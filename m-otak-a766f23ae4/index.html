<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>암낫오타쿠 · 오늘의 초안</title>
<style>
:root{--bg:#121016;--card:#1c1922;--line:#2d2936;--ink:#f2eff7;--mute:#a49db3;--acc:#ff4fa3;--acc2:#ffe14d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;padding:0 16px 80px}
header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,transparent);padding:18px 0 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-size:20px;letter-spacing:-.3px}header b i{font-style:normal;color:var(--acc)}
header .d{color:var(--mute);font-size:13px}
header select{margin-left:auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit}
.note{color:var(--mute);font-size:13px;margin:4px 0 16px}
.it{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 auto 18px;max-width:760px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--line);color:var(--ink)}
.pill.a{background:var(--acc);color:#fff}.pill.pick{background:var(--acc2);color:#111}
h2{font-size:18px;line-height:1.35;margin:2px 0 8px;word-break:keep-all}
.src{font-size:13px;color:var(--mute);word-break:break-all}.src a{color:var(--mute)}
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 0 6px}
.strip a{flex:0 0 auto;scroll-snap-align:start}.strip img,.strip video{height:300px;width:240px;object-fit:cover;border-radius:10px;display:block;background:#000}
.sec{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.sec h3{font-size:13px;color:var(--mute);font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.cap{white-space:pre-wrap;font-size:14.5px;background:#15131b;border-radius:12px;padding:12px;max-height:260px;overflow:auto}
.btn{margin-left:auto;font:inherit;font-size:12px;font-weight:700;color:var(--ink);background:var(--line);border:0;border-radius:8px;padding:5px 10px;cursor:pointer}
.btn.ok{background:var(--acc);color:#fff}
ul.cf{list-style:none}ul.cf li{font-size:13.5px;padding:6px 10px;margin:4px 0;border-radius:8px;background:#2a2116;color:#ffd99a}
.hooks div{font-size:14px;padding:4px 0}.hooks b{color:var(--acc2);margin-right:6px}
.empty{color:var(--mute);text-align:center;padding:60px 0}
</style></head><body>
<header><b>I'M NOT <i>OTAKU</i></b><span class="d" id="when"></span><select id="day"></select></header>
<p class="note">운영자용 초안 화면 · 아직 발행 연결 전이라 그림을 길게 눌러 저장하고, 캡션은 복사해서 올려 주세요.</p>
<main id="list"></main>
<script>
const BRAND = {"id": "otaku", "name": "암낫오타쿠", "handle": "@i_mnot_otaku"};
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const J = v => { if (v && typeof v === 'string') { try { return JSON.parse(v.replace(/'/g, '"')); } catch (e) { return v; } } return v; };
function copyBtn(t) { return `<button class="btn" data-copy="${esc(t)}">복사</button>`; }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  navigator.clipboard.writeText(b.dataset.copy).then(() => { b.textContent = '복사됨'; b.classList.add('ok'); setTimeout(() => { b.textContent = '복사'; b.classList.remove('ok'); }, 1500); });
});
function item(it, i) {
  const c = it.card || {}, s = it.shorts || {}, pv = c.preview || {}, vids = pv.videos || {};
  const title = ((c.form || '').match(/\[커버\][\s\S]*?제목:\s*(.*)/) || [, ''])[1].replace(/\|/g, ' / ');
  const cat = ((c.form || '').match(/\[카테고리\]\s*\n(.+)/) || [, ''])[1];
  const slides = (pv.slides || []).map((u, k) => vids[k] ? `<a href="${esc(vids[k])}" target="_blank"><video src="${esc(vids[k])}" muted playsinline loop autoplay></video></a>`
                                                       : `<a href="${esc(u)}" target="_blank"><img src="${esc(u)}" loading="lazy" alt=""></a>`).join('');
  const conf = [...new Set([...(c.confirm || []), ...((J(s.confirm) || []) instanceof Array ? J(s.confirm) : [])])];
  const hooks = J(s.hooks); const src = it.source || {};
  return `<article class="it"><div class="top"><span class="pill a">${esc(cat || it.corner || '')}</span>${it.pick ? '<span class="pill pick">추천</span>' : ''}
    <span class="pill">${esc((it.subjects || []).slice(0, 2).join(' · '))}</span></div>
    <h2>${esc(title || src.head || '')}</h2>
    <div class="src">${esc(src.account || '')} ${src.url ? `· <a href="${esc(src.url)}" target="_blank">원문</a>` : ''}</div>
    ${slides ? `<div class="strip">${slides}</div>` : ''}
    ${conf.length ? `<div class="sec"><h3>올리기 전 확인</h3><ul class="cf">${conf.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    ${c.caption ? `<div class="sec"><h3>캐러셀 캡션 ${copyBtn(c.caption)}</h3><div class="cap">${esc(c.caption)}</div></div>` : ''}
    ${s.form ? `<div class="sec"><h3>숏폼 ${s.thumb ? '' : ''}${copyBtn(s.form)}</h3>
       ${hooks && typeof hooks === 'object' ? `<div class="hooks">${Object.entries(hooks).map(([k, v]) => `<div><b>${esc(k)}</b>${esc(v)}</div>`).join('')}</div>` : ''}
       <div class="cap">${esc(s.form)}</div>${s.caption ? `<h3 style="margin-top:10px">숏폼 캡션 ${copyBtn(s.caption)}</h3><div class="cap">${esc(s.caption)}</div>` : ''}</div>` : ''}
  </article>`;
}
async function load(day) {
  const f = day ? `drafts-${day}.json` : 'drafts.json';
  const r = await fetch(f + '?t=' + Date.now(), {cache: 'no-store'}); const d = r.ok ? await r.json() : {items: []};
  document.getElementById('when').textContent = (d.date || '') + (d.generated_at ? ' · ' + String(d.generated_at).slice(11, 16) + ' 갱신' : '');
  const its = d.items || [];
  document.getElementById('list').innerHTML = its.length ? its.map(item).join('') : '<p class="empty">아직 초안이 없습니다.</p>';
}
(async () => {
  try {
    const days = await (await fetch('days.json?t=' + Date.now(), {cache: 'no-store'})).json();
    const sel = document.getElementById('day');
    sel.innerHTML = '<option value="">오늘</option>' + days.map(d => `<option value="${d}">${d}</option>`).join('');
    sel.onchange = () => load(sel.value);
  } catch (e) {}
  load('');
})();
</script></body></html>
