<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>플루토 오퍼레이션</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#08080B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오퍼레이션">
<meta name="mobile-web-app-capable" content="yes">
<style>/* 플루토 · 디자인 시스템
 * ─────────────────────────────────────────────────────────────
 * 팀 앱과 개인 앱이 이 한 장을 같이 쓴다. 둘은 강조색만 다르다 —
 * 같은 손에 익은 조작이 두 사이트에서 똑같이 먹혀야 하기 때문이다.
 *
 * 규칙 넷.
 *   1. 색은 뜻이 있을 때만 쓴다. 장식으로 쓰는 색은 없다.
 *   2. 상태 표시는 한 벌뿐이다. 점 + 이름. 화면마다 새로 만들지 않는다.
 *   3. 4px 격자 위에 올린다. 어중간한 값(13.5px 같은)을 쓰지 않는다.
 *   4. 움직임은 설명할 때만. 120~180ms, 감속.
 */

:root{
  /* ── 면 ── 뒤에서 앞으로 네 겹. 이 순서를 뒤집지 않는다. */
  --bg:#08080B;          /* 바닥 */
  --sf:#101015;          /* 패널·카드 */
  --sf2:#17171E;         /* 카드 안의 카드, 입력칸 */
  --sf3:#1F1F28;         /* 눌린 것, 떠 있는 것 */
  --line:#24242E;        /* 경계 */
  --line2:#1B1B23;       /* 흐린 경계 — 목록 안쪽 줄 */

  /* ── 글자 ── 네 단계. 더 만들면 위계가 무너진다. */
  --t1:#EDEDF2;          /* 제목·본문 */
  --t2:#A8A8B4;          /* 설명 */
  --t3:#8A8A97;          /* 부가 정보 */
  --t4:#6B6B78;          /* 거의 안 보여도 되는 것 */

  /* ── 뜻이 있는 색 ── */
  --accent:#E8B34A;      /* 브랜드·강조 (플루토 앰버) */
  --focus:#7C7CF0;       /* 상호작용·선택 */
  --danger:#D96A56;      /* 막힘·지남 */
  --ok:#5FB98B;          /* 진행·정상 */
  --hold:#C9A24A;        /* 대기 */
  --solo:#B58FC4;        /* 개인 */
  --auto:#6E93BA;        /* 자동화가 한 일 */

  --danger-bg:#2A1512; --ok-bg:#11211A; --hold-bg:#211C0E;
  --focus-bg:#16162B;   --solo-bg:#1E1626; --auto-bg:#111A24;

  /* ── 간격 ── 4px 격자 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px;
  --s6:28px; --s7:40px; --s8:56px;

  --r1:4px; --r2:6px; --r3:10px; --r4:16px;

  --shadow:0 18px 48px rgba(0,0,0,.55);
  --shadow-s:0 6px 18px rgba(0,0,0,.4);

  --ease:cubic-bezier(.2,.7,.3,1);
  --fast:120ms; --mid:170ms;

  --rail:212px;
  --pane:376px;

  color-scheme:dark;
}
/* 개인 앱은 같은 뼈대에 다른 강조색을 쓴다. 두 사이트를 헷갈리지 않으려면
   색이 먼저 다르고 구조는 같아야 한다 — 반대로 하면 조작을 다시 배운다. */
:root[data-app="desk"]{ --accent:#B58FC4; --focus:#9B7FD4; --focus-bg:#1C1628; }

*{box-sizing:border-box}
[hidden]{display:none!important}

html,body{overflow-x:clip}
body{
  margin:0;background:var(--bg);color:var(--t1);
  font-family:"Pretendard Variable",Pretendard,"Pretendard-SemiBold",
    -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
  font-size:14px;line-height:1.6;letter-spacing:-.003em;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
  word-break:keep-all;overflow-wrap:anywhere;
}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.018em;line-height:1.28}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
  text-align:left;letter-spacing:inherit}
input,textarea,select{font:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r1)}
::selection{background:var(--focus);color:#08080B}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ── 글자 계단 ─────────────────────────────────────── */
.d1{font-size:23px;font-weight:800;line-height:1.2;letter-spacing:-.025em}
.h1{font-size:18px;font-weight:800;line-height:1.3}
.h2{font-size:14px;font-weight:800;line-height:1.35}
.lbl{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--t3)}
.meta{font-size:12px;line-height:1.45;color:var(--t2)}
.micro{font-size:11px;line-height:1.4;color:var(--t3)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.dim{color:var(--t3)}

/* ── 골격 ──────────────────────────────────────────── */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100dvh}
.app.has-pane{grid-template-columns:var(--rail) minmax(0,1fr) var(--pane)}

.rail{position:sticky;top:0;height:100dvh;overflow-y:auto;background:var(--sf);
  border-right:1px solid var(--line);padding:var(--s4) var(--s3) var(--s5);
  display:flex;flex-direction:column;gap:var(--s2)}
.mark{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) var(--s2) var(--s3)}
.mark .glyph{width:22px;height:22px;border-radius:var(--r2);background:var(--accent);
  color:#08080B;display:grid;place-items:center;font-size:12px;font-weight:800;flex:0 0 auto}
.mark b{font-size:14px;font-weight:800;letter-spacing:-.02em}
.mark span{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--t4);
  margin-left:auto}

.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:var(--s2);width:100%;
  padding:7px var(--s2);border-radius:var(--r2);color:var(--t2);font-size:13px;
  transition:background var(--fast) var(--ease),color var(--fast) var(--ease)}
.nav button:hover{background:var(--sf2);color:var(--t1)}
.nav button[aria-current="page"]{background:var(--sf3);color:var(--t1);font-weight:700}
.nav .ic{width:15px;text-align:center;font-size:11px;color:var(--t4);flex:0 0 auto}
.nav button[aria-current="page"] .ic{color:var(--accent)}
.nav .ct{margin-left:auto;font-size:11px;color:var(--t4)}
.nav .ct.hot{color:var(--danger);font-weight:700}
.nav .ct.on{color:var(--accent)}
.navgap{height:var(--s3)}
.railfoot{margin-top:auto;padding:var(--s3) var(--s2) 0;border-top:1px solid var(--line2);
  font-size:10.5px;line-height:1.55;color:var(--t3)}
.railfoot b{color:var(--t3);font-weight:600}

.main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:20;background:rgba(8,8,11,.86);
  backdrop-filter:saturate(1.3) blur(12px);-webkit-backdrop-filter:saturate(1.3) blur(12px);
  border-bottom:1px solid var(--line);padding:var(--s4) var(--s5) var(--s3)}
.barrow{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
.barrow .ask{font-size:12px;color:var(--t3)}
.barrow .right{margin-left:auto;display:flex;align-items:center;gap:var(--s2)}
.stamp{font-size:11px;color:var(--t3)}
.body{padding:var(--s5);min-width:0;flex:1}
.body > * + *{margin-top:var(--s6)}

/* ── 통계 줄 ───────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));
  gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r3);
  overflow:hidden}
.stat{background:var(--sf);padding:var(--s3) var(--s4) var(--s4);min-width:0}
.stat:hover{background:var(--sf2)}
.stat .k{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--t3);display:block;margin-bottom:var(--s1)}
.stat .v{font-size:25px;font-weight:800;line-height:1.05;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.stat .u{font-size:11px;font-weight:600;color:var(--t3);margin-left:3px}
.stat .n{display:block;font-size:11px;color:var(--t3);margin-top:3px;line-height:1.4}
.stat.hot .v{color:var(--danger)}
.stat.good .v{color:var(--ok)}

/* ── 구역 ──────────────────────────────────────────── */
.sec{min-width:0}
.sech{display:flex;align-items:baseline;gap:var(--s2);padding-bottom:var(--s2);
  border-bottom:1px solid var(--line);margin-bottom:var(--s1)}
.sech h2{font-size:13px;font-weight:800}
.sech .sub{font-size:11px;color:var(--t4)}
.sech .n{margin-left:auto;font-size:11px;color:var(--t4);font-variant-numeric:tabular-nums}
.sech .act{margin-left:auto;font-size:11px;color:var(--t3)}
.sech .act:hover{color:var(--t1)}

/* ── 항목 줄 ───────────────────────────────────────── */
.row{display:grid;grid-template-columns:20px minmax(0,1fr);gap:0 var(--s3);
  padding:var(--s3) var(--s2);border-bottom:1px solid var(--line2);
  align-items:start;position:relative;border-radius:var(--r2);
  transition:background var(--fast) var(--ease)}
.row:hover{background:var(--sf)}
.row.sel{background:var(--sf2)}
.row.sel::before{content:"";position:absolute;left:-1px;top:6px;bottom:6px;width:2px;
  border-radius:2px;background:var(--focus)}
.row.done{opacity:.5}
.row.done .rt{text-decoration:line-through;text-decoration-color:var(--t4)}

.box{width:16px;height:16px;margin-top:3px;border-radius:var(--r1);
  border:1.5px solid var(--t4);position:relative;flex:0 0 auto;
  transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease)}
.box:hover{border-color:var(--focus)}
.box[data-k="recur"]{border-radius:50%}
.box[data-k="track"]{border-style:dashed;opacity:.45;cursor:default}
.box.on{background:var(--focus);border-color:var(--focus)}
.box[data-k="recur"].on{background:var(--ok);border-color:var(--ok)}
.box.on::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:8px;
  border:solid #08080B;border-width:0 1.7px 1.7px 0;transform:rotate(43deg)}

.rc{min-width:0}
.rhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s1) 7px}
.rt{font-size:14px;font-weight:700;line-height:1.45;color:var(--t1);letter-spacing:-.012em}
button.rt:hover{color:var(--accent)}
.rn{font-size:12.5px;color:var(--t2);line-height:1.55;margin-top:3px}
.rw{font-size:12px;color:var(--accent);line-height:1.5;margin-top:var(--s1);
  padding-left:var(--s2);border-left:2px solid rgba(232,179,74,.3)}

/* ── 표식 ── 한 벌만 쓴다 ───────────────────────────── */
.pill{font-size:10.5px;font-weight:600;padding:1.5px 7px;border-radius:99px;
  flex:0 0 auto;line-height:1.5;white-space:nowrap}
.pill.q{background:var(--sf3);color:var(--t2);box-shadow:inset 0 0 0 1px var(--line)}
.pill.s-막힘{background:var(--danger-bg);color:var(--danger)}
.pill.s-진행{background:var(--ok-bg);color:var(--ok)}
.pill.s-대기{background:var(--hold-bg);color:var(--hold)}
.pill.s-확인필요{color:var(--accent);box-shadow:inset 0 0 0 1px rgba(232,179,74,.45)}
.pill.s-상시{background:var(--focus-bg);color:var(--focus)}
.pill.s-동결{background:var(--sf2);color:var(--t4)}
.pill.solo{background:var(--solo-bg);color:var(--solo)}
.pill.late{background:var(--danger-bg);color:var(--danger)}
.pill.mac{background:var(--sf2);color:var(--t3)}
.pill.edit{color:var(--focus);box-shadow:inset 0 0 0 1px rgba(124,124,240,.4)}
.pill.top{color:var(--danger);box-shadow:inset 0 0 0 1px rgba(217,106,86,.45);
  font-size:9.5px;letter-spacing:.05em}
button.pill{transition:filter var(--fast) var(--ease)}
button.pill:hover{filter:brightness(1.25)}

/* 집기 칩 — 세 상태. 배정이 아니라 "누가 집었나"를 보여준다. */
.who{font-size:10.5px;color:var(--t3);padding:1.5px 7px;border-radius:99px;
  box-shadow:inset 0 0 0 1px var(--line);flex:0 0 auto;white-space:nowrap;
  transition:color var(--fast) var(--ease),box-shadow var(--fast) var(--ease)}
button.who:hover{color:var(--t1);box-shadow:inset 0 0 0 1px var(--t3)}
.who.has{color:var(--t1);box-shadow:inset 0 0 0 1px var(--t3)}
.who.open{color:var(--focus);box-shadow:inset 0 0 0 1px rgba(124,124,240,.45)}
.who.only{color:var(--t4);box-shadow:inset 0 0 0 1px var(--line2);font-style:normal}

.dot{width:6px;height:6px;border-radius:50%;background:var(--t4);flex:0 0 auto}
.dot.막힘{background:var(--danger)} .dot.진행{background:var(--ok)}
.dot.대기{background:var(--hold)}   .dot.상시{background:var(--focus)}
.dot.확인필요{background:var(--accent)} .dot.동결{background:var(--t4)}

/* ── 알림 ──────────────────────────────────────────── */
.alert{display:grid;grid-template-columns:3px minmax(0,1fr);gap:0 var(--s3);
  background:var(--sf);border-radius:var(--r2);overflow:hidden;
  padding:0;margin-bottom:var(--s2)}
.alert .stripe{background:var(--danger)}
.alert.warn .stripe{background:var(--hold)}
.alert.ok .stripe{background:var(--ok)}
.alert .in{padding:var(--s3) var(--s4) var(--s3) 0}
.alert .ah{display:flex;flex-wrap:wrap;align-items:baseline;gap:7px}
.alert .ah b{font-size:13px;font-weight:700}
.alert .run{font-size:12px;color:var(--t2);margin-top:var(--s1);line-height:1.55}
.alert .snz{margin-left:auto;font-size:10.5px;color:var(--t3);flex:0 0 auto}
.alert .snz:hover{color:var(--t1)}

/* ── 카드 ──────────────────────────────────────────── */
.cards{display:grid;gap:var(--s3)}
.cards.c2{grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}
.cards.c3{grid-template-columns:repeat(auto-fill,minmax(216px,1fr))}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r3);
  padding:var(--s4);min-width:0;transition:border-color var(--fast) var(--ease)}
.card:hover{border-color:var(--line)}
.cardh{display:flex;align-items:baseline;gap:var(--s2);padding-bottom:var(--s2);
  border-bottom:1px solid var(--line2);margin-bottom:var(--s2)}
.cardh b{font-size:13.5px;font-weight:800}
.cardh .n{margin-left:auto;font-size:11px;color:var(--t4)}
/* 카드 안의 한 줄 — 누가 무엇을 집었는지 훑는 용도라 줄 높이를 낮게 잡는다. */
.pl{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;
  padding:6px 0;border-bottom:1px solid var(--line2);font-size:12.5px;
  line-height:1.45;color:var(--t2);transition:color var(--fast) var(--ease)}
.pl:last-of-type{border-bottom:0}
.pl:hover{color:var(--t1)}
.pl .dot{margin-top:6px}
.pmore{font-size:11px;color:var(--t3);padding-top:8px}

/* ── 칸 ── 나누는 단위. 비어 있는 칸이 한눈에 보여야 한다. ── */
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:var(--s2);
  margin-top:var(--s3)}
.cell{background:var(--sf);border:1px solid var(--line);border-radius:var(--r3);
  padding:var(--s3) var(--s4) var(--s3);display:flex;flex-direction:column;gap:var(--s2);
  transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease)}
.cell.held{background:var(--sf2)}
.cell:not(.held){border-style:dashed;border-color:var(--t4)}
.cell.hot{border-color:rgba(217,106,86,.45)}
.cellh{display:flex;align-items:baseline;gap:var(--s2)}
.cellh b{font-size:13.5px;font-weight:800}
.cellh .n{margin-left:auto;font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums}
.cellm{display:flex;flex-wrap:wrap;gap:var(--s1);align-items:center;min-height:19px}
.cellby{align-self:flex-start}
.cellopen{font-size:11px;color:var(--t3);padding-top:var(--s1);
  border-top:1px solid var(--line2);margin-top:auto;width:100%}
.cellopen:hover{color:var(--t1)}

/* ── 막대 ──────────────────────────────────────────── */
.bar-t{height:5px;border-radius:99px;background:var(--sf3);overflow:hidden;display:flex}
.bar-t i{display:block;height:100%}
.bar-t i.k{background:var(--accent)} .bar-t i.o{background:var(--auto)}

/* ── 회차 칸반 ─────────────────────────────────────── */
.kan{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s2);
  align-items:start}
.col{background:var(--sf);border:1px solid var(--line);border-radius:var(--r3);
  min-height:118px;display:flex;flex-direction:column;
  transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease)}
.col.over{border-color:var(--focus);background:var(--focus-bg)}
.colh{display:flex;align-items:baseline;gap:var(--s2);padding:var(--s3) var(--s3) var(--s2);
  border-bottom:1px solid var(--line2)}
.colh b{font-size:11.5px;font-weight:800;letter-spacing:.02em}
.colh .n{margin-left:auto;font-size:10.5px;color:var(--t4)}
.colb{padding:var(--s2);display:flex;flex-direction:column;gap:var(--s2);flex:1}
.kcard{background:var(--sf2);border:1px solid var(--line);border-radius:var(--r2);
  padding:var(--s3);cursor:grab;-webkit-user-drag:none;
  transition:transform var(--fast) var(--ease),
  border-color var(--fast) var(--ease),box-shadow var(--fast) var(--ease)}
.kcard:hover{border-color:var(--focus);box-shadow:var(--shadow-s)}
.kcard:active{cursor:grabbing}
.kcard.drag{opacity:.35}
.kcard b{display:block;font-size:12.5px;font-weight:700;line-height:1.4}
.kcard .sub{display:block;font-size:11px;color:var(--t3);margin-top:2px;line-height:1.4}
.kcard .foot{display:flex;align-items:center;gap:var(--s1);margin-top:var(--s2)}

/* ── 주간 ──────────────────────────────────────────── */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r3);overflow:hidden}
.dy{background:var(--sf);min-height:168px;display:flex;flex-direction:column}
.dy.off{background:var(--bg)}
.dy.now{box-shadow:inset 0 2px 0 var(--accent)}
.dyh{padding:var(--s2) var(--s3) 6px;display:flex;align-items:baseline;gap:5px;
  border-bottom:1px solid var(--line2)}
.dyh b{font-size:11.5px;font-weight:800}
.dyh span{font-size:10.5px;color:var(--t3)}
.dy.now .dyh b{color:var(--accent)}
.dyb{padding:6px var(--s2) var(--s3);display:flex;flex-direction:column;gap:3px;flex:1}
.slot{display:flex;gap:5px;align-items:baseline;font-size:10.5px;line-height:1.4}
.slot .tm{color:var(--t3);flex:0 0 auto;font-variant-numeric:tabular-nums}
.slot.auto .nm{color:var(--auto)}
.slot.work .nm{color:var(--t2)}
.slot.meet .nm{color:var(--focus)}
.slot.broken .nm{color:var(--danger);text-decoration:line-through

<script>/* 플루토 · 공유 상태 동기화

 *   3. 내려받은 값이 로컬과 다르면 서버를 따른다. 단 내가 방금 올린 건 무시한다.

(function (global) {
"use strict";

var URL_ = "";
var KEY_ = "";
// 값이 안 박혔으면(빈 문자열이거나 자리표시자 그대로면) 통째로 꺼진다.

        && URL_.slice(0, 2) !== "__" && KEY_.slice(0, 2) !== "__"
        && URL_.indexOf("http") === 0;

var dirty = {}, mine = {}, timer = null, live = false;

function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({
    "apikey": KEY_,
    "Authorization": "Bearer " + KEY_,
    "Content-Type": "application/json",
    "Prefer": "resolution=merge-duplicates,return=minimal"
  }, opts.headers || {});
  return fetch(URL_ + "/rest/v1/" + path, opts);
}

/* S 안의 흩어진 흔적을 한 줄로 모은다. 저장 구조와 전송 구조를 분리해 둬야
   나중에 한쪽을 바꿔도 다른 쪽이 안 깨진다. */
function rowOf(id){
  if (id.indexOf("cell:") === 0){
    var k = id.slice(5);
    return { id:id, claimed_by:(S.cell || {})[k] || null, patch:{} };
  }
  if (id.indexOf("series:") === 0){
    var sid = id.slice(7);
    var st = S.stage || {}, sb2 = S.sby || {};
    return { id:id,
             stage: st[sid] == null ? null : st[sid],
             claimed_by: sb2[sid] || null,
             patch: {} };
  }
  var p = (S.patch || {})[id] || {};
  var by = Object.prototype.hasOwnProperty.call(p, "by") ? p.by : undefined;
  var rest = {};
  for (var k in p) if (k !== "by") rest[k] = p[k];
  return { id: id,
           done: !!(S.done || {})[id],
           last_done: (S.last || {})[id] || null,
           claimed_by: by === undefined ? null : by,
           patch: rest };
}

function apply(row){
  var id = row.id;
  if (id.indexOf("cell:") === 0){
    var ck = id.slice(5);
    S.cell = S.cell || {};
    if (row.claimed_by) S.cell[ck] = row.claimed_by; else delete S.cell[ck];
    return;
  }
  if (id.indexOf("series:") === 0){
    var sid = id.slice(7);
    S.stage = S.stage || {}; S.sby = S.sby || {};
    if (row.stage == null) delete S.stage[sid]; else S.stage[sid] = row.stage;
    if (row.claimed_by) S.sby[sid] = row.claimed_by; else delete S.sby[sid];

  }
  S.done = S.done || {}; S.last = S.last || {}; S.patch = S.patch || {};
  if (row.done) S.done[id] = true; else delete S.done[id];
  if (row.last_done) S.last[id] = row.last_done; else delete S.last[id];
  var p = {};
  if (row.patch) for (var k in row.patch) p[k] = row.patch[k];
  if (row.claimed_by) p.by = row.claimed_by;
  if (Object.keys(p).length) S.patch[id] = p; else delete S.patch[id];
}

        headers:{ "Prefer":"" } })
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(rows){
        rows.forEach(apply);
        live = true;
        try { localStorage.setItem("pluto.synced", String(Date.now())); } catch(e){}

/* 남이 바꾼 것만 받는다. 내가 방금 올린 게 되돌아오면 무시한다. */
function listen(){
  if (!global.supabase || sb) return;
  sb = global.supabase.createClient(URL_, KEY_);
  sb.channel("ops")
    .on("postgres_changes", { event:"*", schema:"public", table:"ops_state" },
      function(p){
        var row = p.new; if (!row || !row.id) return;
        var t = mine[row.id];
        if (t && Date.now() - t < 4000) return;
        apply(row);
        try { localStorage.setItem("pluto.ops.v2", JSON.stringify(S)); } catch(e){}
        if (render) render();
      })
    .subscribe();
}

global.Sync = Sync;

<script>/* 플루토 · 공통 런타임

  var c = String(name||"").trim().slice(-1).charCodeAt(0);

P.cellId = function(team, lane){ return "cell:" + team + "|" + lane; };

/* ── 고치기 ───────────────────────────────────────── */
function logit(id, what){

  var g = "", html = "";
  cmd.rows.forEach(function(r,i){
    if (r.g !== g){ g = r.g; html += '<p class="cgrp">'+esc(g)+"</p>"; }
    html += '<button class="crow" data-act="cmdgo" data-arg="'+i+'" aria-selected="'+(i===cmd.i)+'">'
      + '<span class="cic">'+esc(r.ic||"·")+"</span>"
      + '<span class="ctx">'+esc(r.t)+"</span>"
      + '<span class="cm">'+esc(r.m||"")+"</span></button>";
  });
  return '<div class="scrim" data-act="cmdclose"></div><div class="cmdbox">'
    + '<div class="cmdin"><span>⌕</span>'
    + '<input id="cq" value="'+esc(cmd.q)+'" autocomplete="off" spellcheck="false" '
    + 'placeholder="찾거나, 쓰면 새 항목이 됩니다"></div>'
    + '<div class="cmdlist">'+(html||P.empty("없습니다",""))+"</div>"
    + '<div class="cmdf"><span><kbd>↑↓</kbd> 고르기</span><span><kbd>↵</kbd> 열기</span>'
    + "<span><kbd>esc</kbd> 닫기</span></div></div>";
}

/* ── 단축키 안내 ──────────────────────────────────── */
var KEYS = [
  ["⌘K / /","찾기·새 항목"], ["j / k","줄 이동"], ["↵","상세 열기"],
  ["x","완료 표시"], ["s","상태 돌리기"], ["e","상세에서 고치기"],
  ["1–9","화면 이동"], ["esc","닫기"], ["?","이 도움말"]
];
/* 무엇을 집든 같은 시트를 쓴다 — 항목이든 회차든 고르는 동작은 하나여야 한다. */
P.pickFor = function(kind, id, fn, label){
  pick = { kind:kind, id:id, fn:fn, label:label||"" };
  P.render();
};
function pickHTML(){
  if (!pick) return "";
  return '<div class="scrim" data-act="pick-close"></div><div class="cmdbox">'
    + '<div class="cmdin"><span>\u25CD</span><b style="font-size:14px">누가 집나</b></div>'
    + '<div class="cmdlist" style="padding:6px 0">'
    + '<p class="cgrp">'+esc(pick.kind)+" \u00B7 "+esc(pick.label)+"</p>"
    + Object.keys(DATA.people||{}).map(function(k){
        return '<button class="crow" data-act="pick-set" data-val="'+esc(k)+'">'
          + '<span class="cic">\u00B7</span>'
          + '<span class="ctx">'+esc(DATA.people[k])+"</span></button>"; }).join("")
    + '<button class="crow" data-act="pick-set" data-val=""><span class="cic">\u00D7</span>'
    + '<span class="ctx">미배정으로 두기</span></button>'
    + '</div><div class="cmdf"><span><kbd>esc</kbd> 닫기</span></div></div>';
}

function helpHTML(){
  if (!help) return "";
  return '<div class="scrim" data-act="helpclose"></div><div class="cmdbox">'
    + '<div class="cmdin"><span>⌨</span><b style="font-size:14px">단축키</b></div>'
    + '<div class="cmdlist" style="padding:8px 0">'
    + KEYS.map(function(k){
        return '<div class="crow"><span class="ctx">'+esc(k[1])+"</span>"
          + '<span class="cm"><kbd>'+esc(k[0])+"</kbd></span></div>"; }).join("")
    + '</div><div class="cmdf"><span><kbd>esc</kbd> 닫기</span></div></div>';
}

/* ── 그리기 ───────────────────────────────────────── */
function go(id){ S.view=id; save(); sel=null; cursor=-1; P.render(); window.scrollTo(0,0); }
P.go = go;

function view(){ 
  var v = CFG.views.filter(function(x){return x.id===S.view;})[0];
  return v || CFG.views[0];
}
P.view = view;

P.render = function(){
  var v = view();
  rowsOnScreen = [];
  var bodyHTML = v.draw();
  var counts = {};
  CFG.views.forEach(function(x){ counts[x.id] = x.count ? x.count() : ""; });

  document.getElementById("app").innerHTML =
    '<div class="app'+(sel?" has-pane":"")+'">'
    + '<nav class="rail"><div class="mark"><span class="glyph">'+esc(CFG.glyph)+"</span>"
    + "<b>"+esc(CFG.name)+"</b><span>"+esc(CFG.kind)+"</span></div>"
    + '<div class="nav">'+CFG.views.map(function(x){
        var c = counts[x.id];
        return '<button data-act="go" data-arg="'+x.id+'"'
          + (x.id===S.view?' aria-current="page"':"")+">"
          + '<span class="ic">'+esc(x.ic)+"</span>"+esc(x.n)
          + (c!==""&&c!=null?'<span class="ct num'+(x.hot&&c?" hot":"")+'">'+c+"</span>":"")
          + "</button>"; }).join("")+"</div>"
    + '<div class="navgap"></div>'
    + '<div class="nav"><button data-act="cmd"><span class="ic">⌕</span>찾기'
    + '<span class="ct">⌘K</span></button>'
    + '<button data-act="helpopen"><span class="ic">?</span>단축키</button></div>'
    + '<div class="railfoot">'+CFG.foot().split("\n").map(function(x){
        return "<p>"+esc(x)+"</p>"; }).join("")+"</div></nav>"
    + '<main class="main"><div class="bar"><div class="barrow">'
    + '<h1 class="d1">'+esc(v.n)+"</h1>"
    + '<span class="ask">'+esc(v.ask)+"</span>"
    + '<span class="right">'
    + (P.shared()
        ? '<span class="pill '+(P.synced()?"s-진행":"s-대기")+'">'
          + (P.synced()?"같이 보는 중":"연결 중")+"</span>"
        : '<span class="pill q" title="이 브라우저에만 저장됩니다">혼자 보는 중</span>')
    + '<span class="stamp num">'+P.T+" "+P.DOW[NOW.getDay()]+"</span></span>"
    + "</div>"+(v.bar?v.bar():"")+"</div>"
    + '<div class="body">'+bodyHTML+"</div></main>"
    + paneHTML()+"</div>"
    + '<button class="fab" data-act="cmd" aria-label="찾기·추가">+</button>'
    + '<nav class="tabbar" style="grid-template-columns:repeat('+CFG.views.length+',1fr)">'
    + CFG.views.map(function(x){
        var c = counts[x.id];
        return '<button data-act="go" data-arg="'+x.id+'"'
          + (x.id===S.view?' aria-current="page"':"")+">"
          + '<span class="ic">'+esc(x.ic)+"</span>"+esc(x.n)
          + (c?'<span class="ct">'+c+"</span>":"")+"</button>"; }).join("")
    + "</nav>"
    + '<div id="toast"></div>'
    + cmdHTML() + pickHTML() + helpHTML();

  paintToast();
  if (cmd.on){
    var q = document.getElementById("cq");
    if (q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); }
  }
  var t = document.getElementById("f_t");
  if (t){ t.style.height="auto"; t.style.height=t.scrollHeight+"px"; }
  var cur = rowsOnScreen[cursor];
  if (cur){
    var el = document.querySelector('[data-row="'+cur+'"]');
    if (el){ el.classList.add("sel"); el.scrollIntoView({block:"nearest"}); }
  }
};

/* ── 입력 ─────────────────────────────────────────── */
function act(name, arg, val){
  switch(name){
    case "go": go(arg); break;
    case "cmd": cmd.on=true; cmd.q=""; cmd.i=0; P.render(); break;
    case "cmdclose": cmd.on=false; P.render(); break;
    case "cmdgo": var r=cmd.rows[+arg]; cmd.on=false; if(r) r.go(); else P.render(); break;
    case "helpopen": help=true; P.render(); break;
    case "helpclose": help=false; P.render(); break;
    case "close": P.close(); break;
    case "open": P.open(arg); break;
    case "tog": var i1=P.byId(arg); if(i1) P.toggle(i1); break;
    case "cycle": var i2=P.byId(arg); if(i2) P.cycle(i2); break;
    case "savefld": saveFields(); break;
    case "reset": delete S.patch[arg]; dirty(); logit(arg,"원래대로"); save(arg);
      P.toast("원래대로 돌렸습니다"); P.render(); break;
    case "drop": P.drop(arg); P.close(); break;
    case "pick":
      var pi = P.byId(arg);
      if (pi) P.pickFor("항목", arg, function(w){ P.claim(pi, w); }, pi.t);
      break;
    case "cellpick":
      var cp = String(arg).split("|");
      P.pickFor("칸", arg, function(w){ P.claimCell(cp[0], cp[1], w); },
                cp[0]+" · "+P.lane(cp[1]));
      break;
    case "celldrop":
      var cd = String(arg).split("|"); P.claimCell(cd[0], cd[1], null); break;
    case "pick-close": pick = null; P.render(); break;
    case "pick-set":
      var fn = pick && pick.fn; pick = null;
      if (fn) fn(val || null); else P.render();
      break;
    case "unclaim": var uit = P.byId(arg); if (uit) P.claim(uit, null); break;
    case "set":
      var v = val;
      if ((arg==="by" || arg==="must") && v==="") v=null;
      else if (v==="true") v=true; else if (v==="false") v=false;
      else if (arg==="p") v=+v;
      var o={}; o[arg]=v; P.patch(sel,o,arg+" → "+val); P.render(); break;
    case "undo": if(toast&&toast.fn){ var f=toast.fn; toast=null; clearTimeout(toastT); f(); } break;
    case "snooze":
      S.snooze[arg] = Date.now()+864e5; save();
      P.toast("하루 동안 숨깁니다", "되돌리기", function(){
        delete S.snooze[arg]; save(); P.render(); });
      P.render(); break;
    default:
      if (CFG.actions && CFG.actions[name]) CFG.actions[name](arg, val);
  }
}
P.act = act;
P.snoozed = function(key){ return (S.snooze[key]||0) > Date.now(); };

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-act]");
  if (!t) return;
  e.preventDefault();
  act(t.dataset.act, t.dataset.arg, t.dataset.val);
});
document.addEventListener("input", function(e){
  if (e.target.id==="cq"){ cmd.q=e.target.value; cmd.i=0; P.render(); }
  if (e.target.id==="f_t"){ e.target.style.height="auto"; e.target.style.height=e.target.scrollHeight+"px"; }
});
document.addEventListener("keydown", function(e){
  var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){
    e.preventDefault(); cmd.on=true; cmd.i=0; P.render(); return; }
  if (e.key==="Escape"){
    if (cmd.on){ cmd.on=false; P.render(); }
    else if (pick){ pick=null; P.render(); }
    else if (help){ help=false; P.render(); }
    else if (sel){ P.close(); }
    return;
  }
  if (cmd.on){
    if (e.key==="ArrowDown"){ e.preventDefault(); cmd.i=Math.min(cmd.i+1,cmd.rows.length-1); P.render(); }
    else if (e.key==="ArrowUp"){ e.preventDefault(); cmd.i=Math.max(cmd.i-1,0); P.render(); }
    else if (e.key==="Enter"){ e.preventDefault(); var r=cmd.rows[cmd.i]; cmd.on=false;
      if (r) r.go(); else P.render(); }
    return;
  }
  if (typing) return;
  if ((e.metaKey||e.ctrlKey) && e.key==="Enter" && sel){ e.preventDefault(); saveFields(); return; }
  if (e.metaKey||e.ctrlKey||e.altKey) return;

  var k = e.key;
  if (k==="/" ){ e.preventDefault(); cmd.on=true; cmd.q=""; cmd.i=0; P.render(); return; }
  if (k==="?"){ help=true; P.render(); return; }
  if (k>="1" && k<="9"){
    var v = CFG.views[+k-1]; if (v){ go(v.id); } return;
  }
  if (!rowsOnScreen.length) return;
  if (k==="j" || k==="ArrowDown"){ e.preventDefault();
    cursor=Math.min(cursor+1, rowsOnScreen.length-1); P.render(); return; }
  if (k==="k" || k==="ArrowUp"){ e.preventDefault();
    cursor=Math.max(cursor-1, 0); P.render(); return; }
  var id = rowsOnScreen[cursor];
  if (!id) return;
  var it = P.byId(id);
  if (!it) return;
  if (k==="Enter"){ e.preventDefault(); P.open(id); }
  else if (k==="x"){ e.preventDefault(); P.toggle(it); }
  else if (k==="s"){ e.preventDefault(); P.cycle(it); }
  else if (k==="e"){ e.preventDefault(); P.open(id);
    setTimeout(function(){ var t=document.getElementById("f_t"); if(t) t.focus(); },40); }
});

/* 자정을 넘겨 켜둔 폰에서 "매일" 항목이 어제 상태로 남지 않게. */
setInterval(function(){
  var k = ymd(new Date());
  if (k !== P.T){ NOW = new Date(); P.T = k; P.render(); }
}, 6e4);

P.boot = function(cfg){
  CFG = cfg;
  DATA = JSON.parse(document.getElementById("data").textContent);
  document.documentElement.dataset.app = cfg.id;
  S = load();
  // 여기서 그리지 않는다. 앱 파일이 DATA 를 받아 자기 변수를 채운 뒤
  // 직접 P.render() 를 부른다 — 먼저 그리면 화면 수 세는 함수가 빈 데이터를 만난다.
  //
  // 공유 저장소는 뒤따라 붙는다. 먼저 로컬로 그려 두고, 내려온 값이 다르면
  // 그때 다시 그린다 — 네트워크를 기다리며 흰 화면을 보여주지 않는다.
  if (global.Sync && global.Sync.on) {
    setTimeout(function(){
      global.Sync.start(S, function(){ ALL = null; P.render(); });
    }, 0);
  }
};
return P;
})(window);
</script>
<script>/* 플루토 오퍼레이션 — 팀 앱
 * 개인 항목은 이 빌드에 아예 들어 있지 않다. 숨기는 게 아니라 없다.
 * (build.py 가 scope==="solo" 를 걸러낸 data.json 을 박아 넣는다)
 */
(function () {
"use strict";
var D = null;

function E(s){ return P.esc(s); }
function live(){ return P.live(); }
function open(){ return live().filter(function(i){ return !P.on(i); }); }
function blocked(){ return open().filter(function(i){ return i.s==="막힘"; }); }
function todayish(i){ return i.h==="now" || i.k==="recur" || P.late(i); }
function uniq(a){ var o=[],i; for(i=0;i<a.length;i++) if(o.indexOf(a[i])<0) o.push(a[i]); return o; }

/* 오늘 나가야 하는 발행물. 매일 돌더라도 매거진 레인이 아니면 발행이 아니다 —
   리빙 문서 갱신 같은 건 발행 판에 섞이면 숫자를 못 믿게 된다. */
function pubToday(){ return live().filter(function(i){ return i.k==="recur" && i.l==="mag"; }); }
function otherRecur(){ return live().filter(function(i){ return i.k==="recur" && i.l!=="mag"; }); }

/* ── 오늘 ─────────────────────────────────────────── */
function drawToday(){
  var all = live().sort(P.urgency);
  var late = all.filter(P.late);
  var pub  = pubToday();
  var pubDone = pub.filter(P.on).length;
  var now  = all.filter(function(i){ return i.k!=="recur" && !P.late(i) && i.h==="now" && !P.on(i); });
  var week = all.filter(function(i){ return i.h==="week" && !P.on(i) && !P.late(i); });
  var bl = blocked();
  var alerts = P.data().alerts.filter(function(a){
    return a.sev!=="ok" && !P.snoozed("al:"+a.t);
  });
  var good = P.data().alerts.filter(function(a){ return a.sev==="ok"; });

  var head = P.stats([
    { k:"오늘 발행", v:pubDone+"/"+pub.length, tone:pubDone===pub.length?"good":"",
      n:pubDone===pub.length?"오늘 몫은 다 나갔습니다":"아직 "+(pub.length-pubDone)+"건 남았습니다",
      act:"go", arg:"pub" },
    { k:"막힘", v:bl.length, tone:bl.length?"hot":"",
      n:bl.length?uniq(bl.map(function(i){ return i.by?P.who(i.by):"미배정"; })).slice(0,3).join(" · ")
        :"막힌 것 없음",
      act:"go", arg:"share" },
    { k:"지남", v:late.length, tone:late.length?"hot":"",
      n:late.length?"가장 오래된 건 "+P.days(P.T,late[0].d)+"일":"마감 넘긴 것 없음" },
    { k:"이번 주", v:week.length, n:"주 단위로 걸린 일", act:"go", arg:"week" }
  ]);

  var al = alerts.length
    ? '<section class="sec"><div class="sech"><h2>관제</h2>'
      + '<span class="sub">'+E(P.data().scanAt)+" 자동 스캔</span>"
      + '<span class="n num">'+alerts.length+"</span></div>"
      + alerts.map(function(a){
          return '<div class="alert'+(a.sev==="warn"?" warn":"")+'"><span class="stripe"></span>'
            + '<div class="in"><div class="ah"><b>'+E(a.t)+"</b>"
            + '<span class="pill '+(a.sev==="crit"?"s-막힘":"s-대기")+'">'+E(a.d)+"</span>"
            + '<button class="snz" data-act="snooze" data-arg="al:'+E(a.t)+'">하루 숨기기</button></div>'
            + (a.x?'<p class="run">'+E(a.x)+"</p>":"")+"</div></div>";
        }).join("")+"</section>"
    : "";

  var ok = good.length
    ? '<section class="sec"><div class="sech"><h2>잘 돌고 있는 것</h2></div>'
      + good.map(function(a){
          return '<div class="alert ok"><span class="stripe"></span><div class="in">'
            + '<div class="ah"><b>'+E(a.t)+'</b><span class="pill s-진행">'+E(a.d)+"</span></div>"
            + "</div></div>"; }).join("")+"</section>"
    : "";

  var body = head + al
    + P.sec("지났다","마감일이 넘은 것", late)
    + P.sec("오늘 나갈 것","매일 도는 발행 — 자정에 풀린다", pub.filter(function(i){return !P.on(i);}))
    + P.sec("오늘 할 것","지금 블록", now)
    + P.sec("매일 도는 것","발행은 아니지만 매일 손이 가는 일",
        otherRecur().filter(function(i){ return !P.on(i); }))
    + ok;

  if (!late.length && !now.length && pubDone===pub.length)
    body = head + al + P.empty("오늘 걸린 게 없습니다","이번 주 일로 넘어가도 됩니다.") + ok;

  return body;
}

/* ── 발행 ─────────────────────────────────────────── */
function drawPub(){
  var mag = live().filter(function(i){ return i.l==="mag"; });
  var daily = mag.filter(function(i){ return i.k==="recur"; });
  var build = mag.filter(function(i){ return i.k!=="recur"; }).sort(P.urgency);
  var doneN = daily.filter(P.on).length;

  var strip = '<div class="cards c3">'+daily.map(function(i){
    var on = P.on(i);
    return '<div class="card" style="'+(on?"border-color:rgba(95,185,139,.35)":"")+'">'
      + '<div class="cardh"><b>'+E(i.t)+"</b>"
      + '<span class="n">'+E(i.by?P.who(i.by):"미배정")+"</span></div>"
      + (i.n?'<p class="meta">'+E(i.n)+"</p>":"")
      + '<div style="display:flex;gap:8px;align-items:center;margin-top:12px">'
      + '<button class="btn'+(on?" g":"")+'" data-act="tog" data-arg="'+E(i.id)+'">'
      + (on?"오늘 나갔음 ✓":"오늘 나갔다고 표시")+"</button>"
      + '<button class="iconb" data-act="open" data-arg="'+E(i.id)+'" aria-label="상세">›</button>'
      + "</div></div>";
  }).join("")+"</div>";

  return P.stats([
    { k:"오늘 나간 것", v:doneN+"/"+daily.length, tone:doneN===daily.length?"good":"",
      n:"자정에 전부 풀립니다" },
    { k:"준비 중", v:build.filter(function(i){return !P.on(i);}).length, n:"체계·규칙·자동화" },
    { k:"이번 달 성과", v:"180", u:"만", tone:"good", n:"캐러셀 조회수 — 첫 100만 돌파" }
  ])
  + '<section class="sec"><div class="sech"><h2>매일 나가는 것</h2>'
  + '<span class="sub">하나라도 빠지면 그날 계정이 조용해진다</span></div>'
  + strip + "</section>"
  + P.sec("발행 체계 만들기","한 번 만들면 매일이 쉬워지는 것", build)
  + '<p class="note"><b>왜 따로 두는가</b> 발행은 완료되는 일이 아니라 <b>오늘 나갔는가</b>로 '
  + '묻는 일입니다. 같은 목록에 두면 매일 체크가 풀리는 항목과 한 번 끝나는 항목이 섞여서 '
  + '어느 쪽도 믿을 수 없게 됩니다.</p>';
}

/* ── 회차 ─────────────────────────────────────────── */
function stageOf(s){ var v=P.S().stage[s.id]; return v==null ? s.stage : v; }
/* 회차의 집은 사람은 항목과 저장 자리가 다르다 — 회차는 data.json 의 별도 목록이다. */
function sby(s){ var v=P.S().sby||{}; return v[s.id]!=null ? v[s.id] : (s.by||null); }
function setSby(id, whoId){
  var st=P.S(); st.sby = st.sby || {};
  var was = st.sby[id]!=null ? st.sby[id] : null;
  if (whoId) st.sby[id]=whoId; else delete st.sby[id];
  P.save("series:"+id);
  P.toast(whoId ? P.josa(P.who(whoId), "이", "가")+" 집었습니다" : "놓았습니다", "되돌리기", function(){
    if (was) P.S().sby[id]=was; else delete P.S().sby[id];
    P.save("series:"+id); P.render(); });
  P.render();
}
function drawSeries(){
  var stages = D.stages;
  var cols = stages.map(function(g,gi){
    var here = D.series.filter(function(s){ return stageOf(s)===gi; });
    return '<div class="col" data-drop="'+gi+'"><div class="colh"><b>'+E(g)+"</b>"
      + '<span class="n num">'+here.length+'</span></div><div class="colb">'
      + here.map(function(s){
          return '<div class="kcard" data-kid="'+E(s.id)+'" '
            + 'data-act="sopen" data-arg="'+E(s.id)+'">'
            + "<b>"+E(s.n)+"</b>"
            + (s.sub?'<span class="sub">'+E(s.sub)+"</span>":"")
            + '<div class="foot">'
            + (sby(s)
                ? '<button class="who has" data-act="sdrop" data-arg="'+E(s.id)+'">'
                  + E(P.who(sby(s)))+"</button>"
                : '<button class="who open" data-act="spick" data-arg="'+E(s.id)+'">미배정</button>')
            + (gi>0?'<button class="pill q" data-act="sback" data-arg="'+E(s.id)+'">←</button>':"")
            + (gi<stages.length-1?'<button class="pill q" data-act="sfwd" data-arg="'+E(s.id)+'">→</button>':"")
            + "</div></div>";
        }).join("")
      + (here.length?"":'<p class="micro" style="padding:6px 4px">비어 있음</p>')
      + "</div></div>";
  }).join("");

  var open = D.series.map(function(s){
    return { s:s, g:stageOf(s) };
  });
  var stuck = open.filter(function(x){ return x.g===0; }).length;

  return P.stats([
    { k:"회차", v:D.series.length, n:"파일럿 단계" },
    { k:"섭외에 묶임", v:stuck, tone:stuck>1?"hot":"",
      n:stuck>1?"컨택이 안 나가면 전부 여기서 멈춥니다":"진행 중" },
    { k:"촬영 이후", v:open.filter(function(x){return x.g>=2;}).length, n:"찍은 것" }
  ])
  + '<section class="sec"><div class="sech"><h2>파이프라인</h2>'
  + '<span class="sub">카드를 끌어 옮기거나 화살표로 옮깁니다</span></div>'
  + '<div class="kan">'+cols+"</div></section>"
  + P.sec("프로그램 레인","회차에 안 붙는 준비 작업",
      live().filter(function(i){ return i.l==="prog"; }).sort(P.urgency))
  + '<p class="note"><b>회차는 완료가 아니라 단계입니다.</b> 체크박스로 묻지 않는 이유가 '
  + '여기 있습니다 — 촬영이 끝났다고 그 회차가 끝난 게 아니니까요.</p>';
}
function seriesDetail(id){
  var s = D.series.filter(function(x){return x.id===id;})[0];
  if (!s) return;
  P.toast(s.n+" — "+D.stages[stageOf(s)]+" 단계"+(s.cast?" · 출연 "+s.cast:""));
}
function move(id, dir){
  var s = D.series.filter(function(x){return x.id===id;})[0];
  if (!s) return;
  var g = Math.max(0, Math.min(D.stages.length-1, stageOf(s)+dir));
  P.S().stage[s.id] = g; P.save("series:"+s.id);
  P.toast(s.n+" → "+D.stages[g], "되돌리기", function(){
    P.S().stage[s.id] = g-dir; P.save("series:"+s.id); P.render(); });
  P.render();
}

/* ── 주간 ─────────────────────────────────────────── */
function drawWeek(){
  var now = P.now();
  var mon = new Date(now); mon.setDate(mon.getDate() - ((mon.getDay()+6)%7));
  var days=[], i;
  for (i=0;i<7;i++){ var d=new Date(mon); d.setDate(mon.getDate()+i); days.push(d); }
  var grid = '<div class="wk">'+days.map(function(d){
    var dw=d.getDay(), key=P.ymd(d), isNow=key===P.T;
    var slots = D.rhythm.filter(function(r){ return r.days.indexOf(dw)>=0; })
      .sort(function(a,b){ return a.time<b.time?-1:1; });
    var evs = live().filter(function(it){ return it.d===key; });
    return '<div class="dy'+(isNow?" now":"")+((dw===0||dw===6)?" off":"")+'">'
      + '<div class="dyh"><b>'+P.DOW[dw]+"</b><span>"+(d.getMonth()+1)+"/"+d.getDate()+"</span>"
      + (isNow?'<span class="pill q" style="margin-left:auto">오늘</span>':"")+"</div>"
      + '<div class="dyb">'
      + slots.map(function(r){
          return '<div class="slot '+E(r.kind)+'"><span class="tm">'+E(r.time)+"</span>"
            + '<span class="nm">'+E(r.t)+"</span></div>"; }).join("")
      + evs.map(function(it){
          return '<button class="chip'+(P.late(it)?" late":"")+'" data-act="open" data-arg="'
            + E(it.id)+'"><b>'+E(it.t)+"</b>"+E(it.by?P.who(it.by):"미배정")+"</button>"; }).join("")
      + "</div></div>";
  }).join("")+"</div>";

  var brokenN = D.rhythm.filter(function(r){ return r.kind==="broken"; }).length;
  var autoN = D.rhythm.filter(function(r){ return r.kind==="auto"; }).length;

  return P.stats([
    { k:"자동 슬롯", v:autoN, n:"사람 손 없이 도는 것" },
    { k:"깨진 슬롯", v:brokenN, tone:brokenN?"hot":"", n:brokenN?"스케줄러가 못 돌고 있음":"정상" },
    { k:"이번 주 마감", v:live().filter(function(i){
        var k=i.d; if(!k) return false;
        return P.days(k, P.ymd(mon))>=0 && P.days(k, P.ymd(mon))<7; }).length, n:"날짜가 붙은 일" }
  ])
  + '<section class="sec"><div class="sech"><h2>이번 주</h2>'
  + '<span class="sub">고정 리듬 위에 마감을 얹는다</span></div>'+grid+"</section>"
  + P.sec("지난 주 이전에 지난 것","", live().filter(P.late).sort(P.urgency))
  + '<p class="note"><b>정기 회의 없음.</b> 목요일 고정 미팅은 접었고 회의는 필요할 때 소집합니다. '
  + '대신 미결이 스스로 닫히지 않으니, 막힌 항목은 <b>사람</b> 화면에서 직접 봐야 합니다.</p>';
}

/* ── 분담 ─────────────────────────────────────────── */
/* 나누는 단위는 항목이 아니라 칸이다 — 팀 × 성질.
   한 사람이 칸을 맡고 그 안은 맡은 쪽이 알아서 굴린다.
   36개 중에 고르는 건 부담이지만 칸 하나는 회의에서 한 번에 정해진다.
   그래서 이 화면이 묻는 건 "어느 칸이 비었나"다. */
function cells(){
  var op = open().filter(function(i){ return !i.must; });
  var m = {};
  op.forEach(function(i){
    var k = i.team + "|" + i.l;
    (m[k] = m[k] || { team:i.team, lane:i.l, list:[] }).list.push(i);
  });
  return Object.keys(m).map(function(k){
    var c = m[k];
    c.by      = P.cellBy(c.team, c.lane);
    c.blocked = c.list.filter(function(i){ return i.s==="막힘"; }).length;
    c.now     = c.list.filter(function(i){ return i.h==="now" || P.late(i); }).length;
    return c;
  }).sort(function(a,b){ return b.list.length - a.list.length; });
}

function cellCard(c){
  var k = c.team+"|"+c.lane;
  return '<div class="cell'+(c.by?" held":"")+(c.blocked?" hot":"")+'">'
    + '<div class="cellh"><b>'+E(P.lane(c.lane))+"</b>"
    + '<span class="n num">'+c.list.length+"</span></div>"
    + '<div class="cellm">'
    + (c.now?'<span class="pill s-대기">지금 '+c.now+"</span>":"")
    + (c.blocked?'<span class="pill s-막힘">막힘 '+c.blocked+"</span>":"")
    + (!c.now && !c.blocked?'<span class="micro">급한 것 없음</span>':"")
    + "</div>"
    + (c.by
        ? '<button class="who has cellby" data-act="celldrop" data-arg="'+E(k)+'">'
          + E(P.who(c.by))+" 맡음</button>"
        : '<button class="who open cellby" data-act="cellpick" data-arg="'+E(k)+'">'
          + "비어 있음 — 맡기</button>")
    + '<button class="cellopen" data-act="cellview" data-arg="'+E(k)+'">'
    + "안에 든 것 보기</button></div>";
}

function drawShare(){
  var cs = cells();
  var only = open().filter(function(i){ return i.must; });
  var free = cs.filter(function(c){ return !c.by; });
  var view = P.S().filt && P.S().filt.cell;

  var byTeam = {};
  cs.forEach(function(c){ (byTeam[c.team] = byTeam[c.team] || []).push(c); });

  var grid = (D.teams||[]).filter(function(t){ return byTeam[t]; }).map(function(t){
    var mine = byTeam[t];
    var open_ = mine.filter(function(c){ return !c.by; }).length;
    return '<section class="sec"><div class="sech"><h2>'+E(t)+" 팀</h2>"
      + '<span class="sub">'+(open_?open_+"칸이 비어 있습니다":"모든 칸을 맡았습니다")+"</span>"
      + '<span class="n num">'+mine.reduce(function(a,c){return a+c.list.length;},0)+"</span></div>"
      + '<div class="cells">'+mine.map(cellCard).join("")+"</div></section>";
  }).join("");

  var opened = "";
  if (view){
    var c = cs.filter(function(x){ return x.team+"|"+x.lane === view; })[0];
    if (c) opened = P.sec(c.team+" · "+P.lane(c.lane),
      (c.by?P.who(c.by)+" 가 맡은 칸":"아직 비어 있는 칸")+" — 안에 든 것",
      c.list.sort(P.urgency));
  }

  return P.stats([
    { k:"빈 칸", v:free.length, tone:free.length?"hot":"good",
      n:free.length?"아무도 안 맡은 칸":"모든 칸에 주인이 있습니다" },
    { k:"맡은 칸", v:cs.length-free.length, tone:cs.length-free.length?"good":"",
      n:"주인이 있는 칸" },
    { k:"규효만 가능", v:only.length, n:"계정·명의·대표 결정 — 칸으로 못 넘김" },
    { k:"막힘", v:blocked().length, tone:blocked().length?"hot":"", n:"남이 기다리는 것" }
  ])
  + grid + opened
  + P.sec("규효만 가능", "구조적으로 칸에 넣을 수 없는 것", only.sort(P.urgency))
  + '<p class="note"><b>칸을 맡으면 그 안은 맡은 쪽이 굴립니다.</b> 항목 하나하나를 '
  + '집을 수도 있지만(상세에서), 판이 묻는 건 칸입니다 — 36개를 고르는 건 부담이고 '
  + '칸 하나는 회의에서 한 번에 정해집니다.</p>'
  + (P.shared()
      ? '<p class="note">칸을 맡으면 모두에게 보입니다.</p>'
      : '<p class="note"><b>아직 각자 브라우저에만 남습니다.</b> 지금 주소를 팀에 뿌리면 '
        + '각자 자기 메모지에 표시하는 꼴이 됩니다 — 공용 저장소가 붙은 뒤에 공유하세요.</p>');
}

/* ── 전체 ─────────────────────────────────────────── */
function drawAll(){
  var f = P.S().filt || (P.S().filt = {});
  var ft = f.t || "", fs = f.s || "";
  var pool = P.items().filter(function(i){
    if (ft && i.team !== ft) return false;
    if (fs==="free"    && (i.by || i.must)) return false;
    if (fs==="took"    && !i.by) return false;
    if (fs==="blocked" && i.s!=="막힘") return false;
    if (fs==="mac"     && !i.mac) return false;
    return true;
  });
  var chips = '<div class="filt" style="margin-bottom:16px">'
    + '<span class="lbl" style="margin-right:4px">팀</span>'
    + '<button class="f" data-act="ft" data-arg="" aria-pressed="'+(!ft)+'">전부</button>'
    + (D.teams||[]).map(function(t){
        return '<button class="f" data-act="ft" data-arg="'+E(t)+'" aria-pressed="'+(ft===t)+'">'
          + E(t)+"</button>"; }).join("")
    + '<span style="width:12px"></span><span class="lbl" style="margin-right:4px">거르기</span>'
    + [["","전부"],["free","미배정"],["took","집힌 것"],["blocked","막힘"],["mac","맥에서만"]]
        .map(function(x){
          return '<button class="f" data-act="fs" data-arg="'+x[0]+'" aria-pressed="'+(fs===x[0])+'">'
            + x[1]+"</button>"; }).join("")
    + "</div>";
  var secs = D.lanes.map(function(l){
    var list = pool.filter(function(i){ return i.l===l.id; }).sort(P.urgency);
    return P.sec(l.n, l.id==="frozen"?"지금은 건드리지 않는다":"", list, {showTeam:!ft});
  }).join("");
  return chips + (secs || P.empty("걸리는 게 없습니다","거르기를 풀어보세요."));
}

/* ── 설정 ─────────────────────────────────────────── */
var VIEWS = [
  { id:"today",  n:"오늘",  ic:"●", ask:"지금 뭘 해야 하나", draw:drawToday,
    hot:true, count:function(){ return live().filter(function(i){
      return todayish(i) && !P.on(i); }).length; } },
  { id:"pub",    n:"발행",  ic:"◈", ask:"오늘 뭐가 나가나", draw:drawPub,
    count:function(){ var p=pubToday(); return p.length - p.filter(P.on).length; } },
  { id:"series", n:"회차",  ic:"▶", ask:"어느 단계인가", draw:drawSeries,
    count:function(){ return D.series.length; } },
  { id:"week",   n:"주간",  ic:"▦", ask:"이번 주는 어떻게 도나", draw:drawWeek,
    count:function(){ return ""; } },
  { id:"share",  n:"분담",  ic:"◍", ask:"어느 칸이 비었나", draw:drawShare,
    hot:true, count:function(){ return cells().filter(function(c){ return !c.by; }).length; } },
  { id:"all",    n:"전체",  ic:"☰", ask:"레인별 전부", draw:drawAll,
    count:function(){ return P.items().length; } }
];

P.boot({
  id:"ops", key:"pluto.ops.v2", glyph:"P", name:"오퍼레이션", kind:"team",
  views:VIEWS, scope:"team", canScope:false,
  defaults:{ l:"ops", team:"공통" },
  foot:function(){
    return "기준 "+P.data().asof+" · 스캔 "+P.data().scanAt
      + "\n팀이 같이 보는 판입니다. 개인 항목은 여기 없습니다.";
  },
  actions:{
    sopen: seriesDetail,
    spick: function(id){ P.pickFor("회차", id, function(w){ setSby(id, w); },
                                   (P.data().series.filter(function(x){return x.id===id;})[0]||{}).n); },
    sdrop: function(id){ setSby(id, null); },
    sfwd:  function(id){ move(id, +1); },
    sback: function(id){ move(id, -1); },
    ft:    function(v){ P.S().filt.t = v; P.save(); P.render(); },
    cellview: function(v){ var f=P.S().filt;
                           f.cell = (f.cell===v ? null : v); P.save(); P.render(); },
    fs:    function(v){ P.S().filt.s = v; P.save(); P.render(); }
  }
});
D = P.data();
P.render();

/* 칸반 끌어놓기.
 *
 * HTML5 드래그 API 를 쓰지 않는다. 터치에서 안 먹고, 자동 검사로도 확인이 안 돼서
 * 깨진 걸 모른 채 배포하게 된다. 포인터 이벤트로 직접 잡으면 둘 다 해결된다.
 *
 * 마우스일 때만 끈다. 폰에서는 칸이 한 줄로 쌓이므로 끌 이유가 없고,
 * 카드에서 터치를 가로채면 화면 스크롤이 막힌다 — 그쪽은 화살표로 옮긴다.
 */
(function(){
  var id = null, from = null, moved = false, sx = 0, sy = 0;

  function colAt(x, y){
    var el = document.elementFromPoint(x, y);
    return el ? el.closest("[data-drop]") : null;
  }
  function clearOver(){
    [].forEach.call(document.querySelectorAll(".col.over"), function(c){
      c.classList.remove("over"); });
  }
  function stageNow(sid){
    var s = P.data().series.filter(function(x){ return x.id===sid; })[0];
    if (!s) return null;
    var v = P.S().stage[sid];
    return v==null ? s.stage : v;
  }

  document.addEventListener("pointerdown", function(e){
    if (e.pointerType !== "mouse" || e.button !== 0) return;
    var c = e.target.closest("[data-kid]");
    if (!c) return;
    if (e.target.closest("[data-act=sfwd],[data-act=sback]")) return;
    id = c.dataset.kid; from = stageNow(id);
    moved = false; sx = e.clientX; sy = e.clientY;
  });

  document.addEventListener("pointermove", function(e){
    if (!id) return;
    if (!moved && Math.abs(e.clientX-sx) + Math.abs(e.clientY-sy) < 6) return;
    if (!moved){
      moved = true;
      var c = document.querySelector('[data-kid="'+id+'"]');
      if (c) c.classList.add("drag");
      document.body.style.userSelect = "none";
    }
    clearOver();
    var col = colAt(e.clientX, e.clientY);
    if (col) col.classList.add("over");
  });

  document.addEventListener("pointerup", function(e){
    if (!id) return;
    var dragged = moved, sid = id, was = from;
    var col = dragged ? colAt(e.clientX, e.clientY) : null;
    id = null; from = null; moved = false;
    document.body.style.userSelect = "";
    clearOver();
    var c = document.querySelector('[data-kid="'+sid+'"]');
    if (c) c.classList.remove("drag");
    if (!col) return;
    var g = +col.dataset.drop;
    if (g === was) return;
    var s = P.data().series.filter(function(x){ return x.id===sid; })[0];
    P.S().stage[sid] = g; P.save("series:"+sid);
    P.toast((s?s.n:sid)+" → "+P.data().stages[g], "되돌리기", function(){
      P.S().stage[sid] = was; P.save("series:"+sid); P.render(); });
    P.render();
  });

  document.addEventListener("pointercancel", function(){
    id = null; from = null; moved = false;
    document.body.style.userSelect = ""; clearOver();
  });
})();
})();
</script>
