/* ── 입력 ─────────────────────────────────────────── */
function act(name, arg, val){
  switch(name){
    case "go": go(arg); break;
    case "cmd": cmd.on=true; cmd.q=""; cmd.i=0; P.render(); break;
    case "cmdclose": cmd.on=false; P.render(); break;
    case "cmdgo": var r=cmd.rows[+arg]; cmd.on=false; if(r) r.go(); else P.render(); break;
    case "helpopen": help=true; P.render(); break;
    case "theme":
      S.theme = arg; save(); applyTheme(); P.render(); break;
    case "themecycle":
      var ti = 0;
      THEMES.forEach(function(t,i){ if (t[0]===P.theme()) ti=i; });
      S.theme = THEMES[(ti+1) % THEMES.length][0];
      save(); applyTheme(); P.render(); break;
    case "altog":
      if (!alertsOpen) alertsOpen = {};
      if (alertsOpen[arg]) delete alertsOpen[arg]; else alertsOpen[arg] = true;
      P.render(); break;
    case "helpclose": help=false; P.render(); break;
    case "close": P.close(); break;
    case "open": P.open(arg); break;
    case "tog": var i1=P.byId(arg); if(i1) P.toggle(i1); break;
    case "cycle": var i2=P.byId(arg); if(i2) P.cycle(i2); break;
    case "savefld": saveFields(); break;
    case "reset": delete S.patch[arg]; dirty(); logit(arg,"원래대로"); save(arg);
      P.toast("원래대로 돌렸습니다"); P.render(); break;
    case "drop": P.drop(arg); P.close(); break;
    case "rolepick":
      var rp = String(arg).split("|");
      P.askMe(function(me){ P.claimRole(rp[0], rp[1], me); },
              rp[1]+" 단계를 맡습니다. 이름이 한 번 필요합니다.");
      break;
    case "roledrop":
      var rd = String(arg).split("|"); P.claimRole(rd[0], rd[1], null); break;
    case "opentog":
      var ot = String(arg).split("|"); P.togOpen(ot[0], +ot[1]); break;
    case "fd": S.dense = arg === "1" ? 1 : 0; save(); P.render(); break;
    case "fold":
      S.fold = S.fold || {};
      if (S.fold[arg]) delete S.fold[arg]; else S.fold[arg] = 1;
      save(); P.render(); break;
    case "editt": P.startEdit(arg, "t"); break;
    case "addhere":
      var pre = {}; try { pre = JSON.parse(arg) || {}; } catch(e){}
      P.addHere(pre); break;
    case "gopart":
      var gp = String(arg).split("|");
      if (CFG.actions && CFG.actions.gopart) CFG.actions.gopart(gp[0], gp[1]);
      break;
    case "seen":
      S.seen = Date.now(); save(); P.render(); break;
    case "cellpick":
      var cp = String(arg).split("|");
      P.askMe(function(me){ P.claimCell(cp[0], cp[1], me); },
              cp[0]+" · "+P.lane(cp[1])+" 칸을 맡습니다. 이름이 한 번 필요합니다.");
      break;
    case "whoami":
      pick = { fn:function(){ P.render(); }, why:"맡은 칸에 이 이름이 보입니다." };
      P.render(); break;
    case "celldrop":
      var cd = String(arg).split("|"); P.claimCell(cd[0], cd[1], null); break;
    case "pick-close": pick = null; P.render(); break;
    case "pick-set":
      if (P.gateState() === "new"){       // 대표에게 승인 요청
        var nm2 = String(val||"").trim();
        if (!nm2){ P.render(); break; }
        pick = null; P.render();
        global.Auth.ask(nm2).then(function(ok){
          P.toast(ok ? "승인 요청을 보냈습니다 — 대표가 승인하면 바로 됩니다"
                     : "요청을 보내지 못했습니다");
          P.render();
        });
        break;
      }
      if (P.gate()){ pick = null; P.render(); break; }   // 대기 중엔 적을 게 없다
      var fn = pick && pick.fn, nm = P.setMe(val);
      pick = null;
      if (nm && fn) fn(nm); else P.render();
      break;
    case "gateopen":  gateOpen = true;  P.render(); break;
    case "gateclose": gateOpen = false; P.render(); break;
    case "gateok":
      global.Auth.approve(arg, true).then(function(ok){
        P.toast(ok ? "들여보냈습니다" : "승인하지 못했습니다"); P.render(); });
      break;
    case "gateno":
      global.Auth.approve(arg, false).then(function(ok){
        P.toast(ok ? "거절했습니다" : "처리하지 못했습니다"); P.render(); });
      break;
    case "set":
      var v = val;
      if (arg==="must" && v==="") v=null;
      else if (v==="true") v=true; else if (v==="false") v=false;
      else if (arg==="p") v=+v;
      var o={}; o[arg]=v; P.patch(sel,o,arg+" → "+val); P.render(); break;
    case "undo": if(toast&&toast.fn){ var f=toast.fn; toast=null; clearTimeout(toastT); f(); } break;
    case "snooze":
      S.snooze[arg] = Date.now()+864e5; save();
      P.toast("하루 동안 숨깁니다", "되돌리기", function(){
        delete S.snooze[arg]; save(); P.render(); });
      P.render(); break;
    default:
      if (CFG.actions && CFG.actions[name]) CFG.actions[name](arg, val);
  }
}
P.act = act;
P.snoozed = function(key){ return (S.snooze[key]||0) > Date.now(); };

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-act]");
  if (!t) return;
  e.preventDefault();
  act(t.dataset.act, t.dataset.arg, t.dataset.val);
});
document.addEventListener("focusout", function(e){
  if (e.target && e.target.id === "inline" && edit){
    var v = e.target.value, wasId = edit.id;
    P.commitEdit(v);
    var made = P.byId(wasId);
    if (made && !made.t) P.drop(wasId);
  }
});
document.addEventListener("input", function(e){
  if (e.target.id==="cq"){ cmd.q=e.target.value; cmd.i=0; P.render(); }
  if (e.target.id==="f_t"){ e.target.style.height="auto"; e.target.style.height=e.target.scrollHeight+"px"; }
});
document.addEventListener("keydown", function(e){
  // 그 자리 편집칸 안에서는 Enter·Esc 만 가로챈다. 아래 공통 단축키로
  // 흘려보내면 한 글자 칠 때마다 화면이 바뀐다.
  if (e.target && e.target.id === "whoami"){
    if (e.key === "Enter"){ e.preventDefault(); act("pick-set", null, e.target.value); }
    if (e.key === "Escape"){ e.preventDefault(); pick = null; P.render(); }
    return;
  }
  if (e.target && e.target.id === "inline"){
    if (e.key === "Enter" || e.key === "Escape"){
      e.preventDefault();
      var wasId = edit && edit.id;
      var wasNew = !!(wasId && (P.byId(wasId) || {})._n);
      if (e.key === "Enter") P.commitEdit(e.target.value);
      else P.cancelEdit();
      var made = wasId && P.byId(wasId);
      // 제목 없이 끝냈으면 껍데기를 남기지 않는다
      if (made && wasNew && !made.t) P.drop(wasId);
    }
    return;
  }
  var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){
    e.preventDefault(); cmd.on=true; cmd.i=0; P.render(); return; }
  if (e.key==="Escape"){
    if (cmd.on){ cmd.on=false; P.render(); }
    else if (gateOpen){ gateOpen=false; P.render(); }
    else if (pick){ pick=null; P.render(); }
    else if (help){ help=false; P.render(); }
    else if (sel){ P.close(); }
    return;
  }
  if (cmd.on){
    if (e.key==="ArrowDown"){ e.preventDefault(); cmd.i=Math.min(cmd.i+1,cmd.rows.length-1); P.render(); }
    else if (e.key==="ArrowUp"){ e.preventDefault(); cmd.i=Math.max(cmd.i-1,0); P.render(); }
    else if (e.key==="Enter"){ e.preventDefault(); var r=cmd.rows[cmd.i]; cmd.on=false;
      if (r) r.go(); else P.render(); }
    return;
  }
  if (typing) return;
  if ((e.metaKey||e.ctrlKey) && e.key==="Enter" && sel){ e.preventDefault(); saveFields(); return; }
  if (e.metaKey||e.ctrlKey||e.altKey) return;

  var k = e.key;
  if (k==="/" ){ e.preventDefault(); cmd.on=true; cmd.q=""; cmd.i=0; P.render(); return; }
  if (k==="?"){ help=true; P.render(); return; }
  if (k>="1" && k<="9"){
    var v = CFG.views[+k-1]; if (v){ go(v.id); } return;
  }
  if (!rowsOnScreen.length) return;
  if (k==="j" || k==="ArrowDown"){ e.preventDefault();
    cursor=Math.min(cursor+1, rowsOnScreen.length-1); P.render(); return; }
  if (k==="k" || k==="ArrowUp"){ e.preventDefault();
    cursor=Math.max(cursor-1, 0); P.render(); return; }
  var id = rowsOnScreen[cursor];
  if (!id) return;
  var it = P.byId(id);
  if (!it) return;
  if (k==="Enter"){ e.preventDefault(); P.open(id); }
  else if (k==="x"){ e.preventDefault(); P.toggle(it); }
  else if (k==="s"){ e.preventDefault(); P.cycle(it); }
  else if (k==="e"){ e.preventDefault(); P.startEdit(id, "t"); }
});

/* 자정을 넘겨 켜둔 폰에서 "매일" 항목이 어제 상태로 남지 않게. */
setInterval(function(){
  var k = ymd(new Date());
  if (k !== P.T){ NOW = new Date(); P.T = k; P.render(); }
}, 6e4);

P.boot = function(cfg){
  CFG = cfg;
  DATA = JSON.parse(document.getElementById("data").textContent);
  document.documentElement.dataset.app = cfg.id;
  S = load();
  applyTheme();
  // 여기서 그리지 않는다. 앱 파일이 DATA 를 받아 자기 변수를 채운 뒤
  // 직접 P.render() 를 부른다 — 먼저 그리면 화면 수 세는 함수가 빈 데이터를 만난다.
  //
  // 공유 저장소는 뒤따라 붙는다. 먼저 로컬로 그려 두고, 내려온 값이 다르면
  // 그때 다시 그린다 — 네트워크를 기다리며 흰 화면을 보여주지 않는다.
  if (global.Auth && global.Auth.on) {
    setTimeout(function(){ global.Auth.start(function(){ P.render(); }); }, 0);
  }
  if (global.Sync && global.Sync.on) {
    setTimeout(function(){
      global.Sync.start(S, function(){ ALL = null; P.render(); });
    }, 0);
  }
};
return P;
})(window);
</script>
<script>/* 플루토 오퍼레이션 — 팀 앱
 * 개인 항목은 이 빌드에 아예 들어 있지 않다. 숨기는 게 아니라 없다.
 * (build.py 가 scope==="solo" 를 걸러낸 data.json 을 박아 넣는다)
 */
(function () {
"use strict";
var D = null;

function E(s){ return P.esc(s); }
function live(){ return P.live(); }
function open(){ return live().filter(function(i){ return !P.on(i); }); }
function blocked(){ return open().filter(function(i){ return i.s==="막힘"; }); }
function todayish(i){ return i.h==="now" || i.k==="recur" || P.late(i); }
function uniq(a){ var o=[],i; for(i=0;i<a.length;i++) if(o.indexOf(a[i])<0) o.push(a[i]); return o; }

/* 오늘 나가야 하는 발행물. 매일 돌더라도 매거진 레인이 아니면 발행이 아니다 —
   리빙 문서 갱신 같은 건 발행 판에 섞이면 숫자를 못 믿게 된다. */
function pubToday(){ return live().filter(function(i){ return i.k==="recur" && i.l==="mag"; }); }
function otherRecur(){ return live().filter(function(i){ return i.k==="recur" && i.l!=="mag"; }); }

/* ── 오늘 ─────────────────────────────────────────── */
function drawToday(){
  var all = live().sort(P.urgency);
  var late = all.filter(P.late);
  var pub  = pubToday();
  var pubDone = pub.filter(P.on).length;
  var now  = all.filter(function(i){ return i.k!=="recur" && !P.late(i) && i.h==="now" && !P.on(i); });
  var week = all.filter(function(i){ return i.h==="week" && !P.on(i) && !P.late(i); });
  var bl = blocked();
  var alerts = P.data().alerts.filter(function(a){
    return a.sev!=="ok" && !P.snoozed("al:"+a.t);
  });
  var good = P.data().alerts.filter(function(a){ return a.sev==="ok"; });

  // 제일 급한 하나를 머리로 세우고, 아래 목록에서는 뺀다 — 같은 줄이
  // 두 번 나오면 "왜 두 번 있지"부터 묻게 된다.
  // 머리에 세울 후보는 "오늘"에 해당하는 것만 — 그다음 건수가 전체 판을
  // 세면 "그다음 33건"처럼 오늘과 무관한 숫자가 나온다.
  var todays = late.concat(pub, now, otherRecur())
    .filter(function(i){ return !P.on(i) && i.k!=="track"; });
  var seen = {}, tlist = [];
  todays.forEach(function(i){ if (!seen[i.id]){ seen[i.id]=1; tlist.push(i); } });
  var lead = P.lead(tlist, { calm:"오늘 걸린 게 없습니다",
                             calmn:"이번 주 일로 넘어가도 됩니다." });
  var top = tlist.slice().sort(P.urgency)[0];
  var notTop = function(l){ return top ? l.filter(function(i){ return i.id!==top.id; }) : l; };

  var head = P.stats([
    { k:"오늘 발행", v:pubDone+"/"+pub.length, tone:pubDone===pub.length?"good":"",
      n:pubDone===pub.length?"오늘 몫은 다 나갔습니다":"아직 "+(pub.length-pubDone)+"건 남았습니다",
      act:"go", arg:"pub" },
    { k:"막힘", v:bl.length, tone:bl.length?"hot":"",
      n:bl.length?uniq(bl.map(function(i){ return P.holder(i)||"빈 칸"; })).slice(0,3).join(" · ")
        :"막힌 것 없음",
      act:"go", arg:"share" },
    { k:"지남", v:late.length, tone:late.length?"hot":"",
      n:late.length?"가장 오래된 건 "+P.days(P.T,late[0].d)+"일":"마감 넘긴 것 없음" },
    { k:"이번 주", v:week.length, n:"주 단위로 걸린 일", act:"go", arg:"week" }
  ]);

  var al = alerts.length
    ? '<section class="sec"><div class="sech"><h2>관제</h2>'
      + '<span class="sub">'+E(P.data().scanAt)+" 자동 스캔</span>"
      + '<span class="n num">'+alerts.length+"</span></div>"
      + P.alerts(alerts)+"</section>"
    : "";

  var ok = good.length
    ? '<section class="sec"><div class="sech"><h2>잘 돌고 있는 것</h2>'
      + '<span class="n num">'+good.length+"</span></div>"
      + P.alerts(good)+"</section>"
    : "";

  return lead + head + al
    + P.sec("지났다","마감일이 넘은 것", notTop(late), {showPart:true})
    + P.sec("오늘 나갈 것","매일 도는 발행 — 자정에 풀린다",
        notTop(pub.filter(function(i){return !P.on(i);})), {showPart:true})
    + P.sec("오늘 할 것","지금 블록", notTop(now), {showPart:true})
    + P.sec("매일 도는 것","발행은 아니지만 매일 손이 가는 일",
        notTop(otherRecur().filter(function(i){ return !P.on(i); })), {showPart:true})
    + ok;
}

/* ── 발행 ─────────────────────────────────────────── */
function drawPub(){
  var mag = live().filter(function(i){ return i.l==="mag"; });
  var daily = mag.filter(function(i){ return i.k==="recur"; });
  var build = mag.filter(function(i){ return i.k!=="recur"; }).sort(P.urgency);
  var doneN = daily.filter(P.on).length;

  var strip = '<div class="cards c3">'+daily.map(function(i){
    var on = P.on(i);
    return '<div class="card" style="'+(on?"border-color:rgba(95,185,139,.35)":"")+'">'
      + '<div class="cardh"><b>'+E(i.t)+"</b>"
      + '<span class="n">'+E(P.holder(i)||"빈 칸")+"</span></div>"
      + (i.n?'<p class="meta">'+E(i.n)+"</p>":"")
      + '<div style="display:flex;gap:8px;align-items:center;margin-top:12px">'
      + '<button class="btn'+(on?" g":"")+'" data-act="tog" data-arg="'+E(i.id)+'">'
      + (on?"오늘 나갔음 ✓":"오늘 나갔다고 표시")+"</button>"
      + '<button class="iconb" data-act="open" data-arg="'+E(i.id)+'" aria-label="상세">›</button>'
      + "</div></div>";
  }).join("")+"</div>";

  return P.stats([
    { k:"오늘 나간 것", v:doneN+"/"+daily.length, tone:doneN===daily.length?"good":"",
      n:"자정에 전부 풀립니다" },
    { k:"준비 중", v:build.filter(function(i){return !P.on(i);}).length, n:"체계·규칙·자동화" },
    { k:"이번 달 성과", v:"180", u:"만", tone:"good", n:"캐러셀 조회수 — 첫 100만 돌파" }
  ])
  + '<section class="sec"><div class="sech"><h2>매일 나가는 것</h2>'
  + '<span class="sub">하나라도 빠지면 그날 계정이 조용해진다</span></div>'
  + strip + "</section>"
  + P.sec("발행 체계 만들기","한 번 만들면 매일이 쉬워지는 것", build)
  + '<p class="note"><b>왜 따로 두는가</b> 발행은 완료되는 일이 아니라 <b>오늘 나갔는가</b>로 '
  + '묻는 일입니다. 같은 목록에 두면 매일 체크가 풀리는 항목과 한 번 끝나는 항목이 섞여서 '
  + '어느 쪽도 믿을 수 없게 됩니다.</p>';
}

/* ── 회차 ─────────────────────────────────────────── */
function stageOf(s){ var v=P.S().stage[s.id]; return v==null ? s.stage : v; }
/* 회차 하나를 펼친 제작 시트. 단계별로 누가 맡는지가 여기서 정해진다 —
   "서브 PD 위임 범위를 1·2·3편 단계로"가 바로 이 표다. */
function sheet(s){
  var gi = stageOf(s);
  var roles = D.stages.map(function(g, i){
    var who = P.role(s.id, g), passed = i < gi, at = i === gi;
    return '<div class="rl'+(passed?" past":"")+(at?" at":"")+'">'
      + '<span class="rlg">'+E(g)+"</span>"
      + (who
          ? '<button class="who has" data-act="roledrop" data-arg="'+E(s.id+"|"+g)+'"'
            + ' title="놓기">'+E(who)+"</button>"
          : '<button class="who open" data-act="rolepick" data-arg="'+E(s.id+"|"+g)+'">'
            + "비어 있음</button>")
      + "</div>";
  }).join("");

  var opens = (s.open || []).map(function(q, i){
    var on = P.openDone(s.id, i);
    return '<button class="qi'+(on?" on":"")+'" data-act="opentog" data-arg="'
      + E(s.id+"|"+i)+'" aria-pressed="'+on+'"><span class="qb"></span>'+E(q)+"</button>";
  }).join("");
  var left = (s.open || []).filter(function(_, i){ return !P.openDone(s.id, i); }).length;

  // 카메라가 두 대뿐이고 규효가 한 명이다. 같은 날 두 회차는 안 된다.
  var clash = s.when && D.series.filter(function(x){
    return x.id !== s.id && x.when === s.when; });

  return '<section class="sec"><div class="sech"><h2>'+E(s.n)+"</h2>"
    + '<span class="sub">'+E(s.sub||"")+"</span>"
    + '<button class="act" data-act="sclose">닫기</button></div>'
    + '<div class="sheet">'
    + '<div class="shrow"><span class="k">촬영일</span><span class="v'
    + (s.when?"":" none")+'">'+E(s.when || "아직 안 잡힘")+"</span></div>"
    + '<div class="shrow"><span class="k">장소</span><span class="v'
    + (s.where?"":" none")+'">'+E(s.where || "미정")+"</span></div>"
    + '<div class="shrow"><span class="k">출연</span><span class="v'
    + (s.cast?"":" none")+'">'+E(s.cast || "미정")+"</span></div>"
    + '<div class="shrow"><span class="k">카메라</span><span class="v">'
    + E(String(s.cam||1))+"대 · 보유 2대</span></div>"
    + (clash && clash.length
        ? '<p class="clash">같은 날 '+E(clash[0].n)
          + ' 도 잡혀 있습니다 — 카메라 2대와 사람 하나로는 하루에 둘을 못 찍습니다.</p>'
        : "")
    + '<div class="shh">단계별로 누가 맡나</div>'
    + '<div class="rls">'+roles+"</div>"
    + (opens
        ? '<div class="shh">미결 '+left+"건</div>"+'<div class="qs">'+opens+"</div>"
        : "")
    + "</div></section>";
}

function drawSeries(){
  var stages = D.stages;
  var cols = stages.map(function(g,gi){
    var here = D.series.filter(function(s){ return stageOf(s)===gi; });
    return '<div class="col" data-drop="'+gi+'"><div class="colh"><b>'+E(g)+"</b>"
      + '<span class="n num">'+here.length+'</span></div><div class="colb">'
      + here.map(function(s){
          var left = (s.open||[]).filter(function(_,i){
                        return !P.openDone(s.id,i); }).length;
          return '<div class="kcard'+(P.S().filt.ser===s.id?" on":"")+'" data-kid="'+E(s.id)+'" '
            + 'data-act="sopen" data-arg="'+E(s.id)+'">'
            + "<b>"+E(s.n)+"</b>"
            + (s.sub?'<span class="sub">'+E(s.sub)+"</span>":"")
            + (s.when?'<span class="sub when">'+E(s.when)+"</span>":"")
            + '<div class="foot">'
            + (left?'<span class="pill s-대기">미결 '+left+"</span>":
                    '<span class="pill s-진행">미결 없음</span>')
            + (gi>0?'<button class="pill q" data-act="sback" data-arg="'+E(s.id)+'">←</button>':"")
            + (gi<stages.length-1?'<button class="pill q" data-act="sfwd" data-arg="'+E(s.id)+'">→</button>':"")
            + "</div></div>";
        }).join("")
      + (here.length?"":'<p class="micro" style="padding:6px 4px">비어 있음</p>')
      + "</div></div>";
  }).join("");

  var open = D.series.map(function(s){
    return { s:s, g:stageOf(s) };
  });
  var stuck = open.filter(function(x){ return x.g===0; }).length;

  var allOpen = D.series.reduce(function(a, x){
    return a + (x.open||[]).filter(function(_, i){ return !P.openDone(x.id, i); }).length; }, 0);
  var noDate = D.series.filter(function(x){ return !x.when; }).length;
  var sel = P.S().filt.ser;
  var cur = sel && D.series.filter(function(x){ return x.id===sel; })[0];

  return P.stats([
    { k:"회차", v:D.series.length, n:"파일럿 단계" },
    { k:"섭외에 묶임", v:stuck, tone:stuck>1?"hot":"",
      n:stuck>1?"컨택이 안 나가면 전부 여기서 멈춥니다":"진행 중" },
    { k:"미결", v:allOpen, tone:allOpen?"hot":"good",
      n:allOpen?"회차 안에서 닫아야 하는 것":"모두 닫힘" },
    { k:"촬영일 없음", v:noDate, tone:noDate?"hot":"good", n:"날짜가 없으면 아무것도 못 잡음" }
  ])
  + '<section class="sec"><div class="sech"><h2>파이프라인</h2>'
  + '<span class="sub">카드를 끌어 옮기거나 화살표로 옮깁니다 · 눌러서 제작 시트</span></div>'
  + '<div class="kan">'+cols+"</div></section>"
  + (cur ? sheet(cur) : "")
  + P.sec("프로그램 레인","회차에 안 붙는 준비 작업",
      live().filter(function(i){ return i.l==="prog"; }).sort(P.urgency))
  + '<p class="note"><b>회차는 완료가 아니라 단계입니다.</b> 체크박스로 묻지 않는 이유가 '
  + '여기 있습니다 — 촬영이 끝났다고 그 회차가 끝난 게 아니니까요.</p>'
  + '<p class="note">회차를 열면 <b>단계별로 누가 맡는지</b>를 정할 수 있습니다. '
  + '프리프로덕션과 편집을 혼자 지는 구조를 끊는 자리가 여기입니다 — '
  + '회차 하나를 통째로 넘기지 않아도, 편집만 넘기는 것부터 됩니다.</p>';
}
function move(id, dir){
  var s = D.series.filter(function(x){return x.id===id;})[0];
  if (!s) return;
  var g = Math.max(0, Math.min(D.stages.length-1, stageOf(s)+dir));
  P.S().stage[s.id] = g; P.save("series:"+s.id);
  P.toast(s.n+" → "+D.stages[g], "되돌리기", function(){
    P.S().stage[s.id] = g-dir; P.save("series:"+s.id); P.render(); });
  P.render();
}

/* ── 주간 ─────────────────────────────────────────── */
function drawWeek(){
  var now = P.now();
  var mon = new Date(now); mon.setDate(mon.getDate() - ((mon.getDay()+6)%7));
  var days=[], i;
  for (i=0;i<7;i++){ var d=new Date(mon); d.setDate(mon.getDate()+i); days.push(d); }
  var grid = '<div class="wk">'+days.map(function(d){
    var dw=d.getDay(), key=P.ymd(d), isNow=key===P.T;
    var slots = D.rhythm.filter(function(r){ return r.days.indexOf(dw)>=0; })
      .sort(function(a,b){ return a.time<b.time?-1:1; });
    var evs = live().filter(function(it){ return it.d===key; });
    return '<div class="dy'+(isNow?" now":"")+((dw===0||dw===6)?" off":"")+'">'
      + '<div class="dyh"><b>'+P.DOW[dw]+"</b><span>"+(d.getMonth()+1)+"/"+d.getDate()+"</span>"
      + (isNow?'<span class="pill q" style="margin-left:auto">오늘</span>':"")+"</div>"
      + '<div class="dyb">'
      + slots.map(function(r){
          return '<div class="slot '+E(r.kind)+'"><span class="tm">'+E(r.time)+"</span>"
            + '<span class="nm">'+E(r.t)+"</span></div>"; }).join("")
      + evs.map(function(it){
          return '<button class="chip'+(P.late(it)?" late":"")+'" data-act="open" data-arg="'
            + E(it.id)+'"><b>'+E(it.t)+"</b>"+E(P.holder(it)||"빈 칸")+"</button>"; }).join("")
      + "</div></div>";
  }).join("")+"</div>";

  var brokenN = D.rhythm.filter(function(r){ return r.kind==="broken"; }).length;
  var autoN = D.rhythm.filter(function(r){ return r.kind==="auto"; }).length;

  return P.stats([
    { k:"자동 슬롯", v:autoN, n:"사람 손 없이 도는 것" },
    { k:"깨진 슬롯", v:brokenN, tone:brokenN?"hot":"", n:brokenN?"스케줄러가 못 돌고 있음":"정상" },
    { k:"이번 주 마감", v:live().filter(function(i){
        var k=i.d; if(!k) return false;
        return P.days(k, P.ymd(mon))>=0 && P.days(k, P.ymd(mon))<7; }).length, n:"날짜가 붙은 일" }
  ])
  + '<section class="sec"><div class="sech"><h2>이번 주</h2>'
  + '<span class="sub">고정 리듬 위에 마감을 얹는다</span></div>'+grid+"</section>"
  + P.sec("지난 주 이전에 지난 것","", live().filter(P.late).sort(P.urgency), {showPart:true})
  + '<p class="note"><b>정기 회의 없음.</b> 목요일 고정 미팅은 접었고 회의는 필요할 때 소집합니다. '
  + '대신 미결이 스스로 닫히지 않으니, 막힌 항목은 <b>사람</b> 화면에서 직접 봐야 합니다.</p>';
}

/* ── 분담 ─────────────────────────────────────────── */
/* 나누는 단위는 항목이 아니라 칸이다 — 팀 × 성질.
   한 사람이 칸을 맡고 그 안은 맡은 쪽이 알아서 굴린다.
   36개 중에 고르는 건 부담이지만 칸 하나는 회의에서 한 번에 정해진다.
   그래서 이 화면이 묻는 건 "어느 칸이 비었나"다. */
function cells(){
  var op = open().filter(function(i){ return !i.must; });
  var m = {};
  op.forEach(function(i){
    var k = i.team + "|" + i.l;
    (m[k] = m[k] || { team:i.team, lane:i.l, list:[] }).list.push(i);
  });
  return Object.keys(m).map(function(k){
    var c = m[k];
    c.by      = P.cellBy(c.team, c.lane);
    c.blocked = c.list.filter(function(i){ return i.s==="막힘"; }).length;
    c.now     = c.list.filter(function(i){ return i.h==="now" || P.late(i); }).length;
    return c;
  }).sort(function(a,b){ return b.list.length - a.list.length; });
}

function cellCard(c){
  var k = c.team+"|"+c.lane;
  return '<div class="cell'+(c.by?" held":"")+(c.blocked?" hot":"")+'">'
    + '<div class="cellh"><b>'+E(P.lane(c.lane))+"</b>"
    + '<span class="n num">'+c.list.length+"</span></div>"
    + '<div class="cellm">'
    + (c.now?'<span class="pill s-대기">지금 '+c.now+"</span>":"")
    + (c.blocked?'<span class="pill s-막힘">막힘 '+c.blocked+"</span>":"")
    + (!c.now && !c.blocked?'<span class="micro">급한 것 없음</span>':"")
    + "</div>"
    + (c.by
        ? '<button class="who has cellby" data-act="celldrop" data-arg="'+E(k)+'">'
          + E(c.by)+" 맡음</button>"
        : '<button class="who open cellby" data-act="cellpick" data-arg="'+E(k)+'">'
          + "비어 있음 — 맡기</button>")
    + '<button class="cellopen" data-act="cellview" data-arg="'+E(k)+'">'
    + "안에 든 것 보기</button></div>";
}

function drawShare(){
  var cs = cells();
  var only = open().filter(function(i){ return i.must; });
  var free = cs.filter(function(c){ return !c.by; });
  var view = P.S().filt && P.S().filt.cell;

  var byTeam = {};
  cs.forEach(function(c){ (byTeam[c.team] = byTeam[c.team] || []).push(c); });

  var grid = (D.teams||[]).filter(function(t){ return byTeam[t]; }).map(function(t){
    var mine = byTeam[t];
    var open_ = mine.filter(function(c){ return !c.by; }).length;
    return '<section class="sec"><div class="sech"><h2>'+E(t)+" 팀</h2>"
      + '<span class="sub">'+(open_?open_+"칸이 비어 있습니다":"모든 칸을 맡았습니다")+"</span>"
      + '<span class="n num">'+mine.reduce(function(a,c){return a+c.list.length;},0)+"</span></div>"
      + '<div class="cells">'+mine.map(cellCard).join("")+"</div></section>";
  }).join("");

  var opened = "";
  if (view){
    var c = cs.filter(function(x){ return x.team+"|"+x.lane === view; })[0];
    if (c) opened = P.sec(c.team+" · "+P.lane(c.lane),
      (c.by?P.josa(c.by,"이","가")+" 맡은 칸":"아직 비어 있는 칸")+" — 안에 든 것",
      c.list.sort(P.urgency));
  }

  // 이유별로 갈라야 무엇이 구조로 풀리는지 보인다.
  var freeable = only.filter(P.canFree).sort(P.urgency);
  var hard     = only.filter(function(i){ return !P.canFree(i); }).sort(P.urgency);
  var byWhy = {};
  freeable.forEach(function(i){ (byWhy[i.why] = byWhy[i.why] || []).push(i); });
  var WH = P.whys();
  var keyed = Object.keys(byWhy)
    .sort(function(a,b){ return byWhy[b].length - byWhy[a].length; })
    .map(function(k){
      return '<div class="key"><div class="keyh"><b>'+E(WH[k].n)+"</b>"
        + '<span class="n num">'+byWhy[k].length+"건</span></div>"
        + '<p class="keyw">'+E(WH[k].how)+"</p>"
        + '<div class="keyl">'+byWhy[k].map(function(i){
            return '<button class="keyi" data-act="open" data-arg="'+E(i.id)+'">'
              + E(i.t)+"</button>"; }).join("")+"</div></div>";
    }).join("");

  return P.stats([
    { k:"빈 칸", v:free.length, tone:free.length?"hot":"good",
      n:free.length?"아무도 안 맡은 칸":"모든 칸에 주인이 있습니다" },
    { k:"맡은 칸", v:cs.length-free.length, tone:cs.length-free.length?"good":"",
      n:"주인이 있는 칸" },
    { k:"파트로 못 넘긴 것", v:freeable.length, tone:freeable.length?"hot":"good",
      n:"체계 하나면 파트가 가져갈 수 있는 일" },
    { k:"파트에 못 넣는 것", v:hard.length, n:"대표 결정·회사 명의 — 사람을 늘려도 안 줄어듦" }
  ])
  + grid + opened
  + (keyed
      ? '<section class="sec"><div class="sech"><h2>아직 파트로 못 넘긴 것</h2>'
        + '<span class="sub">막고 있는 건 일이 아니라 체계입니다</span>'
        + '<span class="n num">'+freeable.length+"</span></div>"
        + '<div class="keys">'+keyed+"</div></section>"
      : "")
  + P.sec("파트에 못 넣는 것", "회사 명의와 대표 결정 — 구조로 못 넘김", hard, {showPart:true})
  + '<p class="note"><b>칸을 맡으면 그 안은 맡은 쪽이 굴립니다.</b> 항목 하나하나를 '
  + '집을 수도 있지만(상세에서), 판이 묻는 건 칸입니다 — 수십 개를 고르는 건 부담이고 '
  + '칸 하나는 회의에서 한 번에 정해집니다.</p>'
  + '<p class="note">파트 밖에 있는 '+(freeable.length+hard.length)+'건 중 <b>'
  + freeable.length+'건은 일이 어려워서가 아니라 체계가 없어서</b>입니다. '
  + '계정은 금고 하나, 관계는 소개 한 번, 머릿속은 한 장이면 파트가 가져갑니다.</p>'
  + (P.shared()
      ? '<p class="note">칸을 맡으면 모두에게 보입니다.</p>'
      : '<p class="note"><b>아직 각자 브라우저에만 남습니다.</b> 지금 주소를 팀에 뿌리면 '
        + '각자 자기 메모지에 표시하는 꼴이 됩니다 — 공용 저장소가 붙은 뒤에 공유하세요.</p>');
}

/* ── 전체 ─────────────────────────────────────────── */
function drawAll(){
  var f = P.S().filt || (P.S().filt = {});
  var ft = f.t || "", fs = f.s || "", gb = f.g || "part";

  var pool = P.items().filter(function(i){
    if (ft && i.team !== ft) return false;
    if (fs==="free"    && (P.holder(i) || i.must)) return false;
    if (fs==="took"    && !P.holder(i)) return false;
    if (fs==="blocked" && i.s!=="막힘") return false;
    if (fs==="mac"     && !i.mac) return false;
    return true;
  });

  // 묶는 기준. 기본은 파트 — 이 판이 일을 가르는 단위가 그것이기 때문이다.
  var GROUPS = [["part","파트"],["lane","성질"],["s","상태"],["h","기한"],["who","칸 주인"]];
  var HN = { now:"지금", week:"이번 주", month:"이번 달", quarter:"분기", someday:"언젠가" };

  function keyOf(i){
    if (gb==="part") return (i.team||"공통")+"|"+i.l;
    if (gb==="lane") return i.l;
    if (gb==="s")    return i.s || "없음";
    if (gb==="h")    return i.h || "없음";
    return P.holder(i) || (i.must ? "must:"+i.must : "free");
  }
  function labelOf(k, sample){
    if (gb==="part") return P.part(sample);
    if (gb==="lane") return P.lane(k);
    if (gb==="h")    return HN[k] || k;
    if (gb==="who"){
      if (k==="free") return "빈 칸";
      if (k.indexOf("must:")===0) return P.roleName(k.slice(5))+"만 가능";
      return k+" 맡은 칸";
    }
    return k;
  }
  // 섹션에서 바로 만들 때 물려받을 속성
  function presetOf(k, sample){
    if (gb==="part") return { team:sample.team, l:sample.l };
    if (gb==="lane") return { l:k };
    if (gb==="s")    return { s:k };
    if (gb==="h")    return { h:k };
    return {};
  }

  var order = [], bucket = {};
  pool.forEach(function(i){
    var k = keyOf(i);
    if (!bucket[k]) { bucket[k] = []; order.push(k); }
    bucket[k].push(i);
  });
  // 성질·기한은 정해진 차례가 있고, 나머지는 큰 묶음부터
  if (gb==="lane") order = D.lanes.map(function(l){return l.id;}).filter(function(k){return bucket[k];});
  else if (gb==="h") order = ["now","week","month","quarter","someday","없음"].filter(function(k){return bucket[k];});
  else order.sort(function(a,b){ return bucket[b].length - bucket[a].length; });

  function chipRow(label, act, cur, opts){
    return '<span class="lbl">'+E(label)+"</span>"
      + opts.map(function(x){
          return '<button class="f" data-act="'+act+'" data-arg="'+E(x[0])+'" aria-pressed="'
            + (cur===x[0])+'">'+E(x[1])+"</button>"; }).join("");
  }
  var bar = '<div class="filt">'
    + chipRow("묶기", "fg", gb, GROUPS)
    + '<span class="fgap"></span>'
    + chipRow("팀", "ft", ft, [["","전부"]].concat((D.teams||[]).map(function(t){return [t,t];})))
    + '<span class="fgap"></span>'
    + chipRow("거르기", "fs", fs,
        [["","전부"],["free","빈 칸"],["took","맡은 칸"],["blocked","막힘"],["mac","맥에서만"]])
    + '<span class="fgap"></span>'
    + chipRow("보기", "fd", P.dense()?"1":"0", [["0","편하게"],["1","빽빽하게"]])
    + "</div>";

  var secs = order.map(function(k){
    var list = bucket[k].sort(P.urgency);
    return P.sec(labelOf(k, list[0]), "", list, {
      key: "all:"+gb+":"+k,
      showPart: gb!=="part" && gb!=="lane",
      showTeam: gb==="lane" && !ft,
      add: presetOf(k, list[0])
    });
  }).join("");

  return bar + (secs || P.empty("걸리는 게 없습니다","거르기를 풀어보세요."));
}

/* ── 설정 ─────────────────────────────────────────── */
var VIEWS = [
  { id:"today",  n:"오늘",  ic:"●", ask:"지금 뭘 해야 하나", draw:drawToday,
    hot:true, count:function(){ return live().filter(function(i){
      return todayish(i) && !P.on(i); }).length; } },
  { id:"pub",    n:"발행",  ic:"◈", ask:"오늘 뭐가 나가나", draw:drawPub,
    count:function(){ var p=pubToday(); return p.length - p.filter(P.on).length; } },
  { id:"series", n:"회차",  ic:"▶", ask:"어느 단계인가", draw:drawSeries,
    count:function(){ return D.series.length; } },
  { id:"week",   n:"주간",  ic:"▦", ask:"이번 주는 어떻게 도나", draw:drawWeek,
    count:function(){ return ""; } },
  { id:"share",  n:"분담",  ic:"◍", ask:"어느 칸이 비었나", draw:drawShare,
    hot:true, count:function(){ return cells().filter(function(c){ return !c.by; }).length; } },
  { id:"all",    n:"전체",  ic:"☰", draw:drawAll,
    get ask(){
      var g = (P.S().filt||{}).g || "part";
      return { part:"파트별 전부", lane:"성질별 전부", s:"상태별 전부",
               h:"기한별 전부", who:"칸 주인별 전부" }[g] || "전부";
    },
    count:function(){ return P.items().length; } }
];

P.boot({
  id:"ops", key:"pluto.ops.v2", glyph:"P", name:"오퍼레이션", kind:"team",
  views:VIEWS, scope:"team", canScope:false,
  defaults:{ l:"ops", team:"공통" },
  foot:function(){
    return "기준 "+P.data().asof+" · 스캔 "+P.data().scanAt
      + "\n팀이 같이 보는 판입니다. 개인 항목은 여기 없습니다.";
  },
  /* 팀은 이 판을 처음 본다. 한 번만 뜨고, 닫으면 다시 안 뜬다. */
  intro:function(){
    return '<section class="intro"><h2>이 판이 묻는 건 "누가 뭘 하나"가 아닙니다</h2>'
      + '<p>일을 사람 기준으로 쪼개지 않습니다. <b>팀 × 성질로 칸을 나눠 두고, '
      + '각자 칸을 통째로 맡습니다.</b> 칸을 맡으면 그 안은 맡은 쪽이 굴립니다 — '
      + '항목 하나하나를 배정받지 않습니다.</p>'
      + '<p><b>분담</b>에서 빈 칸을 찾아 맡으시면 됩니다. '
      + '<b>오늘</b>은 지금 제일 급한 하나를 세워 두고, <b>회차</b>는 촬영 건별로 '
      + '어느 단계를 누가 맡는지를 봅니다.</p>'
      + '<p class="micro">체크와 담당은 '
      + (P.shared() ? "모두에게 바로 보입니다." : "아직 각자 브라우저에만 남습니다.")
      + ' 화면 밝기는 왼쪽 아래에서 바꿉니다.</p>'
      + '<button class="btn" data-act="seen">알겠습니다</button></section>';
  },
  actions:{
    sopen: function(id){ var f=P.S().filt;
                         f.ser = (f.ser===id ? null : id); P.save(); P.render(); },
    sclose: function(){ P.S().filt.ser = null; P.save(); P.render(); },
    sfwd:  function(id){ move(id, +1); },
    sback: function(id){ move(id, -1); },
    ft:    function(v){ P.S().filt.t = v; P.save(); P.render(); },
    cellview: function(v){ var f=P.S().filt;
                           f.cell = (f.cell===v ? null : v); P.save(); P.render(); },
    fs:    function(v){ P.S().filt.s = v; P.save(); P.render(); },
    fg:    function(v){ P.S().filt.g = v; P.save(); P.render(); },
    /* 줄에 붙은 파트를 누르면 전체 화면에서 그 팀만 남기고 파트로 묶어 보여준다. */
    gopart: function(team){
      var f = P.S().filt; f.g = "part"; f.t = team || ""; f.s = "";
      P.save(); P.go("all");
    }
  }
});
D = P.data();
P.render();

/* 칸반 끌어놓기.
 *
 * HTML5 드래그 API 를 쓰지 않는다. 터치에서 안 먹고, 자동 검사로도 확인이 안 돼서
 * 깨진 걸 모른 채 배포하게 된다. 포인터 이벤트로 직접 잡으면 둘 다 해결된다.
 *
 * 마우스일 때만 끈다. 폰에서는 칸이 한 줄로 쌓이므로 끌 이유가 없고,
 * 카드에서 터치를 가로채면 화면 스크롤이 막힌다 — 그쪽은 화살표로 옮긴다.
 */
(function(){
  var id = null, from = null, moved = false, sx = 0, sy = 0;

  function colAt(x, y){
    var el = document.elementFromPoint(x, y);
    return el ? el.closest("[data-drop]") : null;
  }
  function clearOver(){
    [].forEach.call(document.querySelectorAll(".col.over"), function(c){
      c.classList.remove("over"); });
  }
  function stageNow(sid){
    var s = P.data().series.filter(function(x){ return x.id===sid; })[0];
    if (!s) return null;
    var v = P.S().stage[sid];
    return v==null ? s.stage : v;
  }

  document.addEventListener("pointerdown", function(e){
    if (e.pointerType !== "mouse" || e.button !== 0) return;
    var c = e.target.closest("[data-kid]");
    if (!c) return;
    if (e.target.closest("[data-act=sfwd],[data-act=sback]")) return;
    id = c.dataset.kid; from = stageNow(id);
    moved = false; sx = e.clientX; sy = e.clientY;
  });

  document.addEventListener("pointermove", function(e){
    if (!id) return;
    if (!moved && Math.abs(e.clientX-sx) + Math.abs(e.clientY-sy) < 6) return;
    if (!moved){
      moved = true;
      var c = document.querySelector('[data-kid="'+id+'"]');
      if (c) c.classList.add("drag");
      document.body.style.userSelect = "none";
    }
    clearOver();
    var col = colAt(e.clientX, e.clientY);
    if (col) col.classList.add("over");
  });

  document.addEventListener("pointerup", function(e){
    if (!id) return;
    var dragged = moved, sid = id, was = from;
    var col = dragged ? colAt(e.clientX, e.clientY) : null;
    id = null; from = null; moved = false;
    document.body.style.userSelect = "";
    clearOver();
    var c = document.querySelector('[data-kid="'+sid+'"]');
    if (c) c.classList.remove("drag");
    if (!col) return;
    var g = +col.dataset.drop;
    if (g === was) return;
    var s = P.data().series.filter(function(x){ return x.id===sid; })[0];
    P.S().stage[sid] = g; P.save("series:"+sid);
    P.toast((s?s.n:sid)+" → "+P.data().stages[g], "되돌리기", function(){
      P.S().stage[sid] = was; P.save("series:"+sid); P.render(); });
    P.render();
  });

  document.addEventListener("pointercancel", function(){
    id = null; from = null; moved = false;
    document.body.style.userSelect = ""; clearOver();
  });
})();
})();
</script>
