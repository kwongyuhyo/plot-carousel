<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A0A0C">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오퍼레이션">
<meta name="mobile-web-app-capable" content="yes">

<body>
<title>플루토 오퍼레이션</title>
<style>
/* PLOT 제작 앱과 같은 토큰을 쓴다 — 두 앱을 오갈 때 눈이 다시 적응하지 않도록. */
:root{
  --bg:#0A0A0C; --panel:#131318; --raise:#1B1B22; --line:#2A2A34;
  --text:#ECECF1; --muted:#8A8A96; --dim:#5E5E6A;
  --amber:#E8B34A; --danger:#C75B4A; --focus:#7C7CF0;
  --ok:#5FB98B; --hold:#C9A24A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* 폰트는 싣지 않는다. 캐러셀 스튜디오는 픽셀을 맞춰야 해서 woff2 를 심었지만
   이 앱은 "폰에서 급할 때 연다"가 전부라 1.7MB 를 받게 할 이유가 없다.
   Pretendard 가 기기에 있으면 쓰고, 없으면 시스템 글꼴로 떨어진다. */
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard-SemiBold",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
  font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;
  word-break:keep-all;overflow-wrap:anywhere}
h1,h2,h3{font-family:"Pretendard-ExtraBold","Pretendard-SemiBold",Pretendard,sans-serif;margin:0;font-weight:400}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ── 셸 ─────────────────────────────────────────────── */
.shell{display:grid;grid-template-columns:180px minmax(0,1fr);max-width:1200px;margin:0 auto;min-height:100vh}
.rail{border-right:1px solid var(--line);padding:16px 12px 28px;position:sticky;top:0;
  max-height:100vh;overflow-y:auto;background:var(--panel)}
.brand{display:flex;align-items:baseline;gap:6px;padding:0 6px 13px;border-bottom:1px solid var(--line)}
.brand b{font-size:15px;font-family:"Pretendard-ExtraBold",Pretendard,sans-serif;font-weight:400}
.brand span{font-size:9.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.navs{display:flex;flex-direction:column;gap:2px;margin-top:11px}
.nv{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:5px;color:var(--muted);
  text-align:left;width:100%;font-size:13.5px}
.nv:hover{background:var(--raise);color:var(--text)}
.nv[aria-current="page"]{background:var(--raise);color:var(--text);font-family:"Pretendard-ExtraBold",Pretendard,sans-serif}
.nv .ct{margin-left:auto;font-size:10.5px;color:var(--dim)}
.nv[aria-current="page"] .ct{color:var(--amber)}
.railfoot{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);
  font-size:10.5px;color:var(--dim);line-height:1.5;padding-left:6px}

.main{min-width:0;padding-bottom:96px}
.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);
  padding:15px 20px 12px}
.vt{display:flex;flex-wrap:wrap;align-items:baseline;gap:9px}
.vt h1{font-size:19px;letter-spacing:-.01em}
.vt .sub{font-size:12.5px;color:var(--muted)}
.vt .stamp{margin-left:auto;font-size:11.5px;color:var(--dim)}
.view{padding:16px 20px 0}

/* ── 블록·항목 ───────────────────────────────────────── */
.blk{margin-bottom:24px}
.bh{display:flex;align-items:baseline;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.bh h2{font-size:14px}
.bh p{margin:0;font-size:11.5px;color:var(--dim)}
.bh .n{margin-left:auto;font-size:11px;color:var(--dim)}

.it{display:grid;grid-template-columns:22px minmax(0,1fr);gap:0 9px;padding:9px 0;
  border-bottom:1px solid var(--line);align-items:start}
.it:last-child{border-bottom:0}
.it.done .ttl{text-decoration:line-through;color:var(--dim)}
.it.done .nn{opacity:.4}
.mk{width:16px;height:16px;margin-top:3px;border-radius:3px;border:1.5px solid var(--dim);
  position:relative;flex:0 0 auto}
.mk:hover{border-color:var(--focus)}
.mk[data-k="recur"]{border-radius:50%}
.mk[data-k="track"]{border-style:dashed;cursor:default;opacity:.4}
.mk.on{background:var(--focus);border-color:var(--focus)}
.mk[data-k="recur"].on{background:var(--ok);border-color:var(--ok)}
.mk.on::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
  border:solid var(--bg);border-width:0 1.6px 1.6px 0;transform:rotate(42deg)}
.itop{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.ttl{font-size:14px;line-height:1.45;cursor:pointer;
  font-family:"Pretendard-ExtraBold",Pretendard,sans-serif;font-weight:400}
.ttl[data-k="track"]{cursor:default}
.tg{font-size:10.5px;padding:1px 6px;border-radius:3px;flex:0 0 auto;background:var(--raise);color:var(--muted)}
.tg.s-막힘{background:#2A1614;color:var(--danger)}
.tg.s-진행{background:#122019;color:var(--ok)}
.tg.s-대기{background:#221D0E;color:var(--hold)}
.tg.s-확인필요{background:transparent;color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.tg.s-상시{background:#16162A;color:var(--focus)}
.ow{font-size:10.5px;color:var(--dim);padding:1px 6px;border-radius:3px;
  box-shadow:inset 0 0 0 1px var(--line);flex:0 0 auto}
.sc{font-size:10px;padding:1px 5px;border-radius:3px;flex:0 0 auto}
.sc.solo{background:#1E1526;color:#B58FC4}
.sc.both{background:#251C10;color:var(--amber)}
.sc.mac{background:var(--raise);color:var(--muted)}
.dt{font-size:10.5px;padding:1px 6px;border-radius:3px;background:var(--raise);color:var(--muted);flex:0 0 auto}
.dt.late{background:#2A1614;color:var(--danger)}
.pr{font-size:9.5px;letter-spacing:.06em;color:var(--danger);padding:0 4px;border-radius:3px;
  box-shadow:inset 0 0 0 1px var(--danger);flex:0 0 auto}
.nn{margin:3px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55}
.ww{margin:4px 0 0;font-size:12px;color:var(--amber);line-height:1.5;padding-left:9px;
  box-shadow:inset 2px 0 0 -0.5px #3A2C10}

/* ── 회차 ───────────────────────────────────────────── */
.sr{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:13px 15px;margin-bottom:11px}
.srh{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.srh b{font-size:15px;font-family:"Pretendard-ExtraBold",Pretendard,sans-serif;font-weight:400}
.srh span{font-size:12px;color:var(--muted)}
.pipe{display:flex;gap:3px;margin-top:10px}
.pg{flex:1;padding:6px 3px;text-align:center;font-size:10.5px;border-radius:4px;
  background:var(--raise);color:var(--dim)}
.pg.done{background:#122019;color:var(--ok)}
.pg.at{background:var(--focus);color:#0A0A0C}
.srm{margin:9px 0 0;font-size:12.5px;color:var(--text)}
.srm b{color:var(--muted);font-weight:400}
.srn{margin:4px 0 0;font-size:12.5px;color:var(--dim)}

/* ── 주간 ───────────────────────────────────────────── */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:6px;overflow:hidden}
.day{background:var(--panel);min-height:160px;display:flex;flex-direction:column}
.day.off{background:var(--bg)}
.day.tdy{box-shadow:inset 0 0 0 2px var(--focus)}
.dh{padding:7px 9px 6px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:5px}
.dh b{font-size:12px;font-family:"Pretendard-ExtraBold",Pretendard,sans-serif;font-weight:400}
.dh span{font-size:10.5px;color:var(--dim)}
.day.tdy .dh b{color:var(--focus)}
.db{padding:6px 7px 9px;display:flex;flex-direction:column;gap:4px;flex:1}
.sl{display:flex;gap:5px;align-items:baseline;font-size:11px;line-height:1.35}
.sl .tm{font-size:9.5px;color:var(--dim);flex:0 0 auto}
.sl.auto .nm{color:var(--dim)} .sl.work .nm{color:var(--muted)}
.sl.meet .nm{color:var(--focus)} .sl.broken .nm{color:var(--danger)}
.ev{margin-top:3px;padding:5px 7px;border-radius:4px;font-size:11px;line-height:1.35;
  background:var(--raise);color:var(--muted)}
.ev.late{background:#2A1614;color:var(--danger)}
.ev b{display:block;font-weight:400;font-family:"Pretendard-ExtraBold",Pretendard,sans-serif}

.filt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px}
.ch{font-size:12.5px;padding:4px 11px;border-radius:99px;color:var(--muted);
  box-shadow:inset 0 0 0 1px var(--line)}
.ch:hover{color:var(--text)}
.ch[aria-pressed="true"]{background:var(--text);color:var(--bg);box-shadow:none}
.empty{padding:30px 0;text-align:center;color:var(--dim);font-size:13px}
.note{margin:16px 0 0;padding:11px 13px;background:var(--panel);border-radius:6px;
  font-size:12.5px;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.note b{color:var(--text);font-weight:400;font-family:"Pretendard-ExtraBold",Pretendard,sans-serif}

/* ── 명령바 ─────────────────────────────────────────── */
.cmdwrap{position:fixed;inset:0;z-index:60;background:rgba(6,6,9,.72);
  display:flex;align-items:flex-start;justify-content:center;padding:14vh 16px 16px}
.cmd{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;overflow:hidden;box-shadow:0 22px 60px rgba(0,0,0,.6)}
.cmd input{width:100%;padding:15px 17px;background:none;border:0;color:var(--text);font-size:15.5px;
  border-bottom:1px solid var(--line)}
.cmd input::placeholder{color:var(--dim)}
.cmdlist{max-height:46vh;overflow-y:auto}
.cmdrow{display:flex;gap:9px;align-items:baseline;width:100%;padding:9px 17px;text-align:left;
  font-size:13.5px;color:var(--muted)}
.cmdrow[aria-selected="true"]{background:var(--raise);color:var(--text)}
.cmdrow .k{font-size:10px;color:var(--dim);flex:0 0 auto;
  box-shadow:inset 0 0 0 1px var(--line);padding:1px 5px;border-radius:3px}
.cmdrow .m{margin-left:auto;font-size:10.5px;color:var(--dim);flex:0 0 auto}
.cmdfoot{padding:8px 17px;border-top:1px solid var(--line);font-size:10.5px;color:var(--dim);
  display:flex;gap:12px;flex-wrap:wrap}

/* ── 편집 패널 ───────────────────────────────────────── */
.sheet{position:fixed;inset:0;z-index:55;background:rgba(6,6,9,.6);display:flex;
  align-items:stretch;justify-content:flex-end}
.pane{width:min(430px,100%);background:var(--panel);border-left:1px solid var(--line);
  overflow-y:auto;padding:17px 19px 40px}
.paneh{display:flex;align-items:baseline;gap:9px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.paneh h3{font-size:14px}
.paneh .x{margin-left:auto;color:var(--dim);font-size:12px;padding:3px 7px;border-radius:4px}
.paneh .x:hover{background:var(--raise);color:var(--text)}
.fld{margin-top:14px}
.fld label{display:block;font-size:10.5px;letter-spacing:.05em;color:var(--dim);margin-bottom:5px}
.fld input,.fld textarea,.fld select{width:100%;background:var(--raise);color:var(--text);
  border:1px solid var(--line);border-radius:5px;padding:8px 10px;font-size:13.5px;font-family:inherit}
.fld textarea{min-height:66px;resize:vertical;line-height:1.55}
.opts{display:flex;flex-wrap:wrap;gap:5px}
.opt{font-size:12px;padding:4px 10px;border-radius:99px;color:var(--muted);
  box-shadow:inset 0 0 0 1px var(--line)}
.opt[aria-pressed="true"]{background:var(--text);color:var(--bg);box-shadow:none}
.panefoot{display:flex;gap:8px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line);
  flex-wrap:wrap}
.btn{font-size:13px;padding:8px 15px;border-radius:5px;background:var(--focus);color:#0A0A0C}
.btn.ghost{background:none;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.btn.warn{background:none;color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.btn:hover{filter:brightness(1.08)}
.edited{font-size:9.5px;color:var(--focus);padding:0 4px;border-radius:3px;
  box-shadow:inset 0 0 0 1px var(--focus);flex:0 0 auto}

/* ── 사람 ───────────────────────────────────────────── */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px}
.pcard{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:13px 15px 15px}
.pch{display:flex;align-items:baseline;gap:7px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.pch b{font-size:14px;font-family:"Pretendard-ExtraBold",Pretendard,sans-serif;font-weight:400}
.pch .n{margin-left:auto;font-size:10.5px;color:var(--dim)}
.pl{display:flex;gap:7px;align-items:baseline;font-size:12.5px;padding:6px 0;
  border-bottom:1px solid var(--line);line-height:1.45;width:100%;text-align:left}
.pl:last-child{border-bottom:0}
.pl .dot{width:5px;height:5px;border-radius:50%;background:var(--dim);flex:0 0 auto;
  margin-top:7px}
.pl .dot.막힘{background:var(--danger)} .pl .dot.진행{background:var(--ok)}
.pl .dot.대기{background:var(--hold)} .pl .dot.상시{background:var(--focus)}
.pl:hover{color:var(--text)}
.pmore{font-size:11px;color:var(--dim);padding-top:7px}

/* ── 기록 ───────────────────────────────────────────── */
.logrow{display:flex;gap:9px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);
  font-size:12.5px;color:var(--muted)}
.logrow .tm{font-size:10.5px;color:var(--dim);flex:0 0 auto;min-width:82px}
.logrow b{color:var(--text);font-weight:400}

.addbtn{position:fixed;right:18px;bottom:18px;z-index:40;width:48px;height:48px;border-radius:50%;
  background:var(--focus);color:#0A0A0C;font-size:24px;line-height:1;
  box-shadow:0 8px 24px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}

/* ── 폰 ─────────────────────────────────────────────── */
.mobnav{display:none}
@media(max-width:860px){
  html,body{overflow-x:hidden}
  .shell{grid-template-columns:1fr}
  .shell>*{min-width:0}
  .rail{display:none}
  .top{padding:12px 14px 10px}
  .view{padding:13px 14px 0}
  .main{padding-bottom:78px}
  .week{grid-template-columns:1fr}
  .day{min-height:auto}
  .vt h1{font-size:17px}
  .mobnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;bottom:0;left:0;right:0;
    background:var(--panel);border-top:1px solid var(--line);z-index:30;
    padding-bottom:env(safe-area-inset-bottom,0px)}
  .mobnav button{padding:9px 1px 10px;font-size:10px;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;justify-content:center}
  .mobnav button[aria-current="page"]{color:var(--focus)}
  .mobnav .bn{font-size:9.5px;color:var(--dim)}
  .mobnav button[aria-current="page"] .bn{color:var(--focus)}
  .sheet{align-items:flex-end}
  .pane{width:100%;max-height:88vh;border-left:0;border-top:1px solid var(--line);
    border-radius:12px 12px 0 0;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  .cmdwrap{padding-top:8vh}
  .addbtn{bottom:calc(70px + env(safe-area-inset-bottom,0px));right:14px}
  .people{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>/* 플루토 오퍼레이션 — 화면 로직.
 *
 * 판이 셋이다. 섞으면 갱신할 때마다 서로를 지운다.
 *   data.json      배포할 때마다 통째로 갈리는 판 (스캔·목록)
 *   S.patch/S.add  사람이 고치거나 새로 쓴 것      → localStorage
 *   S.done/S.last  사람이 누른 것                  → localStorage
 *
 * 그래서 data.json 의 항목을 고칠 때도 원본을 건드리지 않고 덮어쓸 값만 patch 에 쌓는다.
 * 다음 배포가 목록을 새로 내려도 규효가 고친 제목·담당·마감은 그대로 얹힌다.
 */
(function () {
"use strict";

var D = JSON.parse(document.getElementById("data").textContent);
var KEY = "pluto.ops.v1";
var TODAY = new Date();
var TKEY = ymd(TODAY);

var S = load();
function load() {
  try {
    var r = JSON.parse(localStorage.getItem(KEY));
    if (r && r.done) {
      r.patch = r.patch || {}; r.add = r.add || []; r.log = r.log || [];
      r.who = (r.who === "both") ? "team" : (r.who || "team");
      return r;
    }
  } catch (e) {}
  return { done:{}, last:{}, patch:{}, add:[], log:[], view:"today", who:"team", seq:0 };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ── 날짜 ─────────────────────────────────────────── */
function ymd(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function parse(s){ var p=String(s).split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function diffDays(a,b){ return Math.round((parse(a)-parse(b))/864e5); }
var DOW = ["일","월","화","수","목","금","토"];
function ago(ts){
  var m = Math.round((Date.now()-ts)/60000);
  if (m < 1) return "방금";
  if (m < 60) return m+"분 전";
  if (m < 1440) return Math.round(m/60)+"시간 전";
  return Math.round(m/1440)+"일 전";
}

/* ── 항목 ─────────────────────────────────────────── */
var LANE = {}, OWN = D.owners;
D.lanes.forEach(function(l){ LANE[l.id]=l.n; });
var STATES = ["대기","진행","막힘","확인필요","상시","동결"];
var HORIZ = [["now","지금"],["week","이번 주"],["month","이번 달"],["quarter","분기"],["someday","언젠가"]];

var ALL = null;
function items(){
  if (ALL) return ALL;
  ALL = D.items.concat(S.add).map(function(it){
    var p = S.patch[it.id];
    if (!p) return it;
    var o = {}; for (var k in it) o[k]=it[k];
    for (var k2 in p) o[k2]=p[k2];
    o._edited = true;
    return o;
  });
  return ALL;
}
function dirty(){ ALL = null; }
function byId(id){ var a=items(); for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }

function isTeam(it){ return it.scope === "team"; }
function isSolo(it){ return it.scope === "solo"; }
function inScope(it){ return S.who === "all" ? true : it.scope === S.who; }

function isOn(it){
  if (it.k === "track") return false;
  if (it.k === "recur") return S.last[it.id] === TKEY;
  return !!S.done[it.id];
}
function overdue(it){ return it.d && !isOn(it) && diffDays(TKEY, it.d) > 0; }
function byUrgency(a,b){
  var ao=overdue(a)?0:1, bo=overdue(b)?0:1;
  if (ao!==bo) return ao-bo;
  if ((a.p||9)!==(b.p||9)) return (a.p||9)-(b.p||9);
  return 0;
}

/* ── 고치기 ───────────────────────────────────────── */
function logit(id, what){
  S.log.unshift({ id:id, t:what, at:Date.now() });
  if (S.log.length > 60) S.log.length = 60;   // 무한히 쌓으면 저장이 터진다
}
function patch(id, fields, label){
  var p = S.patch[id] || (S.patch[id] = {});
  for (var k in fields) p[k] = fields[k];
  dirty(); logit(id, label); save();
}
function toggle(it){
  if (it.k === "track") return;
  if (it.k === "recur") {
    if (S.last[it.id]===TKEY) { delete S.last[it.id]; logit(it.id,"오늘 표시 해제"); }
    else { S.last[it.id]=TKEY; logit(it.id,"오늘 처리"); }
  } else {
    if (S.done[it.id]) { delete S.done[it.id]; logit(it.id,"완료 해제"); }
    else { S.done[it.id]=true; logit(it.id,"완료"); }
  }
  save(); render();
}
function cycleState(it){
  var i = STATES.indexOf(it.s);
  var next = STATES[(i+1) % 4];            // 대기 → 진행 → 막힘 → 확인필요 만 돈다
  patch(it.id, { s: next }, "상태 → "+next);
  render();
}
function addItem(title){
  S.seq = (S.seq||0) + 1;
  var it = { id:"u"+S.seq, l:"ops", o:"kyu", k:"once", s:"대기", h:"now",
             p:3, t:title, n:null, w:null, d:null, scope:S.who==="solo"?"solo":"team",
             mac:false, done:false, _new:true };
  S.add.push(it); dirty(); logit(it.id, "새로 씀"); save();
  return it;
}
function removeItem(id){
  var i = S.add.map(function(x){return x.id;}).indexOf(id);
  if (i >= 0) { S.add.splice(i,1); }
  else { patch(id, { l:"frozen", s:"동결" }, "동결로 내림"); }
  delete S.patch[id]; delete S.done[id]; delete S.last[id];
  dirty(); save();
}

/* ── 조각 ─────────────────────────────────────────── */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function itemHTML(it){
  var on = isOn(it), late = overdue(it);
  var tags = "";
  if (it.s) tags += '<button class="tg s-'+esc(it.s)+'" data-cyc="'+esc(it.id)+'" title="상태 바꾸기">'+esc(it.s)+"</button>";
  tags += '<span class="ow">'+esc(OWN[it.o]||it.o)+"</span>";
  if (isSolo(it) && S.who !== "solo") tags += '<span class="sc solo">내 것</span>';
  if (it.mac) tags += '<span class="sc mac">맥</span>';
  if (it.d) tags += '<span class="dt'+(late?" late":"")+'">'+esc(it.d.slice(5))
                  + (late?" · "+diffDays(TKEY,it.d)+"일 지남":"")+"</span>";
  if (it.p===1 && !on) tags += '<span class="pr">최우선</span>';
  if (it._edited || it._new) tags += '<span class="edited">'+(it._new?"새로":"고침")+"</span>";
  return '<div class="it'+(on?" done":"")+'" data-row="'+esc(it.id)+'">'
    + '<button class="mk'+(on?" on":"")+'" data-k="'+esc(it.k)+'" data-tog="'+esc(it.id)+'"'
    + ' aria-pressed="'+on+'" aria-label="'+esc(it.t)+' 완료"'+(it.k==="track"?" disabled":"")+"></button>"
    + '<div><div class="itop"><button class="ttl" data-open="'+esc(it.id)+'">'+esc(it.t)+"</button>"+tags+"</div>"
    + (it.n?'<p class="nn">'+esc(it.n)+"</p>":"")
    + (it.w?'<p class="ww">'+esc(it.w)+"</p>":"")
    + "</div></div>";
}
function block(title, sub, list){
  if (!list.length) return "";
  return '<section class="blk"><div class="bh"><h2>'+esc(title)+"</h2>"
    + (sub?"<p>"+esc(sub)+"</p>":"") + '<span class="n">'+list.length+"</span></div>"
    + list.map(itemHTML).join("")+"</section>";
}
function chips(){
  var o=[["team","팀"],["solo","내 것"],["all","전부"]];
  return '<div class="filt">'+o.map(function(c){
    return '<button class="ch" data-who="'+c[0]+'" aria-pressed="'+(S.who===c[0])+'">'+c[1]+"</button>";
  }).join("")+"</div>";
}

/* ── 화면 ─────────────────────────────────────────── */
var VIEWS = [
  {id:"today", n:"오늘",  ic:"●", sub:"지금 손댈 것만"},
  {id:"week",  n:"주간",  ic:"▦", sub:"고정 리듬 + 이번 주 마감"},
  {id:"series",n:"회차",  ic:"▶", sub:"프로그램 파일럿"},
  {id:"people",n:"사람",  ic:"◍", sub:"누가 무엇을 쥐고 있나"},
  {id:"mine",  n:"내 것", ic:"◆", sub:"남의 일정을 안 바꾸는 일"},
  {id:"all",   n:"전체",  ic:"☰", sub:"레인별 전부"}
];

function vToday(){
  var live = items().filter(function(it){
    return it.l!=="frozen" && (it.h==="now" || it.k==="recur" || overdue(it));
  }).sort(byUrgency);
  var list = live.filter(inScope);
  var late = list.filter(overdue);
  var rec  = list.filter(function(i){ return i.k==="recur" && !overdue(i); });
  var now  = list.filter(function(i){ return i.k!=="recur" && !overdue(i); });
  var hidden = (S.who==="team") ? live.filter(isSolo).length : 0;
  var al = D.alerts.filter(function(a){ return a.sev!=="ok"; });

  return chips()
    + (S.who!=="solo" && al.length
        ? '<section class="blk"><div class="bh"><h2>관제</h2><p>자동 스캔</p>'
          + '<span class="n">'+esc(D.scanAt)+"</span></div>"
          + al.map(function(a){
              return '<div class="it"><span></span><div><div class="itop">'
                + '<span class="ttl" style="cursor:default">'+esc(a.t)+"</span>"
                + '<span class="tg s-'+(a.sev==="crit"?"막힘":"대기")+'">'+esc(a.d)+"</span></div>"
                + (a.x?'<p class="nn">'+esc(a.x)+"</p>":"")+"</div></div>";
            }).join("")+"</section>"
        : "")
    + block("지났다", "마감일이 넘은 것", late)
    + block("오늘 할 것", "지금 블록", now)
    + block("매일", "자정에 풀린다", rec)
    + (list.length?"":'<p class="empty">오늘 걸린 게 없습니다.</p>')
    + (hidden ? '<p class="note"><b>가려둔 것</b> 개인 항목 '+hidden+'건은 이 판에 없습니다. 위의 <b>내 것</b>을 누르면 보입니다.</p>' : "")
    + '<p class="note"><b>저장 위치</b> 체크와 수정은 이 브라우저에만 남습니다. '
    + '공용 저장소는 다음 단계 — 그때까지 폰과 맥이 서로 안 보입니다.</p>';
}

function vWeek(){
  var mon = new Date(TODAY); mon.setDate(mon.getDate() - ((mon.getDay()+6)%7));
  var days=[]; for (var i=0;i<7;i++){ var d=new Date(mon); d.setDate(mon.getDate()+i); days.push(d); }
  var html = '<div class="week">'+days.map(function(d){
    var dw=d.getDay(), k=ymd(d), on=k===TKEY;
    var slots = D.rhythm.filter(function(r){ return r.days.indexOf(dw)>=0; })
      .sort(function(a,b){ return a.time<b.time?-1:1; });
    var evs = items().filter(function(it){ return it.d===k && it.l!=="frozen" && inScope(it); });
    return '<div class="day'+(on?" tdy":"")+(dw===0||dw===6?" off":"")+'">'
      + '<div class="dh"><b>'+DOW[dw]+"</b><span>"+(d.getMonth()+1)+"/"+d.getDate()+"</span></div>"
      + '<div class="db">'
      + slots.map(function(r){
          return '<div class="sl '+esc(r.kind)+'"><span class="tm mono">'+esc(r.time)+"</span>"
            + '<span class="nm">'+esc(r.t)+"</span></div>"; }).join("")
      + evs.map(function(it){
          return '<div class="ev'+(overdue(it)?" late":"")+'"><b>'+esc(it.t)+"</b>"
            + esc(OWN[it.o]||it.o)+"</div>"; }).join("")
      + "</div></div>";
  }).join("")+"</div>";
  var over = items().filter(overdue).filter(inScope).sort(byUrgency);
  return chips()+html+block("이번 주 이전에 지난 것","", over)
    + '<p class="note"><b>정기 회의 없음</b> 목요일 고정 미팅은 접었습니다. 회의는 필요할 때 소집합니다 — '
    + '대신 미결이 스스로 닫히지 않으니 <b>오늘</b> 판에서 막힌 것을 직접 봐야 합니다.</p>';
}

function vSeries(){
  return D.series.map(function(s){
    return '<div class="sr"><div class="srh"><b>'+esc(s.n)+"</b><span>"+esc(s.sub||"")+"</span>"
      + '<span class="ow" style="margin-left:auto">'+esc(OWN[s.own]||s.own)+"</span></div>"
      + '<div class="pipe">'+D.stages.map(function(g,i){
          var c = i<s.stage ? " done" : (i===s.stage ? " at" : "");
          return '<div class="pg'+c+'">'+esc(g)+"</div>"; }).join("")+"</div>"
      + (s.cast?'<p class="srm"><b>출연</b> '+esc(s.cast)+"</p>":"")
      + (s.note?'<p class="srn">'+esc(s.note)+"</p>":"")+"</div>";
  }).join("")
  + block("프로그램 레인","회차에 안 붙는 준비 작업",
      items().filter(function(i){ return i.l==="prog"; }).sort(byUrgency));
}

/* 누가 무엇을 쥐고 있나. 위임이 되고 있는지는 이 화면에서만 보인다. */
function vPeople(){
  var open = items().filter(function(i){ return i.l!=="frozen" && !isOn(i) && isTeam(i); });
  var ids = Object.keys(OWN).filter(function(o){ return o!=="tbd"; });
  ids.push("tbd");
  var cards = ids.map(function(o){
    var mine = open.filter(function(i){ return i.o===o; }).sort(byUrgency);
    if (!mine.length) return "";
    var blocked = mine.filter(function(i){ return i.s==="막힘"; }).length;
    var head = mine.slice(0,7);
    return '<div class="pcard"><div class="pch"><b>'+esc(OWN[o]||o)+"</b>"
      + (blocked?'<span class="tg s-막힘">막힘 '+blocked+"</span>":"")
      + '<span class="n">'+mine.length+"건</span></div>"
      + head.map(function(i){
          return '<button class="pl" data-open="'+esc(i.id)+'">'
            + '<span class="dot '+esc(i.s||"")+'"></span><span>'+esc(i.t)+"</span></button>"; }).join("")
      + (mine.length>7?'<p class="pmore">외 '+(mine.length-7)+"건</p>":"")
      + "</div>";
  }).join("");
  var kyu = open.filter(function(i){ return i.o==="kyu"; }).length;
  var pct = open.length ? Math.round(kyu/open.length*100) : 0;
  return '<div class="people">'+cards+"</div>"
    + '<p class="note"><b>집중도</b> 열린 팀 일 '+open.length+'건 중 '+kyu+'건이 규효 담당입니다 — '+pct+'%. '
    + '이 숫자가 안 내려가면 사람을 늘려도 속도는 안 바뀝니다.</p>';
}

function vMine(){
  var solo = items().filter(function(i){ return isSolo(i) && i.l!=="frozen"; });
  var g = {now:[],week:[],month:[],quarter:[],someday:[]};
  solo.forEach(function(i){ (g[i.h]||g.someday).push(i); });
  var held = items().filter(function(i){
    return isTeam(i) && i.o==="kyu" && i.l!=="frozen" && !isOn(i) &&
           (i.h==="now" || i.h==="week" || overdue(i));
  }).sort(byUrgency);
  var log = S.log.slice(0,12);
  return HORIZ.map(function(h){ return block(h[1],"", g[h[0]].sort(byUrgency)); }).join("")
    + block("팀 판에서 내가 쥔 것","이번 주 안에 나한테 걸린 팀 일", held)
    + (log.length
        ? '<section class="blk"><div class="bh"><h2>최근 손댄 것</h2><p>이 브라우저 기준</p></div>'
          + log.map(function(l){
              var it = byId(l.id);
              return '<div class="logrow"><span class="tm mono">'+ago(l.at)+"</span>"
                + "<span><b>"+esc(it?it.t:l.id)+"</b> — "+esc(l.t)+"</span></div>"; }).join("")
          + "</section>"
        : "")
    + '<p class="note"><b>기준</b> 이 일이 남의 일정을 바꾸는가. 바꾸면 팀 판, 안 바꾸면 개인. '
    + '가운데 칸은 없앴습니다 — 애매한 칸을 두면 두 판이 같이 어지러워집니다.</p>';
}

function vAll(){
  return chips() + D.lanes.map(function(l){
    var list = items().filter(function(i){ return i.l===l.id && inScope(i); }).sort(byUrgency);
    return block(l.n, l.id==="frozen"?"지금은 건드리지 않는다":"", list);
  }).join("");
}

var BODY = {today:vToday, week:vWeek, series:vSeries, people:vPeople, mine:vMine, all:vAll};

function counts(id){
  var a = items();
  if (id==="today") return a.filter(function(i){
    return i.l!=="frozen" && inScope(i) && (i.h==="now"||i.k==="recur"||overdue(i)) && !isOn(i); }).length;
  if (id==="series") return D.series.length;
  if (id==="people") return a.filter(function(i){ return isTeam(i) && i.s==="막힘" && !isOn(i); }).length;
  if (id==="mine")   return a.filter(function(i){ return isSolo(i) && i.l!=="frozen" && !isOn(i); }).length;
  if (id==="all")    return a.filter(inScope).length;
  return "";
}

/* ── 명령바 ───────────────────────────────────────── */
var cmd = { open:false, q:"", sel:0, rows:[] };
function cmdRows(){
  var q = cmd.q.trim(), out = [];
  if (q) {
    var lq = q.toLowerCase();
    items().filter(function(i){
      return (i.t+" "+(i.n||"")+" "+(LANE[i.l]||"")+" "+(OWN[i.o]||"")).toLowerCase().indexOf(lq)>=0;
    }).slice(0,8).forEach(function(i){
      out.push({ k:"항목", t:i.t, m:(LANE[i.l]||"")+" · "+(OWN[i.o]||i.o), go:function(){ openSheet(i.id); } });
    });
    out.push({ k:"추가", t:'"'+q+'" 새 항목으로', m:"Enter",
               go:function(){ var it=addItem(q); openSheet(it.id); } });
  } else {
    VIEWS.forEach(function(v){
      out.push({ k:"이동", t:v.n, m:v.sub, go:function(){ S.view=v.id; save(); render(); } });
    });
  }
  return out;
}
function cmdHTML(){
  if (!cmd.open) return "";
  cmd.rows = cmdRows();
  return '<div class="cmdwrap" data-cmdbg="1"><div class="cmd">'
    + '<input id="cq" placeholder="찾거나, 새 항목을 쓰거나" value="'+esc(cmd.q)+'" autocomplete="off">'
    + '<div class="cmdlist">'
    + (cmd.rows.length ? cmd.rows.map(function(r,i){
        return '<button class="cmdrow" data-cmd="'+i+'" aria-selected="'+(i===cmd.sel)+'">'
          + '<span class="k">'+esc(r.k)+"</span><span>"+esc(r.t)+"</span>"
          + '<span class="m">'+esc(r.m||"")+"</span></button>"; }).join("")
      : '<p class="empty">없습니다.</p>')
    + "</div>"
    + '<div class="cmdfoot"><span>↑↓ 고르기</span><span>Enter 열기</span><span>Esc 닫기</span>'
    + "<span>⌘K 다시 열기</span></div></div></div>";
}

/* ── 편집 패널 ────────────────────────────────────── */
var sheet = null;
function openSheet(id){ sheet=id; cmd.open=false; cmd.q=""; render(); }
function closeSheet(){ sheet=null; render(); }
function sheetHTML(){
  if (!sheet) return "";
  var it = byId(sheet); if (!it) return "";
  function opts(name, list, cur){
    return '<div class="opts">'+list.map(function(o){
      return '<button class="opt" data-set="'+name+'" data-val="'+esc(o[0])+'" aria-pressed="'
        + (cur===o[0])+'">'+esc(o[1])+"</button>"; }).join("")+"</div>";
  }
  return '<div class="sheet" data-sheetbg="1"><div class="pane">'
    + '<div class="paneh"><h3>항목 고치기</h3>'
    + (it._new?'<span class="edited">새로</span>':(it._edited?'<span class="edited">고침</span>':""))
    + '<button class="x" data-close="1">닫기 ✕</button></div>'
    + '<div class="fld"><label>제목</label><input id="f_t" value="'+esc(it.t)+'"></div>'
    + '<div class="fld"><label>메모</label><textarea id="f_n">'+esc(it.n||"")+"</textarea></div>"
    + '<div class="fld"><label>주의 — 놓치면 다시 하게 되는 것</label><textarea id="f_w">'+esc(it.w||"")+"</textarea></div>"
    + '<div class="fld"><label>담당</label>'
    + opts("o", Object.keys(OWN).map(function(k){return [k,OWN[k]];}), it.o)+"</div>"
    + '<div class="fld"><label>상태</label>'
    + opts("s", STATES.map(function(x){return [x,x];}), it.s)+"</div>"
    + '<div class="fld"><label>언제까지</label>'
    + opts("h", HORIZ, it.h)+"</div>"
    + '<div class="fld"><label>판</label>'
    + opts("scope", [["team","팀"],["solo","내 것"]], it.scope)+"</div>"
    + '<div class="fld"><label>레인</label>'
    + opts("l", D.lanes.map(function(l){return [l.id,l.n];}), it.l)+"</div>"
    + '<div class="fld"><label>종류</label>'
    + opts("k", [["once","한 번"],["recur","매일"],["track","지켜보기"]], it.k)+"</div>"
    + '<div class="fld"><label>마감일</label><input id="f_d" type="date" value="'+esc(it.d||"")+'"></div>'
    + '<div class="panefoot"><button class="btn" data-savefld="1">저장</button>'
    + '<button class="btn ghost" data-close="1">취소</button>'
    + (S.patch[it.id]?'<button class="btn ghost" data-reset="'+esc(it.id)+'">원래대로</button>':"")
    + '<button class="btn warn" data-del="'+esc(it.id)+'">'+(it._new?"지우기":"동결로 내리기")+"</button>"
    + "</div></div></div>";
}
function saveSheetFields(){
  var it = byId(sheet); if (!it) return;
  var g = function(id){ var e=document.getElementById(id); return e?e.value.trim():""; };
  patch(it.id, { t: g("f_t") || it.t, n: g("f_n") || null, w: g("f_w") || null,
                 d: g("f_d") || null }, "내용 수정");
  closeSheet();
}

/* ── 그리기 ───────────────────────────────────────── */
function render(){
  var v = VIEWS.filter(function(x){ return x.id===S.view; })[0] || VIEWS[0];
  document.getElementById("app").innerHTML =
    '<div class="shell">'
    + '<nav class="rail"><div class="brand"><b>플루토</b><span>operations</span></div>'
    + '<div class="navs">'+VIEWS.map(function(x){
        var c = counts(x.id);
        return '<button class="nv" data-v="'+x.id+'"'+(x.id===S.view?' aria-current="page"':"")+">"
          + '<span aria-hidden="true">'+x.ic+"</span>"+x.n
          + (c!==""?'<span class="ct mono">'+c+"</span>":"")+"</button>"; }).join("")
    + "</div>"
    + '<button class="nv" data-cmdopen="1" style="margin-top:10px">'
    + '<span aria-hidden="true">⌕</span>찾기<span class="ct">⌘K</span></button>'
    + '<p class="railfoot">기준 '+esc(D.asof)+"<br>스캔 "+esc(D.scanAt)+"</p></nav>"
    + '<main class="main"><div class="top"><div class="vt"><h1>'+esc(v.n)+"</h1>"
    + '<span class="sub">'+esc(v.sub)+"</span>"
    + '<span class="stamp mono">'+TKEY+" "+DOW[TODAY.getDay()]+"</span></div></div>"
    + '<div class="view">'+BODY[v.id]()+"</div></main></div>"
    + '<button class="addbtn" data-cmdopen="1" aria-label="찾기 · 추가">+</button>'
    + '<nav class="mobnav">'+VIEWS.map(function(x){
        var c = counts(x.id);
        return '<button data-v="'+x.id+'"'+(x.id===S.view?' aria-current="page"':"")+">"
          + '<span aria-hidden="true">'+x.ic+"</span>"+x.n
          + (c!==""&&c!==0?'<span class="bn mono">'+c+"</span>":"")+"</button>"; }).join("")
    + "</nav>"
    + sheetHTML() + cmdHTML();

  if (cmd.open) {
    var q = document.getElementById("cq");
    if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
}

/* ── 입력 ─────────────────────────────────────────── */
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-v],[data-who],[data-tog],[data-open],[data-cyc],[data-cmdopen],"
    + "[data-cmd],[data-cmdbg],[data-close],[data-sheetbg],[data-set],[data-savefld],[data-del],[data-reset]");
  if (!t) return;
  var d = t.dataset;
  if (d.cmdbg && t.dataset.cmdbg==="1" && e.target===t){ cmd.open=false; render(); return; }
  if (d.sheetbg && e.target===t){ closeSheet(); return; }
  if (d.cmdopen){ cmd.open=true; cmd.q=""; cmd.sel=0; render(); return; }
  if (d.cmd!==undefined){ var r=cmd.rows[+d.cmd]; cmd.open=false; if(r) r.go(); else render(); return; }
  if (d.close){ closeSheet(); return; }
  if (d.savefld){ saveSheetFields(); return; }
  if (d.reset){ delete S.patch[d.reset]; dirty(); logit(d.reset,"원래대로"); save(); closeSheet(); return; }
  if (d.del){ removeItem(d.del); closeSheet(); return; }
  if (d.set){
    var o = {}; o[d.set] = d.val;
    patch(sheet, o, d.set+" → "+d.val); render(); return;
  }
  if (d.v){ S.view=d.v; save(); render(); window.scrollTo(0,0); return; }
  if (d.who){ S.who=d.who; save(); render(); return; }
  if (d.cyc){ var c=byId(d.cyc); if(c) cycleState(c); return; }
  if (d.open){ openSheet(d.open); return; }
  if (d.tog){ var it=byId(d.tog); if(it) toggle(it); return; }
});

document.addEventListener("input", function(e){
  if (e.target.id==="cq"){ cmd.q=e.target.value; cmd.sel=0; render(); }
});

document.addEventListener("keydown", function(e){
  var typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){
    e.preventDefault(); cmd.open=true; cmd.sel=0; render(); return;
  }
  if (e.key==="Escape"){ if(cmd.open){cmd.open=false;render();} else if(sheet){closeSheet();} return; }
  if (cmd.open){
    if (e.key==="ArrowDown"){ e.preventDefault(); cmd.sel=Math.min(cmd.sel+1,cmd.rows.length-1); render(); }
    else if (e.key==="ArrowUp"){ e.preventDefault(); cmd.sel=Math.max(cmd.sel-1,0); render(); }
    else if (e.key==="Enter"){ e.preventDefault(); var r=cmd.rows[cmd.sel]; cmd.open=false; if(r) r.go(); else render(); }
    return;
  }
  if (typing || sheet) return;
  if (e.key==="/"){ e.preventDefault(); cmd.open=true; cmd.q=""; cmd.sel=0; render(); }
  if (e.key==="n"){ cmd.open=true; cmd.q=""; cmd.sel=0; render(); }
});

/* 자정을 넘겨 켜둔 폰에서 "매일" 항목이 어제 상태로 남지 않도록. */
setInterval(function(){
  var k = ymd(new Date());
  if (k !== TKEY){ TKEY=k; TODAY=new Date(); render(); }
}, 60000);

render();
})();
</script>

if ('serviceWorker' in navigator) {
  addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
