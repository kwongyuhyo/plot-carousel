<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 소재 — PLOT</title>
<meta name="description" content="매거진 반응 스캔 후보">
<meta name="robots" content="noindex, nofollow">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0C; --panel:#131318; --raise:#1B1B22;
  --line:#20202A; --hair:#17171E;
  --text:#ECECF1; --muted:#8A8A96; --dim:#565663;
  --amber:#E8B34A; --pick:#6FBF8B; --skip:#4A4A57;
  --u:8px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}

/* 라이트 — 밝은 데서 폰으로 볼 때. 시스템 설정을 따라가되 손으로도 바꾼다.
   대비는 어두운 쪽과 맞춰 잡았다: 본문 대 배경 13:1, 흐린 글씨도 4.5:1 위. */
:root[data-theme="light"]{
  --bg:#FBFAF7; --panel:#F2F0EA; --raise:#E9E6DE;
  --line:#DCD8CE; --hair:#E6E3DA;
  --text:#1A1A1F; --muted:#5E5E6B; --dim:#746E7C;
  --amber:#7A6B10; --pick:#2E7D51; --skip:#8C8C99;
  color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#FBFAF7; --panel:#F2F0EA; --raise:#E9E6DE;
    --line:#DCD8CE; --hair:#E6E3DA;
    --text:#1A1A1F; --muted:#5E5E6B; --dim:#746E7C;
    --amber:#7A6B10; --pick:#2E7D51; --skip:#8C8C99;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); min-height:100dvh;
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px; line-height:1.55;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  padding:calc(var(--u)*4 + env(safe-area-inset-top)) 22px
          calc(var(--u)*16 + env(safe-area-inset-bottom));
}
[hidden]{display:none!important}
.wrap{max-width:620px; margin:0 auto}
.lat{font-family:var(--mono); letter-spacing:.14em; text-transform:uppercase}

header{display:flex; align-items:center; gap:14px; padding-bottom:calc(var(--u)*2)}
header .rule{flex:1; height:1px; background:var(--line)}
header .kicker{flex:none; font-size:10.5px; font-weight:700; color:var(--dim)}
header .home{flex:none; font-size:10.5px; color:var(--dim); text-decoration:none;
  font-family:var(--mono); letter-spacing:.1em}
header .home:hover{color:var(--text)}
header .theme{flex:none; background:none; border:1px solid var(--line); border-radius:3px;
  color:var(--dim); cursor:pointer; font:inherit; font-size:12px; line-height:1;
  padding:4px 7px}
header .theme:hover{color:var(--text); border-color:var(--dim)}

h1{margin:0 0 calc(var(--u)*0.5); font-size:29px; font-weight:800; letter-spacing:-.045em}
.stamp{color:var(--dim); font-size:11.5px; font-family:var(--mono); letter-spacing:.02em}
.stamp.warn{color:var(--amber)}

/* 대분류 — 이슈는 이틀이면 식고 기획은 안 식는다. 같은 줄에 세우면 매일
   이슈가 이기고 기획거리는 아래로 밀려 사라진다. 그래서 갈래부터 가른다. */
.grp{display:flex; gap:6px; margin:calc(var(--u)*2) 0 0}
.grp button{flex:1; background:none; border:1px solid var(--line); border-radius:8px;
  color:var(--dim); font:inherit; font-size:12.5px; font-weight:700; padding:9px 0;
  cursor:pointer}
.grp button[aria-selected="true"]{color:var(--text); border-color:var(--amber)}
.pcard{border:1px solid var(--line); border-radius:10px; padding:14px;
  margin-top:calc(var(--u)*1.5)}
.pcard h4{margin:0 0 2px; font-size:14.5px; letter-spacing:-.02em}
.pcard .pwhy{font-size:11.5px; color:var(--amber); font-weight:700}
.pcard .pstat{font-size:11px; color:var(--dim); margin-top:2px}
.pcard .prow{display:flex; gap:8px; font-size:12px; margin-top:7px; line-height:1.5}
.pcard .prow b{flex:none; width:82px; color:var(--dim); font-weight:600}
.pcard .pbtn{margin-top:11px; width:100%; background:none; border:1px solid var(--line);
  border-radius:7px; color:var(--text); font:inherit; font-size:12.5px; font-weight:700;
  padding:9px 0; cursor:pointer}
.pempty{font-size:12px; color:var(--dim); line-height:1.7; padding:16px 0}
.pcard.pdone{opacity:.5}
.pchips{display:flex; gap:5px; margin-top:11px}
.pchips button{flex:none; background:none; border:1px solid var(--line); border-radius:999px;
  color:var(--dim); font:inherit; font-size:11px; padding:4px 10px; cursor:pointer}
.pchips button[aria-pressed="true"]{color:var(--amber); border-color:var(--amber)}
.pitem{border-top:1px solid var(--hair); padding:9px 0 8px; display:flex; gap:10px;
  align-items:flex-start}
.pitem:first-of-type{border-top:1px solid var(--line); margin-top:9px}
.pitem .pin{flex:1; min-width:0}
.pitem .pname{font-size:13.5px; font-weight:700; letter-spacing:-.01em}
.pitem .pwhy2{font-size:11.5px; color:var(--dim); line-height:1.5; margin-top:1px}
.pitem .pmini{flex:none; background:none; border:1px solid var(--line); border-radius:6px;
  color:var(--text); font:inherit; font-size:11.5px; font-weight:600; padding:6px 10px;
  cursor:pointer; margin-top:2px}
.pmore{margin-top:10px; border-top:1px dashed var(--line); padding-top:8px}
.pmore summary{font-size:11.5px; color:var(--dim); cursor:pointer; list-style:none}
.pmore summary::-webkit-details-marker{display:none}
.pmore summary::before{content:"▸ "; color:var(--amber)}
.pmore[open] summary::before{content:"▾ "}
.pmore .prow{font-size:11.5px}

.tabs{display:flex; gap:18px; margin:calc(var(--u)*3) 0 calc(var(--u)*1);
  border-bottom:1px solid var(--line)}
.tab{background:none; border:0; color:var(--dim); font:inherit; font-size:12px;
  font-weight:700; letter-spacing:-.01em; padding:0 0 10px; cursor:pointer;
  border-bottom:2px solid transparent; margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--text); border-bottom-color:var(--amber)}

.card{border-bottom:1px solid var(--hair); padding:calc(var(--u)*2.5) 0;
  transition:opacity .2s ease}
.card.covered{opacity:.45}
.card.picked{border-left:2px solid var(--pick); padding-left:12px; margin-left:-14px}
.card.skipped{opacity:.3}
.head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.mult{font-family:var(--mono); font-size:19px; font-weight:700; color:var(--amber);
  letter-spacing:-.02em; flex:none}
.acct{font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.02em}
.badge{font-size:10px; font-weight:700; letter-spacing:.02em; color:var(--dim);
  border:1px solid var(--line); border-radius:3px; padding:1px 5px}
.badge.news{color:var(--amber); border-color:#3A3020}
.badge.pace{color:var(--pick); border-color:currentColor; font-weight:700}
.fastwrap{border:1px solid var(--line); border-radius:10px; padding:0 calc(var(--u)*2);
          margin-bottom:calc(var(--u)*3)}
.fasth{margin:calc(var(--u)*2) 0 0; font-size:13px; font-weight:700; color:var(--pick)}
.fasth .sub{display:block; margin-top:3px; font-size:11px; font-weight:400; color:var(--dim)}
.badge.reel{color:var(--muted)}
.cap{margin:calc(var(--u)*1.5) 0 0; font-size:14px; line-height:1.6;
  letter-spacing:-.012em; white-space:pre-wrap; word-break:break-word}
.stat{margin-top:calc(var(--u)*1.25); font-family:var(--mono); font-size:10.5px;
  color:var(--dim); letter-spacing:.02em; display:flex; gap:12px; flex-wrap:wrap}
.why{margin-top:6px; font-size:10.5px; color:var(--skip); letter-spacing:-.005em;
  word-break:break-word}
.acts{display:flex; gap:8px; align-items:center; margin-top:calc(var(--u)*1.75);
  flex-wrap:wrap}
.btn{background:none; border:1px solid var(--line); border-radius:4px;
  color:var(--muted); font:inherit; font-size:11.5px; font-weight:700;
  padding:6px 12px; cursor:pointer; transition:.15s ease}
.btn:hover{border-color:var(--dim); color:var(--text)}
.btn.on{border-color:var(--pick); color:var(--pick)}
.btn.off{border-color:var(--skip); color:var(--skip)}
.btn.draft{border-color:var(--amber); color:var(--amber)}
.filters{margin:calc(var(--u)*2) 0 calc(var(--u)*1)}
.frow{display:flex; align-items:flex-start; gap:10px; padding:4px 0}
.flab{flex:none; width:38px; font-size:11px; color:var(--skip); padding-top:5px;
  font-family:var(--mono); letter-spacing:.06em}
.chips{display:flex; flex-wrap:wrap; gap:5px}
.chip{background:none; border:1px solid var(--line); border-radius:3px; cursor:pointer;
  color:var(--dim); font:inherit; font-size:11.5px; padding:3px 8px}
.chip:hover{color:var(--text)}
.chip.on{border-color:var(--amber); color:var(--amber)}
.chip .n{font-family:var(--mono); font-size:10px; opacity:.65; margin-left:4px}
.thumb{float:left; width:64px; height:64px; margin:0 10px 6px 0; border-radius:3px;
  object-fit:cover; background:var(--panel); border:1px solid var(--line)}
.warn-kind{display:inline-block; margin-top:6px; font-size:11px; color:var(--amber);
  border:1px solid var(--line); border-radius:3px; padding:2px 6px}
.hint{margin:calc(var(--u)*2) 0; padding:10px 12px; border-left:2px solid var(--amber);
  background:var(--panel); font-size:12.5px; line-height:1.55; color:var(--text)}
.hint b{color:var(--amber)}
.pf{border-bottom:1px solid var(--line); padding:calc(var(--u)*1.5) 0}
.pf h3{margin:0 0 6px; font-size:13px; font-weight:700}
.pf .row{display:flex; justify-content:space-between; gap:10px; font-size:12px;
  color:var(--dim); padding:3px 0}
.pf .row b{color:var(--text); font-family:var(--mono)}
.pf .sub{font-size:11px; color:var(--skip); margin-top:4px; line-height:1.5}
.ns{border-bottom:1px solid var(--line); padding:calc(var(--u)*2) 0}
.ns h3{margin:0 0 3px; font-size:15px; font-weight:700; letter-spacing:-.02em}
.ns .sig{font-size:11.5px; color:var(--dim); font-family:var(--mono)}
.ns .mult{color:var(--amber); font-weight:700}
.ns .arts{margin-top:8px}
.ns .arts a{display:block; font-size:12.5px; color:var(--muted); text-decoration:none;
  padding:3px 0 3px 10px; border-left:1px solid var(--line); line-height:1.45}
.ns .arts a:hover{color:var(--text); border-color:var(--dim)}
.ns .arts .src{font-size:10.5px; color:var(--skip); font-family:var(--mono)}
/* 카드의 주인공은 배수가 아니라 사람이 한 말이다. 배수는 왜 떴는지의 근거일 뿐,
   읽을 문장이 아니다. */
.ns .lede{display:block; font-size:15px; line-height:1.45; color:var(--text);
          text-decoration:none; font-weight:600; letter-spacing:-.01em; margin:2px 0 6px}
.ns .lede:hover{color:var(--pick)}
.ns .who{font-size:11.5px; color:var(--dim); font-family:var(--mono); letter-spacing:.02em}
.quiet{margin-top:calc(var(--u)*3)}
.quiet summary{cursor:pointer; font-size:12px; color:var(--dim); padding:6px 0;
               list-style:none; font-family:var(--mono)}
.quiet summary::-webkit-details-marker{display:none}
.quiet summary:hover{color:var(--muted)}
.quiet .q{font-size:12px; color:var(--dim); padding:4px 0; font-family:var(--mono)}
.quiet .qa{display:block; margin-top:2px; font-size:12.5px; color:var(--muted);
           text-decoration:none; font-family:var(--sans, inherit)}
.quiet .qa:hover{color:var(--text)}
.xref{display:inline-block; margin-top:6px; font-size:11px; color:var(--pick);
  border:1px solid var(--pick); border-radius:3px; padding:2px 6px}
.btn.link{border:0; padding:6px 0; color:var(--dim); text-decoration:none}
.btn.link:hover{color:var(--amber)}
.angle{width:100%; margin-top:8px; background:var(--panel); border:1px solid var(--line);
  border-radius:4px; color:var(--text); font:inherit; font-size:13px;
  padding:8px 10px; letter-spacing:-.01em}
.angle::placeholder{color:var(--skip)}

.grp{margin-top:calc(var(--u)*4)}
.grp h3{margin:0 0 calc(var(--u)*1); font-size:12px; font-weight:700; color:var(--muted);
  font-family:var(--mono); letter-spacing:.06em}
.grp .base{font-size:10.5px; color:var(--dim); font-family:var(--mono)}

.bar{position:fixed; left:0; right:0; bottom:0; z-index:50;
  background:rgba(10,10,12,.94); backdrop-filter:blur(8px);
  border-top:1px solid var(--line);
  padding:12px 22px calc(12px + env(safe-area-inset-bottom));}
.bar .in{max-width:620px; margin:0 auto; display:flex; align-items:center; gap:12px}
.bar .cnt{flex:1; font-size:12px; color:var(--muted); letter-spacing:-.01em}
.bar .cnt b{color:var(--text)}
.bar .send.alt{background:none; border:1px solid var(--line); color:var(--text)}
.fq{flex:1; min-width:0; background:var(--raise,#1B1B22); color:var(--text);
  border:1px solid var(--line); border-radius:7px; padding:7px 10px; font:inherit; font-size:12.5px}
.fq::placeholder{color:var(--dim)}
/* 고른 조건이 실제로 먹었는지 숫자로 보여준다 — 칩만으로는 안 먹은 줄 알았다 */
.fsum{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--muted);
  padding:2px 0 0}
.fsum b{color:var(--text)}
.fsum button{margin-left:auto; border:1px solid var(--line); border-radius:6px; background:none;
  color:var(--text); font:inherit; font-size:11.5px; padding:4px 9px}
/* 이어지는 이야기 — 같은 인물·페스티벌을 여러 매거진이 며칠에 걸쳐 다룬 줄기 */
.fw{border:1px solid var(--line); border-radius:12px; padding:12px 13px; margin:0 0 14px}
.fwh{font-size:13px; font-weight:700; margin:0 0 3px}
.fwh .sub{display:block; font-size:11.5px; font-weight:400; color:var(--muted); margin-top:3px}
.fwRow{border-top:1px solid var(--line); padding:10px 0 9px}
.fwTop{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.fwName{font-size:13.5px; font-weight:700}
.fwMeta{font-size:11.5px; color:var(--muted); flex:1}
.fwNew{font-size:11px; color:var(--amber); font-weight:700}
.fwBtn{border:1px solid var(--line); border-radius:6px; background:none; color:var(--text);
  font:inherit; font-size:11.5px; padding:5px 9px}
.fwBtn.on{background:rgba(232,179,74,.16); border-color:rgba(232,179,74,.75); color:#f3cf86}
.fwList{margin:7px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:4px}
.fwList li{font-size:12px; color:var(--muted); line-height:1.5}
.fwList a{color:var(--text); text-decoration:none}
.fwList .w{color:var(--dim)}
/* 초안 양식 판 — 봇에 그대로 붙여넣거나 제작 앱에 붙여넣는다. */
#formSheet{position:fixed; inset:0; z-index:60; background:rgba(6,6,8,.86);
  display:flex; align-items:center; justify-content:center; padding:18px}
#formSheet .box{background:var(--panel,#15161a); border:1px solid var(--line);
  border-radius:12px; padding:16px; width:100%; max-width:620px}
#formSheet h3{margin:0 0 4px; font-size:15px}
#formSheet p{margin:0 0 10px; font-size:12px; color:var(--muted)}
#formSheet textarea{width:100%; height:44vh; background:#0c0d10; color:var(--text);
  border:1px solid var(--line); border-radius:8px; padding:10px;
  font-family:ui-monospace,Menlo,monospace; font-size:12px; line-height:1.55}
#formSheet .row{display:flex; gap:8px; margin-top:10px}
#formSheet .row button{flex:1; border:1px solid var(--line); border-radius:8px;
  background:none; color:var(--text); font:inherit; font-size:13px; padding:10px}
#formSheet .row button.primary{background:var(--text); color:#0A0A0C; border-color:var(--text)}
.send{background:var(--amber); border:0; border-radius:5px; color:#17130A;
  font:inherit; font-size:13px; font-weight:800; padding:10px 18px; cursor:pointer;
  letter-spacing:-.015em}
.send[disabled]{opacity:.3; cursor:default}
.note{margin-top:calc(var(--u)*3); color:var(--dim); font-size:11.5px; line-height:1.7}
.note b{color:var(--muted)}
.err{border:1px solid #4A2A2A; background:#1A1214; border-radius:5px;
  padding:14px 16px; color:#E8A0A0; font-size:13px; line-height:1.6}
</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A0A0C">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PLOT">
<meta name="mobile-web-app-capable" content="yes">

<style id="plotTheme">
:root{ --accent:#E8B34A; --glass:rgba(18,19,26,.93); }
/* 흐린 보조 글씨가 어두운 바탕에서 2.3~2.9:1 이었다 — 해 아래 폰에서 안 읽힌다.
   세 화면이 이름만 다를 뿐 같은 자리라 한 군데서 올린다. */
html:root[data-theme="dark"]{ --dim:#82828F; --faint:#82828F; --skip:#82828F;
  --bad:#E0786A }
@media (prefers-color-scheme: dark){
  html:root:not([data-theme="light"]){ --dim:#82828F; --faint:#82828F;
    --skip:#82828F; --bad:#E0786A }
}
html:root[data-accent="amber"]{ --accent:#E8B34A; --amber:#E8B34A }
html:root[data-accent="blue"]{ --accent:#5B8DEF; --amber:#5B8DEF }
html:root[data-accent="green"]{ --accent:#4FB477; --amber:#4FB477 }
html:root[data-accent="violet"]{ --accent:#8B7CF0; --amber:#8B7CF0 }
html:root[data-accent="mono"]{ --accent:#ECECF1; --amber:#ECECF1 }
html:root .plotThemeBox .sw[data-accent="amber"]{ background:#E8B34A; color:#E8B34A }
html:root .plotThemeBox .sw[data-accent="blue"]{ background:#5B8DEF; color:#5B8DEF }
html:root .plotThemeBox .sw[data-accent="green"]{ background:#4FB477; color:#4FB477 }
html:root .plotThemeBox .sw[data-accent="violet"]{ background:#8B7CF0; color:#8B7CF0 }
html:root .plotThemeBox .sw[data-accent="mono"]{ background:#ECECF1; color:#ECECF1 }
html:root[data-theme="light"]{
  --bg:#FBFAF7; --panel:#F2F0EA; --raise:#E9E6DE; --panel-2:#E9E6DE;
  --line:#DAD6CB; --text:#1A1A1E; --ink:#1A1A1E;
  --muted:#57544D; --dim:#6B6760; --faint:#6B6760; --skip:#6E6A78;
  --glass:rgba(246,244,239,.93); --bad:#A63A2B; --warn:#8A6B12; --danger:#A63A2B;
  color-scheme:light;
}
html:root[data-theme="light"][data-accent="amber"]{ --accent:#7A6B10; --amber:#7A6B10 }
html:root[data-theme="light"][data-accent="blue"]{ --accent:#2B5BC4; --amber:#2B5BC4 }
html:root[data-theme="light"][data-accent="green"]{ --accent:#216E45; --amber:#216E45 }
html:root[data-theme="light"][data-accent="violet"]{ --accent:#5240B8; --amber:#5240B8 }
html:root[data-theme="light"][data-accent="mono"]{ --accent:#1A1A1E; --amber:#1A1A1E }
html:root[data-theme="light"] input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]),
html:root[data-theme="light"] textarea,
html:root[data-theme="light"] select{
  background:var(--panel)!important; color:var(--text)!important;
  -webkit-text-fill-color:var(--text)!important;
}
html:root[data-theme="light"] input:focus, html:root[data-theme="light"] textarea:focus{ background:var(--bg)!important }
html:root[data-theme="light"] ::placeholder{ color:var(--dim)!important; opacity:1 }
html:root[data-theme="light"] .err{ background:#FBEFEF!important; border-color:#E2BDBD!important;
  color:#8A2F2F!important }

<script>
(function () {
  'use strict';
  var TG = window.Telegram && window.Telegram.WebApp;
  var inTG = !!(TG && TG.initData !== undefined && TG.platform && TG.platform !== 'unknown');
  if (inTG) { try { TG.ready(); TG.expand(); } catch (e) {} }

  var SCHEMA = 1;
  var D = null;
  // 선택은 메모리에만 둔다. localStorage 는 기기 간 공유가 안 돼서
  // 폰에서 고른 게 맥에서 안 보인다 — 진짜 기록은 봇으로 보낸다.
  var marks = {};          // id → 'pick' | 'skip'
  var angles = {};         // id → 문자열
  var forms  = {};         // id → 'shorts' | 'card' | 'both'
  var tracks = {};         // 이름 → true(추적 켜기) | false(끄기)
  // 초안 버튼을 다시 누르면 다음 형식으로 돈다 — 칸을 더 만들지 않는다.
  var FORM_NEXT  = { shorts: 'card', card: 'both', both: null };
  var FORM_LABEL = { shorts: '숏폼', card: '캐러셀', both: '둘다' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function num(n) { return n == null ? '숨김' : Number(n).toLocaleString('ko-KR'); }
  function ago(h) {
    if (h == null) return '';
    if (h < 24) return Math.round(h) + '시간 전';
    return Math.round(h / 24) + '일 전';
  }

  function card(c, opts) {
    opts = opts || {};
    var m = marks[c.id];
    var cls = 'card' + (c.covered ? ' covered' : '') +
              (m === 'pick' ? ' picked' : '') + (m === 'skip' ? ' skipped' : '');
    var badges = '';
    if (c.kind === 'news') badges += '<span class="badge news">소식</span>';
    else if (c.kind === 'curation') badges += '<span class="badge">큐레이션</span>';
    if (c.is_reel) badges += ' <span class="badge reel">릴스</span>';
    (c.genres || []).forEach(function (g) {
      if (g !== '기타') badges += ' <span class="badge">' + esc(g) + '</span>';
    });
    if (c.covered) badges += ' <span class="badge">이미 다룸</span>';
    /* 속도 — '이 나이치고 빠른가'. 절대 배수로는 갓 올라온 글이 안 보인다.
       반응은 쌓이는 데 시간이 걸리고, 3배를 넘긴 시점이 중앙값 59시간이었다. */
    if (c.pace && c.pace >= 2) badges += ' <span class="badge pace">빠름 ' + c.pace + '배</span>';

    var why = [].concat(c.why || [], c.kind_why || []).join(' ');
    var base = c.baseline_kind === 'reel' ? '릴스 기준' :
               c.baseline_kind === 'post' ? '이미지 기준' : '계정 기준';

    return '' +
      '<div class="' + cls + '" data-id="' + esc(c.id) + '">' +
        '<div class="head">' +
          '<span class="mult">' + (c.multiple != null ? c.multiple.toFixed(1) : '?') + 'x</span>' +
          '<span class="acct">@' + esc(c.account) + '</span>' + badges +
        '</div>' +
        '<p class="cap">' + esc((c.caption || '').slice(0, 220)) + '</p>' +
        '<div class="stat">' +
          '<span>♥ ' + num(c.likes) + '</span>' +
          '<span>댓글 ' + num(c.comments) + '</span>' +
          (c.views != null ? '<span>조회 ' + num(c.views) + '</span>' : '') +
          '<span>' + ago(c.hours) + '</span>' +
          '<span>' + base + ' ' + num(Math.round(c.baseline || 0)) + '</span>' +
          (c.velocity != null ? '<span>시간당 +' + Math.round(c.velocity) + '</span>' : '') +
        '</div>' +
        // 인스타 CDN 주소는 서명이 만료되면 깨진다 — 그때는 조용히 숨긴다.
        (c.image ? '<img class="thumb" loading="lazy" src="' + esc(c.image) +
          '" alt="" onerror="this.remove()">' : '') +
        (why ? '<div class="why">' + esc(why) + '</div>' : '') +
        kindWarn(c) +
        (c.news_surge ? '<div class="xref">뉴스도 ' + c.news_surge.multiple +
          '배 (' + esc(c.news_surge.entity) + ') — 먼저 보세요</div>' : '') +
        (opts.plain ? '' :
          '<div class="acts">' +
            '<button class="btn' + (m === 'pick' ? ' on' : '') + '" data-act="pick">' +
              (m === 'pick' ? '✓ 고름' : '고르기') + '</button>' +
            '<button class="btn' + (m === 'drafted' ? ' draft' : '') + '" data-act="drafted">' +
              (m === 'drafted' ? '✎ ' + FORM_LABEL[forms[c.id] || 'shorts'] : '초안') +
            '</button>' +
            '<button class="btn' + (m === 'skip' ? ' off' : '') + '" data-act="skip">' +
              (m === 'skip' ? '건너뜀' : '건너뛰기') + '</button>' +
            '<a class="btn link" href="' + esc(c.url) + '" target="_blank" rel="noopener">원문 →</a>' +
          '</div>' +
          (m === 'pick' || m === 'drafted' ?
            '<input class="angle" data-act="angle" placeholder="' +
            (m === 'drafted' ? '앵글 한 줄 — 이 각도로 씁니다 (선택)'
                             : '앵글 한 줄 — 어떻게 쓸지 (선택)') + '" ' +
            'value="' + esc(angles[c.id] || '') + '">' : '')) +
      '</div>';
  }

  var P = null;          // performance.json — 없어도 나머지는 그대로 돈다

  /* 기간·매거진 거르기. 순위 자체는 맥에서 이미 7일로 자르지만, 여기서
     더 좁혀 보거나(오늘 것만) 한 매거진만 보는 건 화면에서 한다. */
  var DAYS = [{ k: 1, t: '오늘' }, { k: 2, t: '이틀' }, { k: 3, t: '사흘' },
              { k: 7, t: '일주일' }, { k: 0, t: '전체' }];
  var fDays = 0;         // 0 = 전체
  var fAcct = null;      // null = 전체
  var fSort = 'reco';    // 추천순(봇이 낸 차례)
  var fQ = '';           // 찾는 말
  var SORTS = [{ k: 'reco', t: '추천순' }, { k: 'new', t: '최신순' },
               { k: 'mult', t: '배수순' }, { k: 'fast', t: '빠른순' }];

  function passAcct(c) { return !fAcct || c.account === fAcct; }
  function passDays(c) { return !fDays || (c.hours != null && c.hours <= fDays * 24); }

  /* 찾기 — 캡션·계정·해시태그·장르를 한 덩어리로 보고 훑는다.
     띄어쓰기로 나눠 모두 들어 있어야 통과(그래야 두 낱말로 좁힐 수 있다). */
  function passQ(c) {
    if (!fQ) return true;
    var hay = [c.caption, c.account, (c.genres || []).join(' '),
               (c.plot_kind && c.plot_kind.kind) || '',
               (c.why || []).join(' ')].join(' ').toLowerCase();
    return fQ.toLowerCase().split(/\s+/).every(function (w) { return !w || hay.indexOf(w) >= 0; });
  }

  function pass(c) { return passAcct(c) && passDays(c) && passQ(c); }

  /* 정렬 — 추천순은 봇이 낸 차례를 그대로 둔다(그게 점수순이다). */
  function sorted(list) {
    var a = list.slice();
    if (fSort === 'new') a.sort(function (x, y) { return (x.hours || 0) - (y.hours || 0); });
    else if (fSort === 'mult') a.sort(function (x, y) { return (y.multiple || 0) - (x.multiple || 0); });
    else if (fSort === 'fast') a.sort(function (x, y) { return (y.velocity || 0) - (x.velocity || 0); });
    return a;
  }

  function renderFilters() {
    var all = D.candidates || [];
    if (!all.length) { document.getElementById('filters').hidden = true; return; }
    document.getElementById('filters').hidden = false;

    // 매거진을 고른 뒤에도 기간 숫자가 12 그대로면 '안 먹었다' 로 읽힌다.
    // 각 칩의 숫자는 '나머지 조건을 건 상태에서 이걸 고르면 몇 건' 이어야 한다.
    var d = DAYS.map(function (o) {
      var n = all.filter(function (c) {
        return passAcct(c) && passQ(c) && (!o.k || (c.hours != null && c.hours <= o.k * 24));
      }).length;
      return '<button class="chip' + (fDays === o.k ? ' on' : '') + '" data-days="' + o.k +
             '">' + o.t + '<span class="n">' + n + '</span></button>';
    });
    document.getElementById('chipDays').innerHTML = d.join('');

    var by = {};
    all.forEach(function (c) {
      if (passDays(c) && passQ(c)) by[c.account] = (by[c.account] || 0) + 1;
    });
    var seen = all.filter(function (c) { return passDays(c) && passQ(c); }).length;
    var a = ['<button class="chip' + (fAcct ? '' : ' on') + '" data-acct="">전체' +
             '<span class="n">' + seen + '</span></button>'];
    Object.keys(by).sort(function (x, y) { return by[y] - by[x]; }).forEach(function (k) {
      a.push('<button class="chip' + (fAcct === k ? ' on' : '') + '" data-acct="' + esc(k) +
             '">' + esc(k) + '<span class="n">' + by[k] + '</span></button>');
    });
    document.getElementById('chipAcct').innerHTML = a.join('');

    document.getElementById('chipSort').innerHTML = SORTS.map(function (o) {
      return '<button class="chip' + (fSort === o.k ? ' on' : '') + '" data-sort="' + o.k +
             '">' + o.t + '</button>';
    }).join('');

    var shown = all.filter(pass).length;
    var box = document.getElementById('fsum');
    var on = fDays || fAcct || fQ || fSort !== 'reco';
    box.hidden = !on;
    if (on) {
      var what = [];
      if (fAcct) what.push('@' + fAcct);
      if (fDays) what.push((DAYS.filter(function (o) { return o.k === fDays; })[0] || {}).t);
      if (fQ) what.push('「' + fQ + '」');
      if (fSort !== 'reco') what.push((SORTS.filter(function (o) { return o.k === fSort; })[0] || {}).t);
      box.innerHTML = what.join(' · ') + ' — <b>' + shown + '</b>건 보임 (전체 ' + all.length + ')' +
        '<button type="button" id="fclear">조건 지우기</button>';
      document.getElementById('fclear').onclick = function () {
        fDays = 0; fAcct = null; fQ = ''; fSort = 'reco';
        document.getElementById('fq').value = '';
        renderFilters(); renderCand();
      };
    }
  }

  /* 결 경고 — '확실한' 결에만 붙인다. 흔들리는 수치를 카드에 박으면
     편집 판단을 잘못된 근거로 끌고 간다. */
  function kindWarn(c) {
    var k = c.plot_kind;
    if (!k || k.multiple == null) return '';
    if (k.multiple >= 0.8 && k.multiple <= 1.25) return '';
    var dir = k.multiple < 1 ? '아래' : '위';
    return '<div class="warn-kind">' + esc(k.kind) + ' 결 — PLOT 실적 ' +
           k.multiple + '배 (기준선 ' + dir + ', n=' + k.n + ')</div>';
  }

  /* 뉴스 급상승 — 매거진과 다른 축이다. 매거진은 '편집자가 고른 것',
     이쪽은 '세상이 갑자기 찾는 것'. 둘 다 걸리면 제일 강한 신호라 짚어준다. */
  function renderNews() {
    var v = document.getElementById('viewNews');
    var list = (D.news || []);
    if (!list.length) {
      v.innerHTML = '<p class="note">지금은 기준(평소의 3배)을 넘은 아티스트가 없습니다. ' +
                    '차트·기사 수를 매일 재고 있으니 움직이면 여기 올라옵니다.</p>';
      return;
    }

    /* 발화가 있는 것만 카드로 펼친다. 차트만 오른 건 성적이지 사건이 아니라서
       읽을 게 없다 — 지우지는 않고 아래에 접어 둔다. */
    var loud = list.filter(function (s) { return (s.speech || 0) > 0; });
    var quiet = list.filter(function (s) { return !(s.speech || 0); });

    var out = ['<p class="note">아티스트별로 기사 수와 차트를 매일 재서 평소의 <b>3배</b>를 ' +
               '넘은 것만 올립니다. 그중 <b>누가 무슨 말을 했는지</b> 잡힌 것을 먼저 폅니다.</p>'];

    (loud.length ? loud : list).forEach(function (s) {
      var arts = (s.articles || []);
      var head = arts[0];
      var rest = arts.slice(1).map(function (a) {
        return '<a href="' + esc(a.url) + '" target="_blank" rel="noopener">' +
               esc(a.title) + (a.source ? ' <span class="src">' + esc(a.source) + '</span>' : '') +
               '</a>';
      }).join('');
      out.push('<div class="ns">' +
        '<div class="who">' + esc(s.entity) + '</div>' +
        (head
          ? '<a class="lede" href="' + esc(head.url) + '" target="_blank" rel="noopener">' +
            esc(head.title) + '</a>'
          : '<div class="lede">기사를 못 불러왔습니다 — 맥에서 스캔이 돌면 붙습니다</div>') +
        '<div class="sig"><span class="mult">' + s.multiple + '배</span> · ' + esc(s.why) + '</div>' +
        (s.also_in_magazine
          ? '<div class="xref">매거진에도 ' + s.also_in_magazine.length + '건 — 먼저 보세요</div>'
          : '') +
        (rest ? '<div class="arts">' + rest + '</div>' : '') +
        '</div>');
    });

    if (loud.length && quiet.length) {
      /* 접혀 있어도 기사 제목은 보여준다 — 발언이 없을 뿐 소재가 없는 건 아니다
         ('도경수 재예매 매진' 처럼 사실만 있는 기사가 여기 걸린다). */
      var qs = quiet.map(function (s) {
        var a = (s.articles || [])[0];
        return '<div class="q">' + esc(s.entity) + ' · ' + s.multiple + '배 · ' + esc(s.why) +
               (a ? '<a class="qa" href="' + esc(a.url) + '" target="_blank" rel="noopener">' +
                    esc(a.title) + '</a>' : '') + '</div>';
      }).join('');
      out.push('<details class="quiet"><summary>조용한 급상승 ' + quiet.length +
               '건 — 숫자만 움직이고 발언은 안 잡혔습니다</summary>' + qs + '</details>');
    }
    v.innerHTML = out.join('');
  }

  function renderPerf() {
    var v = document.getElementById('viewPerf');
    if (!P) {
      v.innerHTML = '<p class="note">성과 데이터가 아직 배포되지 않았습니다. ' +
                    '맥에서 스캔이 한 번 더 돌면 올라옵니다.</p>';
      return;
    }
    var out = [];
    var wk = (P.weeks || []).slice(-4).reverse();
    if (wk.length) {
      out.push('<div class="pf"><h3>주간</h3>');
      wk.forEach(function (w) {
        var d = w.followers_delta;
        out.push('<div class="row"><span>' + esc(w.week) + ' · 발행 ' + w.posts + '건</span>' +
          '<b>도달 ' + num(w.reach) + (w.followers ? ' · 팔로워 ' + num(w.followers) +
          (d ? (d > 0 ? ' (+' + num(d) + ')' : ' (' + num(d) + ')') : '') : '') + '</b></div>');
      });
      out.push('</div>');
    }
    var solid = (P.kinds || []).filter(function (k) { return k.stable; });
    var shaky = (P.kinds || []).filter(function (k) { return !k.stable; });
    if (solid.length) {
      out.push('<div class="pf"><h3>결별 성과 — 주차 보정</h3>');
      solid.forEach(function (k) {
        out.push('<div class="row"><span>' + esc(k.kind) + '</span><b>' + k.multiple + '배</b></div>');
      });
      out.push('<div class="sub">한 주씩 빼도 기준선을 넘나들지 않는 것만 실었습니다. ' +
        (shaky.length ? '흔들려서 뺀 결: ' + shaky.map(function (k) { return esc(k.kind); }).join(', ') : '') +
        '</div></div>');
    }
    var top = (P.top || []).slice(0, 6);
    if (top.length) {
      out.push('<div class="pf"><h3>가장 멀리 간 글</h3>');
      top.forEach(function (t) {
        out.push('<div class="row"><span>' + esc((t.head || '').replace(/\n/g, ' ').slice(0, 34)) +
          '</span><b>' + num(t.reach) + '</b></div>');
      });
      out.push('</div>');
    }
    if (P.runs) {
      out.push('<div class="pf"><h3>마지막 실행</h3>');
      Object.keys(P.runs).forEach(function (k) {
        out.push('<div class="row"><span>' + esc(k) + '</span><b>' + esc(P.runs[k]) + '</b></div>');
      });
      out.push('</div>');
    }
    out.push('<p class="note">' + esc(P.generated_at || '') + ' 기준</p>');
    v.innerHTML = out.join('');
  }

  function renderCand() {
    var v = document.getElementById('viewCand');
    var hint = '';
    if (P) {
      var best = (P.kinds || []).filter(function (k) {
        return k.stable && k.multiple > 1.2;
      }).sort(function (a, b) { return b.multiple - a.multiple; })[0];
      if (best) {
        hint = '<div class="hint">PLOT 에서 가장 멀리 가는 건 <b>' + esc(best.kind) +
          '</b> 결입니다 — 기준선의 <b>' + best.multiple + '배</b> (n=' + best.n +
          ', ' + best.weeks + '주). 어떤 소재든 이 결로 쓸 수 있습니다.</div>';
      }
    }
    if (!D.candidates || !D.candidates.length) {
      v.innerHTML = hint + '<p class="note">오늘은 기준을 넘은 소식이 없습니다. ' +
                    '계정별 탭에서 직접 훑어보세요.</p>';
      return;
    }
    /* 빠른 글 — 절대 배수로는 아직 상위에 못 오지만 이 나이치고 빠른 글.
       순위를 건드리지 않고 따로 낸다. 후보 안에 이미 든 글은 여기 안 나온다. */
    var fast = sorted((D.fast || []).filter(pass));
    var fastBlock = fast.length
      ? '<div class="fastwrap"><h3 class="fasth">빠른 글 ' + fast.length + '건' +
        '<span class="sub">아직 숫자는 작지만 이 나이치고 빠릅니다 — ' +
        '반응이 다 쌓이길 기다리면 이틀 늦습니다</span></h3>' +
        fast.map(function (c) { return card(c); }).join('') + '</div>'
      : '';

    var list = sorted(D.candidates.filter(pass));
    // 이어지는 이야기는 기획 갈래로 옮겼다 — 성격이 기획거리인데
    // 이슈 목록에 섞여 있으면 반응 배수에 밀려 매일 아래로 내려간다.
    v.innerHTML = hint + fastBlock + (list.length
      ? list.map(function (c) { return card(c); }).join('')
      : '<p class="note">이 조건에 맞는 후보가 없습니다. 기간이나 매거진을 넓혀보세요.</p>');
  }

  /* 이어지는 이야기. 저절로 잡힌 줄기 + 내가 추적을 켠 이름.
     "어제 본 이야기가 오늘 어떻게 됐나" 를 목록 맨 위에 둔다. */
  function followBlock() {
    var rows = D.followups || [];
    if (!rows.length) return '';
    var body = rows.map(function (r) {
      var on = (tracks[r.name] !== undefined) ? tracks[r.name] : !!r.tracked;
      var meta = '매거진 ' + r.accounts.length + '곳 · 글 ' + r.posts + '건 · ' +
                 r.days + '일째';
      var items = (r.latest || []).map(function (x) {
        return '<li><span class="w">' + esc(x.at.slice(5, 10)) + ' @' + esc(x.account) +
               '</span> <a href="' + esc(x.url) + '" target="_blank" rel="noopener">' +
               esc(x.head || '(캡션 없음)') + '</a></li>';
      }).join('');
      return '<div class="fwRow" data-name="' + esc(r.name) + '">' +
        '<div class="fwTop"><span class="fwName">' + esc(r.name) + '</span>' +
        (r.fresh ? '<span class="fwNew">새 소식 ' + r.fresh + '건</span>' : '') +
        '<span class="fwMeta">' + esc(meta) + '</span>' +
        '<button class="fwBtn' + (on ? ' on' : '') + '" data-act="track">' +
        (on ? '🔔 추적 중' : '추적') + '</button></div>' +
        '<ul class="fwList">' + items + '</ul></div>';
    }).join('');
    return '<div class="fw"><h3 class="fwh">이어지는 이야기 ' + rows.length + '줄기' +
      '<span class="sub">여러 매거진이 며칠에 걸쳐 같은 이름을 다뤘습니다. ' +
      '추적을 켜면 그 이름의 새 소식이 여기 모입니다</span></h3>' + body + '</div>';
  }

  function renderAcct() {
    var v = document.getElementById('viewAcct');
    var out = [];
    Object.keys(D.by_account || {}).forEach(function (a) {
      var meta = (D.accounts || {})[a] || {};
      out.push('<div class="grp"><h3>@' + esc(a) +
        ' <span class="base">기준선 ' + num(Math.round(meta.baseline || 0)) +
        ' · 하루 ' + (meta.per_day != null ? meta.per_day : '?') + '개</span></h3>' +
        D.by_account[a].map(function (c) { return card(c, { plain: true }); }).join('') +
        '</div>');
    });
    v.innerHTML = out.join('') || '<p class="note">계정 데이터가 없습니다.</p>';
  }

  function refreshBar() {
    var p = 0, s = 0, d = 0;
    Object.keys(marks).forEach(function (k) {
      if (marks[k] === 'pick') p++;
      else if (marks[k] === 'skip') s++;
      else if (marks[k] === 'drafted') d++;
    });
    var t = Object.keys(tracks).length;
    var bar = document.getElementById('bar');
    bar.hidden = (p + s + d + t) === 0;
    var parts = [];
    if (p) parts.push('고른 <b>' + p + '</b>건');
    if (d) parts.push('초안 <b>' + d + '</b>건');
    if (s) parts.push('건너뛴 ' + s + '건');
    if (t) parts.push('추적 <b>' + t + '</b>건');
    document.getElementById('cnt').innerHTML =
      parts.join(' · ') + (d > 3 ? ' <i>— 초안은 3건까지 만듭니다</i>' : '');
    document.getElementById('send').disabled = (p + s + d + t) === 0;
    document.getElementById('formBtn').hidden = d === 0;
  }

  function onClick(e) {
    var btn = e.target.closest('[data-act]');
    if (!btn || btn.tagName === 'INPUT') return;
    if (btn.getAttribute('data-act') === 'track') {
      var host = btn.closest('[data-name]');
      if (!host) return;
      var nm = host.getAttribute('data-name');
      var was = btn.classList.contains('on');
      tracks[nm] = !was;
      btn.classList.toggle('on', !was);
      btn.textContent = !was ? '🔔 추적 중' : '추적';
      refreshBar();
      return;
    }
    var host = e.target.closest('[data-id]');
    if (!host) return;
    var id = host.getAttribute('data-id');
    var act = btn.getAttribute('data-act');
    if (act === 'drafted') {
      // 처음 누르면 숏폼. 누를수록 캐러셀 → 둘다 → 해제.
      var nxt = marks[id] === 'drafted' ? FORM_NEXT[forms[id] || 'shorts'] : 'shorts';
      if (nxt === null) { delete marks[id]; delete forms[id]; }
      else { marks[id] = 'drafted'; forms[id] = nxt; }
    } else {
      marks[id] = marks[id] === act ? undefined : act;
      if (marks[id] === undefined) delete marks[id];
      delete forms[id];
    }
    renderCand(); refreshBar();
  }

  function onInput(e) {
    var el = e.target;
    if (el.getAttribute && el.getAttribute('data-act') === 'angle') {
      var host = el.closest('[data-id]');
      if (host) angles[host.getAttribute('data-id')] = el.value;
    }
  }

  function payload() {
    var now = new Date().toISOString();
    var byId = indexAll();
    var out = Object.keys(tracks).map(function (nm) {
      return { v: 1, action: tracks[nm] ? 'track' : 'untrack', name: nm, at: now };
    });
    return out.concat(Object.keys(marks).map(function (id) {
      var c = byId[id] || {};
      var o = { v: 1, action: marks[id], id: id, account: c.account || '?', at: now };
      if (angles[id]) o.angle = angles[id].slice(0, 200);
      if (marks[id] === 'drafted') o.form = forms[id] || 'shorts';
      if (c.multiple != null) o.multiple = c.multiple;
      if (c.kind) o.kind = c.kind;
      if (c.genres) o.genres = c.genres;
      return o;
    }));
  }

  /* ── 초안 → 봇 양식 ──────────────────────────────────────────────
     예전에는 '보내기' 가 선택 기록 JSON 을 복사했다. 그건 텔레그램 안에서
     미니앱이 봇에게 보내는 전용 데이터라, 사람이 봇 대화창에 붙여넣으면
     아무 일도 일어나지 않는다 (2026-09-24 규효: "이상한 코드로 나오는데
     봇에 붙여도 작동하지 않아"). 초안은 사람이 쓰는 것이므로 사람이 읽고
     붙여넣을 수 있는 양식으로 낸다 — 봇의 manual_flow / parse_simple_batch
     가 읽는 바로 그 형식이다. */
  /* 카드는 네 곳에서 나온다 — 후보·급상승·계정별·소식. 후보만 훑으면 급상승에서
     고른 카드가 빈 껍데기로 남는다(제목도 출처도 없이 나갔다). */
  function indexAll() {
    var byId = {};
    function add(list) {
      (list || []).forEach(function (c) { if (c && c.id && !byId[c.id]) byId[c.id] = c; });
    }
    add(D.candidates); add(D.fast);
    Object.keys(D.by_account || {}).forEach(function (a) { add(D.by_account[a]); });
    return byId;
  }

  function headline(c) {
    var t = String(c.caption || '').split('\n')[0];
    t = t.replace(/^[^0-9A-Za-z가-힣]+/, '').trim();
    return t.slice(0, 40) || (c.account ? '@' + c.account + ' 소재' : '제목');
  }
  function srcOf(c) { return c.account ? '@' + c.account : ''; }
  function cardCat(c) { return c.kind === 'curation' ? 'Feature' : 'News'; }
  function shortsCat(c) {
    var k = (c.plot_kind && c.plot_kind.kind) || '';
    return k.indexOf('발매') >= 0 || k.indexOf('신보') >= 0 ? 'New release!' : 'Issue';
  }
  function cardForm(c) {
    return ['[카테고리]', cardCat(c), '',
            '[캡션]', '', '',
            '[커버]',
            '소스: ',                    // 비우면 봇이 사진을 직접 받는다
            '제목: ' + headline(c),
            '부제: ',
            '출처: ' + srcOf(c), '',
            '[슬라이드]', '소스: ', '소제목: ', '본문: ', '출처: ' + srcOf(c), ''].join('\n');
  }
  function shortsForm(c) {
    return ['[영상]',
            '카테고리: ' + shortsCat(c),
            'URL: ', '구간: ',
            '곡: ' + headline(c),
            '아티스트: ', '피처링: ', '후킹: ',
            '출처: ' + srcOf(c),
            '리프레임: 자동'].join('\n');
  }
  function draftForms() {
    var byId = indexAll();
    var out = [];
    Object.keys(marks).forEach(function (id) {
      if (marks[id] !== 'drafted') return;
      var c = byId[id] || {}, f = forms[id] || 'shorts';
      if (f === 'shorts' || f === 'both') out.push(shortsForm(c));
      if (f === 'card' || f === 'both') out.push(cardForm(c));
    });
    return out.join('\n\n');
  }
  function openForms() {
    var txt = draftForms();
    if (!txt) { alert('초안으로 표시한 소재가 없습니다.'); return; }
    document.getElementById('formText').value = txt;
    document.getElementById('formSheet').hidden = false;
  }

  function send() {
    var body = JSON.stringify(payload());
    if (inTG && TG.sendData) {
      if (new Blob([body]).size > 3800) {
        alert('한 번에 보낼 수 있는 양을 넘었습니다. 몇 건 줄여서 보내주세요.');
        return;
      }
      TG.sendData(body);          // 보내면 미니앱이 닫힌다
      return;
    }
    // 텔레그램 밖에서는 복사로 대신한다 — 웹에서 봇을 직접 부를 길이 없다.
    var ok = false;
    try {
      navigator.clipboard.writeText(body);
      ok = true;
    } catch (err) { ok = false; }
    var el = document.getElementById('cnt');
    el.innerHTML = ok
      ? '복사했습니다 — 텔레그램 봇에 붙여넣으세요'
      : '복사에 실패했습니다. 텔레그램 안에서 열어주세요';
  }

  function stale(genAt) {
    // "2026-09-18 08:05 KST"
    var m = /(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/.exec(genAt || '');
    if (!m) return null;
    var t = Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4] - 9, +m[5]);
    return (Date.now() - t) / 36e5;
  }

  function boot(d) {
    D = d;
    if (D.schema !== SCHEMA) {
      var e = document.getElementById('err');
      e.hidden = false;
      e.textContent = '데이터 형식이 다릅니다 (schema ' + D.schema + ', 이 화면은 ' +
                      SCHEMA + '). 앱을 새로 배포해야 합니다.';
      return;
    }
    var st = document.getElementById('stamp');
    var h = stale(D.generated_at);
    st.textContent = D.generated_at +
      (h != null && h >= 12 ? ' · ' + Math.round(h) + '시간 전 데이터' : '');
    if (h != null && h >= 12) st.classList.add('warn');

    var nn = (D.news || []).length;
    if (nn) document.getElementById('tNews').textContent = '뉴스 급상승 ' + nn;
    renderFilters(); renderCand(); renderAcct(); refreshBar();

    var s = (D.stats || {});
    document.getElementById('note').innerHTML =
      '풀 <b>' + (s.pool || 0) + '</b>건에서 추린 <b>' +
      (s.picked || 0) + '</b>건입니다. ' +
      '배수는 그 계정 평소 반응 대비이고, 릴스와 이미지는 따로 잽니다. ' +
      '‘이미 다룸’은 지우지 않고 흐리게만 둡니다 — 같은 사안을 다른 앵글로 다시 쓸 수 있으니까요.';
  }

  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.getElementById('send').addEventListener('click', send);
  document.getElementById('formBtn').addEventListener('click', openForms);
  document.getElementById('formClose').addEventListener('click', function () {
    document.getElementById('formSheet').hidden = true;
  });
  document.getElementById('formCopy').addEventListener('click', function () {
    var ta = document.getElementById('formText');
    ta.removeAttribute('readonly'); ta.select(); ta.setSelectionRange(0, 999999);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    if (!ok && navigator.clipboard) {
      try { navigator.clipboard.writeText(ta.value); ok = true; } catch (e) {}
    }
    ta.setAttribute('readonly', 'readonly');
    this.textContent = ok ? '복사했습니다' : '길게 눌러 복사하세요';
    var self = this;
    setTimeout(function () { self.textContent = '복사'; }, 1800);
  });
  /* 밝기 — 시스템 설정을 기본으로 두고, 누르면 그 기기에서만 고정한다.
     텔레그램 안에서 열면 앱 테마를 따라간다. localStorage 는 막히는 데가
     있으므로(시크릿 창·저장 차단) 읽기·쓰기를 모두 감싼다. */
  var THEME_KEY = 'plot.app.theme';   // 세 화면이 같은 열쇠를 쓴다

  function systemTheme() {
    if (inTG && TG && TG.colorScheme) return TG.colorScheme;
    try {
      return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    } catch (e) { return 'dark'; }
  }

  function applyTheme(t) {
    if (t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    var b = document.getElementById('theme');
    if (b) b.title = t ? (t === 'light' ? '밝게 고정됨' : '어둡게 고정됨') : '시스템 설정';
  }

  (function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    applyTheme(saved === 'light' || saved === 'dark' ? saved : null);
  })();

  document.getElementById('theme').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme') || systemTheme();
    var next = cur === 'light' ? 'dark' : 'light';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  });

  document.getElementById('chipDays').addEventListener('click', function (e) {
    var b = e.target.closest('[data-days]');
    if (!b) return;
    fDays = parseInt(b.getAttribute('data-days'), 10) || 0;
    renderFilters(); renderCand();
  });
  document.getElementById('chipSort').addEventListener('click', function (e) {
    var b = e.target.closest('[data-sort]');
    if (!b) return;
    fSort = b.getAttribute('data-sort') || 'reco';
    renderFilters(); renderCand();
  });
  var fqT;
  document.getElementById('fq').addEventListener('input', function (e) {
    clearTimeout(fqT);
    var v = e.target.value.trim();
    fqT = setTimeout(function () { fQ = v; renderFilters(); renderCand(); }, 180);
  });
  document.getElementById('chipAcct').addEventListener('click', function (e) {
    var b = e.target.closest('[data-acct]');
    if (!b) return;
    fAcct = b.getAttribute('data-acct') || null;
    renderFilters(); renderCand();
  });

  function showTab(which) {
    if (GRP === 'plan') return;          // 기획 갈래에서는 후보 화면을 켜지 않는다
    var t = { cand: 'tCand', acct: 'tAcct', news: 'tNews', perf: 'tPerf' };
    var v = { cand: 'viewCand', acct: 'viewAcct', news: 'viewNews', perf: 'viewPerf' };
    Object.keys(t).forEach(function (k) {
      document.getElementById(t[k]).setAttribute('aria-selected', String(k === which));
      document.getElementById(v[k]).hidden = (k !== which);
    });
    var fl = document.getElementById('filters');
    fl.hidden = (which !== 'cand') || !(D.candidates || []).length;
    if (which === 'perf') renderPerf();
    if (which === 'news') renderNews();
  }
  /* 기획 소스 — 차트 기록으로 만든 시장 분석, 낱개 대신 묶은 주간 발매.
     둘 다 새 수집 없이 이미 쌓인 기록만 읽는다. 카드마다 봇 양식이 붙어 있다. */
  var PSTATE = 'plot.plan.state';
  var pstate = (function () {
    try { return JSON.parse(localStorage.getItem(PSTATE) || '{}') || {}; }
    catch (e) { return {}; }
  })();
  function psave() {
    try { localStorage.setItem(PSTATE, JSON.stringify(pstate)); } catch (e) {}
  }
  var PSTEPS = [['idea', '아이디어'], ['prep', '준비중'], ['done', '제작함']];

  function planRows() {
    return (D.plan || []).filter(function (p) {
      return p && (p.form || (p.items || []).length);
    });
  }

  function renderPlan() {
    var host = document.getElementById('viewPlan');
    var rows = planRows();
    var fw = followBlock();          // 이어지는 이야기 — 기획거리라 이쪽이 제자리다
    if (!rows.length && !fw) {
      host.innerHTML = '<div class="pempty">아직 기획 소스가 없습니다.<br>' +
        '맥에서 스캔이 한 번 돌면 인물 후보와 차트 기록으로 만든 시장 분석이 ' +
        '여기 들어옵니다.</div>';
      return;
    }
    host.innerHTML = fw + rows.map(function (p, i) {
      var st = pstate[p.id] || '';
      var body = (p.rows || []).map(function (r) {
        return '<div class="prow"><b>' + esc(r.label) + '</b><span>' +
               esc(r.value) + '</span></div>';
      }).join('');
      // 사람처럼 항목마다 제 양식이 있는 카드
      var items = (p.items || []).map(function (it, j) {
        return '<div class="pitem"><div class="pin">' +
               '<div class="pname">' + esc(it.name) + '</div>' +
               '<div class="pwhy2">' + esc(it.why || '') + '</div></div>' +
               '<button class="pmini" type="button" data-plan="' + i +
               '" data-item="' + j + '">양식</button></div>';
      }).join('');
      // 접어 둔 전체 — 요약 몇 줄만 두면 카드 안에서 판단이 안 끝난다
      var more = (p.more || []).length
        ? '<details class="pmore"><summary>전체 ' + p.more.length + '줄 보기</summary>' +
          p.more.map(function (r) {
            return '<div class="prow"><b>' + esc(r.label) + '</b><span>' +
                   esc(r.value) + '</span></div>';
          }).join('') + '</details>'
        : '';
      var chips = '<div class="pchips" data-chips="' + i + '">' +
        PSTEPS.map(function (x) {
          return '<button type="button" data-step="' + x[0] + '" aria-pressed="' +
                 (st === x[0]) + '">' + x[1] + '</button>';
        }).join('') + '</div>';
      return '<div class="pcard' + (st === 'done' ? ' pdone' : '') + '">' +
             '<div class="pwhy">' + esc(p.why || '') + '</div>' +
             '<h4>' + esc(p.title || '') + '</h4>' +
             '<div class="pstat">' + esc(p.stat || '') + '</div>' +
             body + items + more +
             (p.form ? '<button class="pbtn" type="button" data-plan="' + i +
                       '">봇 양식 만들기</button>' : '') +
             chips + '</div>';
    }).join('');
  }

  function openForm(txt) {
    document.getElementById('formText').value = txt;
    document.getElementById('formSheet').hidden = false;
  }

  document.getElementById('viewPlan').addEventListener('click', function (e) {
    var step = e.target.closest('[data-step]');
    if (step) {                              // 아이디어 → 준비중 → 제작함
      var box = step.closest('[data-chips]');
      var card = planRows()[parseInt(box.getAttribute('data-chips'), 10)];
      if (!card) return;
      var want = step.getAttribute('data-step');
      pstate[card.id] = (pstate[card.id] === want) ? '' : want;
      psave(); renderPlan();
      return;
    }
    var b = e.target.closest('[data-plan]');
    if (!b) return;
    var p = planRows()[parseInt(b.getAttribute('data-plan'), 10)];
    if (!p) return;
    var idx = b.getAttribute('data-item');
    if (idx !== null) {                      // 사람 하나의 양식
      var it = (p.items || [])[parseInt(idx, 10)];
      if (it && it.form) openForm(it.form);
      return;
    }
    if (p.form) openForm(p.form);
  });

  var GRP = 'info';
  function showGroup(g) {
    GRP = g;
    [].forEach.call(document.querySelectorAll('#grp button'), function (b) {
      b.setAttribute('aria-selected', String(b.getAttribute('data-grp') === g));
    });
    document.querySelector('.tabs').hidden = (g !== 'info');
    document.getElementById('viewPlan').hidden = (g !== 'plan');
    if (g === 'plan') {
      ['viewCand', 'viewAcct', 'viewNews', 'viewPerf'].forEach(function (id) {
        document.getElementById(id).hidden = true;
      });
      document.getElementById('filters').hidden = true;
      renderPlan();
    } else {
      var cur = document.querySelector('.tab[aria-selected="true"]');
      showTab(cur ? { tCand: 'cand', tAcct: 'acct', tNews: 'news', tPerf: 'perf' }[cur.id] : 'cand');
    }
  }
  document.getElementById('grp').addEventListener('click', function (e) {
    var b = e.target.closest('[data-grp]');
    if (b) showGroup(b.getAttribute('data-grp'));
  });

  document.getElementById('tCand').addEventListener('click', function () { showTab('cand'); });
  document.getElementById('tAcct').addEventListener('click', function () { showTab('acct'); });
  document.getElementById('tNews').addEventListener('click', function () { showTab('news'); });
  document.getElementById('tPerf').addEventListener('click', function () { showTab('perf'); });

  // 성과는 곁다리다. 실패해도 후보 화면은 그대로 뜬다.
  fetch('./performance.json', { cache: 'no-cache' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { if (d && d.schema === 1) { P = d; renderCand(); } })
    .catch(function () {});

  fetch('./magazines.json', { cache: 'no-cache' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(boot)
    .catch(function (err) {
      document.getElementById('stamp').textContent = '';
      var e = document.getElementById('err');
      e.hidden = false;
      e.textContent = '후보 데이터를 불러오지 못했습니다 (' + err.message + '). ' +
        '맥에서 스캔이 아직 안 돌았거나 배포가 안 된 상태일 수 있습니다.';
    });
})();
</script>
</body>
</html>

<script>
(function () {
  var TK = 'plot.app.theme', AK = 'plot.app.accent';
  var MODES = [['system', '기기'], ['light', '밝게'], ['dark', '어둡게']];
  var ACCENTS = [['amber', '#E8B34A'], ['blue', '#5B8DEF'], ['green', '#4FB477'],
                 ['violet', '#8B7CF0'], ['mono', '#ECECF1']];
  var box = null;

  function get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
  function set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
  function mode() { var t = get(TK, ''); return (t === 'light' || t === 'dark') ? t : 'system'; }
  function accent() { return get(AK, 'amber'); }

  function apply() {
    var r = document.documentElement, m = mode();
    if (m === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', m);
    r.setAttribute('data-accent', accent());
    var meta = document.querySelector('meta[name=theme-color]');
    if (meta) {
      var dark = m === 'dark' ||
        (m === 'system' && !matchMedia('(prefers-color-scheme: light)').matches);
      meta.setAttribute('content', dark ? '#0A0A0C' : '#FBFAF7');
    }
    if (box) paint();
  }

  function paint() {
    [].forEach.call(box.querySelectorAll('[data-mode]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-mode') === mode());
    });
    [].forEach.call(box.querySelectorAll('[data-accent]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-accent') === accent());
    });
  }

  function close() {
    if (box) { box.remove(); box = null; document.removeEventListener('click', away); }
  }
  function away(e) {
    if (box && !box.contains(e.target) && !e.target.closest('.plotThemeBtn')) close();
  }

  function open(btn) {
    if (box) { close(); return; }
    box = document.createElement('div');
    box.className = 'plotThemeBox';
    box.innerHTML = '<b>밝기</b><div class="row">' +
      MODES.map(function (m) {
        return '<button type="button" data-mode="' + m[0] + '">' + m[1] + '</button>';
      }).join('') + '</div><b>강조색</b><div class="row">' +
      ACCENTS.map(function (a) {
        return '<button type="button" class="sw" data-accent="' + a[0] +
               '" title="' + a[0] + '"></button>';
      }).join('') + '</div>';
    document.body.appendChild(box);
    box.style.top = Math.round(btn.getBoundingClientRect().bottom + 8) + 'px';
    box.onclick = function (e) {
      var m = e.target.closest('[data-mode]'), a = e.target.closest('[data-accent]');
      if (m) { set(TK, m.getAttribute('data-mode') === 'system' ? '' : m.getAttribute('data-mode')); apply(); }
      if (a) { set(AK, a.getAttribute('data-accent')); apply(); }
    };
    paint();
    setTimeout(function () { document.addEventListener('click', away); }, 0);
  }

  function put() {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'plotThemeBtn';
    btn.textContent = '◐ 테마';
    btn.title = '밝기와 강조색';
    btn.onclick = function (e) { e.stopPropagation(); open(btn); };
    var own = document.getElementById('theme');
    var h = document.querySelector('header .hbtns') || document.querySelector('.addRow')
            || (own && own.parentElement);
    if (h) { h.appendChild(btn); return; }
    btn.className += ' float';
    document.body.appendChild(btn);
  }

  apply();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', put);
  else put();
})();
</script>

<script>
(function () {
  var KEY = 'plot.app.installHint';
  var ua = navigator.userAgent;
  var iOS = /iPad|iPhone|iPod/.test(ua) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!iOS) return;
  if (window.navigator.standalone === true ||
      matchMedia('(display-mode: standalone)').matches) return;   // 이미 앱으로 열었다
  try { if (localStorage.getItem(KEY) === 'off') return; } catch (e) {}

  var TG = window.Telegram && window.Telegram.WebApp;
  var inTG = !!(TG && TG.initData !== undefined && TG.platform && TG.platform !== 'unknown');
  var safari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|Chrome/.test(ua);

  function show() {
    var box = document.createElement('div');
    box.style.cssText =
      'position:fixed; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom));' +
      'z-index:9997; background:var(--panel,#131318); color:var(--text,#ECECF1);' +
      'border:1px solid var(--line,#2A2A34); border-radius:12px; padding:12px 13px;' +
      'font:13px/1.55 -apple-system,BlinkMacSystemFont,sans-serif;' +
      'box-shadow:0 14px 40px rgba(0,0,0,.45)';
    var msg = inTG
      ? '홈 화면에 추가하려면 <b>사파리에서 열어야</b> 합니다 — 텔레그램 안에는 그 메뉴가 없어요.'
      : safari
        ? '아래 <b>공유 버튼(↑)</b> → <b>홈 화면에 추가</b> 를 누르면 앱처럼 열립니다.'
        : '홈 화면에 추가는 <b>사파리에서만</b> 됩니다 — 이 주소를 사파리로 열어 주세요.';
    box.innerHTML = '<div style="margin-bottom:9px">' + msg + '</div>' +
      '<div style="display:flex; gap:7px">' +
      (inTG ? '<button id="plotOpenSafari" style="flex:1; border:0; border-radius:8px;' +
              'padding:9px; font:inherit; font-weight:700; background:var(--text,#ECECF1);' +
              'color:var(--bg,#0A0A0C)">브라우저에서 열기</button>' : '') +
      '<button id="plotHintNo" style="flex:' + (inTG ? '0 0 92px' : '1') + ';' +
      'border:1px solid var(--line,#2A2A34); border-radius:8px; padding:9px; font:inherit;' +
      'background:none; color:var(--muted,#8A8A96)">다시 안 보기</button></div>';
    document.body.appendChild(box);
    var go = document.getElementById('plotOpenSafari');
    if (go) go.onclick = function () {
      try { TG.openLink(location.href); } catch (e) { window.open(location.href, '_blank'); }
    };
    document.getElementById('plotHintNo').onclick = function () {
      try { localStorage.setItem(KEY, 'off'); } catch (e) {}
      box.remove();
    };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show);
  else show();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', function () {
    // updateViaCache:'none' — 이게 없으면 sw.js 자체가 HTTP 캐시에 걸린다.
    // 캐시 규칙을 고친 새 워커가 옛 캐시 때문에 안 실리는, 웃기지만 실제로 겪은 일.
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(function (r) { r.update(); })
      .catch(function () {});
  });
}
</script>
