<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 소재 — PLOT</title>
<meta name="description" content="매거진 반응 스캔 후보">
<meta name="robots" content="noindex, nofollow">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0C; --panel:#131318; --raise:#1B1B22;
  --line:#20202A; --hair:#17171E;
  --text:#ECECF1; --muted:#8A8A96; --dim:#565663;
  --amber:#E8B34A; --pick:#6FBF8B; --skip:#4A4A57;
  --u:8px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}

/* 라이트 — 밝은 데서 폰으로 볼 때. 시스템 설정을 따라가되 손으로도 바꾼다.
   대비는 어두운 쪽과 맞춰 잡았다: 본문 대 배경 13:1, 흐린 글씨도 4.5:1 위. */
:root[data-theme="light"]{
  --bg:#FBFAF7; --panel:#F2F0EA; --raise:#E9E6DE;
  --line:#DCD8CE; --hair:#E6E3DA;
  --text:#1A1A1F; --muted:#5E5E6B; --dim:#746E7C;
  --amber:#7A6B10; --pick:#2E7D51; --skip:#8C8C99;
  color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#FBFAF7; --panel:#F2F0EA; --raise:#E9E6DE;
    --line:#DCD8CE; --hair:#E6E3DA;
    --text:#1A1A1F; --muted:#5E5E6B; --dim:#746E7C;
    --amber:#7A6B10; --pick:#2E7D51; --skip:#8C8C99;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); min-height:100dvh;
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px; line-height:1.55;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  padding:calc(var(--u)*4 + env(safe-area-inset-top)) 22px
          calc(var(--u)*16 + env(safe-area-inset-bottom));
}
[hidden]{display:none!important}
.wrap{max-width:620px; margin:0 auto}
.lat{font-family:var(--mono); letter-spacing:.14em; text-transform:uppercase}

header{display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding-bottom:calc(var(--u)*2)}
header .rule{min-width:16px}
header .rule{flex:1; height:1px; background:var(--line)}
header .kicker{flex:none; font-size:12px; font-weight:700; color:var(--dim)}
header .home{flex:none; font-size:12px; color:var(--dim); text-decoration:none;
  font-family:var(--mono); letter-spacing:.1em}
header .home:hover{color:var(--text)}
header .theme{flex:none; background:none; border:1px solid var(--line); border-radius:3px;
  color:var(--dim); cursor:pointer; font:inherit; font-size:13px; line-height:1;
  padding:4px 7px}
header .theme:hover{color:var(--text); border-color:var(--dim)}
@media (max-width:480px){ header .kicker{display:none} header{gap:10px} }

h1{margin:0 0 calc(var(--u)*0.5); font-size:29px; font-weight:800; letter-spacing:-.045em}
.stamp{color:var(--dim); font-size:13px; font-family:var(--mono); letter-spacing:.02em}
.stamp.warn{color:var(--amber)}

/* 대분류 — 이슈는 이틀이면 식고 기획은 안 식는다. 같은 줄에 세우면 매일
   이슈가 이기고 기획거리는 아래로 밀려 사라진다. 그래서 갈래부터 가른다. */
.split{display:flex; gap:6px; margin:calc(var(--u)*2) 0 0}
.split{flex-wrap:wrap}
.split button, .split .jump{flex:1 1 30%; white-space:nowrap}
.split button{flex:1; background:none; border:1px solid var(--line); border-radius:8px;
  color:var(--dim); font:inherit; font-size:13.5px; font-weight:700; padding:9px 0;
  cursor:pointer}
.split button[aria-selected="true"]{color:var(--text); border-color:var(--amber)}
.pcard{border:1px solid var(--line); border-radius:10px; padding:14px;
  margin-top:calc(var(--u)*1.5)}
.pcard h4{margin:0 0 2px; font-size:14.5px; letter-spacing:-.02em}
.pcard .pwhy{font-size:13px; color:var(--amber); font-weight:700}
.pcard .pstat{font-size:12.5px; color:var(--dim); margin-top:2px}
.pcard .prow{display:flex; gap:8px; font-size:13px; margin-top:7px; line-height:1.5}
.pcard .prow b{flex:none; width:82px; color:var(--dim); font-weight:600}
.pcard .pbtn{margin-top:11px; width:100%; background:none; border:1px solid var(--line);
  border-radius:7px; color:var(--text); font:inherit; font-size:13.5px; font-weight:700;
  padding:9px 0; cursor:pointer}
.pempty{font-size:13px; color:var(--dim); line-height:1.7; padding:16px 0}
.pcard .pnote{font-size:12.5px; color:var(--skip); margin-top:4px; line-height:1.5}
.pcard.pdone{opacity:.5}
.pchips{display:flex; gap:5px; margin-top:11px}
.pchips button{flex:none; background:none; border:1px solid var(--line); border-radius:999px;
  color:var(--dim); font:inherit; font-size:12.5px; padding:4px 10px; cursor:pointer}
.pchips button[aria-pressed="true"]{color:var(--amber); border-color:var(--amber)}
.pitem{border-top:1px solid var(--hair); padding:9px 0 8px; display:flex; gap:10px;
  align-items:flex-start}
.pitem:first-of-type{border-top:1px solid var(--line); margin-top:9px}
.pitem .pin{flex:1; min-width:0}
.pitem .pname{font-size:13.5px; font-weight:700; letter-spacing:-.01em}
.pitem .pwhy2{font-size:13px; color:var(--dim); line-height:1.5; margin-top:1px}
.pitem .pmini{flex:none; background:none; border:1px solid var(--line); border-radius:6px;
  color:var(--text); font:inherit; font-size:13px; font-weight:600; padding:6px 10px;
  cursor:pointer; margin-top:2px}
.pmore{margin-top:10px; border-top:1px dashed var(--line); padding-top:8px}
.pmore summary{font-size:13px; color:var(--dim); cursor:pointer; list-style:none}
.pmore summary::-webkit-details-marker{display:none}
.pmore summary::before{content:"▸ "; color:var(--amber)}
.pmore[open] summary::before{content:"▾ "}
.pmore .prow{font-size:13px}
/* 항목 안쪽 — 무엇을 물어볼지(각도), 남이 한 말(실마리), 어디서 찾을지(링크) */
.pangle{margin:6px 0 0; padding:0; list-style:none; display:grid; gap:3px}
.pangle li{font-size:13px; line-height:1.5; padding-left:11px; position:relative}
.pangle li::before{content:"?"; position:absolute; left:0; color:var(--amber);
  font-weight:800; font-size:12.5px}
.pclue{margin-top:6px; font-size:12.5px; color:var(--dim); line-height:1.55;
  border-left:2px solid var(--line); padding-left:8px}
.plinks{display:flex; flex-wrap:wrap; gap:5px; margin-top:7px}
.plinks a, .pqs button{font-size:12.5px; border:1px solid var(--line); border-radius:999px;
  padding:3px 9px; text-decoration:none; color:var(--muted); background:none;
  font-family:inherit; cursor:pointer}
.plinks a{color:var(--amber); border-color:var(--amber)}
.pqs{display:flex; flex-wrap:wrap; gap:5px; margin-top:5px}
.pqs button:active{background:var(--raise)}

.tabs{display:flex; gap:18px; margin:calc(var(--u)*3) 0 calc(var(--u)*1);
  border-bottom:1px solid var(--line)}
.tab{background:none; border:0; color:var(--dim); font:inherit; font-size:13px;
  font-weight:700; letter-spacing:-.01em; padding:0 0 10px; cursor:pointer;
  border-bottom:2px solid transparent; margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--text); border-bottom-color:var(--amber)}

.card{border-bottom:1px solid var(--hair); padding:calc(var(--u)*2.5) 0;
  transition:opacity .2s ease}
.card.covered{opacity:.45}
.card.picked{border-left:2px solid var(--pick); padding-left:12px; margin-left:-14px}
.card.skipped{opacity:.3}
.head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.mult{font-family:var(--mono); font-size:19px; font-weight:700; color:var(--amber);
  letter-spacing:-.02em; flex:none}
.acct{font-family:var(--mono); font-size:12.5px; color:var(--muted); letter-spacing:.02em}
.badge{font-size:11.5px; font-weight:700; letter-spacing:.02em; color:var(--dim);
  border:1px solid var(--line); border-radius:3px; padding:1px 5px}
.badge.news{color:var(--amber); border-color:#3A3020}
.badge.pace{color:var(--pick); border-color:currentColor; font-weight:700}
.fastwrap{border:1px solid var(--line); border-radius:10px; padding:0 calc(var(--u)*2);
          margin-bottom:calc(var(--u)*3)}
.fasth{margin:calc(var(--u)*2) 0 0; font-size:14px; font-weight:700; color:var(--pick)}
.fasth .sub{display:block; margin-top:3px; font-size:12.5px; font-weight:400; color:var(--dim)}
.badge.reel{color:var(--muted)}
.cap{margin:calc(var(--u)*1.5) 0 0; font-size:14px; line-height:1.6;
  letter-spacing:-.012em; white-space:pre-wrap; word-break:break-word}
.stat{margin-top:calc(var(--u)*1.25); font-family:var(--mono); font-size:12px;
  color:var(--dim); letter-spacing:.02em; display:flex; gap:12px; flex-wrap:wrap}
.why{margin-top:6px; font-size:12px; color:var(--skip); letter-spacing:-.005em;
  word-break:break-word}
.acts{display:flex; gap:8px; align-items:center; margin-top:calc(var(--u)*1.75);
  flex-wrap:wrap}
.btn{background:none; border:1px solid var(--line); border-radius:4px;
  color:var(--muted); font:inherit; font-size:13px; font-weight:700;
  padding:6px 12px; cursor:pointer; transition:.15s ease}
.btn:hover{border-color:var(--dim); color:var(--text)}
.btn.on{border-color:var(--pick); color:var(--pick)}
.btn.off{border-color:var(--skip); color:var(--skip)}
.btn.draft{border-color:var(--amber); color:var(--amber)}
.filters{margin:calc(var(--u)*2) 0 calc(var(--u)*1)}
.frow{display:flex; align-items:flex-start; gap:10px; padding:4px 0}
.flab{flex:none; width:48px; white-space:nowrap; font-size:12.5px; color:var(--skip); padding-top:5px;
  font-family:var(--mono); letter-spacing:.06em}
.chips{display:flex; flex-wrap:wrap; gap:5px}
.chip{background:none; border:1px solid var(--line); border-radius:3px; cursor:pointer;
  color:var(--dim); font:inherit; font-size:13px; padding:3px 8px}
.chip:hover{color:var(--text)}
.chip.on{border-color:var(--amber); color:var(--amber)}
.chip .n{font-family:var(--mono); font-size:11.5px; opacity:.65; margin-left:4px}
.thumb{float:left; width:64px; height:64px; margin:0 10px 6px 0; border-radius:3px;
  object-fit:cover; background:var(--panel); border:1px solid var(--line)}
.warn-kind{display:inline-block; margin-top:6px; font-size:12.5px; color:var(--amber);
  border:1px solid var(--line); border-radius:3px; padding:2px 6px}
.hint{margin:calc(var(--u)*2) 0; padding:10px 12px; border-left:2px solid var(--amber);
  background:var(--panel); font-size:13.5px; line-height:1.55; color:var(--text)}
.hint b{color:var(--amber)}
.pf{border-bottom:1px solid var(--line); padding:calc(var(--u)*1.5) 0}
.pf h3{margin:0 0 6px; font-size:14px; font-weight:700}
.pf .row{display:flex; justify-content:space-between; gap:10px; font-size:13px;
  color:var(--dim); padding:3px 0}
.pf .row b{color:var(--text); font-family:var(--mono)}
.pf .sub{font-size:12.5px; color:var(--skip); margin-top:4px; line-height:1.5}
.ns{border-bottom:1px solid var(--line); padding:calc(var(--u)*2) 0}
.ns h3{margin:0 0 3px; font-size:15px; font-weight:700; letter-spacing:-.02em}
.ns .sig{font-size:13px; color:var(--dim); font-family:var(--mono)}
.ns .mult{color:var(--amber); font-weight:700}
.ns .arts{margin-top:8px}
.ns .arts a{display:block; font-size:13.5px; color:var(--muted); text-decoration:none;
  padding:3px 0 3px 10px; border-left:1px solid var(--line); line-height:1.45}
.ns .arts a:hover{color:var(--text); border-color:var(--dim)}
.ns .arts .src{font-size:12px; color:var(--skip); font-family:var(--mono)}
/* 카드의 주인공은 배수가 아니라 사람이 한 말이다. 배수는 왜 떴는지의 근거일 뿐,
   읽을 문장이 아니다. */
.ns .lede{display:block; font-size:15px; line-height:1.45; color:var(--text);
          text-decoration:none; font-weight:600; letter-spacing:-.01em; margin:2px 0 6px}
.ns .lede:hover{color:var(--pick)}
.ns .who{font-size:13px; color:var(--dim); font-family:var(--mono); letter-spacing:.02em}
.quiet{margin-top:calc(var(--u)*3)}
.quiet summary{cursor:pointer; font-size:13px; color:var(--dim); padding:6px 0;
               list-style:none; font-family:var(--mono)}
.quiet summary::-webkit-details-marker{display:none}
.quiet summary:hover{color:var(--muted)}
.quiet .q{font-size:13px; color:var(--dim); padding:4px 0; font-family:var(--mono)}
.quiet .qa{display:block; margin-top:2px; font-size:13.5px; color:var(--muted);
           text-decoration:none; font-family:var(--sans, inherit)}
.quiet .qa:hover{color:var(--text)}
.xref{display:inline-block; margin-top:6px; font-size:12.5px; color:var(--pick);
  border:1px solid var(--pick); border-radius:3px; padding:2px 6px}
.btn.link{border:0; padding:6px 0; color:var(--dim); text-decoration:none}
.btn.link:hover{color:var(--amber)}
.angle{width:100%; margin-top:8px; background:var(--panel); border:1px solid var(--line);
  border-radius:4px; color:var(--text); font:inherit; font-size:14px;
  padding:8px 10px; letter-spacing:-.01em}
.angle::placeholder{color:var(--skip)}

.grp{margin-top:calc(var(--u)*4)}
/* 계정별은 훑는 화면이다 — 한 줄에 하나씩 쌓으면 스무 번 스크롤한다. */
.acctGrid{display:grid; gap:calc(var(--u)*1.5);
  grid-template-columns:repeat(auto-fill, minmax(230px, 1fr))}
.acctGrid .card{border:1px solid var(--line); border-radius:10px;
  padding:calc(var(--u)*1.5); margin:0; border-bottom:1px solid var(--line)}
.acctHead{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
  position:sticky; top:0; background:var(--bg); padding:4px 0 6px; z-index:2}
.acctHead b{font-size:13.5px}
.acctHead .base{font-size:12.5px; color:var(--dim); font-weight:400}
.grp h3{margin:0 0 calc(var(--u)*1); font-size:13px; font-weight:700; color:var(--muted);
  font-family:var(--mono); letter-spacing:.06em}
.grp .base{font-size:12px; color:var(--dim); font-family:var(--mono)}

.bar{position:fixed; left:0; right:0; bottom:0; z-index:50;
  background:var(--bg); backdrop-filter:blur(8px);
  border-top:1px solid var(--line);
  padding:12px 22px calc(12px + env(safe-area-inset-bottom));}
.bar .in{max-width:620px; margin:0 auto; display:flex; align-items:center; gap:12px}
.bar .cnt{flex:1; font-size:13px; color:var(--muted); letter-spacing:-.01em}
.bar .cnt b{color:var(--text)}
.bar .send.alt{background:none; border:1px solid var(--line); color:var(--text)}
.fq{flex:1; min-width:0; background:var(--raise,#1B1B22); color:var(--text);
  border:1px solid var(--line); border-radius:7px; padding:7px 10px; font:inherit; font-size:13.5px}
.fq::placeholder{color:var(--dim)}
/* 고른 조건이 실제로 먹었는지 숫자로 보여준다 — 칩만으로는 안 먹은 줄 알았다 */
.dates{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.dates input[type=date]{background:var(--panel); border:1px solid var(--line);
  border-radius:7px; color:var(--text); font:inherit; font-size:13px; padding:5px 8px}
.dates .dsep{color:var(--dim); font-size:13px}
.dates button{background:none; border:1px solid var(--line); border-radius:7px;
  color:var(--dim); font:inherit; font-size:13px; padding:5px 9px; cursor:pointer}
.fhelp{font-size:13px; color:var(--dim); line-height:1.6; padding-top:2px}
.ago{color:var(--dim)}
.ns.missed{border:1px solid var(--line); border-radius:10px;
  padding:14px; margin-top:calc(var(--u)*2)}
.ns.missed .pbtn{margin-top:10px}
.fsum{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted);
  padding:2px 0 0}
.fsum b{color:var(--text)}
.fsum button{margin-left:auto; border:1px solid var(--line); border-radius:6px; background:none;
  color:var(--text); font:inherit; font-size:13px; padding:4px 9px}
/* 이어지는 이야기 — 같은 인물·페스티벌을 여러 매거진이 며칠에 걸쳐 다룬 줄기 */
.fw{border:1px solid var(--line); border-radius:12px; padding:12px 13px; margin:0 0 14px}
.fwh{font-size:14px; font-weight:700; margin:0 0 3px}
.fwh .sub{display:block; font-size:13px; font-weight:400; color:var(--muted); margin-top:3px}
.fwRow{border-top:1px solid var(--line); padding:10px 0 9px}
.fwTop{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.fwName{font-size:13.5px; font-weight:700}
.fwMeta{font-size:13px; color:var(--muted); flex:1}
.fwNew{font-size:12.5px; color:var(--amber); font-weight:700}
.fwBtn{border:1px solid var(--line); border-radius:6px; background:none; color:var(--text);
  font:inherit; font-size:13px; padding:5px 9px}
.fwBtn.on{background:rgba(232,179,74,.16); border-color:rgba(232,179,74,.75); color:var(--amber)}
.fwList{margin:7px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:4px}
.fwList li{font-size:13px; color:var(--muted); line-height:1.5}
.fwList a{color:var(--text); text-decoration:none}
.fwList .w{color:var(--dim)}
/* 초안 양식 판 — 봇에 그대로 붙여넣거나 제작 앱에 붙여넣는다. */
#formSheet{position:fixed; inset:0; z-index:60; background:rgba(6,6,8,.86);
  display:flex; align-items:center; justify-content:center; padding:18px}
#formSheet .box{background:var(--panel,#15161a); border:1px solid var(--line);
  border-radius:12px; padding:16px; width:100%; max-width:620px}
#formSheet h3{margin:0 0 4px; font-size:15px}
#formSheet p{margin:0 0 10px; font-size:13px; color:var(--muted)}
#formSheet textarea{width:100%; height:44vh; background:var(--bg); color:var(--text);
  border:1px solid var(--line); border-radius:8px; padding:10px;
  font-family:ui-monospace,Menlo,monospace; font-size:13px; line-height:1.55}
#formSheet .row{display:flex; gap:8px; margin-top:10px}
#formSheet .row button{flex:1; border:1px solid var(--line); border-radius:8px;
  background:none; color:var(--text); font:inherit; font-size:14px; padding:10px}
#formSheet .row button.primary{background:var(--text); color:var(--bg); border-color:var(--text)}
.send{background:var(--amber); border:0; border-radius:5px; color:#17130A;
  font:inherit; font-size:14px; font-weight:800; padding:10px 18px; cursor:pointer;
  letter-spacing:-.015em}
.send[disabled]{opacity:.3; cursor:default}
.note{margin-top:calc(var(--u)*3); color:var(--dim); font-size:13px; line-height:1.7}
.note b{color:var(--muted)}
/* ── 오늘의 초안 ── */
.dr{border:1px solid var(--line); border-radius:12px; padding:calc(var(--u)*2.5); margin:calc(var(--u)*2.5) 0}
.dr .src{font-size:12.5px; color:var(--dim); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.dr .src a{color:inherit}
.dr .head{font-size:14.5px; margin:6px 0 10px; line-height:1.45}
.dr .fm{border-top:1px solid var(--hair); padding-top:10px; margin-top:10px}
.dr .fm b{font-size:13px; letter-spacing:-.02em}
.dr .fm .t{font-size:15px; font-weight:700; margin:4px 0}
.dr .fm .c{font-size:13px; color:var(--dim); white-space:pre-wrap; max-height:4.5em; overflow:hidden}
.dr .thumbs{display:flex; gap:6px; margin:8px 0; overflow:auto}
.dr .thumbs img{width:54px; height:68px; object-fit:cover; border-radius:6px; background:var(--hair); flex:none}
.dr .vid{font-size:13px; margin:4px 0; overflow:hidden; text-overflow:ellipsis}
.dr .vid a{color:var(--text)} .dr .vid.alt{color:var(--dim)} .dr .vid.alt a{color:var(--dim)}
.dr .fm b .sub{font-weight:400; color:var(--dim); font-size:12px}
.dr .ed{font-size:13px; margin:2px 0 6px; color:var(--dim)} .dr .ed b{color:var(--text)} .dr .ed b.gS, .dr .ed b.gA{color:var(--pick)}
.dr .chk{font-size:12px; color:var(--amber); margin:6px 0 0; padding-left:16px}
.dr .err{font-size:12.5px; color:var(--amber)}
.dr .go{margin-top:10px; width:100%; padding:11px; border-radius:9px; border:1px solid var(--amber);
  background:var(--amber); color:#111; font:inherit; font-weight:800; cursor:pointer}
.dr .go.done{background:none; color:var(--amber)}
.pub{border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:calc(var(--u)*2) 0; font-size:13px; color:var(--dim)}
.pub .row{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.pub b{font-size:20px; color:var(--text); letter-spacing:-.02em} .pub b.ok{color:var(--pick)}
.pub .bar{position:static; z-index:auto; padding:0; border:0; backdrop-filter:none;
  height:5px; border-radius:3px; background:var(--hair); margin:7px 0 4px; overflow:hidden}
.pub .bar i{display:block; height:100%; background:var(--amber)} .pub .bar i.ok{background:var(--pick)}
.pub .days{display:flex; gap:3px; margin-top:6px} .pub .days span{flex:1; text-align:center; font-size:10.5px}
.pub .days em{display:block; font-style:normal; height:22px; border-radius:3px; background:var(--hair); position:relative}
.pub .days em i{position:absolute; left:0; right:0; bottom:0; background:var(--amber); border-radius:3px}
.dr .cov{display:flex; flex-direction:column; gap:5px; margin:6px 0}
.dr .cov button{text-align:left; border:1px solid var(--line); border-radius:8px; background:none; color:var(--text);
  padding:7px 9px; font-size:13.5px; font-weight:600; line-height:1.35}
.dr .cov button small{display:block; font-weight:400; color:var(--dim); font-size:12px}
.dr .cov button em{font-style:normal; font-size:11px; color:var(--dim); margin-right:6px; font-weight:400}
.dr .cov button.on{border-color:var(--pick); box-shadow:inset 0 0 0 1px var(--pick)}
.dr .rp{font-size:12.5px; color:var(--dim); margin:-4px 0 8px}
.dr .tr{display:inline-block; font-size:11px; padding:1px 7px; border-radius:999px; border:1px solid var(--line); margin-left:6px; font-weight:600}
.dr .tr.t높음{color:var(--pick); border-color:var(--pick)} .dr .tr.t낮음{color:var(--amber); border-color:var(--amber)}
/* 오늘의 초안 — 인스타 피드처럼 (2026-10-10) */
.vmode{display:flex; gap:6px; margin:calc(var(--u)*2) 0}
.dayrow{display:flex; gap:6px; overflow-x:auto; margin:calc(var(--u)*2) 0 0; padding-bottom:2px; scrollbar-width:none}
.dayrow::-webkit-scrollbar{display:none}
.dayrow button{flex:none; padding:6px 10px; border:1px solid var(--line); border-radius:999px; background:none; color:var(--dim); font-size:12.5px; white-space:nowrap}
.dayrow button[aria-pressed="true"]{color:var(--text); border-color:var(--text)}
.vmode button{flex:1; padding:8px; border:1px solid var(--line); border-radius:8px; background:none; color:var(--dim); font-size:13px}
.vmode button[aria-pressed="true"]{color:var(--text); border-color:var(--text)}
.ig{margin:0 -22px calc(var(--u)*6); border-bottom:1px solid var(--hair); padding-bottom:12px}
.ig .igh{display:flex; align-items:center; gap:10px; padding:8px 14px}
.ig .av{width:34px; height:34px; border-radius:50%; background:#111; object-fit:cover; border:1px solid var(--line)}
.ig .who{flex:1; min-width:0; line-height:1.25}
.ig .who b{font-size:14px} .ig .who span{display:block; font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ig .who .tr{margin-left:0}
.ig .med{position:relative; background:#000}
.ig .track{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none}
.ig .track::-webkit-scrollbar{display:none}
.ig .track img{flex:none; width:100%; aspect-ratio:4/5; object-fit:cover; scroll-snap-align:start; display:block; background:#111}
.ig .cnt{position:absolute; top:10px; right:10px; background:rgba(0,0,0,.6); color:#fff; font-size:12px; padding:3px 8px; border-radius:999px}
/* 숏폼 미리보기 — 숏폼 앱의 완성본 틀(webapp/shorts/page.html .frame)을 그대로 옮겼다.
   10/11 규효 "숏폼은 미리보기가 안됨. 폼이 좀 다른거 같기도" — 예전엔 유튜브 썸네일 가운데에 작은 글자를 얹어서
   완성본과 모양이 달랐다. 1080×1920 틀을 그대로 그려 화면 폭에 맞게 줄인다. 자리·글자 크기는 숏폼 앱과 같은 값
   (tests/test_shorts_frame.py 가 숏폼 앱 쪽을 렌더러와 대조한다). */

/* 요청한 초안 — 앱에서 고른 소재·후속 기획이 맥에서 써지는 동안 (2026-10-11) */
.rq{border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:12px 0}
.rq h5{margin:0 0 6px; font-size:13px}
.ug{display:block; width:100%; text-align:left; background:none; border:1px solid var(--line); border-radius:12px; padding:9px 12px; margin:10px 0 0; color:var(--text); font:inherit; font-size:13px}
.ug small{color:var(--dim); font-size:11.5px} .ug .bar{display:block; height:4px; border-radius:2px; background:var(--line); margin:6px 0 5px; overflow:hidden}

}
/* 강조색이 여섯이 되면서 한 줄에 안 들어간다 */
.plotThemeBox .row{flex-wrap:wrap}
.plotThemeBtn{border:1px solid var(--line); border-radius:6px; background:none;
  color:var(--muted,#8A8A96); font:inherit; font-size:13px; padding:5px 9px; cursor:pointer}
/* 머리줄에 붙을 자리가 없으면 화면 오른쪽 위에 떠 있는다. 이 배경을 인라인으로
   까맣게 박아 두면 밝은 테마에서 글자가 묻는다 — 변수로 둔다. */
.plotThemeBtn.float{position:fixed; right:12px; top:calc(12px + env(safe-area-inset-top)); z-index:9998;
  background:var(--panel); color:var(--text); backdrop-filter:blur(8px)}
/* 숏폼은 버튼 줄에 붙는다. 그 줄은 한 줄로 고정돼 있어서 하나 더 얹으면 390px 에서
   18px 밀려났다 — 넘치면 접히게 한다. */
.addRow{flex-wrap:wrap}
.addRow .plotThemeBtn{flex:0 0 auto}
.plotThemeBox{position:fixed; right:12px; z-index:9999; background:var(--panel,#131318);
  border:1px solid var(--line); border-radius:10px; padding:11px 12px; min-width:186px;
  box-shadow:0 12px 34px rgba(0,0,0,.4); font-size:13px; color:var(--text,#ECECF1)}
.plotThemeBox b{display:block; font-size:12.5px; color:var(--muted,#8A8A96);
  font-weight:600; margin:0 0 6px}
.plotThemeBox .row{display:flex; gap:6px; margin-bottom:10px; align-items:center}
.plotThemeBox .row:last-child{margin-bottom:0}
.plotThemeBox button{flex:1; border:1px solid var(--line); border-radius:7px; background:none;
  color:inherit; font:inherit; font-size:13px; padding:7px 4px; cursor:pointer}
.plotThemeBox button.on{border-color:var(--accent); color:var(--accent)}
.plotThemeBox .sw{width:26px; height:26px; flex:none; border-radius:50%; padding:0; border:0}
.plotThemeBox .sw.on{box-shadow:0 0 0 2px var(--bg,#0A0A0C), 0 0 0 4px currentColor}
.plotThemeBox .hues{display:none}
html:root[data-accent="neon"] .plotThemeBox .hues{display:flex}
.plotThemeBox .hue{width:22px; height:22px; flex:none; border-radius:50%; padding:0; border:0}
.plotThemeBox .hue.on{box-shadow:0 0 0 2px var(--bg,#0A0A0C), 0 0 0 4px currentColor,
  0 0 12px currentColor}
/* 글자 크기 — 브라우저 확대와 같은 방식(칸도 같이 큰다). 기기마다 따로 기억한다. */

<script>
(function () {
  'use strict';
  var TG = window.Telegram && window.Telegram.WebApp;
  var inTG = !!(TG && TG.initData !== undefined && TG.platform && TG.platform !== 'unknown');
  if (inTG) { try { TG.ready(); TG.expand(); } catch (e) {} }

  var SCHEMA = 1;
  var D = null;
  // 선택은 메모리에만 둔다. localStorage 는 기기 간 공유가 안 돼서
  // 폰에서 고른 게 맥에서 안 보인다 — 진짜 기록은 봇으로 보낸다.
  var marks = {};          // id → 'pick' | 'skip'
  var angles = {};         // id → 문자열
  var forms  = {};         // id → 'shorts' | 'card' | 'both'
  var tracks = {};         // 이름 → true(추적 켜기) | false(끄기)
  // 초안 버튼을 다시 누르면 다음 형식으로 돈다 — 칸을 더 만들지 않는다.
  var FORM_NEXT  = { shorts: 'card', card: 'both', both: null };
  var FORM_LABEL = { shorts: '숏폼', card: '캐러셀', both: '둘다' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function num(n) { return n == null ? '숨김' : Number(n).toLocaleString('ko-KR'); }
  function ago(h) {
    if (h == null) return '';
    if (h < 24) return Math.round(h) + '시간 전';
    return Math.round(h / 24) + '일 전';
  }

  function card(c, opts) {
    opts = opts || {};
    var m = marks[c.id];
    var cls = 'card' + (c.covered ? ' covered' : '') +
              (m === 'pick' ? ' picked' : '') + (m === 'skip' ? ' skipped' : '');
    var badges = '';
    if (c.kind === 'news') badges += '<span class="badge news">소식</span>';
    else if (c.kind === 'curation') badges += '<span class="badge">큐레이션</span>';
    if (c.is_reel) badges += ' <span class="badge reel">릴스</span>';
    (c.genres || []).forEach(function (g) {
      if (g === '기타') return;
      /* 인물 계정(아티스트 본인)은 '본인 · 장르' 로 — 매거진이 옮긴 글과 구분한다 */
      badges += ' <span class="badge">' + (g.indexOf('인물:') === 0 ? '본인 · ' + esc(g.slice(3)) : esc(g)) + '</span>';
    });
    if (c.covered) badges += ' <span class="badge">이미 다룸</span>';
    /* 속도 — '이 나이치고 빠른가'. 절대 배수로는 갓 올라온 글이 안 보인다.
       반응은 쌓이는 데 시간이 걸리고, 3배를 넘긴 시점이 중앙값 59시간이었다. */
    if (c.pace && c.pace >= 2) badges += ' <span class="badge pace">빠름 ' + c.pace + '배</span>';

    var why = [].concat(c.why || [], c.kind_why || []).join(' ');
    var base = c.baseline_kind === 'reel' ? '릴스 기준' :
               c.baseline_kind === 'post' ? '이미지 기준' : '계정 기준';

    return '' +
      '<div class="' + cls + '" data-id="' + esc(c.id) + '">' +
        '<div class="head">' +
          '<span class="mult">' + (c.multiple != null ? c.multiple.toFixed(1) : '?') + 'x</span>' +
          '<span class="acct">@' + esc(c.account) + '</span>' + badges +
        '</div>' +
        '<p class="cap">' + esc((c.caption || '').slice(0, 220)) + '</p>' +
        '<div class="stat">' +
          '<span>♥ ' + num(c.likes) + '</span>' +
          '<span>댓글 ' + num(c.comments) + '</span>' +
          (c.views != null ? '<span>조회 ' + num(c.views) + '</span>' : '') +
          '<span>' + ago(c.hours) + '</span>' +
          '<span>' + base + ' ' + num(Math.round(c.baseline || 0)) + '</span>' +
          (c.velocity != null ? '<span>시간당 +' + Math.round(c.velocity) + '</span>' : '') +
        '</div>' +
        // 인스타 CDN 주소는 서명이 만료되면 깨진다 — 그때는 조용히 숨긴다.
        (c.image ? '<img class="thumb" loading="lazy" src="' + esc(c.image) +
          '" alt="" onerror="this.remove()">' : '') +
        (why ? '<div class="why">' + esc(why) + '</div>' : '') +
        kindWarn(c) +
        (c.news_surge ? '<div class="xref">뉴스도 ' + c.news_surge.multiple +
          '배 (' + esc(c.news_surge.entity) + ') — 먼저 보세요</div>' : '') +
        (opts.plain ? '' :
          '<div class="acts">' +
            '<button class="btn' + (m === 'pick' ? ' on' : '') + '" data-act="pick">' +
              (m === 'pick' ? '✓ 고름' : '고르기') + '</button>' +
            '<button class="btn' + (m === 'drafted' ? ' draft' : '') + '" data-act="drafted">' +
              (m === 'drafted' ? '✎ ' + FORM_LABEL[forms[c.id] || 'shorts'] : '초안') +
            '</button>' +
            '<button class="btn draft" data-act="mkdraft">✍️ 앱 초안</button>' +
            '<button class="btn' + (m === 'skip' ? ' off' : '') + '" data-act="skip">' +
              (m === 'skip' ? '건너뜀' : '건너뛰기') + '</button>' +
            '<a class="btn link" href="' + escU(c.url) + '" target="_blank" rel="noopener">원문 →</a>' +
          '</div>' +
          (m === 'pick' || m === 'drafted' ?
            '<input class="angle" data-act="angle" placeholder="' +
            (m === 'drafted' ? '앵글 한 줄 — 이 각도로 씁니다 (선택)'
                             : '앵글 한 줄 — 어떻게 쓸지 (선택)') + '" ' +
            'value="' + esc(angles[c.id] || '') + '">' : '')) +
      '</div>';
  }


  /* 기간·매거진 거르기. 순위 자체는 맥에서 이미 7일로 자르지만, 여기서
     더 좁혀 보거나(오늘 것만) 한 매거진만 보는 건 화면에서 한다. */
  var DAYS = [{ k: 1, t: '오늘' }, { k: 2, t: '이틀' }, { k: 3, t: '사흘' },
              { k: 7, t: '일주일' }, { k: 0, t: '전체' }];
  var fDays = 0;         // 0 = 전체
  var fFrom = '', fTo = '';   // 직접 고른 기간 (YYYY-MM-DD). 있으면 칩보다 우선한다.
  var fAcct = null;      // null = 전체
  var fSort = 'reco';    // 추천순(봇이 낸 차례)
  var fQ = '';           // 찾는 말
  /* 이름만 보면 무슨 차이인지 모른다 — 고르면 아래에 한 줄로 설명한다. */
  var SORTS = [
    { k: 'reco', t: '추천순',   h: '봇이 매긴 차례 — 반응·신선도·우리가 다뤘는지를 함께 본 순서' },
    { k: 'new',  t: '새로 올라온 순', h: '올라온 시각이 최근인 것부터. 지금 도는 이야기를 볼 때' },
    { k: 'mult', t: '반응 많은 순', h: '그 계정 평소보다 몇 배 반응인지. 계정 크기를 지운 값' },
    { k: 'fast', t: '빨리 퍼진 순', h: '올라온 지 얼마 안 됐는데 반응이 빠른 것. 아직 오르는 중' },
  ];

  function passAcct(c) { return !fAcct || c.account === fAcct; }

  /* 글이 올라온 날. 스캔 시각에서 나이(시간)를 빼면 나온다. */
  function scanMs() {
    var g = (D.generated_at || '').replace(' KST', '+09:00').replace(' ', 'T');
    var t = Date.parse(g);
    return isNaN(t) ? Date.now() : t;
  }
  function ymd(ms) {
    var d = new Date(ms);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
           '-' + String(d.getDate()).padStart(2, '0');
  }
  function dayOf(c) {
    if (c.hours == null) return '';
    return ymd(scanMs() - c.hours * 3600000);
  }
  function passDays(c) {
    if (fFrom || fTo) {                       // 직접 고른 기간이 먼저다
      var d = dayOf(c);
      if (!d) return false;
      if (fFrom && d < fFrom) return false;
      if (fTo && d > fTo) return false;
      return true;
    }
    return !fDays || (c.hours != null && c.hours <= fDays * 24);
  }

  /* 찾기 — 캡션·계정·해시태그·장르를 한 덩어리로 보고 훑는다.
     띄어쓰기로 나눠 모두 들어 있어야 통과(그래야 두 낱말로 좁힐 수 있다). */
  function passQ(c) {
    if (!fQ) return true;
    var hay = [c.caption, c.account, (c.genres || []).join(' '),
               (c.plot_kind && c.plot_kind.kind) || '',
               (c.why || []).join(' ')].join(' ').toLowerCase();
    return fQ.toLowerCase().split(/\s+/).every(function (w) { return !w || hay.indexOf(w) >= 0; });
  }

  function pass(c) { return passAcct(c) && passDays(c) && passQ(c); }

  /* 정렬 — 추천순은 봇이 낸 차례를 그대로 둔다(그게 점수순이다). */
  function sorted(list) {
    var a = list.slice();
    if (fSort === 'new') a.sort(function (x, y) { return (x.hours || 0) - (y.hours || 0); });
    else if (fSort === 'mult') a.sort(function (x, y) { return (y.multiple || 0) - (x.multiple || 0); });
    else if (fSort === 'fast') a.sort(function (x, y) { return (y.velocity || 0) - (x.velocity || 0); });
    return a;
  }

  function renderFilters() {
    var all = D.candidates || [];
    if (!all.length) { document.getElementById('filters').hidden = true; return; }
    document.getElementById('filters').hidden = (typeof GRP !== 'undefined' && GRP !== 'info');   // 10/20 — 초안 칸으로 열 때 위에 후보 필터가 겹쳐 보였다

    // 매거진을 고른 뒤에도 기간 숫자가 12 그대로면 '안 먹었다' 로 읽힌다.
    // 각 칩의 숫자는 '나머지 조건을 건 상태에서 이걸 고르면 몇 건' 이어야 한다.
    var d = DAYS.map(function (o) {
      var n = all.filter(function (c) {
        return passAcct(c) && passQ(c) && (!o.k || (c.hours != null && c.hours <= o.k * 24));
      }).length;
      return '<button class="chip' + (fDays === o.k ? ' on' : '') + '" data-days="' + o.k +
             '">' + o.t + '<span class="n">' + n + '</span></button>';
    });
    d.push('<button class="chip' + ((fFrom || fTo) ? ' on' : '') +
           '" data-days="cal">📅 직접</button>');
    document.getElementById('chipDays').innerHTML = d.join('');
    document.getElementById('rowDate').hidden = !(fFrom || fTo || fDays === 'cal');
    document.getElementById('dFrom').value = fFrom;
    document.getElementById('dTo').value = fTo;

    var by = {};
    all.forEach(function (c) {
      if (passDays(c) && passQ(c)) by[c.account] = (by[c.account] || 0) + 1;
    });
    var seen = all.filter(function (c) { return passDays(c) && passQ(c); }).length;
    var a = ['<button class="chip' + (fAcct ? '' : ' on') + '" data-acct="">전체' +
             '<span class="n">' + seen + '</span></button>'];
    Object.keys(by).sort(function (x, y) { return by[y] - by[x]; }).forEach(function (k) {
      a.push('<button class="chip' + (fAcct === k ? ' on' : '') + '" data-acct="' + esc(k) +
             '">' + esc(k) + '<span class="n">' + by[k] + '</span></button>');
    });
    document.getElementById('chipAcct').innerHTML = a.join('');

    document.getElementById('chipSort').innerHTML = SORTS.map(function (o) {
      return '<button class="chip' + (fSort === o.k ? ' on' : '') + '" data-sort="' + o.k +
             '">' + o.t + '</button>';
    }).join('');
    // 고른 정렬이 무슨 뜻인지 한 줄로 — 이름만으로는 아무도 모른다
    var cur = SORTS.filter(function (o) { return o.k === fSort; })[0];
    var help = document.getElementById('fhelp');
    help.hidden = !cur;
    if (cur) help.innerHTML = '<b>' + esc(cur.t) + '</b> · ' + esc(cur.h);

    var shown = all.filter(pass).length;
    var box = document.getElementById('fsum');
    var on = fDays || fAcct || fQ || fSort !== 'reco' || fFrom || fTo;
    box.hidden = !on;
    if (on) {
      var what = [];
      if (fAcct) what.push('@' + fAcct);
      if (fFrom || fTo) what.push((fFrom || '처음') + '~' + (fTo || '오늘'));
      else if (fDays) what.push((DAYS.filter(function (o) { return o.k === fDays; })[0] || {}).t);
      if (fQ) what.push('「' + fQ + '」');
      if (fSort !== 'reco') what.push((SORTS.filter(function (o) { return o.k === fSort; })[0] || {}).t);
      box.innerHTML = what.join(' · ') + ' — <b>' + shown + '</b>건 보임 (전체 ' + all.length + ')' +
        '<button type="button" id="fclear">조건 지우기</button>';
      document.getElementById('fclear').onclick = function () {
        fDays = 0; fAcct = null; fQ = ''; fSort = 'reco'; fFrom = ''; fTo = '';
        document.getElementById('fq').value = '';
        renderFilters(); renderCand();
      };
    }
  }

  /* 결 경고 — '확실한' 결에만 붙인다. 흔들리는 수치를 카드에 박으면
     편집 판단을 잘못된 근거로 끌고 간다. */
  function kindWarn(c) {
    var k = c.plot_kind;
    if (!k || k.multiple == null) return '';
    if (k.multiple >= 0.8 && k.multiple <= 1.25) return '';
    var dir = k.multiple < 1 ? '아래' : '위';
    return '<div class="warn-kind">' + esc(k.kind) + ' 결 — PLOT 실적 ' +
           k.multiple + '배 (기준선 ' + dir + ', n=' + k.n + ')</div>';
  }

  /* 뉴스 급상승 — 매거진과 다른 축이다. 매거진은 '편집자가 고른 것',
     이쪽은 '세상이 갑자기 찾는 것'. 둘 다 걸리면 제일 강한 신호라 짚어준다. */
  /* 뉴스 급상승에도 제 정렬·기간이 필요하다. 후보 쪽 조건과 섞지 않는다 —
     보는 물건이 다르다(글 vs 아티스트). */
  var nSort = 'reco', nDays = 0, nFrom = '', nTo = '';
  var NSORTS = [
    { k: 'reco', t: '추천순',   h: '발언이 잡힌 것 먼저, 그다음 배수 큰 순' },
    { k: 'new',  t: '최신순',   h: '오늘 잡힌 것부터' },
    { k: 'old',  t: '오래된순', h: '사흘 전 것부터 — 놓친 게 있나 훑을 때' },
    { k: 'mult', t: '배수순',   h: '평소의 몇 배인지 큰 것부터' },
    { k: 'multr', t: '배수 역순', h: '작게 움직인 것부터 — 아직 안 터진 것' },
  ];

  function newsDay(s2) { return ymd(scanMs() - (s2.days_ago || 0) * 86400000); }
  function newsPass(s2) {
    var d = newsDay(s2);
    if (nFrom || nTo) {
      if (nFrom && d < nFrom) return false;
      if (nTo && d > nTo) return false;
      return true;
    }
    return !nDays || (s2.days_ago || 0) < nDays;
  }
  function newsSorted(list) {
    var a = list.slice();
    if (nSort === 'new') a.sort(function (x, y) { return (x.days_ago || 0) - (y.days_ago || 0); });
    else if (nSort === 'old') a.sort(function (x, y) { return (y.days_ago || 0) - (x.days_ago || 0); });
    else if (nSort === 'mult') a.sort(function (x, y) { return (y.multiple || 0) - (x.multiple || 0); });
    else if (nSort === 'multr') a.sort(function (x, y) { return (x.multiple || 0) - (y.multiple || 0); });
    else a.sort(function (x, y) {
      var sx = (x.speech || 0) > 0 ? 0 : 1, sy = (y.speech || 0) > 0 ? 0 : 1;
      return sx - sy || (y.multiple || 0) - (x.multiple || 0);
    });
    return a;
  }

  function newsBar() {
    var days = [{ k: 0, t: '전체' }, { k: 1, t: '오늘' }, { k: 2, t: '이틀' }, { k: 3, t: '사흘' }];
    var chips = days.map(function (o) {
      return '<button class="chip' + (!nFrom && !nTo && nDays === o.k ? ' on' : '') +
             '" data-nd="' + o.k + '">' + o.t + '</button>';
    }).join('') +
      '<button class="chip' + ((nFrom || nTo) ? ' on' : '') + '" data-nd="cal">📅 직접</button>';
    var sorts = NSORTS.map(function (o) {
      return '<button class="chip' + (nSort === o.k ? ' on' : '') + '" data-ns="' + o.k +
             '">' + o.t + '</button>';
    }).join('');
    var cur = NSORTS.filter(function (o) { return o.k === nSort; })[0];
    return '<div class="filters" id="nfilters">' +
      '<div class="frow"><span class="flab">기간</span><div class="chips" id="nDays">' +
        chips + '</div></div>' +
      ((nFrom || nTo)
        ? '<div class="frow"><span class="flab">직접</span><div class="dates">' +
          '<input type="date" id="nFrom" value="' + esc(nFrom) + '" aria-label="시작일">' +
          '<span class="dsep">~</span>' +
          '<input type="date" id="nTo" value="' + esc(nTo) + '" aria-label="종료일">' +
          '<button type="button" id="nClear">지우기</button></div></div>'
        : '') +
      '<div class="frow"><span class="flab">정렬</span><div class="chips" id="nSortRow">' +
        sorts + '</div></div>' +
      '<div class="fhelp">' + (cur ? '<b>' + esc(cur.t) + '</b> · ' + esc(cur.h) : '') + '</div>' +
      '</div>';
  }

  /* 우리가 안 다룬 이야기 — 기획거리가 아니라 '놓친 것' 이라 이슈·뉴스 쪽에 둔다. */
  function newsBlocks() {
    /* 이슈·뉴스 쪽에 붙는 묶음은 이제 여럿이다 — 우리가 안 다룬 이야기, 레딧,
       유튜브. 첫 번째만 그리면 나중에 붙인 소스가 통째로 안 보인다. */
    return (D.plan || []).filter(function (b) { return b && b.where === 'news'; })
      .map(newsBlock).join('');
  }

  function newsBlock(blk, i) {
    if (!blk) return '';
    var det = (blk.detail || []).map(function (t) {
      var posts = (t.posts || []).map(function (x) {
        return '<div class="q">' + esc(x.at) + ' @' + esc(x.from) +
               (x.url ? ' <a class="qa" href="' + escU(x.url) + '" target="_blank" rel="noopener">' +
                        esc(x.head) + '</a>' : ' ' + esc(x.head)) + '</div>';
      }).join('');
      return '<details class="quiet"><summary>' + esc(t.theme) + ' — ' + esc(t.stat) +
             '</summary>' + (posts || '<div class="q">글을 못 붙였습니다</div>') + '</details>';
    }).join('');
    return '<div class="ns missed"><div class="who">' + esc(blk.title) + '</div>' +
      '<div class="sig">' + esc(blk.why) + '</div>' +
      '<div class="arts">' + esc(blk.stat || '') + '</div>' + det +
      (blk.form ? '<button class="pbtn" type="button" data-missed="' + i +
                  '">봇 양식 만들기</button>' : '') +
      '</div>';
  }

  function bindNewsBar() {
    var nd = document.getElementById('nDays');
    if (nd) nd.onclick = function (e) {
      var b = e.target.closest('[data-nd]'); if (!b) return;
      var v2 = b.getAttribute('data-nd');
      if (v2 === 'cal') { nTo = ymd(scanMs()); nFrom = ymd(scanMs() - 2 * 86400000); }
      else { nDays = parseInt(v2, 10) || 0; nFrom = ''; nTo = ''; }
      renderNews();
    };
    var ns = document.getElementById('nSortRow');
    if (ns) ns.onclick = function (e) {
      var b = e.target.closest('[data-ns]'); if (!b) return;
      nSort = b.getAttribute('data-ns') || 'reco';
      renderNews();
    };
    ['nFrom', 'nTo'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.onchange = function () {
        nFrom = (document.getElementById('nFrom') || {}).value || '';
        nTo = (document.getElementById('nTo') || {}).value || '';
        if (nFrom && nTo && nFrom > nTo) { var t = nFrom; nFrom = nTo; nTo = t; }
        renderNews();
      };
    });
    var nc = document.getElementById('nClear');
    if (nc) nc.onclick = function () { nFrom = ''; nTo = ''; nDays = 0; renderNews(); };
    [].forEach.call(document.querySelectorAll('[data-missed]'), function (mb) {
      mb.onclick = function () {
        var all = (D.plan || []).filter(function (b) { return b && b.where === 'news'; });
        var blk = all[parseInt(mb.getAttribute('data-missed'), 10) || 0];
        if (blk && blk.form) openForm(blk.form);
      };
    });
  }

  function renderNews() {
    var v = document.getElementById('viewNews');
    var list = newsSorted((D.news || []).filter(newsPass));
    if (!list.length) {
      v.innerHTML = newsBar() +
        '<p class="note">이 조건에 맞는 급상승이 없습니다. 기간을 넓혀보세요. ' +
        '기준은 평소의 <b>3배</b>이고, 지난 <b>사흘</b>치까지 남겨 둡니다.</p>' +
        newsBlocks();
      bindNewsBar();
      return;
    }

    /* 발화가 있는 것만 카드로 펼친다. 차트만 오른 건 성적이지 사건이 아니라서
       읽을 게 없다 — 지우지는 않고 아래에 접어 둔다. */
    var loud = list.filter(function (s) { return (s.speech || 0) > 0; });
    var quiet = list.filter(function (s) { return !(s.speech || 0); });

    var out = [newsBar(),
               '<p class="note">아티스트별로 기사 수와 차트를 매일 재서 평소의 <b>3배</b>를 ' +
               '넘은 것만 올립니다. 새로 모을 때마다 지워지지 않게 <b>사흘치</b>를 남깁니다.</p>'];

    (loud.length ? loud : list).forEach(function (s) {
      var arts = (s.articles || []);
      var head = arts[0];
      var rest = arts.slice(1).map(function (a) {
        return '<a href="' + escU(a.url) + '" target="_blank" rel="noopener">' +
               esc(a.title) + (a.source ? ' <span class="src">' + esc(a.source) + '</span>' : '') +
               '</a>';
      }).join('');
      out.push('<div class="ns">' +
        '<div class="who">' + esc(s.entity) + '</div>' +
        (head
          ? '<a class="lede" href="' + escU(head.url) + '" target="_blank" rel="noopener">' +
            esc(head.title) + '</a>'
          : '<div class="lede">기사를 못 불러왔습니다 — 맥에서 스캔이 돌면 붙습니다</div>') +
        '<div class="sig"><span class="mult">' + s.multiple + '배</span> · ' + esc(s.why || '') +
          (s.days_ago ? ' · <span class="ago">' + s.days_ago + '일 전에 잡힘</span>' : '') + '</div>' +
        (s.also_in_magazine
          ? '<div class="xref">매거진에도 ' + s.also_in_magazine.length + '건 — 먼저 보세요</div>'
          : '') +
        (rest ? '<div class="arts">' + rest + '</div>' : '') +
        '</div>');
    });

    if (loud.length && quiet.length) {
      /* 접혀 있어도 기사 제목은 보여준다 — 발언이 없을 뿐 소재가 없는 건 아니다
         ('도경수 재예매 매진' 처럼 사실만 있는 기사가 여기 걸린다). */
      var qs = quiet.map(function (s) {
        var a = (s.articles || [])[0];
        return '<div class="q">' + esc(s.entity) + ' · ' + s.multiple + '배 · ' + esc(s.why) +
               (a ? '<a class="qa" href="' + escU(a.url) + '" target="_blank" rel="noopener">' +
                    esc(a.title) + '</a>' : '') + '</div>';
      }).join('');
      out.push('<details class="quiet"><summary>조용한 급상승 ' + quiet.length +
               '건 — 숫자만 움직이고 발언은 안 잡혔습니다</summary>' + qs + '</details>');
    }
    out.push(newsBlocks());
    v.innerHTML = out.join('');
    bindNewsBar();
  }

  // 오늘의 후보 — 인스타 피드처럼 (2026-10-12 규효 "이슈 뉴스도 인스타 보기 탭처럼").
  // ♥ 고르기 · 💬 고정 댓글(빠름·선정 사유) + 앵글은 댓글로 · ✈︎ 앱에 초안 맡기기 · 🔖 봇 초안 표시
  var CV_KEY = 'plot.cand.view';
  function candView() { try { return localStorage.getItem(CV_KEY) || 'feed'; } catch (e) { return 'feed'; } }
  function candPost(c) {
    var m = marks[c.id], sub = [], cap = String(c.caption || ''), id = esc(c.id);
    if (c.kind === 'news') sub.push('소식'); else if (c.kind === 'curation') sub.push('큐레이션');
    if (c.is_reel) sub.push('릴스');
    (c.genres || []).forEach(function (g) { if (g !== '기타') sub.push(g.indexOf('인물:') === 0 ? '본인 · ' + g.slice(3) : g); });
    if (c.covered) sub.push('이미 다룸');
    var notes = CNOTE[c.id] || (angles[c.id] ? [angles[c.id]] : []);
    var media = '<div class="med' + (c.image ? '' : ' gone') + '">' + (c.image ? '<img class="one" loading="lazy" referrerpolicy="no-referrer" src="' + esc(c.image) +
      '" alt="" onerror="this.parentNode.classList.add(\'gone\')">' : '') + '<div class="alt">' + esc(cap.slice(0, 160)) + '</div></div>';
    return '<article class="ig' + (m === 'skip' ? ' skipped' : '') + '" data-id="' + id + '">' +
      '<div class="igh"><span class="av avt">' + esc(String(c.account || '?').slice(0, 1).toUpperCase()) + '</span>' +
      '<div class="who"><a href="' + escU(c.url) + '" target="_blank" rel="noopener"><b>' + esc(c.account) + '</b></a><span>' + esc(sub.join(' · ')) + '</span></div>' +
      '<button type="button" class="igx" data-act="skip">' + (m === 'skip' ? '건너뜀' : '건너뛰기') + '</button></div>' + media +
      '<div class="iga"><button type="button" class="' + (m === 'pick' ? 'on' : '') + '" data-act="pick" aria-label="고르기">' + IC.heart + '</button>' +
      '<button type="button" data-cmt="c:' + id + '" aria-label="댓글">' + IC.chat + '</button>' +
      '<button type="button" data-act="mkdraft" aria-label="앱 초안 맡기기">' + IC.send + '</button><span class="sp"></span>' +
      '<button type="button" class="sv' + (m === 'drafted' ? ' on' : '') + '" data-act="drafted" aria-label="초안 표시">' + IC.save + '</button></div>' +
      '<div class="igl"><b>좋아요 ' + num(c.likes) + '개</b>' + (m === 'drafted' ? ' · ✎ ' + FORM_LABEL[forms[c.id] || 'shorts'] + ' 초안' : '') + '</div>' +
      '<div class="igc cl" data-cap><b>' + esc(c.account) + '</b> ' + esc(cap) + '</div>' +
      (cap.length > 60 ? '<button type="button" class="more" data-morecap2>더 보기</button>' : '') +
      (notes.length ? '<button type="button" class="evcm" data-cmt="c:' + id + '">💬 ' + esc(notes[notes.length - 1]) + '</button>' : '') +
      '<button type="button" class="cml" data-cmt="c:' + id + '">' + (c.comments ? '댓글 ' + num(c.comments) + '개 · ' : '') + '빠름·선정 사유 보기</button>' +
      '<div class="igt">' + esc(ago(c.hours)) + '</div></article>';
  }
  function candModeBar(mode) {
    return '<div class="vmode"><button type="button" data-cvmode="feed" aria-pressed="' + (mode === 'feed') + '">피드로 보기</button>' +
      '<button type="button" data-cvmode="list" aria-pressed="' + (mode === 'list') + '">자세히 보기</button></div>';
  }
  function renderCandFeed() {
    var v = document.getElementById('viewCand');
    if (!D.candidates || !D.candidates.length) {
      v.innerHTML = candModeBar('feed') + '<p class="note">오늘은 기준을 넘은 소식이 없습니다. 계정별 탭에서 직접 훑어보세요.</p>';
      return;
    }
    var fast = sorted((D.fast || []).filter(pass)), list = sorted(D.candidates.filter(pass));
    v.innerHTML = candModeBar('feed') +
      '<div class="fsum">♥ 고르기 · 💬 빠름·선정 사유 (앵글은 댓글로) · ✈︎ 앱에 초안 맡기기 · 🔖 봇 초안 표시</div>' +
      (fast.length ? '<h3 class="fasth">빠른 글 ' + fast.length + '건<span class="sub">아직 숫자는 작지만 이 나이치고 빠릅니다</span></h3>' +
        fast.map(candPost).join('') : '') +
      (list.length ? list.map(candPost).join('') : '<p class="note">이 조건에 맞는 후보가 없습니다. 기간이나 매거진을 넓혀보세요.</p>');
  }
  document.getElementById('viewCand').addEventListener('click', function (e) {
    var vm = e.target.closest('[data-cvmode]');
    if (vm) { try { localStorage.setItem(CV_KEY, vm.getAttribute('data-cvmode')); } catch (x) {} renderCand(); return; }
    var mc = e.target.closest('[data-morecap2]');
    if (mc) { var cp = mc.previousElementSibling; if (cp) cp.classList.remove('cl'); mc.remove(); }
  });
  function renderCand() {
    if (candView() === 'feed') return renderCandFeed();
    var v = document.getElementById('viewCand');
    var hint = '';      // 성과 요약 한 줄은 뺐다 — 고르는 데 도움이 안 됐다(규효)
    if (!D.candidates || !D.candidates.length) {
      v.innerHTML = hint + '<p class="note">오늘은 기준을 넘은 소식이 없습니다. ' +
                    '계정별 탭에서 직접 훑어보세요.</p>';
      return;
    }
    /* 빠른 글 — 절대 배수로는 아직 상위에 못 오지만 이 나이치고 빠른 글.
       순위를 건드리지 않고 따로 낸다. 후보 안에 이미 든 글은 여기 안 나온다. */
    var fast = sorted((D.fast || []).filter(pass));
    var fastBlock = fast.length
      ? '<div class="fastwrap"><h3 class="fasth">빠른 글 ' + fast.length + '건' +
        '<span class="sub">아직 숫자는 작지만 이 나이치고 빠릅니다 — ' +
        '반응이 다 쌓이길 기다리면 이틀 늦습니다</span></h3>' +
        fast.map(function (c) { return card(c); }).join('') + '</div>'
      : '';

    var list = sorted(D.candidates.filter(pass));
    // 이어지는 이야기는 기획 갈래로 옮겼다 — 성격이 기획거리인데
    // 이슈 목록에 섞여 있으면 반응 배수에 밀려 매일 아래로 내려간다.
    v.innerHTML = candModeBar('list') + hint + fastBlock + (list.length
      ? list.map(function (c) { return card(c); }).join('')
      : '<p class="note">이 조건에 맞는 후보가 없습니다. 기간이나 매거진을 넓혀보세요.</p>');
  }

  /* 이어지는 이야기. 저절로 잡힌 줄기 + 내가 추적을 켠 이름.
     "어제 본 이야기가 오늘 어떻게 됐나" 를 목록 맨 위에 둔다. */
  function followBlock() {
    var rows = D.followups || [];
    if (!rows.length) return '';
    var body = rows.map(function (r) {
      var on = (tracks[r.name] !== undefined) ? tracks[r.name] : !!r.tracked;
      var meta = '매거진 ' + (r.accounts || []).length + '곳 · 글 ' + r.posts + '건 · ' +
                 r.days + '일째';
      var items = (r.latest || []).map(function (x) {
        return '<li><span class="w">' + esc(String(x.at || '').slice(5, 10)) + ' @' + esc(x.account) +
               '</span> <a href="' + escU(x.url) + '" target="_blank" rel="noopener">' +
               esc(x.head || '(캡션 없음)') + '</a></li>';
      }).join('');
      return '<div class="fwRow" data-name="' + esc(r.name) + '">' +
        '<div class="fwTop"><span class="fwName">' + esc(r.name) + '</span>' +
        (r.fresh ? '<span class="fwNew">새 소식 ' + r.fresh + '건</span>' : '') +
        '<span class="fwMeta">' + esc(meta) + '</span>' +
        '<button class="fwBtn' + (on ? ' on' : '') + '" data-act="track">' +
        (on ? '🔔 추적 중' : '추적') + '</button></div>' +
        '<ul class="fwList">' + items + '</ul></div>';
    }).join('');
    return '<div class="fw"><h3 class="fwh">팔로우업 할 소재 ' + rows.length + '건' +
      '<span class="sub">여러 매거진이 며칠에 걸쳐 같은 이름을 다뤘습니다. ' +
      '추적을 켜면 그 이름의 새 소식이 여기 모입니다</span></h3>' + body + '</div>';
  }

  function renderAcct() {
    var v = document.getElementById('viewAcct');
    var out = [];
    Object.keys(D.by_account || {}).forEach(function (a) {
      var meta = (D.accounts || {})[a] || {};
      var list = (D.by_account[a] || []).filter(function (c) {
        return passDays(c) && passQ(c);
      });
      if (!list.length) return;
      out.push('<div class="grp"><div class="acctHead"><b>@' + esc(a) + '</b>' +
        '<span class="base">글 ' + list.length + '건 · 기준선 ' +
        num(Math.round(meta.baseline || 0)) +
        ' · 하루 ' + (meta.per_day != null ? meta.per_day : '?') + '개</span></div>' +
        '<div class="acctGrid">' +
        list.map(function (c) { return card(c, { plain: true }); }).join('') +
        '</div></div>');
    });
    v.innerHTML = out.join('') ||
      '<p class="note">이 조건에 맞는 글이 없습니다. 기간을 넓히거나 검색을 지워보세요.</p>';
  }

  function refreshBar() {
    var p = 0, s = 0, d = 0;
    Object.keys(marks).forEach(function (k) {
      if (marks[k] === 'pick') p++;
      else if (marks[k] === 'skip') s++;
      else if (marks[k] === 'drafted') d++;
    });
    var t = Object.keys(tracks).length;
    var bar = document.getElementById('bar');
    bar.hidden = (p + s + d + t) === 0;
    var parts = [];
    if (p) parts.push('고른 <b>' + p + '</b>건');
    if (d) parts.push('초안 <b>' + d + '</b>건');
    if (s) parts.push('건너뛴 ' + s + '건');
    if (t) parts.push('추적 <b>' + t + '</b>건');
    document.getElementById('cnt').innerHTML =
      parts.join(' · ') + (d > 3 ? ' <i>— 초안은 3건까지 만듭니다</i>' : '');
    document.getElementById('send').disabled = (p + s + d + t) === 0;
    document.getElementById('formBtn').hidden = d === 0;
  }

  function onClick(e) {
    var btn = e.target.closest('[data-act]');
    if (!btn || btn.tagName === 'INPUT') return;
    if (btn.getAttribute('data-act') === 'track') {
      var host = btn.closest('[data-name]');
      if (!host) return;
      var nm = host.getAttribute('data-name');
      var was = btn.classList.contains('on');
      tracks[nm] = !was;
      btn.classList.toggle('on', !was);
      btn.textContent = !was ? '🔔 추적 중' : '추적';
      refreshBar();
      return;
    }
    var host = e.target.closest('[data-id]');
    if (!host) return;
    var id = host.getAttribute('data-id');
    var act = btn.getAttribute('data-act');
    if (act === 'mkdraft') {
      var cc = indexAll()[id] || {};
      askDraft('dr-' + skey(id), headline(cc) || ('@' + (cc.account || '')), cc.account ? cc : null);
      return;
    }
    if (act === 'drafted') {
      // 처음 누르면 숏폼. 누를수록 캐러셀 → 둘다 → 해제.
      var nxt = marks[id] === 'drafted' ? FORM_NEXT[forms[id] || 'shorts'] : 'shorts';
      if (nxt === null) { delete marks[id]; delete forms[id]; }
      else { marks[id] = 'drafted'; forms[id] = nxt; }
    } else {
      marks[id] = marks[id] === act ? undefined : act;
      if (marks[id] === undefined) delete marks[id];
      delete forms[id];
    }
    renderCand(); refreshBar();
  }

  function onInput(e) {
    var el = e.target;
    if (el.getAttribute && el.getAttribute('data-act') === 'angle') {
      var host = el.closest('[data-id]');
      if (host) angles[host.getAttribute('data-id')] = el.value;
    }
  }

  function payload() {
    var now = new Date().toISOString();
    var byId = indexAll();
    var out = Object.keys(tracks).map(function (nm) {
      return { v: 1, action: tracks[nm] ? 'track' : 'untrack', name: nm, at: now };
    });
    return out.concat(Object.keys(marks).map(function (id) {
      var c = byId[id] || {};
      var o = { v: 1, action: marks[id], id: id, account: c.account || '?', at: now };
      if (angles[id]) o.angle = angles[id].slice(0, 200);
      if (marks[id] === 'drafted') o.form = forms[id] || 'shorts';
      if (c.multiple != null) o.multiple = c.multiple;
      if (c.kind) o.kind = c.kind;
      if (c.genres) o.genres = c.genres;
      return o;
    }));
  }

  /* ── 초안 → 봇 양식 ──────────────────────────────────────────────
     예전에는 '보내기' 가 선택 기록 JSON 을 복사했다. 그건 텔레그램 안에서
     미니앱이 봇에게 보내는 전용 데이터라, 사람이 봇 대화창에 붙여넣으면
     아무 일도 일어나지 않는다 (2026-09-24 규효: "이상한 코드로 나오는데
     봇에 붙여도 작동하지 않아"). 초안은 사람이 쓰는 것이므로 사람이 읽고
     붙여넣을 수 있는 양식으로 낸다 — 봇의 manual_flow / parse_simple_batch
     가 읽는 바로 그 형식이다. */
  /* 카드는 네 곳에서 나온다 — 후보·급상승·계정별·소식. 후보만 훑으면 급상승에서
     고른 카드가 빈 껍데기로 남는다(제목도 출처도 없이 나갔다). */
  function indexAll() {
    var byId = {};
    function add(list) {
      (list || []).forEach(function (c) { if (c && c.id && !byId[c.id]) byId[c.id] = c; });
    }
    add(D.candidates); add(D.fast);
    Object.keys(D.by_account || {}).forEach(function (a) { add(D.by_account[a]); });
    return byId;
  }

  function headline(c) {
    var t = String(c.caption || '').split('\n')[0];
    t = t.replace(/^[^0-9A-Za-z가-힣]+/, '').trim();
    return t.slice(0, 40) || (c.account ? '@' + c.account + ' 소재' : '제목');
  }
  function srcOf(c) { return c.account ? '@' + c.account : ''; }
  function cardCat(c) { return c.kind === 'curation' ? 'Feature' : 'News'; }
  function shortsCat(c) {
    var k = (c.plot_kind && c.plot_kind.kind) || '';
    return k.indexOf('발매') >= 0 || k.indexOf('신보') >= 0 ? 'New release!' : 'Issue';
  }
  function cardForm(c) {
    return ['[카테고리]', cardCat(c), '',
            '[캡션]', '', '',
            '[커버]',
            '소스: ',                    // 비우면 봇이 사진을 직접 받는다
            '제목: ' + headline(c),
            '부제: ',
            '출처: ' + srcOf(c), '',
            '[슬라이드]', '소스: ', '소제목: ', '본문: ', '출처: ' + srcOf(c), ''].join('\n');
  }
  function shortsForm(c) {
    return ['[영상]',
            '카테고리: ' + shortsCat(c),
            'URL: ', '구간: ',
            '곡: ' + headline(c),
            '아티스트: ', '피처링: ', '후킹: ',
            '출처: ' + srcOf(c),
            '리프레임: 자동'].join('\n');
  }
  function draftForms() {
    var byId = indexAll();
    var out = [];
    Object.keys(marks).forEach(function (id) {
      if (marks[id] !== 'drafted') return;
      var c = byId[id] || {}, f = forms[id] || 'shorts';
      if (f === 'shorts' || f === 'both') out.push(shortsForm(c));
      if (f === 'card' || f === 'both') out.push(cardForm(c));
    });
    return out.join('\n\n');
  }
  function openForms() {
    var txt = draftForms();
    if (!txt) { alert('초안으로 표시한 소재가 없습니다.'); return; }
    document.getElementById('formText').value = txt;
    document.getElementById('formSheet').hidden = false;
  }

  function send() {
    var body = JSON.stringify(payload());
    if (inTG && TG.sendData) {
      if (new Blob([body]).size > 3800) {
        alert('한 번에 보낼 수 있는 양을 넘었습니다. 몇 건 줄여서 보내주세요.');
        return;
      }
      TG.sendData(body);          // 보내면 미니앱이 닫힌다
      return;
    }
    // 텔레그램 밖에서는 복사로 대신한다 — 웹에서 봇을 직접 부를 길이 없다.
    var ok = false;
    try {
      navigator.clipboard.writeText(body);
      ok = true;
    } catch (err) { ok = false; }
    var el = document.getElementById('cnt');
    el.innerHTML = ok
      ? '복사했습니다 — 텔레그램 봇에 붙여넣으세요'
      : '복사에 실패했습니다. 텔레그램 안에서 열어주세요';
  }

  function stale(genAt) {
    // "2026-09-18 08:05 KST"
    var m = /(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/.exec(genAt || '');
    if (!m) return null;
    var t = Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4] - 9, +m[5]);
    return (Date.now() - t) / 36e5;
  }

  function boot(d) {
    D = d;
    if (D.schema !== SCHEMA) {
      var e = document.getElementById('err');
      e.hidden = false;
      e.textContent = '데이터 형식이 다릅니다 (schema ' + D.schema + ', 이 화면은 ' +
                      SCHEMA + '). 앱을 새로 배포해야 합니다.';
      return;
    }
    var st = document.getElementById('stamp');
    var h = stale(D.generated_at);
    st.textContent = D.generated_at +
      (h != null && h >= 12 ? ' · ' + Math.round(h) + '시간 전 데이터' : '');
    if (h != null && h >= 12) st.classList.add('warn');

    var nn = (D.news || []).length;
    if (nn) document.getElementById('tNews').textContent = '뉴스 급상승 ' + nn;
    renderFilters(); renderCand(); renderAcct(); refreshBar();

    var s = (D.stats || {});
    document.getElementById('note').innerHTML =
      '풀 <b>' + (s.pool || 0) + '</b>건에서 추린 <b>' +
      (s.picked || 0) + '</b>건입니다. ' +
      '배수는 그 계정 평소 반응 대비이고, 릴스와 이미지는 따로 잽니다. ' +
      '‘이미 다룸’은 지우지 않고 흐리게만 둡니다 — 같은 사안을 다른 앵글로 다시 쓸 수 있으니까요.';
  }

  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.getElementById('send').addEventListener('click', send);
  document.getElementById('formBtn').addEventListener('click', openForms);
  document.getElementById('formClose').addEventListener('click', function () {
    document.getElementById('formSheet').hidden = true;
  });
  document.getElementById('formCopy').addEventListener('click', function () {
    var ta = document.getElementById('formText');
    ta.removeAttribute('readonly'); ta.select(); ta.setSelectionRange(0, 999999);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    if (!ok && navigator.clipboard) {
      try { navigator.clipboard.writeText(ta.value); ok = true; } catch (e) {}
    }
    ta.setAttribute('readonly', 'readonly');
    this.textContent = ok ? '복사했습니다' : '길게 눌러 복사하세요';
    var self = this;
    setTimeout(function () { self.textContent = '복사'; }, 1800);
  });
  /* 밝기 — 시스템 설정을 기본으로 두고, 누르면 그 기기에서만 고정한다.
     텔레그램 안에서 열면 앱 테마를 따라간다. localStorage 는 막히는 데가
     있으므로(시크릿 창·저장 차단) 읽기·쓰기를 모두 감싼다. */
  var THEME_KEY = 'plot.app.theme';   // 세 화면이 같은 열쇠를 쓴다

  function systemTheme() {
    if (inTG && TG && TG.colorScheme) return TG.colorScheme;
    try {
      return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    } catch (e) { return 'dark'; }
  }

  function applyTheme(t) {
    if (t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    var b = document.getElementById('theme');
    if (b) b.title = t ? (t === 'light' ? '밝게 고정됨' : '어둡게 고정됨') : '시스템 설정';
  }

  (function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    applyTheme(saved === 'light' || saved === 'dark' ? saved : null);
  })();

  document.getElementById('theme').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme') || systemTheme();
    var next = cur === 'light' ? 'dark' : 'light';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  });

  document.getElementById('chipDays').addEventListener('click', function (e) {
    var b = e.target.closest('[data-days]');
    if (!b) return;
    var v = b.getAttribute('data-days');
    if (v === 'cal') {                       // 달력으로 직접
      fDays = 'cal';
      if (!fFrom && !fTo) {                  // 처음 열면 최근 이레를 넣어 둔다
        fTo = ymd(scanMs());
        fFrom = ymd(scanMs() - 6 * 86400000);
      }
    } else {
      fDays = parseInt(v, 10) || 0;
      fFrom = ''; fTo = '';
    }
    renderFilters(); renderCand(); renderAcct();
  });
  ['dFrom', 'dTo'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', function () {
      fFrom = document.getElementById('dFrom').value;
      fTo = document.getElementById('dTo').value;
      if (fFrom && fTo && fFrom > fTo) { var t = fFrom; fFrom = fTo; fTo = t; }
      fDays = (fFrom || fTo) ? 'cal' : 0;
      renderFilters(); renderCand(); renderAcct();
    });
  });
  document.getElementById('dClear').onclick = function () {
    fFrom = ''; fTo = ''; fDays = 0;
    renderFilters(); renderCand(); renderAcct();
  };
  document.getElementById('chipSort').addEventListener('click', function (e) {
    var b = e.target.closest('[data-sort]');
    if (!b) return;
    fSort = b.getAttribute('data-sort') || 'reco';
    renderFilters(); renderCand(); renderAcct();
  });
  var fqT;
  document.getElementById('fq').addEventListener('input', function (e) {
    clearTimeout(fqT);
    var v = e.target.value.trim();
    fqT = setTimeout(function () { fQ = v; renderFilters(); renderCand(); renderAcct(); }, 180);
  });
  document.getElementById('chipAcct').addEventListener('click', function (e) {
    var b = e.target.closest('[data-acct]');
    if (!b) return;
    fAcct = b.getAttribute('data-acct') || null;
    renderFilters(); renderCand(); renderAcct();
  });

  function showTab(which) {
    if (GRP !== 'info') return;          // 기획·초안 갈래에서는 후보 화면을 켜지 않는다
    var t = { cand: 'tCand', acct: 'tAcct', news: 'tNews' };
    var v = { cand: 'viewCand', acct: 'viewAcct', news: 'viewNews' };
    Object.keys(t).forEach(function (k) {
      document.getElementById(t[k]).setAttribute('aria-selected', String(k === which));
      document.getElementById(v[k]).hidden = (k !== which);
    });
    var fl = document.getElementById('filters');
    fl.hidden = (which !== 'cand') || !(D.candidates || []).length;
    if (which === 'news') renderNews();
  }
  /* 기획 소스 — 차트 기록으로 만든 시장 분석, 낱개 대신 묶은 주간 발매.
     둘 다 새 수집 없이 이미 쌓인 기록만 읽는다. 카드마다 봇 양식이 붙어 있다. */
  var PSTATE = 'plot.plan.state';
  var pstate = (function () {
    try { return JSON.parse(localStorage.getItem(PSTATE) || '{}') || {}; }
    catch (e) { return {}; }
  })();
  function psave() {
    try { localStorage.setItem(PSTATE, JSON.stringify(pstate)); } catch (e) {}
  }
  var PSTEPS = [['idea', '아이디어'], ['prep', '준비중'], ['done', '제작함']];

  function planRows() {
    return (D.plan || []).filter(function (p) {
      return p && p.where !== 'news' && (p.form || (p.items || []).length);
    }).sort(function (a, b) { return (a.order || 10) - (b.order || 10); });
  }

  function renderPlan() {
    var host = document.getElementById('viewPlan');
    var rows = planRows();
    var fw = followBlock();          // 이어지는 이야기 — 기획거리라 이쪽이 제자리다
    if (!rows.length && !fw) {
      host.innerHTML = '<div class="pempty">아직 기획 소스가 없습니다.<br>' +
        '맥에서 스캔이 한 번 돌면 인물 후보와 차트 기록으로 만든 시장 분석이 ' +
        '여기 들어옵니다.</div>';
      return;
    }
    host.innerHTML = fw + rows.map(function (p, i) {
      var st = pstate[p.id] || '';
      var body = (p.rows || []).map(function (r) {
        return '<div class="prow"><b>' + esc(r.label) + '</b><span>' +
               esc(r.value) + '</span></div>';
      }).join('');
      // 사람처럼 항목마다 제 양식이 있는 카드
      var items = (p.items || []).map(function (it, j) {
        // 각도 — 무엇을 물어볼지. 이게 없으면 카드가 형식만 남는다.
        var ang = (it.angles || []).length
          ? '<ul class="pangle">' + it.angles.map(function (a) {
              return '<li>' + esc(a) + '</li>'; }).join('') + '</ul>' : '';
        // 실마리 — 남이 한 말. 사실 확인용이지 옮겨 쓰는 문장이 아니다.
        var clue = (it.clues || []).length
          ? '<div class="pclue">' + it.clues.map(esc).join('<br>') + '</div>' : '';
        // 어디서 찾을지 — 이야기는 말보다 화면에서 잡힌다.
        var lnk = (it.links || []).length
          ? '<div class="plinks">' + it.links.map(function (l) {
              return '<a href="' + escU(l.url) + '" target="_blank" rel="noopener">' +
                     esc(l.label) + '</a>'; }).join('') + '</div>' : '';
        var qs = (it.queries || []).length
          ? '<div class="pqs">' + it.queries.map(function (q) {
              return '<button type="button" data-copy="' + esc(q) + '">' +
                     esc(q) + '</button>'; }).join('') + '</div>' : '';
        return '<div class="pitem"><div class="pin">' +
               '<div class="pname">' + esc(it.name) + '</div>' +
               '<div class="pwhy2">' + esc(it.why || '') + '</div>' +
               ang + clue + lnk + qs + '</div>' +
               '<div style="display:flex;flex-direction:column;gap:6px">' +
               (it.id ? '<button class="pmini" type="button" data-mk="' + esc(it.id) + '" data-mkname="' + esc(it.name || '') + '">✍️ 앱 초안</button>' : '') +
               '<button class="pmini" type="button" data-plan="' + i +
               '" data-item="' + j + '">양식</button></div></div>';
      }).join('');
      // 접어 둔 전체 — 요약 몇 줄만 두면 카드 안에서 판단이 안 끝난다
      var more = (p.more || []).length
        ? '<details class="pmore"><summary>전체 ' + p.more.length + '줄 보기</summary>' +
          p.more.map(function (r) {
            return '<div class="prow"><b>' + esc(r.label) + '</b><span>' +
                   esc(r.value) + '</span></div>';
          }).join('') + '</details>'
        : '';

  /* ── 예약 발행 (collectors/app_actions sc/sx · collectors/publish_slots) ── */

  function nextAt(hhmm) {                       // 그 시각이 오늘 5분 안이거나 지났으면 내일
    var now = new Date(), k = new Date(now.getTime() + 9 * 3600e3);
    var h = Number(hhmm.slice(0, 2)), m = Number(hhmm.slice(3, 5));
    var t = Date.UTC(k.getUTCFullYear(), k.getUTCMonth(), k.getUTCDate(), h, m) - 9 * 3600e3;
    if (t <= now.getTime() + 5 * 60e3) t += 86400e3;
    var d = new Date(t + 9 * 3600e3);

<script>
(function () {
  var TK = 'plot.app.theme', AK = 'plot.app.accent', NK = 'plot.app.neon',
      GK = 'plot.app.gap', FK = 'plot.app.fs';
  var GAPS = [['tight', '좁게'], ['normal', '보통'], ['wide', '넓게']];
  var FSIZES = [['s', '작게'], ['m', '보통'], ['l', '크게'], ['xl', '더 크게']];
  var HUES = ['cyan', 'magenta', 'lime', 'orange', 'violet'];
  var MODES = [['system', '기기'], ['light', '밝게'], ['dark', '어둡게']];
  var ACCENTS = [['amber', '#E8B34A'], ['blue', '#5B8DEF'], ['green', '#4FB477'],
                 ['violet', '#8B7CF0'], ['mono', '#ECECF1'], ['neon', '#00F0FF']];
  var box = null;

  function get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
  function set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
  function mode() { var t = get(TK, ''); return (t === 'light' || t === 'dark') ? t : 'system'; }
  function accent() { return get(AK, 'amber'); }
  function hue() { var h = get(NK, 'cyan'); return HUES.indexOf(h) < 0 ? 'cyan' : h; }
  function gap() { var g = get(GK, 'normal'); return /^(tight|normal|wide)$/.test(g) ? g : 'normal'; }
  function fsize() { var f = get(FK, 'm'); return /^(s|m|l|xl)$/.test(f) ? f : 'm'; }

  function apply() {
    var r = document.documentElement, m = mode();
    if (m === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', m);
    r.setAttribute('data-accent', accent());
    r.setAttribute('data-neon', hue());
    r.setAttribute('data-gap', gap());
    r.setAttribute('data-fs', fsize());
    var meta = document.querySelector('meta[name=theme-color]');
    if (meta) {
      var dark = m === 'dark' ||
        (m === 'system' && !matchMedia('(prefers-color-scheme: light)').matches);
      meta.setAttribute('content', dark ? '#0A0A0C' : '#FBFAF7');
    }
    if (box) paint();
  }

  function paint() {
    [].forEach.call(box.querySelectorAll('[data-mode]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-mode') === mode());
    });
    [].forEach.call(box.querySelectorAll('[data-accent]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-accent') === accent());
    });
    [].forEach.call(box.querySelectorAll('[data-hue]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-hue') === hue());
    });
    [].forEach.call(box.querySelectorAll('[data-gap]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-gap') === gap());
    });
    [].forEach.call(box.querySelectorAll('[data-fs]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-fs') === fsize());
    });
  }

  function close() {
    if (box) { box.remove(); box = null; document.removeEventListener('click', away); }
  }
  function away(e) {
    if (box && !box.contains(e.target) && !e.target.closest('.plotThemeBtn')) close();
  }

  function open(btn) {
    if (box) { close(); return; }
    box = document.createElement('div');
    box.className = 'plotThemeBox';
    box.innerHTML = '<b>밝기</b><div class="row">' +
      MODES.map(function (m) {
        return '<button type="button" data-mode="' + m[0] + '">' + m[1] + '</button>';
      }).join('') + '</div><b>강조색</b><div class="row">' +
      ACCENTS.map(function (a) {
        return '<button type="button" class="sw" data-accent="' + a[0] +
               '" title="' + a[0] + '"></button>';
      }).join('') + '</div>' +
      // 네온을 골랐을 때만 열리는 줄 — 색이 하나면 사이버펑크가 안 산다
      '<div class="row hues">' + HUES.map(function (h) {
        return '<button type="button" class="hue" data-hue="' + h +
               '" title="' + h + '"></button>';
      }).join('') + '</div>' +
      '<b>글자 크기</b><div class="row">' + FSIZES.map(function (f) {
        return '<button type="button" data-fs="' + f[0] + '">' + f[1] + '</button>';
      }).join('') + '</div>' +
      '<b>여백</b><div class="row">' + GAPS.map(function (g) {
        return '<button type="button" data-gap="' + g[0] + '">' + g[1] + '</button>';
      }).join('') + '</div>';
    document.body.appendChild(box);
    // body 에 배율이 걸려 있으면 getBoundingClientRect 는 이미 곱해진 값을 준다.
    // 상자는 그 배율 안에 놓이므로 되나눠야 제자리에 선다.
    var z = parseFloat(getComputedStyle(document.body).zoom) || 1;
    box.style.top = Math.round(btn.getBoundingClientRect().bottom / z + 8) + 'px';
    box.onclick = function (e) {
      var m = e.target.closest('[data-mode]'), a = e.target.closest('[data-accent]');
      if (m) { set(TK, m.getAttribute('data-mode') === 'system' ? '' : m.getAttribute('data-mode')); apply(); }
      if (a) { set(AK, a.getAttribute('data-accent')); apply(); }
      var h = e.target.closest('[data-hue]');
      if (h) { set(NK, h.getAttribute('data-hue')); apply(); }
      var g = e.target.closest('[data-gap]');
      if (g) { set(GK, g.getAttribute('data-gap')); apply(); }
      var f = e.target.closest('[data-fs]');
      if (f) { set(FK, f.getAttribute('data-fs')); apply(); }
    };
    paint();
    setTimeout(function () { document.addEventListener('click', away); }, 0);
  }

  function put() {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'plotThemeBtn';
    btn.textContent = '◐ 테마';
    btn.title = '밝기와 강조색';
    btn.onclick = function (e) { e.stopPropagation(); open(btn); };
    var own = document.getElementById('theme');
    var h = document.querySelector('header .hbtns') || document.querySelector('.addRow')
            || (own && own.parentElement);
    if (h) { h.appendChild(btn); return; }
    btn.className += ' float';
    document.body.appendChild(btn);
  }

  apply();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', put);
  else put();
})();
</script>

<script>
(function () {
  var KEY = 'plot.app.installHint';
  var ua = navigator.userAgent;
  var iOS = /iPad|iPhone|iPod/.test(ua) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!iOS) return;
  if (window.navigator.standalone === true ||
      matchMedia('(display-mode: standalone)').matches) return;   // 이미 앱으로 열었다
  try { if (localStorage.getItem(KEY) === 'off') return; } catch (e) {}

  var TG = window.Telegram && window.Telegram.WebApp;
  var inTG = !!(TG && TG.initData !== undefined && TG.platform && TG.platform !== 'unknown');
  var safari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|Chrome/.test(ua);

  function show() {
    var box = document.createElement('div');
    box.style.cssText =
      'position:fixed; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom));' +
      'z-index:9997; background:var(--panel,#131318); color:var(--text,#ECECF1);' +
      'border:1px solid var(--line,#2A2A34); border-radius:12px; padding:12px 13px;' +
      'font:14px/1.55 -apple-system,BlinkMacSystemFont,sans-serif;' +
      'box-shadow:0 14px 40px rgba(0,0,0,.45)';
    var msg = inTG
      ? '홈 화면에 추가하려면 <b>사파리에서 열어야</b> 합니다 — 텔레그램 안에는 그 메뉴가 없어요.'
      : safari
        ? '아래 <b>공유 버튼(↑)</b> → <b>홈 화면에 추가</b> 를 누르면 앱처럼 열립니다.'
        : '홈 화면에 추가는 <b>사파리에서만</b> 됩니다 — 이 주소를 사파리로 열어 주세요.';
    box.innerHTML = '<div style="margin-bottom:9px">' + msg + '</div>' +
      '<div style="display:flex; gap:7px">' +
      (inTG ? '<button id="plotOpenSafari" style="flex:1; border:0; border-radius:8px;' +
              'padding:9px; font:inherit; font-weight:700; background:var(--text,#ECECF1);' +
              'color:var(--bg,#0A0A0C)">브라우저에서 열기</button>' : '') +
      '<button id="plotHintNo" style="flex:' + (inTG ? '0 0 92px' : '1') + ';' +
      'border:1px solid var(--line,#2A2A34); border-radius:8px; padding:9px; font:inherit;' +
      'background:none; color:var(--muted,#8A8A96)">다시 안 보기</button></div>';
    document.body.appendChild(box);
    var go = document.getElementById('plotOpenSafari');
    if (go) go.onclick = function () {
      try { TG.openLink(location.href); } catch (e) { window.open(location.href, '_blank'); }
    };
    document.getElementById('plotHintNo').onclick = function () {
      try { localStorage.setItem(KEY, 'off'); } catch (e) {}
      box.remove();
    };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show);
  else show();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', function () {
    // updateViaCache:'none' — 이게 없으면 sw.js 자체가 HTTP 캐시에 걸린다.
    // 캐시 규칙을 고친 새 워커가 옛 캐시 때문에 안 실리는, 웃기지만 실제로 겪은 일.
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(function (r) { r.update(); })
      .catch(function () {});
  });
}
</script>
