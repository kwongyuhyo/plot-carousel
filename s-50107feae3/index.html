<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLOT 제작</title>
<meta name="description" content="PLOT 콘텐츠 제작 도구">
<meta name="robots" content="noindex, nofollow">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A0A0C">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PLOT">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* 완성물과 같은 집 사람처럼 보이게 — 캐러셀 스튜디오의 팔레트를 그대로 쓴다.
   색은 흑백으로 두고 앰버 하나만 액센트로. 잡지 목차처럼 활자와 괘선으로 끌고 간다. */
:root{
  --bg:#0A0A0C; --panel:#131318; --raise:#1B1B22;
  --line:#22222B; --line-soft:#191920;
  --text:#ECECF1; --muted:#8A8A96; --dim:#5E5E6A;
  --amber:#E8B34A; --danger:#C75B4A;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); min-height:100dvh;
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
  padding:calc(40px + env(safe-area-inset-top)) 22px calc(40px + env(safe-area-inset-bottom));
}
[hidden]{display:none!important}
.wrap{max-width:540px; margin:0 auto}

/* ── 제호 ── */
.mark{width:44px; height:28px; background-size:contain; background-repeat:no-repeat;
  opacity:.92; margin-bottom:17px}
h1{margin:0; font-size:40px; font-weight:800; letter-spacing:-.045em; line-height:1}
.tag{margin:11px 0 0; color:var(--muted); font-size:13.5px; letter-spacing:-.01em}

/* ── 목차 ── */
.index{margin-top:38px; border-top:1px solid var(--line)}
.row{
  display:block; text-decoration:none; color:inherit; position:relative;
  border-bottom:1px solid var(--line);
  padding:21px 34px 20px 19px;
  transition:background .16s ease;
}
.row::before{                       /* 완성물의 '|' 바를 그대로 */
  content:''; position:absolute; left:0; top:24px;
  width:3px; height:17px; background:var(--text);
  transition:height .18s ease, background .16s ease;
}
.row::after{
  content:'→'; position:absolute; right:12px; top:22px;
  color:var(--dim); font-size:14px; transition:transform .18s ease, color .16s ease;
}
.row:hover{background:var(--panel)}
.row:hover::before{height:26px; background:var(--amber)}
.row:hover::after{transform:translateX(3px); color:var(--muted)}
.row:active{background:var(--raise)}
.row h2{margin:0; font-size:19px; font-weight:800; letter-spacing:-.035em}
.row p{margin:7px 0 0; color:var(--muted); font-size:13.5px; line-height:1.55; letter-spacing:-.01em}
.row .meta{
  margin-top:10px; font-size:11px; color:var(--dim);
  letter-spacing:.045em;
}
.row .meta.warn{color:var(--amber)}

/* ── 아래 동작 ── */
/* 보일 버튼이 하나도 없으면 위 여백까지 같이 접는다. */
.acts{display:flex; flex-direction:column; gap:9px}
.acts:has(.act:not([hidden])){margin-top:26px}
.act{
  width:100%; text-align:left; cursor:pointer;
  background:none; border:1px solid var(--line); border-radius:7px;
  color:var(--text); font:inherit; font-size:13.5px; font-weight:600;
  padding:13px 15px; transition:border-color .16s, background .16s;
}
.act:hover{border-color:#31313d; background:var(--panel)}
.act:active{background:var(--raise)}
.act[disabled]{cursor:default; opacity:1}
.act small{display:block; margin-top:3px; color:var(--dim); font-size:11.5px; font-weight:400;
  letter-spacing:-.005em}
.act b{color:var(--text); font-weight:700}

/* ── 꼬리 ── */
.foot{margin-top:30px; color:var(--dim); font-size:12px; line-height:1.7; letter-spacing:-.005em}
.foot b{color:var(--muted); font-weight:600}
.foot code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px;
  color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:1px 5px;
}
</style>
</head>
<body>
<div class="wrap">

  <div class="mark" id="mark"></div>
  <h1>제작</h1>
  <p class="tag">캐러셀과 숏폼, 한 자리에서.</p>

  <nav class="index">
    <a class="row" href="carousel.html">
      <h2>캐러셀 스튜디오</h2>

      <div class="meta" id="cMeta"></div>
    </a>
    <a class="row" href="shorts.html">
      <h2>숏폼 양식</h2>
      <p>곡·아티스트·구간을 채우면 글자 배치가 바로 보입니다.
         다 쓰면 제작 대기열로 넘어가고, 완성되는 대로 하나씩 도착합니다.</p>
      <div class="meta" id="sMeta"></div>
    </a>
  </nav>

  <div class="acts">
    <button class="act" id="openWide" hidden></button>
    <button class="act" id="install" hidden></button>
  </div>

  <div class="foot" id="foot"></div>
</div>

  const wide  = document.getElementById('openWide');

  if (inTG) {

    wide.onclick = () => {
      try { TG.openLink(location.href); } catch (e) { window.open(location.href, '_blank'); }

      '완성본은 만들어지는 대로 <b>폰으로 · 레이어만 · 리프레임 수정</b> 버튼과 함께 도착합니다.';
  } else {
    cMeta.textContent = '브라우저에서 완결 · 오프라인 가능';
    sMeta.className = 'meta warn';
    sMeta.textContent = '제작까지 가려면 텔레그램에서';

    foot.innerHTML =
      '숏폼 양식은 봇에 작업을 거는 것이 목적이라, 일반 브라우저에서는 ' +
      '<b>양식 텍스트 복사</b>까지만 됩니다. 채팅 하단 키보드의 ' +
      '<b>숏폼 양식</b> 버튼으로 열면 쓴 내용이 곧장 제작 대기열로 넘어갑니다.';
    setupInstall();
  }

  /* 앱으로 설치 — 크롬 계열은 버튼 하나, 사파리는 글로 안내.
     이미 자체 창으로 열었으면 아무것도 보여주지 않는다. */
  function setupInstall() {
    const btn = document.getElementById('install');
    if (window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true) return;

    let prompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); prompt = e;
      btn.hidden = false;
      btn.innerHTML = '앱으로 설치' +
        '<small>독·홈 화면에 아이콘이 생기고 자체 창으로 열립니다.</small>';
      btn.onclick = async () => {
        btn.disabled = true;
        try { await prompt.prompt(); } catch (_) {}
        prompt = null; btn.hidden = true;
      };
    });

    const ua = navigator.userAgent;
    if (/iPad|iPhone|iPod/.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua)) {
      btn.hidden = false; btn.disabled = true;
      btn.innerHTML = '앱으로 설치하려면' +
        '<small>아래 공유 버튼 → <b>홈 화면에 추가</b></small>';
    }
  }
})();
</script>
</body>
</html>
