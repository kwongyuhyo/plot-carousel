<title>PLOT 제작</title>

<meta name="robots" content="noindex, nofollow">

<style>
:root{
  --bg:#101119; --card:#1a1c26; --card-h:#212430; --line:#2e3240;
  --ink:#eceef4; --dim:#98a0b2; --accent:#6f8cff; --ok:#3ecf8e; --warn:#ffb020;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(120% 60% at 50% -10%, #1e2334 0%, #101119 60%),
    var(--bg);
  min-height:100dvh; color:var(--ink);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;
  font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
  padding:calc(34px + env(safe-area-inset-top)) 20px calc(34px + env(safe-area-inset-bottom));
}
[hidden]{display:none!important}
.wrap{max-width:540px; margin:0 auto}

/* ── 머리 ── */
.brand{display:flex; align-items:center; gap:11px; margin-bottom:6px}
.brand .mark{width:52px; height:33px; background-size:contain; background-repeat:no-repeat; opacity:.95}
.brand h1{margin:0; font-size:20px; font-weight:800; letter-spacing:-.4px}
.sub{color:var(--dim); font-size:13.5px; margin:0 0 26px}

/* ── 카드 ── */
.card{
  display:block; text-decoration:none; color:inherit;
  background:var(--card); border:1px solid var(--line); border-radius:17px;
  padding:19px 19px 17px; margin-bottom:13px;
  transition:background .14s, border-color .14s, transform .08s;
}
.card:hover{background:var(--card-h); border-color:#3b4154}
.card:active{transform:scale(.988)}
.card .top{display:flex; align-items:center; gap:11px}
.card .ico{
  width:40px; height:40px; flex:none; border-radius:12px;
  background:#252936; border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:19px;
}
.card h2{margin:0; font-size:16.5px; font-weight:700; letter-spacing:-.2px}
.card .arrow{margin-left:auto; color:var(--dim); font-size:16px; flex:none}
.card p{margin:11px 0 0; color:var(--dim); font-size:13.5px; line-height:1.5}
.chip{
  display:inline-block; margin-top:11px; font-size:11.5px; font-weight:700;
  padding:4px 10px; border-radius:99px; border:1px solid;
}
.chip.ok  {color:var(--ok);     border-color:rgba(62,207,142,.38); background:rgba(62,207,142,.1)}
.chip.warn{color:var(--warn);   border-color:rgba(255,176,32,.38); background:rgba(255,176,32,.1)}
.chip.info{color:var(--accent); border-color:rgba(111,140,255,.38); background:rgba(111,140,255,.1)}

/* ── 꼬리 ── */
.wide{
  width:100%; margin-top:4px; padding:13px; cursor:pointer;
  background:var(--card); border:1px solid var(--line); border-radius:13px;
  color:var(--ink); font:600 14px/1.4 inherit;
}
.wide:active{transform:scale(.99)}
.wide small{display:block; color:var(--dim); font-weight:400; font-size:12px; margin-top:3px}
.foot{
  margin-top:24px; padding-top:18px; border-top:1px solid var(--line);
  color:var(--dim); font-size:12.5px; line-height:1.6;
}
.foot b{color:var(--ink); font-weight:700}
.foot code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px;
  background:#22252f; border:1px solid var(--line); border-radius:6px; padding:1px 6px;
}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="mark" id="mark"></div>
    <h1>PLOT 제작</h1>
  </div>
  <p class="sub" id="sub">캐러셀은 여기서 바로 완성하고, 숏폼은 양식을 써서 제작 대기열에 겁니다.</p>

  <a class="card" href="carousel.html">
    <div class="top">
      <div class="ico">🖼</div>
      <h2>캐러셀 스튜디오</h2>
      <span class="arrow">›</span>
    </div>
    <p>제목·본문·사진을 넣으면 화면에서 바로 슬라이드가 만들어집니다. 봇과 똑같은 렌더 규칙이라 결과가 어긋나지 않습니다.</p>
    <span class="chip" id="cChip"></span>
  </a>

  <a class="card" href="shorts.html">
    <div class="top">
      <div class="ico">🎬</div>
      <h2>숏폼 양식</h2>
      <span class="arrow">›</span>
    </div>
    <p>곡·아티스트·구간을 채우면 글자 배치가 바로 보입니다. 다 쓰면 제작 대기열로 넘어가고, 완성되는 대로 하나씩 도착합니다.</p>
    <span class="chip" id="sChip"></span>
  </a>

  <button class="wide" id="openWide" hidden>🖥 브라우저에서 열기</button>
  <button class="wide" id="install" hidden></button>
  <div class="foot" id="foot"></div>
</div>

  const sChip = document.getElementById('sChip');

  if (inTG) {

  } else {
    cChip.className = 'chip ok';
    cChip.textContent = '바로 만들고 저장까지';
    sChip.className = 'chip info';
    sChip.textContent = '제작까지 가려면 텔레그램에서 여세요';

      '<b>📝 숏폼 양식</b> 버튼으로 열면 쓴 내용이 곧장 제작 대기열로 넘어갑니다.';
    setupInstall();
  }

  /* ── 앱으로 설치 ────────────────────────────────────────────────
   * 크롬 계열은 beforeinstallprompt 를 주므로 버튼 한 번이면 끝난다.
   * 사파리는 그 이벤트가 없어서 '공유 → 홈 화면에 추가' 를 글로 알려준다.
   * 이미 설치해서 자체 창으로 열었으면 아무것도 보여주지 않는다. */
  function setupInstall() {
    const btn = document.getElementById('install');
    const standalone = window.matchMedia('(display-mode: standalone)').matches ||
                       window.navigator.standalone === true;
    if (standalone) return;

    let prompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); prompt = e;
      btn.hidden = false;
      btn.innerHTML = '📲 앱으로 설치' +
        '<small>독·홈 화면에 아이콘이 생기고 자체 창으로 열립니다.</small>';
      btn.onclick = async () => {
        btn.disabled = true;
        try { await prompt.prompt(); } catch (_) {}
        prompt = null; btn.hidden = true;
      };
    });

    const ua = navigator.userAgent;
    const iOS = /iPad|iPhone|iPod/.test(ua);
    const safari = iOS && !/CriOS|FxiOS|EdgiOS/.test(ua);
    if (safari) {
      btn.hidden = false;
      btn.disabled = true;
      btn.style.cursor = 'default';
      btn.innerHTML = '📲 앱으로 설치하려면' +
        '<small>아래 공유 버튼 → <b>홈 화면에 추가</b></small>';
    }
  }
})();
</script>
</body>
</html>
