<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>타임라인 편집 — PLOT</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
@font-face{font-family:PlotNoto; src:url(f-nb.woff2) format('woff2'); font-weight:900; font-display:swap}
@font-face{font-family:PlotPre; src:url(f-eb.woff2) format('woff2'); font-weight:800; font-display:swap}
:root{--bg:#0A0A0C;--panel:#131318;--raise:#1B1B22;--line:#262631;--text:#ECECF1;--muted:#8A8A96;--dim:#5E5E6B;
  --amber:#E8B34A;--clip:#3B5B8C;--clipImg:#5B4A8C;--clipYt:#8C3B3B;--sel:#E8B34A;--ok:#6FBF8B;--bad:#E0786A;color-scheme:dark}
:root[data-theme="light"]{--bg:#FBFAF7;--panel:#F2F0EA;--raise:#E9E6DE;--line:#D6D2C8;--text:#1A1A1F;--muted:#5E5E6B;--dim:#8A8494;
  --amber:#7A6B10;--clip:#5D7FB3;--clipImg:#8070B3;--clipYt:#B35D5D;--sel:#B08A00;--ok:#2E7D51;--bad:#A63A2B;color-scheme:light}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#FBFAF7;--panel:#F2F0EA;--raise:#E9E6DE;--line:#D6D2C8;--text:#1A1A1F;
  --muted:#5E5E6B;--dim:#8A8494;--amber:#7A6B10;--clip:#5D7FB3;--clipImg:#8070B3;--clipYt:#B35D5D;--sel:#B08A00;--ok:#2E7D51;--bad:#A63A2B;color-scheme:light}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Pretendard,-apple-system,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.app{display:grid;grid-template-rows:auto 1fr minmax(210px,34vh);height:100vh}
/* 위 막대 */
.top{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.top h1{font-size:16px;margin:0 8px 0 0;letter-spacing:-.02em}
.top a{color:var(--muted);text-decoration:none;font-size:13px}
.top .sp{flex:1}
.tb{padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:var(--raise);font-size:13px;white-space:nowrap}
.tb.primary{background:var(--amber);border-color:var(--amber);color:#111;font-weight:700}
.tb:disabled{opacity:.45;cursor:default}
/* 가운데: 미리보기 + 속성 */
.mid{display:grid;grid-template-columns:1fr 360px;min-height:0}
.pvWrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:12px;gap:8px}
.stage{position:relative;aspect-ratio:9/16;height:100%;max-height:100%;background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.stage .media{position:absolute;inset:0;opacity:0;pointer-events:none}
.stage .media video,.stage .media img,.stage .media .yt,.stage .media iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.stage .media .bgblur{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(18px) brightness(.85)}
.stage .media.fit video,.stage .media.fit img{object-fit:contain}
.stage .media.fill video,.stage .media.fill img{object-fit:cover}
.stage .media.fill .yt iframe,.stage .media.fill iframe{width:316%;left:-108%}
.stage .empty[hidden]{display:none}
.stage .empty{z-index:40;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#888;font-size:13px;padding:20px}
.frame{position:absolute;top:0;left:0;width:1080px;height:1920px;transform-origin:0 0;pointer-events:none;z-index:50}
.frame .grad{position:absolute;left:0;right:0;bottom:0;height:820px;background:linear-gradient(to bottom,rgba(0,0,0,0) 0%,rgba(0,0,0,.961) 100%)}
.frame .logo{position:absolute;left:456px;top:38px;width:168px;height:104px;background-size:contain;background-repeat:no-repeat;opacity:.6}
.frame .catBar{position:absolute;left:59px;top:261px;width:8.55px;height:57.6px;background:#fff}
.frame .cat{position:absolute;left:80px;bottom:1604px;line-height:1;font-family:PlotNoto,'Noto Sans KR',sans-serif;font-weight:900;font-size:58.05px;letter-spacing:-3.825px;color:#fff;white-space:nowrap}
.frame .line{position:absolute;left:96px;font-family:PlotNoto,'Noto Sans KR',sans-serif;font-weight:900;color:#fff;white-space:nowrap;line-height:1;font-size:85.14px;letter-spacing:-5.61px;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.frame .hook{bottom:578px}.frame .artist{bottom:483px}.frame .title{bottom:388px}
.frame .suffix{font-size:36.12px;letter-spacing:-2.38px;margin-left:10px}
.frame .src{position:absolute;right:51px;bottom:38px;font-family:PlotPre,Pretendard,sans-serif;font-weight:800;font-size:32px;line-height:1;color:#606060;white-space:nowrap}
.transport{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.transport button{width:36px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--raise)}
.transport .tc{font:600 14px ui-monospace,Menlo,monospace;min-width:150px;text-align:center}
.pvNote{font-size:12px;color:var(--dim);max-width:460px;text-align:center}
.side{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 14px 30px}
.side h3{font-size:13px;margin:14px 0 6px;color:var(--muted);font-weight:700;letter-spacing:-.01em}
.side h3:first-child{margin-top:0}
.side label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
.side input[type=text]{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:none;font-size:12.5px}
.chip.on{background:var(--amber);border-color:var(--amber);color:#111;font-weight:700}
.kv{font-size:12.5px;color:var(--muted)}
.kv b{color:var(--text);font-weight:600}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btns button{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--raise);font-size:12.5px}
.btns .danger{color:var(--bad)}
.err{color:var(--bad);font-size:12.5px;margin-top:6px}
.keys{font-size:11.5px;color:var(--dim);line-height:1.7;margin-top:16px}
.keys kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--raise);color:var(--text)}
/* 아래: 타임라인 */
.tl{border-top:1px solid var(--line);display:grid;grid-template-columns:86px 1fr;min-height:0;background:var(--panel);user-select:none}
.tl .heads{border-right:1px solid var(--line);padding-top:30px}
.tl .heads div{height:56px;display:flex;align-items:center;padding:0 10px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.tl .heads div.v{height:84px}
.tl .scroll{overflow-x:auto;overflow-y:hidden;position:relative}
.tl .inner{position:relative;height:100%;min-width:100%}
.ruler{position:relative;height:30px;border-bottom:1px solid var(--line);cursor:ew-resize}
.ruler .tk{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.ruler .tk span{position:absolute;left:3px;top:6px;font:10.5px ui-monospace,Menlo,monospace;color:var(--dim)}
.ruler .tk.minor{top:20px}
.track{position:relative;height:56px;border-bottom:1px solid var(--line)}
.track.v{height:84px}
.clip{position:absolute;top:8px;bottom:8px;border-radius:7px;background:var(--clip);overflow:hidden;cursor:grab;border:2px solid transparent;
  background-size:auto 100%;background-repeat:repeat-x;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.clip.img{background-color:var(--clipImg)}.clip.yt{background-color:var(--clipYt)}
.clip.sel{border-color:var(--sel)}
.clip.drag{opacity:.55;cursor:grabbing;z-index:5}
.clip .lab{position:absolute;left:10px;right:10px;bottom:4px;font-size:11.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.clip .h{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;background:rgba(255,255,255,.18)}
.clip .h.l{left:0;border-radius:5px 0 0 5px}.clip .h.r{right:0;border-radius:0 5px 5px 0}
.clip .h:hover{background:var(--sel)}
.xf{position:absolute;top:30px;height:16px;transform:translateX(-50%);font-size:10px;padding:0 5px;border-radius:999px;background:var(--amber);color:#111;font-weight:700;z-index:4;white-space:nowrap;cursor:pointer}
.tbar{position:absolute;top:10px;bottom:10px;border-radius:6px;background:rgba(232,179,74,.22);border:1px solid rgba(232,179,74,.55);font-size:11.5px;padding:0 8px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tbar.base{top:4px;bottom:auto;height:18px;font-size:10.5px;background:rgba(127,127,127,.12);border-color:var(--line);color:var(--muted)}
.tbar.meta{top:25px;bottom:5px;cursor:grab;padding:0 12px}
.tbar.meta span{overflow:hidden;text-overflow:ellipsis}
.tbar .h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;background:rgba(232,179,74,.5)}
.tbar .h.l{left:0}.tbar .h.r{right:0}
.xf.on{outline:2px solid var(--text)}
.drop{position:absolute;top:4px;bottom:4px;width:3px;background:var(--sel);border-radius:2px;z-index:6;display:none}
.ph{position:absolute;top:0;bottom:0;width:0;border-left:2px solid #ff4d4d;z-index:8;pointer-events:none}
.ph::before{content:'';position:absolute;top:0;left:-7px;border:6px solid transparent;border-top:9px solid #ff4d4d}
.zoom{position:absolute;right:10px;top:4px;display:flex;gap:4px;z-index:9}
.zoom button{width:24px;height:22px;border:1px solid var(--line);border-radius:6px;background:var(--raise);font-size:13px;line-height:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:flex;align-items:center;justify-content:center}
.sheet .pn{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(640px,92vw);max-height:80vh;overflow:auto;padding:16px}
.sheet pre{white-space:pre-wrap;font:12.5px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);padding:10px;border-radius:8px;border:1px solid var(--line)}
@media (max-width:900px){.mid{grid-template-columns:1fr}.side{display:none}.app{grid-template-rows:auto 1fr minmax(200px,38vh)}}
</style>

<style id="plotTheme">

   세 화면이 이름만 다를 뿐 같은 자리라 한 군데서 올린다. */

  --bad:#E0786A }
@media (prefers-color-scheme: dark){
  html:root:not([data-theme="light"]){ --dim:#82828F; --faint:#82828F;
    --skip:#82828F; --bad:#E0786A }
}
html:root[data-accent="amber"]{ --accent:#E8B34A; --amber:#E8B34A }
html:root[data-accent="blue"]{ --accent:#5B8DEF; --amber:#5B8DEF }

html:root[data-accent="neon"]{ --accent:#00F0FF; --amber:#00F0FF }

html:root .plotThemeBox .sw[data-accent="blue"]{ background:#5B8DEF; color:#5B8DEF }
html:root .plotThemeBox .sw[data-accent="green"]{ background:#4FB477; color:#4FB477 }
html:root .plotThemeBox .sw[data-accent="violet"]{ background:#8B7CF0; color:#8B7CF0 }
html:root .plotThemeBox .sw[data-accent="mono"]{ background:#ECECF1; color:#ECECF1 }

html:root[data-theme="light"]{

  --line:#DAD6CB; --text:#1A1A1E; --ink:#1A1A1E;
  --muted:#57544D; --dim:#6B6760; --faint:#6B6760; --skip:#6E6A78;
  --glass:rgba(246,244,239,.93); --bad:#A63A2B; --warn:#8A6B12; --danger:#A63A2B;
  color-scheme:light;
}
html:root[data-theme="light"][data-accent="amber"]{ --accent:#7A6B10; --amber:#7A6B10 }
html:root[data-theme="light"][data-accent="blue"]{ --accent:#2B5BC4; --amber:#2B5BC4 }
html:root[data-theme="light"][data-accent="green"]{ --accent:#216E45; --amber:#216E45 }
html:root[data-theme="light"][data-accent="violet"]{ --accent:#5240B8; --amber:#5240B8 }
html:root[data-theme="light"][data-accent="mono"]{ --accent:#1A1A1E; --amber:#1A1A1E }
html:root[data-theme="light"][data-accent="neon"]{ --accent:#B5008C; --amber:#B5008C }
html:root[data-theme="light"] input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]),
html:root[data-theme="light"] textarea,
html:root[data-theme="light"] select{
  background:var(--panel)!important; color:var(--text)!important;
  -webkit-text-fill-color:var(--text)!important;
}
html:root[data-theme="light"] input:focus, html:root[data-theme="light"] textarea:focus{ background:var(--bg)!important }
html:root[data-theme="light"] ::placeholder{ color:var(--dim)!important; opacity:1 }
html:root[data-theme="light"] .err{ background:#FBEFEF!important; border-color:#E2BDBD!important;
  color:#8A2F2F!important }
html:root[data-theme="light"] .send{ color:var(--bg)!important }
html:root[data-theme="light"] .plotThemeBox .sw[data-accent="amber"]{ background:#7A6B10; color:#7A6B10 }
html:root[data-theme="light"] .plotThemeBox .sw[data-accent="blue"]{ background:#2B5BC4; color:#2B5BC4 }
html:root[data-theme="light"] .plotThemeBox .sw[data-accent="green"]{ background:#216E45; color:#216E45 }
html:root[data-theme="light"] .plotThemeBox .sw[data-accent="violet"]{ background:#5240B8; color:#5240B8 }
html:root[data-theme="light"] .plotThemeBox .sw[data-accent="mono"]{ background:#1A1A1E; color:#1A1A1E }
html:root[data-theme="light"] .plotThemeBox .sw[data-accent="neon"]{ background:linear-gradient(135deg,#00F0FF 0%,#FF2BD6 45%,#B6FF3B 100%); color:#B5008C }
@media (prefers-color-scheme: light){
html:root:not([data-theme="dark"]){
  --bg:#FBFAF7; --panel:#F2F0EA; --raise:#E9E6DE; --panel-2:#E9E6DE;
  --line:#DAD6CB; --text:#1A1A1E; --ink:#1A1A1E;
  --muted:#57544D; --dim:#6B6760; --faint:#6B6760; --skip:#6E6A78;
  --glass:rgba(246,244,239,.93); --bad:#A63A2B; --warn:#8A6B12; --danger:#A63A2B;
  color-scheme:light;
}
html:root:not([data-theme="dark"])[data-accent="amber"]{ --accent:#7A6B10; --amber:#7A6B10 }
html:root:not([data-theme="dark"])[data-accent="blue"]{ --accent:#2B5BC4; --amber:#2B5BC4 }
html:root:not([data-theme="dark"])[data-accent="green"]{ --accent:#216E45; --amber:#216E45 }
html:root:not([data-theme="dark"])[data-accent="violet"]{ --accent:#5240B8; --amber:#5240B8 }
html:root:not([data-theme="dark"])[data-accent="mono"]{ --accent:#1A1A1E; --amber:#1A1A1E }
html:root:not([data-theme="dark"])[data-accent="neon"]{ --accent:#B5008C; --amber:#B5008C }
html:root:not([data-theme="dark"]) input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]),
html:root:not([data-theme="dark"]) textarea,
html:root:not([data-theme="dark"]) select{
  background:var(--panel)!important; color:var(--text)!important;
  -webkit-text-fill-color:var(--text)!important;
}
html:root:not([data-theme="dark"]) input:focus, html:root:not([data-theme="dark"]) textarea:focus{ background:var(--bg)!important }
html:root:not([data-theme="dark"]) ::placeholder{ color:var(--dim)!important; opacity:1 }
html:root:not([data-theme="dark"]) .err{ background:#FBEFEF!important; border-color:#E2BDBD!important;
  color:#8A2F2F!important }
html:root:not([data-theme="dark"]) .send{ color:var(--bg)!important }
html:root:not([data-theme="dark"]) .plotThemeBox .sw[data-accent="amber"]{ background:#7A6B10; color:#7A6B10 }
html:root:not([data-theme="dark"]) .plotThemeBox .sw[data-accent="blue"]{ background:#2B5BC4; color:#2B5BC4 }
html:root:not([data-theme="dark"]) .plotThemeBox .sw[data-accent="green"]{ background:#216E45; color:#216E45 }
html:root:not([data-theme="dark"]) .plotThemeBox .sw[data-accent="violet"]{ background:#5240B8; color:#5240B8 }
html:root:not([data-theme="dark"]) .plotThemeBox .sw[data-accent="mono"]{ background:#1A1A1E; color:#1A1A1E }
html:root:not([data-theme="dark"]) .plotThemeBox .sw[data-accent="neon"]{ background:linear-gradient(135deg,#00F0FF 0%,#FF2BD6 45%,#B6FF3B 100%); color:#B5008C }
}
/* 네온 — 바탕째 갈아 끼우므로 밝은 한 벌보다 뒤에 온다 */
html:root[data-theme="dark"][data-accent="neon"]{
  --bg:#06040F; --panel:#0E0A1C; --raise:#161029; --panel-2:#161029;
  --line:#2B1D52; --hair:#14102A; --text:#EAE6FF; --ink:#EAE6FF;
  --muted:#B9AEE8; --dim:#8E85C9; --faint:#8E85C9; --skip:#8E85C9;
  --bad:#FF5C8A; --warn:#FFD166; --danger:#FF5C8A;
  --glass:rgba(10,7,22,.93); --pick:#3DFFA8;
  color-scheme:dark;
}
html:root[data-theme="dark"][data-accent="neon"] .chip.on, html:root[data-theme="dark"][data-accent="neon"] .btn.primary, html:root[data-theme="dark"][data-accent="neon"] .grp button[aria-selected="true"],
html:root[data-theme="dark"][data-accent="neon"] .tab[aria-selected="true"], html:root[data-theme="dark"][data-accent="neon"] .pcard .pbtn:hover,
html:root[data-theme="dark"][data-accent="neon"] .plotThemeBox button.on{ box-shadow:0 0 10px rgba(0,240,255,.35) }
html:root[data-theme="dark"][data-accent="neon"] .plotThemeBox .sw.on{ box-shadow:0 0 0 2px var(--bg), 0 0 0 4px currentColor,
  0 0 12px rgba(0,240,255,.5) }
html:root[data-theme="dark"][data-accent="neon"] header, html:root[data-theme="dark"][data-accent="neon"] .bar{ border-color:var(--line) }
html:root[data-theme="dark"][data-accent="neon"][data-neon="cyan"]{ --accent:#00F0FF; --amber:#00F0FF; --neonrgb:0,240,255 }
html:root[data-theme="dark"][data-accent="neon"][data-neon="magenta"]{ --accent:#FF2BD6; --amber:#FF2BD6; --neonrgb:255,43,214 }
html:root[data-theme="dark"][data-accent="neon"][data-neon="lime"]{ --accent:#B6FF3B; --amber:#B6FF3B; --neonrgb:182,255,59 }
html:root[data-theme="dark"][data-accent="neon"][data-neon="orange"]{ --accent:#FF9F43; --amber:#FF9F43; --neonrgb:255,159,67 }
html:root[data-theme="dark"][data-accent="neon"][data-neon="violet"]{ --accent:#B08CFF; --amber:#B08CFF; --neonrgb:176,140,255 }
html:root[data-theme="dark"][data-accent="neon"] body{
  background-image:
    radial-gradient(120% 60% at 50% -10%, rgba(var(--neonrgb,0,240,255),.16), transparent 60%),
    linear-gradient(rgba(var(--neonrgb,0,240,255),.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(var(--neonrgb,0,240,255),.055) 1px, transparent 1px);
  background-size:100% 420px, 36px 36px, 36px 36px;

<script>
'use strict';
/* PLOT 숏폼 타임라인 편집 (2026-10-18 규효 "프리미어처럼 영상 편집 위주로, 타임라인으로")
 * 첫 판: 클립 넣기·자르기(양끝 끌기·재생헤드에서 자르기)·순서 바꾸기(끌어 옮기기) · 이어 붙인 결과 미리보기 재생 · 글자 레이어 트랙.
 * 결과는 지금 숏폼 양식 그대로 나간다 — 첫 클립이 URL·구간, 나머지는 「이어붙이기」, 사이는 「전환」.
 * 맥은 scripts/studio_upload.fetch_join 으로 조각마다 세로로 맞추고 전환으로 잇는다. */
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS = ['New release!', 'Issue', '오늘의 노래', 'Feature', 'Daily', 'Interview', 'Live clip'];
const TR_KIND = [['디졸브', '디졸브'], ['블랙', '블랙 디졸브'], ['컷', '컷']];
const TR_DUR = [['0.3', '빠르게'], ['0.5', '보통'], ['0.8', '느리게']];
const IMG_DEF = 4, MIN_LEN = 0.3, IMG_MAX = 60;
const SAVE = 'plot.timeline.seq', IN_KEY = 'plot.timeline.in', HANDOFF = 'plot.form.handoff';

let S = { clips: [], trans: { k: '디졸브', d: '0.5' }, gaps: {}, metaT: null,
          text: { cat: 'New release!', custom: '', title: '', artist: '', feat: '', hook: '', source: '' } };
let ctx = null;            // 숏폼 양식에서 넘어왔으면 {idx, texts}
let sel = null, selGap = null, t = 0, playing = false, pps = 60, seq = 0;
const META_DEF = 6, CUT_T = 1 / 30;
let hist = [], fut = [];

/* ── 시간 ── */
function fmt(v) {
  v = Math.max(0, v || 0);
  const m = Math.floor(v / 60), s = v - m * 60;
  return m + ':' + (s < 10 ? '0' : '') + s.toFixed(2);
}
function fmtF(v) {                 // 양식용 — 0:03.50 → 0:03.5, 0:04.00 → 0:04
  v = Math.max(0, Math.round((v || 0) * 100) / 100);
  const m = Math.floor(v / 60), s = v - m * 60;
  let ss = s.toFixed(2).replace(/\.?0+$/, '');
  if (Number(ss) < 10) ss = '0' + ss;
  return m + ':' + ss;
}
function toSec(x) {
  x = String(x || '').trim(); if (!x) return null;
  const p = x.split(':').map(Number);
  if (p.some(isNaN)) return null;
  return p.reduce((a, b) => a * 60 + b, 0);
}
const ytId = (u) => { const m = /(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|live\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/.exec(String(u || '')); return m ? m[1] : null; };
const UP_RX = /^https:\/\/res\.cloudinary\.com\/[^/]+\/(image|video|raw)\/upload\//i;
function kindOf(u) {
  if (ytId(u)) return 'yt';
  const m = UP_RX.exec(u);
  if (m) return m[1].toLowerCase() === 'image' ? 'image' : 'video';
  return /\.(jpe?g|png|webp|gif|avif|heic)(\?|$)/i.test(u) ? 'image' : 'video';
}

/* ── 순서·자리 계산 (맥의 xfade_cmd 와 같은 셈) ── */
const len = (c) => Math.max(MIN_LEN, c.out - c.in);
/* 이음새 i (클립 i-1 → i) 의 전환 — 따로 정한 게 없으면 기본(S.trans). 겹치는 길이는 맥의 gap_times 와 같은 셈 */
function gapOf(i) { const c = S.clips[i]; return (c && S.gaps && S.gaps[c.id]) || S.trans; }
function gapT(i) {
  const g = gapOf(i), a = S.clips[i - 1], b = S.clips[i];
  const want = g.k === '컷' ? CUT_T : (Number(g.d) || 0.5);
  return Math.max(CUT_T, Math.min(want, len(a) / 2, len(b) / 2));
}
function layout() {
  const st = [], T = [0];
  let acc = 0;
  S.clips.forEach((c, i) => { if (i) T.push(gapT(i)); st.push(i ? acc - T[i] : 0); acc = st[i] + len(c); });
  return { st: st, total: S.clips.length ? acc : 0, T: T };
}
/* 1~3줄이 나오는 때 — 정하지 않으면 맥 기본(처음 6초, 마지막 1초는 들어올 때를 거꾸로 하며 빠짐) */
function metaWin(total) {
  const m = S.metaT;
  if (!m) return { s: 0, e: Math.min(META_DEF, total), def: true };
  const s0 = Math.max(0, Math.min(m.s, Math.max(0, total - 0.5)));
  return { s: s0, e: m.e == null ? total : Math.max(s0 + 0.5, Math.min(m.e, total)), def: false, toEnd: m.e == null };
}

/* ── 되돌리기 ── */
function snap() { hist.push(JSON.stringify(S)); if (hist.length > 60) hist.shift(); fut = []; }
function undo() { if (!hist.length) return; fut.push(JSON.stringify(S)); S = JSON.parse(hist.pop()); afterLoad(); toast('되돌렸습니다'); }
function redo() { if (!fut.length) return; hist.push(JSON.stringify(S)); S = JSON.parse(fut.pop()); afterLoad(); toast('다시 했습니다'); }
function save() { try { localStorage.setItem(SAVE, JSON.stringify({ S: S, ctx: ctx, at: Date.now() })); } catch (_) {} }

/* ── 클립 넣기 ── */
function newClip(url, kind, name, srcDur) {
  const c = { id: 'c' + (++seq) + Date.now().toString(36), url: url, kind: kind, name: name || '', srcDur: srcDur || null, in: 0, out: 0 };
  c.out = kind === 'image' ? IMG_DEF : (srcDur || 10);
  return c;
}
function addClip(c, at) {

        '<div class="btns"><button data-a="metaHere">재생헤드에서 시작</button><button data-a="metaEnd">끝까지</button>' + (S.metaT ? '<button data-a="metaDef">기본(처음 6초)</button>' : '') + '</div>' +
        '<div class="kv" style="margin-top:6px">' + (mw.def ? '기본: 처음 6초 동안 나오고, 마지막 1초는 들어올 때 움직임을 거꾸로 하며 빠집니다.' : '정한 때에 들어와서, 끝나기 전 1초 동안 거꾸로 빠집니다.') +
        ' 카테고리·로고·출처는 처음부터 끝까지 나옵니다. 글자 트랙의 막대를 끌어도 됩니다.</div>';
    })();
  const er = problems();
  if (er.length) h += '<div class="err">' + er.map(esc).join('<br>') + '</div>';
  h += '<div class="keys"><kbd>Space</kbd> 재생·멈춤 · <kbd>←</kbd><kbd>→</kbd> 한 프레임 (<kbd>Shift</kbd> 1초) · <kbd>S</kbd>·<kbd>⌘K</kbd> 자르기 · <kbd>⌫</kbd> 빼기 · <kbd>⌘D</kbd> 복제 · <kbd>⌘Z</kbd> 되돌리기 · <kbd>+</kbd><kbd>−</kbd> 확대·축소 · <kbd>\\</kbd> 맞추기<br>' +
    '클립 가운데를 끌면 순서가 바뀌고, 양끝을 끌면 길이가 바뀝니다. 눈금자를 끌면 재생헤드가 움직입니다.</div>';
  side.innerHTML = h;
}
function problems() {
  const e = [], tx = S.text;
  if (!S.clips.length) e.push('클립을 하나 이상 넣어 주세요.');
  if (!(tx.title || '').trim()) e.push('3줄(맨 아래)은 필수입니다.');
  if (!(tx.source || '').trim()) e.push('출처는 필수입니다.');
  if (!((tx.cat === '__custom__' ? tx.custom : tx.cat) || '').trim()) e.push('카테고리를 정해 주세요.');
  return e;
}

/* ── 손으로 고치기 ── */
function selClip() { return S.clips.find(x => x.id === sel); }
function clampClip(c) {
  if (c.kind === 'image') { c.in = 0; c.out = Math.max(MIN_LEN, Math.min(IMG_MAX, c.out)); return; }
  const max = c.srcDur || Infinity;
  c.in = Math.max(0, Math.min(c.in, max - MIN_LEN));
  c.out = Math.max(c.in + MIN_LEN, Math.min(c.out, max));
}
function clipAt(time) {
  const L = layout();
  for (let i = S.clips.length - 1; i >= 0; i--) if (time >= L.st[i] && time < L.st[i] + len(S.clips[i])) return i;
  return -1;
}
function split() {
  const L = layout();
  let i = sel ? S.clips.findIndex(x => x.id === sel) : -1;
  if (i < 0 || t < L.st[i] || t > L.st[i] + len(S.clips[i])) i = clipAt(t);
  if (i < 0) { toast('재생헤드 아래에 클립이 없습니다'); return; }
  const c = S.clips[i], loc = t - L.st[i];
  if (loc < MIN_LEN || len(c) - loc < MIN_LEN) { toast('클립 끝에 너무 가깝습니다'); return; }
  snap();
  const b = JSON.parse(JSON.stringify(c)); b.id = 'c' + (++seq) + Date.now().toString(36);
  if (c.kind === 'image') { c.out = loc; b.out = len(b) - loc; b.in = 0; }
  else { c.out = c.in + loc; b.in = c.out; }
  S.clips.splice(i + 1, 0, b); sel = b.id; afterLoad(); toast('잘랐습니다');
}
function dup() { const c = selClip(); if (!c) return; const b = JSON.parse(JSON.stringify(c)); b.id = 'c' + (++seq) + Date.now().toString(36); addClip(b, S.clips.indexOf(c) + 1); }
function del() { const c = selClip(); if (!c) return; snap(); S.clips.splice(S.clips.indexOf(c), 1); if (S.gaps) delete S.gaps[c.id]; sel = null; afterLoad(); }
function move(d) { const c = selClip(); if (!c) return; const i = S.clips.indexOf(c), j = i + d; if (j < 0 || j >= S.clips.length) return; snap(); S.clips.splice(i, 1); S.clips.splice(j, 0, c); afterLoad(); }
function afterLoad() {
  gcMedia();
  const tot = layout().total; if (t > tot) t = tot;
  renderTl(); renderSide(); paintFrame(); save();
}

/* 타임라인 끌기: 눈금자=재생헤드 · 양끝=자르기 · 가운데=순서 */
function bindTl() {
  const inner = $('#inner'), ru = $('#ruler');
  const tAt = (ev) => Math.max(0, (ev.clientX - inner.getBoundingClientRect().left) / pps);
  ru.addEventListener('pointerdown', (ev) => {
    ru.setPointerCapture(ev.pointerId); setPlay(false); t = Math.min(tAt(ev), layout().total);
    const mv = (e) => { t = Math.min(tAt(e), layout().total); };
    const up = () => { ru.removeEventListener('pointermove', mv); ru.removeEventListener('pointerup', up); };
    ru.addEventListener('pointermove', mv); ru.addEventListener('pointerup', up);
  });
  $('#trV').addEventListener('pointerdown', (ev) => {
    const cd = ev.target.closest('.clip');
    const xb = ev.target.closest('.xf');
    if (xb) { sel = null; selGap = xb.dataset.xf; renderTl(); renderSide(); return; }
    selGap = null;
    if (!cd) { sel = null; renderTl(); renderSide(); return; }
    const c = S.clips.find(x => x.id === cd.dataset.id); if (!c) return;
    sel = c.id; setPlay(false);
    const hd = ev.target.dataset.h, x0 = ev.clientX, in0 = c.in, out0 = c.out, before = JSON.stringify(S);
    let moved = false;
    const drop = $('#drop');
    const mv = (e) => {
      const ds = (e.clientX - x0) / pps;
      if (Math.abs(e.clientX - x0) > 3) moved = true;
      if (!moved) return;
      const L = layout(), i = S.clips.indexOf(c);
      if (hd === 'l') {
        if (c.kind === 'image') { c.out = out0 - ds; } else { c.in = in0 + ds; }
        clampClip(c); t = L.st[i]; renderTl();
      } else if (hd === 'r') {
        c.out = out0 + ds; clampClip(c); t = L.st[i] + len(c) - 0.001; renderTl();
      } else {
        const live = $('#trV .clip[data-id="' + c.id + '"]') || cd;
        live.classList.add('drag'); live.style.transform = 'translateX(' + (e.clientX - x0) + 'px)';
        const x = tAt(e); let k = S.clips.length;
        for (let j = 0; j < S.clips.length; j++) if (x < L.st[j] + len(S.clips[j]) / 2) { k = j; break; }
        drop.style.display = 'block'; drop.style.left = ((k < S.clips.length ? L.st[k] : L.total) * pps - 1) + 'px'; drop.dataset.k = k;
      }
    };
    const up = () => {
      window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up);
      drop.style.display = 'none';
      if (moved) {
        hist.push(before); if (hist.length > 60) hist.shift(); fut = [];
        if (!hd) {
          const i = S.clips.indexOf(c); let k = Number(drop.dataset.k);
          if (k !== i && k !== i + 1) { S.clips.splice(i, 1); if (k > i) k--; S.clips.splice(k, 0, c); }
        }
      }
      afterLoad();
    };
    // 끄는 동안 클립을 다시 그리므로(cd 가 사라진다) 창 전체에서 받는다
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
    ev.preventDefault();
    renderSide();
  });
  $('#trT').addEventListener('pointerdown', (ev) => {
    const bar = ev.target.closest('[data-meta]'); if (!bar) return;
    ev.preventDefault(); setPlay(false);
    const tot = layout().total, mw = metaWin(tot), hd = ev.target.dataset.mh, x0 = ev.clientX, before = JSON.stringify(S);
    const s0 = mw.s, e0 = mw.toEnd ? null : mw.e, span = mw.e - mw.s;
    let moved = false;
    const mv = (e) => {
      const ds = (e.clientX - x0) / pps; if (Math.abs(e.clientX - x0) > 3) moved = true; if (!moved) return;
      if (hd === 'l') S.metaT = { s: Math.max(0, Math.min(s0 + ds, (e0 == null ? tot : e0) - 0.5)), e: e0 };
      else if (hd === 'r') { const ne = Math.max(s0 + 0.5, (e0 == null ? tot : e0) + ds); S.metaT = { s: s0, e: ne >= tot - 0.02 ? null : ne }; }
      else { const ns = Math.max(0, Math.min(s0 + ds, tot - span)); S.metaT = { s: ns, e: e0 == null ? null : ns + span }; }
      t = S.metaT.s; renderTl();
    };
    const up = () => {
      window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up);
      if (moved) { hist.push(before); fut = []; } else { const i = $('#side [data-t=title]'); if (i) i.focus(); }
      afterLoad();
    };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
  });
  $('#scroll').addEventListener('wheel', (ev) => {
    if (!(ev.ctrlKey || ev.metaKey || ev.altKey)) return;
    ev.preventDefault(); zoom(ev.deltaY < 0 ? 1.25 : 0.8);
  }, { passive: false });
}
function zoom(f) { pps = Math.max(6, Math.min(400, pps * f)); renderTl(); followPh(); }
function zoomFit() { const tot = layout().total || 10; pps = Math.max(6, Math.min(400, ($('#scroll').clientWidth - 60) / tot)); renderTl(); }

/* 오른쪽 입력 */
function bindSide() {
  const side = $('#side');
  side.addEventListener('click', (ev) => {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.gk || b.dataset.gd) {
      snap(); const cur = gapOf(S.clips.findIndex(x => x.id === selGap));
      S.gaps[selGap] = { k: b.dataset.gk || cur.k, d: b.dataset.gd || cur.d }; afterLoad();
    }
    else if (b.dataset.a === 'gapReset') { snap(); delete S.gaps[selGap]; afterLoad(); }
    else if (b.dataset.a === 'gapAll') { snap(); S.trans = Object.assign({}, S.gaps[selGap]); S.gaps = {}; afterLoad(); }
    else if (b.dataset.a === 'metaHere') { snap(); const mw = metaWin(layout().total); S.metaT = { s: t, e: mw.toEnd ? null : Math.max(t + 0.5, t + (mw.e - mw.s)) }; afterLoad(); }
    else if (b.dataset.a === 'metaEnd') { snap(); S.metaT = { s: metaWin(layout().total).s, e: null }; afterLoad(); }
    else if (b.dataset.a === 'metaDef') { snap(); S.metaT = null; afterLoad(); }
    else if (b.dataset.tk) { snap(); S.trans.k = b.dataset.tk; afterLoad(); }
    else if (b.dataset.td) { snap(); S.trans.d = b.dataset.td; afterLoad(); }
    else if (b.dataset.cat != null) { S.text.cat = b.dataset.cat; afterLoad(); }
    else if (b.dataset.a === 'split') split();
    else if (b.dataset.a === 'dup') dup();
    else if (b.dataset.a === 'del') del();
    else if (b.dataset.a === 'left') move(-1);
    else if (b.dataset.a === 'right') move(1);
  });
  side.addEventListener('input', (ev) => {
    const k = ev.target.dataset.t; if (!k) return;
    S.text[k] = ev.target.value; paintFrame(); renderTl(); save();
  });
  side.addEventListener('change', (ev) => {
    const mk = ev.target.dataset.m;
    if (mk) {
      const v = ev.target.value.trim(), tot = layout().total, mw = metaWin(tot);
      snap();
      const cur = S.metaT || { s: mw.s, e: mw.e };
      if (mk === 's') { const x = toSec(v); if (x != null) cur.s = x; }
      else cur.e = /^끝/.test(v) ? null : (toSec(v) != null ? toSec(v) : cur.e);
      if (cur.e != null && cur.e <= cur.s) cur.e = cur.s + 0.5;
      S.metaT = cur; afterLoad(); return;
    }
    const k = ev.target.dataset.c, c = selClip(); if (!k || !c) return;
    const v = ev.target.value.trim();
    snap();
    if (k === 'len') { const n = Number(v); if (n > 0) c.out = n; }
    else { const s = toSec(v); if (s != null) c[k] = s; }
    clampClip(c); afterLoad();
  });
}

/* ── 양식 ── */
function rangeOf(c) { return c.kind === 'image' ? '0:00-' + fmtF(len(c)) : fmtF(c.in) + '-' + fmtF(c.out); }
function formText() {
  const tx = S.text, c0 = S.clips[0], rest = S.clips.slice(1);
  const cat = (tx.cat === '__custom__' ? tx.custom : tx.cat).trim();
  return ['[영상]', '카테고리: ' + cat, 'URL: ' + (c0 ? c0.url : ''), '구간: ' + (c0 ? rangeOf(c0) : ''),
    '곡: ' + (tx.title || '').trim(), '아티스트: ' + (tx.artist || '').trim(), '피처링: ' + (tx.feat || '').trim(),
    '후킹: ' + (tx.hook || '').trim(), '출처: ' + String(tx.source || '').trim().replace(/^출처\s*:\s*/, ''), '리프레임: 자동',
    ...(rest.length ? ['이어붙이기: ' + rest.map(c => c.url + ' ' + rangeOf(c)).join(' | '), '전환: ' + transLine()] : []),
    ...(S.metaT ? ['글자시간: ' + fmtF(metaWin(layout().total).s) + '-' + (S.metaT.e == null ? '끝' : fmtF(metaWin(layout().total).e))] : [])].join('\n');
}
function transLine() {
  const one = (g) => g.k === '컷' ? '컷' : g.k + ' ' + g.d;
  const list = S.clips.slice(1).map((_, j) => one(gapOf(j + 1)));
  return list.every(x => x === list[0]) ? list[0] : list.join(' | ');
}
function ready() { const e = problems(); if (e.length) { toast(e[0]); renderSide(); return false; } return true; }
function studioOn() { return !!(window.plotStudio && window.plotStudio.on && window.plotStudio.on()); }
function make(ovl) {
  if (!ready()) return;
  setPlay(false);
  toast((ovl ? '🧾 정보 레이어를' : '🎬 이 편을') + ' 맥으로 보냅니다…', true);
  plotStudio.send('shorts', ovl ? { text: formText(), overlay: 1 } : { text: formText() }).then((sn) => toast('✓ ' + (sn.note || '대기열에 넣었습니다')))
    .catch((e) => toast('못 보냈습니다 — ' + String(e && e.message || e).slice(0, 90)));
}
function toShorts() {
  if (!S.clips.length) return;
  const mine = formText();
  const texts = ctx && Array.isArray(ctx.texts) ? ctx.texts.slice() : [];
  if (ctx && ctx.idx >= 0 && ctx.idx < texts.length) texts[ctx.idx] = mine; else texts.push(mine);
  try { localStorage.setItem(HANDOFF, texts.join('\n\n')); } catch (_) { toast('저장소를 쓸 수 없어 넘길 수 없습니다'); return; }
  location.href = 'shorts.html';
}
function showForm() {
  const sh = document.createElement('div'); sh.className = 'sheet';
  sh.innerHTML = '<div class="pn"><b>맥으로 보낼 양식</b><pre></pre><div class="btns"><button data-x="c">복사</button><button data-x="q">닫기</button></div></div>';
  $('pre', sh).textContent = formText();
  sh.addEventListener('click', (e) => {
    const b = e.target.closest('[data-x]');
    if (e.target === sh || (b && b.dataset.x === 'q')) sh.remove();
    else if (b) { try { navigator.clipboard.writeText(formText()); b.textContent = '✓ 복사했습니다'; } catch (_) {} }
  });
  document.body.append(sh);
}

/* ── 들어오기: 숏폼 양식의 한 편 · 지난번 작업 ── */
function fromBlock(b) {
  const clips = [];
  if (b.url) {
    const k = kindOf(b.url), c = newClip(b.url, k, k === 'yt' ? '유튜브 ' + ytId(b.url) : b.url.split('/').pop().slice(0, 30));
    const s = toSec(b.start), e = toSec(b.end);
    if (s != null && e != null && e > s) { if (k === 'image') c.out = e - s; else { c.in = s; c.out = e; } }
    clips.push(c);
  }
  String(b.joins || '').split('|').map(x => x.trim()).filter(Boolean).forEach(p => {
    const m = /^(https?:\/\/\S+)(?:\s+([\d:.]+)\s*-\s*([\d:.]+))?$/.exec(p); if (!m) return;
    const k = kindOf(m[1]), c = newClip(m[1], k, k === 'yt' ? '유튜브 ' + ytId(m[1]) : m[1].split('/').pop().slice(0, 30));
    const s = toSec(m[2]), e = toSec(m[3]);
    if (s != null && e != null && e > s) { if (k === 'image') c.out = e - s; else { c.in = s; c.out = e; } }
    clips.push(c);
  });
  const one = (x) => ({ k: /^블랙/.test(x) ? '블랙' : /^컷/.test(x) ? '컷' : '디졸브', d: (/(\d+(?:\.\d+)?)/.exec(x) || [, '0.5'])[1] });
  const trs = String(b.trans || '디졸브 0.5').split('|').map(x => x.trim()).filter(Boolean);
  const gaps = {};
  if (trs.length > 1) clips.slice(1).forEach((c, j) => { if (trs[j]) gaps[c.id] = one(trs[j]); });
  const mt = /^([\d:.]+)\s*-\s*([\d:.]+|끝|끝까지)$/.exec(String(b.metaTime || '').trim());
  S = { clips: clips, gaps: gaps,
        metaT: mt ? { s: toSec(mt[1]), e: /^끝/.test(mt[2]) ? null : toSec(mt[2]) } : null,
        trans: one(trs[0] || '디졸브 0.5'),
        text: { cat: b.cat || 'New release!', custom: b.custom || '', title: b.title || '', artist: b.artist || '', feat: b.feat || '', hook: b.hook || '', source: b.source || '' } };
}
function boot() {
  let inc = null;
  try { inc = JSON.parse(localStorage.getItem(IN_KEY) || 'null'); localStorage.removeItem(IN_KEY); } catch (_) {}
  if (inc && inc.block) { fromBlock(inc.block); ctx = { idx: inc.idx, texts: inc.texts || [] }; toast('숏폼 양식 ' + (inc.idx + 1) + '번 편을 열었습니다'); }
  else {
    try { const o = JSON.parse(localStorage.getItem(SAVE) || 'null'); if (o && o.S) { S = o.S; ctx = o.ctx || null; } } catch (_) {}
  }
  if (!S.trans) S.trans = { k: '디졸브', d: '0.5' };
  if (!S.gaps) S.gaps = {};
  if (S.metaT === undefined) S.metaT = null;
  if (studioOn()) { $('#makeBtn').hidden = false; $('#ovBtn').hidden = false; }
  $('#backLink').textContent = ctx ? '← 숏폼 양식 (' + (ctx.idx + 1) + '번 편)' : '← 숏폼 양식';
  $('#addFile').onclick = () => { if (!upOn()) { toast('파일 올리기가 연결되지 않았습니다'); return; } $('#fileIn').click(); };
  $('#fileIn').onchange = (e) => { const fs = Array.from(e.target.files || []); e.target.value = ''; addFiles(fs); };
  $('#addUrl').onclick = addUrl;
  $('#playBtn').onclick = () => setPlay(!playing);
  $('#toStart').onclick = () => { setPlay(false); t = 0; followPh(); };
  $('#makeBtn').onclick = () => make(false);
  $('#ovBtn').onclick = () => make(true);
  $('#toShorts').onclick = toShorts;
  $('#showForm').onclick = showForm;
  $('#zIn').onclick = () => zoom(1.4); $('#zOut').onclick = () => zoom(1 / 1.4); $('#zFit').onclick = zoomFit;
  // 파일을 화면에 끌어 놓아도 넣는다
  document.addEventListener('dragover', (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
  document.addEventListener('drop', (e) => { const fs = Array.from((e.dataTransfer && e.dataTransfer.files) || []); if (fs.length) { e.preventDefault(); addFiles(fs); } });
  document.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input,textarea')) return;
    const mod = e.metaKey || e.ctrlKey, step = e.shiftKey ? 1 : 1 / 30;
    if (e.code === 'Space') { e.preventDefault(); setPlay(!playing); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); setPlay(false); t = Math.min(layout().total, t + step); followPh(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); setPlay(false); t = Math.max(0, t - step); followPh(); }
    else if (e.key === 'Home') { setPlay(false); t = 0; followPh(); }
    else if (e.key === 'End') { setPlay(false); t = layout().total; followPh(); }
    else if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); split(); }
    else if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); dup(); }
    else if (!mod && e.key.toLowerCase() === 's') { split(); }
    else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); del(); }
    else if (e.key === '+' || e.key === '=') zoom(1.4);
    else if (e.key === '-') zoom(1 / 1.4);
    else if (e.key === '\\') zoomFit();
  });
  window.addEventListener('resize', () => { paintFrame(); renderTl(); });
  bindTl(); bindSide();
  afterLoad(); zoomFit();
  requestAnimationFrame(loop);
}
let toastT;
function toast(m, keep) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), keep ? 6000 : 2400); }
boot();
</script>

<script>
(function () {
  var TK = 'plot.app.theme', AK = 'plot.app.accent', NK = 'plot.app.neon',
      GK = 'plot.app.gap', FK = 'plot.app.fs';
  var GAPS = [['tight', '좁게'], ['normal', '보통'], ['wide', '넓게']];
  var FSIZES = [['s', '작게'], ['m', '보통'], ['l', '크게'], ['xl', '더 크게']];
  var HUES = ['cyan', 'magenta', 'lime', 'orange', 'violet'];
  var MODES = [['system', '기기'], ['light', '밝게'], ['dark', '어둡게']];
  var ACCENTS = [['amber', '#E8B34A'], ['blue', '#5B8DEF'], ['green', '#4FB477'],
                 ['violet', '#8B7CF0'], ['mono', '#ECECF1'], ['neon', '#00F0FF']];
  var box = null;

  function get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
  function set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
  function mode() { var t = get(TK, ''); return (t === 'light' || t === 'dark') ? t : 'system'; }
  function accent() { return get(AK, 'amber'); }
  function hue() { var h = get(NK, 'cyan'); return HUES.indexOf(h) < 0 ? 'cyan' : h; }
  function gap() { var g = get(GK, 'normal'); return /^(tight|normal|wide)$/.test(g) ? g : 'normal'; }
  function fsize() { var f = get(FK, 'm'); return /^(s|m|l|xl)$/.test(f) ? f : 'm'; }

  function apply() {
    var r = document.documentElement, m = mode();
    if (m === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', m);
    r.setAttribute('data-accent', accent());
    r.setAttribute('data-neon', hue());
    r.setAttribute('data-gap', gap());
    r.setAttribute('data-fs', fsize());
    var meta = document.querySelector('meta[name=theme-color]');
    if (meta) {
      var dark = m === 'dark' ||
        (m === 'system' && !matchMedia('(prefers-color-scheme: light)').matches);
      meta.setAttribute('content', dark ? '#0A0A0C' : '#FBFAF7');
    }
    if (box) paint();
  }

  function paint() {
    [].forEach.call(box.querySelectorAll('[data-mode]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-mode') === mode());
    });
    [].forEach.call(box.querySelectorAll('[data-accent]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-accent') === accent());
    });
    [].forEach.call(box.querySelectorAll('[data-hue]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-hue') === hue());
    });
    [].forEach.call(box.querySelectorAll('[data-gap]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-gap') === gap());
    });
    [].forEach.call(box.querySelectorAll('[data-fs]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-fs') === fsize());
    });
  }

  function close() {
    if (box) { box.remove(); box = null; document.removeEventListener('click', away); }
  }
  function away(e) {
    if (box && !box.contains(e.target) && !e.target.closest('.plotThemeBtn')) close();
  }

  function open(btn) {
    if (box) { close(); return; }
    box = document.createElement('div');
    box.className = 'plotThemeBox';
    box.innerHTML = '<b>밝기</b><div class="row">' +
      MODES.map(function (m) {
        return '<button type="button" data-mode="' + m[0] + '">' + m[1] + '</button>';
      }).join('') + '</div><b>강조색</b><div class="row">' +
      ACCENTS.map(function (a) {
        return '<button type="button" class="sw" data-accent="' + a[0] +
               '" title="' + a[0] + '"></button>';
      }).join('') + '</div>' +
      // 네온을 골랐을 때만 열리는 줄 — 색이 하나면 사이버펑크가 안 산다
      '<div class="row hues">' + HUES.map(function (h) {
        return '<button type="button" class="hue" data-hue="' + h +
               '" title="' + h + '"></button>';
      }).join('') + '</div>' +
      '<b>글자 크기</b><div class="row">' + FSIZES.map(function (f) {
        return '<button type="button" data-fs="' + f[0] + '">' + f[1] + '</button>';
      }).join('') + '</div>' +
      '<b>여백</b><div class="row">' + GAPS.map(function (g) {
        return '<button type="button" data-gap="' + g[0] + '">' + g[1] + '</button>';
      }).join('') + '</div>';
    document.body.appendChild(box);
    // body 에 배율이 걸려 있으면 getBoundingClientRect 는 이미 곱해진 값을 준다.
    // 상자는 그 배율 안에 놓이므로 되나눠야 제자리에 선다.
    var z = parseFloat(getComputedStyle(document.body).zoom) || 1;
    box.style.top = Math.round(btn.getBoundingClientRect().bottom / z + 8) + 'px';
    box.onclick = function (e) {
      var m = e.target.closest('[data-mode]'), a = e.target.closest('[data-accent]');
      if (m) { set(TK, m.getAttribute('data-mode') === 'system' ? '' : m.getAttribute('data-mode')); apply(); }
      if (a) { set(AK, a.getAttribute('data-accent')); apply(); }
      var h = e.target.closest('[data-hue]');
      if (h) { set(NK, h.getAttribute('data-hue')); apply(); }
      var g = e.target.closest('[data-gap]');
      if (g) { set(GK, g.getAttribute('data-gap')); apply(); }
      var f = e.target.closest('[data-fs]');
      if (f) { set(FK, f.getAttribute('data-fs')); apply(); }
    };
    paint();
    setTimeout(function () { document.addEventListener('click', away); }, 0);
  }

  function put() {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'plotThemeBtn';
    btn.textContent = '◐ 테마';
    btn.title = '밝기와 강조색';
    btn.onclick = function (e) { e.stopPropagation(); open(btn); };
    var own = document.getElementById('theme');
    var h = document.querySelector('header .hbtns') || document.querySelector('.addRow')
            || (own && own.parentElement);
    if (h) { h.appendChild(btn); return; }
    btn.className += ' float';
    document.body.appendChild(btn);
  }

  apply();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', put);
  else put();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', function () {
    // updateViaCache:'none' — 이게 없으면 sw.js 자체가 HTTP 캐시에 걸린다.
    // 캐시 규칙을 고친 새 워커가 옛 캐시 때문에 안 실리는, 웃기지만 실제로 겪은 일.
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(function (r) { r.update(); })
      .catch(function () {});
  });
}
</script>
</body>
</html>
