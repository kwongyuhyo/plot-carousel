<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>타임라인 편집 — PLOT</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
@font-face{font-family:PlotNoto; src:url(f-nb.woff2) format('woff2'); font-weight:900; font-display:swap}
@font-face{font-family:PlotPre; src:url(f-eb.woff2) format('woff2'); font-weight:800; font-display:swap}
:root{--bg:#0A0A0C;--panel:#131318;--raise:#1B1B22;--line:#262631;--text:#ECECF1;--muted:#8A8A96;--dim:#5E5E6B;
  --amber:#E8B34A;--clip:#3B5B8C;--clipImg:#5B4A8C;--clipYt:#8C3B3B;--sel:#E8B34A;--ok:#6FBF8B;--bad:#E0786A;color-scheme:dark}
:root[data-theme="light"]{--bg:#FBFAF7;--panel:#F2F0EA;--raise:#E9E6DE;--line:#D6D2C8;--text:#1A1A1F;--muted:#5E5E6B;--dim:#8A8494;
  --amber:#7A6B10;--clip:#5D7FB3;--clipImg:#8070B3;--clipYt:#B35D5D;--sel:#B08A00;--ok:#2E7D51;--bad:#A63A2B;color-scheme:light}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#FBFAF7;--panel:#F2F0EA;--raise:#E9E6DE;--line:#D6D2C8;--text:#1A1A1F;
  --muted:#5E5E6B;--dim:#8A8494;--amber:#7A6B10;--clip:#5D7FB3;--clipImg:#8070B3;--clipYt:#B35D5D;--sel:#B08A00;--ok:#2E7D51;--bad:#A63A2B;color-scheme:light}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Pretendard,-apple-system,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
textarea{width:100%;resize:vertical;line-height:1.5}
.app{display:grid;grid-template-rows:auto 1fr minmax(210px,34vh);height:100vh;height:100dvh}
/* 위 막대 */
.top{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.top h1{font-size:16px;margin:0 8px 0 0;letter-spacing:-.02em}
.top a{color:var(--muted);text-decoration:none;font-size:13px}
.top .sp{flex:1}
.tb{padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:var(--raise);font-size:13px;white-space:nowrap}
.tb.primary{background:var(--amber);border-color:var(--amber);color:#111;font-weight:700}
.tb:disabled{opacity:.45;cursor:default}
.modes{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.modes button{border:0;background:none;padding:6px 11px;font-size:13px;color:var(--muted)}
.modes button.on{background:var(--amber);color:#111;font-weight:700}
/* 가운데: 미리보기 + 속성 */
.mid{display:grid;grid-template-columns:1fr 372px;min-height:0}
.pvWrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:12px;gap:8px}
.stage{position:relative;aspect-ratio:9/16;height:100%;max-height:100%;background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.stage .media{position:absolute;inset:0;opacity:0;pointer-events:none}
.stage .media video,.stage .media img,.stage .media .yt,.stage .media iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.stage .media .bgblur{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(18px) brightness(.85)}
.stage .media.fit video,.stage .media.fit img{object-fit:contain}
.stage .media.fill video,.stage .media.fill img{object-fit:cover}
.stage .empty[hidden]{display:none}
.stage .empty{z-index:40;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#888;font-size:13px;padding:20px}
.frame{position:absolute;top:0;left:0;width:1080px;height:1920px;transform-origin:0 0;pointer-events:none;z-index:50}
.frame .grad{position:absolute;left:0;right:0;bottom:0;height:820px;background:linear-gradient(to bottom,rgba(0,0,0,0) 0%,rgba(0,0,0,.961) 100%)}
.frame .logo{position:absolute;left:456px;top:38px;width:168px;height:104px;background-size:contain;background-repeat:no-repeat;opacity:.6}
.frame .catBar{position:absolute;left:59px;top:261px;width:8.55px;height:57.6px;background:#fff}
.frame .cat{position:absolute;left:80px;bottom:1604px;line-height:1;font-family:PlotNoto,'Noto Sans KR',sans-serif;font-weight:900;font-size:58.05px;letter-spacing:-3.825px;color:#fff;white-space:nowrap}
.frame .line{position:absolute;left:96px;font-family:PlotNoto,'Noto Sans KR',sans-serif;font-weight:900;color:#fff;white-space:nowrap;line-height:1;font-size:85.14px;letter-spacing:-5.61px;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.frame .hook{bottom:578px}.frame .artist{bottom:483px}.frame .title{bottom:388px}
.frame .suffix{font-size:36.12px;letter-spacing:-2.38px;margin-left:10px}
.frame .src{position:absolute;right:51px;bottom:38px;font-family:PlotPre,Pretendard,sans-serif;font-weight:800;font-size:32px;line-height:1;color:#606060;white-space:nowrap}
.frame .chart{position:absolute;left:30px;top:400px;width:300px;height:880px;display:none}
.frame .chart .trk{position:absolute;left:32px;top:30px;height:820px;width:4px;background:rgba(255,255,255,.22);border-radius:2px}
.frame .chart .dot{position:absolute;left:23px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 0 16px rgba(255,255,255,.5);transition:top .5s cubic-bezier(.2,.8,.2,1)}
.frame .chart .lab{position:absolute;left:80px;font-family:PlotNoto,'Noto Sans KR',sans-serif;font-weight:900;color:#fff;font-size:64px;letter-spacing:-3px;white-space:nowrap;transition:top .5s cubic-bezier(.2,.8,.2,1)}
.frame .chart .lab small{font-size:34px;opacity:.7;margin-left:6px}
.frame .story{position:absolute;inset:0;display:none;background:rgba(0,0,0,.35)}
.frame .story div{position:absolute;left:96px;right:60px;bottom:420px;font-family:PlotNoto,'Noto Sans KR',sans-serif;font-weight:900;color:#fff;font-size:80px;letter-spacing:-5px;line-height:1.14;white-space:pre-line}
.transport{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.transport button{width:36px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--raise)}
.transport .tc{font:600 14px ui-monospace,Menlo,monospace;min-width:150px;text-align:center}
.pvNote{font-size:12px;color:var(--dim);max-width:460px;text-align:center}
.side{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 14px 30px;-webkit-overflow-scrolling:touch}
.side h3{font-size:13px;margin:16px 0 6px;color:var(--muted);font-weight:700;letter-spacing:-.01em}
.side h3:first-of-type{margin-top:2px}
.side label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
.side input[type=text]{width:100%}
.side details{border-top:1px solid var(--line);margin-top:14px;padding-top:6px}
.side summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);padding:6px 0;list-style:none}
.side summary::-webkit-details-marker{display:none}
.side summary::before{content:'▸ ';display:inline-block;transition:transform .15s}
.side details[open] summary::before{transform:rotate(90deg)}
.side summary small{font-weight:500;color:var(--dim)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:none;font-size:12.5px}
.chip.on{background:var(--amber);border-color:var(--amber);color:#111;font-weight:700}
.chip:disabled{opacity:.4}
.kv{font-size:12.5px;color:var(--muted)}
.kv b{color:var(--text);font-weight:600}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btns button{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--raise);font-size:12.5px}
.btns .danger{color:var(--bad)}
.btns .go{background:var(--amber);border-color:var(--amber);color:#111;font-weight:700}
.err{color:var(--bad);font-size:12.5px;margin-top:8px;line-height:1.6}
.warn{color:var(--amber);font-size:12.5px;margin-top:6px}
.tgl{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:13px;cursor:pointer}
.tgl input{margin-top:3px}
.tgl small{display:block;color:var(--dim);font-size:11.5px}
.rng{display:flex;align-items:center;gap:8px;margin-top:6px}
.rng input[type=range]{flex:1;accent-color:var(--amber)}
.rng span{font:12px ui-monospace,Menlo,monospace;min-width:42px;text-align:right;color:var(--muted)}
.sugg{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.sugg button{text-align:left;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--raise);font-size:12.5px}
.sugg button.on{border-color:var(--amber)}
.sugg button small{display:block;color:var(--dim)}
.keys{font-size:11.5px;color:var(--dim);line-height:1.7;margin-top:16px}
.keys kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--raise);color:var(--text)}
/* 아래: 타임라인 */
.tl{border-top:1px solid var(--line);display:grid;grid-template-columns:86px 1fr;min-height:0;background:var(--panel);user-select:none;-webkit-user-select:none}
.tl .heads{border-right:1px solid var(--line);padding-top:30px}
.tl .heads div{height:56px;display:flex;align-items:center;padding:0 10px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.tl .heads div.v{height:84px}
.tl .scroll{overflow-x:auto;overflow-y:hidden;position:relative}
.tl .inner{position:relative;height:100%;min-width:100%}
.ruler{position:relative;height:30px;border-bottom:1px solid var(--line);cursor:ew-resize}
.ruler .tk{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.ruler .tk span{position:absolute;left:3px;top:6px;font:10.5px ui-monospace,Menlo,monospace;color:var(--dim)}
.ruler .tk.minor{top:20px}
.track{position:relative;height:56px;border-bottom:1px solid var(--line)}
.track.v{height:84px}
.clip{position:absolute;top:24px;bottom:6px;border-radius:7px;background:var(--clip);overflow:hidden;cursor:grab;border:2px solid transparent;
  background-size:auto 100%;background-repeat:repeat-x;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.clip.img{background-color:var(--clipImg)}.clip.yt{background-color:var(--clipYt)}
.clip.sel{border-color:var(--sel)}
.clip.drag{opacity:.55;cursor:grabbing;z-index:5}
.clip .lab{position:absolute;left:10px;right:10px;bottom:4px;font-size:11.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.clip .fb{position:absolute;right:12px;top:3px;font-size:10px;padding:0 5px;border-radius:5px;background:rgba(0,0,0,.55);color:#fff}
.clip .h{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;background:rgba(255,255,255,.18)}
.clip .h.l{left:0;border-radius:5px 0 0 5px}.clip .h.r{right:0;border-radius:0 5px 5px 0}
.clip .h:hover{background:var(--sel)}
.xf{position:absolute;top:3px;height:17px;line-height:17px;transform:translateX(-50%);font-size:10px;padding:0 5px;border-radius:999px;background:var(--amber);color:#111;font-weight:700;z-index:4;white-space:nowrap;cursor:pointer}
.xf.cutmark{background:var(--raise);color:var(--muted);border:1px solid var(--line);cursor:default}
.tbar{position:absolute;top:10px;bottom:10px;border-radius:6px;background:rgba(232,179,74,.22);border:1px solid rgba(232,179,74,.55);font-size:11.5px;padding:0 8px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tbar.base{top:4px;bottom:auto;height:18px;font-size:10.5px;background:rgba(127,127,127,.12);border-color:var(--line);color:var(--muted)}
.tbar.meta{top:25px;bottom:5px;cursor:grab;padding:0 12px}
.tbar.main{background:rgba(111,191,139,.22);border-color:rgba(111,191,139,.6)}
.tbar.seg{cursor:pointer}
.tbar.lock{cursor:pointer}
.tbar.meta span{overflow:hidden;text-overflow:ellipsis}
.tbar .h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;background:rgba(232,179,74,.5)}
.tbar .h.l{left:0}.tbar .h.r{right:0}
.xf.on{outline:2px solid var(--text)}
.drop{position:absolute;top:4px;bottom:4px;width:3px;background:var(--sel);border-radius:2px;z-index:6;display:none}
.ph{position:absolute;top:0;bottom:0;width:0;border-left:2px solid #ff4d4d;z-index:8;pointer-events:none}
.ph::before{content:'';position:absolute;top:0;left:-7px;border:6px solid transparent;border-top:9px solid #ff4d4d}
.zoom{position:absolute;right:10px;top:4px;display:flex;gap:4px;z-index:9}
.zoom button{width:24px;height:22px;border:1px solid var(--line);border-radius:6px;background:var(--raise);font-size:13px;line-height:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:flex;align-items:center;justify-content:center}
.sheet .pn{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(640px,92vw);max-height:80vh;overflow:auto;padding:16px}
.sheet pre{white-space:pre-wrap;word-break:break-all;font:12.5px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);padding:10px;border-radius:8px;border:1px solid var(--line)}
/* 편집 단추 줄 — 컴퓨터·휴대폰 같이 */
.mbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.mbar button{padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:var(--raise);font-size:13px;white-space:nowrap}
.mbar button:disabled{opacity:.4}
.sideHd{display:none}
.mOnly{display:none !important}
.themeSlot{display:inline-flex}.themeSlot .plotThemeBtn{position:static !important}
.more{display:none}
.ruler,.tbar[data-meta],.clip .h{touch-action:none}
/* ── 휴대폰 ── */
@media (max-width:900px){
  body{font-size:15px}
  .app{grid-template-rows:auto 1fr minmax(220px,40dvh)}
  .top{padding:6px 10px;gap:6px;flex-wrap:nowrap;padding-top:max(6px,env(safe-area-inset-top))}
  .top h1,.top .sec,.top .sp{display:none}
  .top a{flex:none;font-size:15px;white-space:nowrap;padding:6px 4px}
  .top a .lg,.top a .bl{display:none}
  .top #addFile{display:none}
  .mOnly{display:inline-block !important}
  .modes button{padding:7px 9px;font-size:13px}
  .kb{display:none}
  .tb{padding:9px 12px;font-size:14px}
  .tb.primary .lg{display:none}
  .more{display:inline-block}
  .mid{grid-template-columns:1fr}
  .pvWrap{padding:8px 8px 6px;gap:6px;overflow:hidden}
  .stage{flex:1 1 0;height:auto;min-height:120px}
  .transport .tc{min-width:120px;font-size:13px}
  .transport button{width:44px;height:38px}
  .mbar{gap:5px;flex-wrap:nowrap;max-width:100%;overflow-x:auto;scrollbar-width:none;padding:0 2px}
  .mbar::-webkit-scrollbar{display:none}
  .mbar button{flex:none;padding:9px 11px;font-size:15px}
  .mbar [data-m=redo]{display:none}
  .mbar .lg,.dsk{display:none}
  .pvNote{display:none}
  .side{position:fixed;left:0;right:0;bottom:0;z-index:80;max-height:76dvh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    transform:translateY(102%);transition:transform .22s ease;box-shadow:0 -10px 30px rgba(0,0,0,.35);padding:0 16px calc(24px + env(safe-area-inset-bottom))}
  .side.open{transform:none}
  .sideHd{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--panel);padding:12px 0 8px;z-index:2}
  .sideHd b{font-size:15px}.sideHd button{border:1px solid var(--line);background:var(--raise);border-radius:9px;padding:6px 12px}
  .side input[type=text],.side textarea{font-size:16px;padding:9px 10px}
  .chip{padding:8px 13px;font-size:14px}
  .btns button{padding:9px 12px;font-size:14px}
  .sugg button{padding:10px 11px;font-size:14px}
  .keys{display:none}
  .tl{grid-template-columns:44px 1fr}
  .tl .heads div{font-size:11px;padding:0 6px}
  .track.v{height:92px}.tl .heads div.v{height:92px}
  .clip{touch-action:pan-x;cursor:default}
  .clip .h{width:20px}
  .clip .h::after{content:'';position:absolute;left:8px;top:30%;bottom:30%;width:3px;border-radius:2px;background:rgba(255,255,255,.85)}
  .xf{height:21px;font-size:12px;line-height:21px;padding:0 8px;top:1px}
  .clip{top:26px}
  .zoom button{width:34px;height:30px;font-size:16px}
  .toast{bottom:calc(16px + env(safe-area-inset-bottom))}
}
@media (max-width:380px){ .modes button{padding:7px 7px;font-size:12.5px} .tb{padding:9px 9px} }
</style>

<style id="plotTheme">
:root{ --accent:#E8B34A; --glass:rgba(18,19,26,.93); }
/* 흐린 보조 글씨가 어두운 바탕에서 2.3~2.9:1 이었다 — 해 아래 폰에서 안 읽힌다.
   세 화면이 이름만 다를 뿐 같은 자리라 한 군데서 올린다. */
html:root[data-theme="dark"]{ --dim:#82828F; --faint:#82828F; --skip:#82828F;
  --bad:#E0786A }
@media (prefers-color-scheme: dark){
  html:root:not([data-theme="light"]){ --dim:#82828F; --faint:#82828F;
    --skip:#82828F; --bad:#E0786A }
}
html:root[data-accent="amber"]{ --accent:#E8B34A; --amber:#E8B34A }
html:root[data-accent="blue"]{ --accent:#5B8DEF; --amber:#5B8DEF }
html:root[data-accent="green"]{ --accent:#4FB477; --amber:#4FB477 }
html:root[data-accent="violet"]{ --accent:#8B7CF0; --amber:#8B7CF0 }
html:root[data-accent="mono"]{ --accent:#ECECF1; --amber:#ECECF1 }
html:root[data-accent="neon"]{ --accent:#00F0FF; --amber:#00F0FF }
html:root .plotThemeBox .sw[data-accent="amber"]{ background:#E8B34A; color:#E8B34A }
html:root .plotThemeBox .sw[data-accent="blue"]{ background:#5B8DEF; color:#5B8DEF }
html:root .plotThemeBox .sw[data-accent="green"]{ background:#4FB477; color:#4FB477 }
html:root .plotThemeBox .sw[data-accent="violet"]{ background:#8B7CF0; color:#8B7CF0 }
html:root .plotThemeBox .sw[data-accent="mono"]{ background:#ECECF1; color:#ECECF1 }
html:root .plotThemeBox .sw[data-accent="neon"]{ background:linear-gradient(135deg,#00F0FF 0%,#FF2BD6 45%,#B6FF3B 100%); color:#00F0FF }
html:root[data-theme="light"]{
  --bg:#FBFAF7; --panel:#F2F0EA; --raise:#E9E6DE; --panel-2:#E9E6DE;
  --line:#DAD6CB; --text:#1A1A1E; --ink:#1A1A1E;
  --muted:#57544D; --dim:#6B6760; --faint:#6B6760; --skip:#6E6A78;
  --glass:rgba(246,244,239,.93); --bad:#A63A2B; --warn:#8A6B12; --danger:#A63A2B;
  color-scheme:light;
}
html:root[data-theme="light"][data-accent="amber"]{ --accent:#7A6B10; --amber:#7A6B10 }
html:root[data-theme="light"][data-accent="blue"]{ --accent:#2B5BC4; --amber:#2B5BC4 }
html:root[data-theme="light"][data-accent="green"]{ --accent:#216E45; --amber:#216E45 }
html:root[data-theme="light"][data-accent="violet"]{ --accent:#5240B8; --amber:#5240B8 }

  var LIMIT = { shorts: 3 * 60e3, caption: 5 * 60e3, cut: 40 * 60e3, carousel: 10 * 60e3, special: 3 * 60e3, raw: 15 * 60e3, cardvid: 30 * 60e3 };
  function send(op, data, onStep) {
    var id = 'st:' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
    var sn = { op: op, at: new Date().toISOString() };
    Object.keys(data || {}).forEach(function (k) { sn[k] = data[k]; });
    var rec = { id: id, kind: 'studio', draft_date: null, draft_key: null, source_id: op, verdict: {}, reason: '', rewrite: {},
      device: (navigator.userAgent.match(/iPhone|iPad|Android|Mac/) || ['?'])[0], snapshot: sn };
    return req('plot_evals', { method: 'POST', body: JSON.stringify(rec), prefer: 'resolution=merge-duplicates,return=minimal' })
      .then(function () { return wait(id, LIMIT[op] || 5 * 60e3, onStep); });
  }
  function wait(id, limit, onStep) {
    var t0 = Date.now();
    return new Promise(function (ok, no) {
      (function tick() {
        req('plot_evals?select=snapshot&id=eq.' + encodeURIComponent(id)).then(function (rows) {
          var sn = (rows && rows[0] && rows[0].snapshot) || {};
          if (sn.status === 'done') return ok(sn);
          if (sn.status === 'fail') return no(new Error(sn.note || '맥에서 실패했습니다'));
          var gone = Date.now() - t0;
          if (gone > limit) return no(new Error(sn.status ? '오래 걸려 화면에서 기다리기를 멈췄습니다 — 맥에서는 계속합니다'
                                                            : '맥이 받지 않습니다 — 맥과 봇이 켜져 있는지 봐 주세요'));
          if (onStep) { try { onStep(sn.status === 'running' ? (sn.note || '맥이 처리 중') : '맥이 받기를 기다리는 중', gone); } catch (_) {} }
          setTimeout(tick, 3000);
        }).catch(function (e) { if (Date.now() - t0 > limit) no(e); else setTimeout(tick, 5000); });
      })();
    });
  }
  function sheet(title, text) {
    var o = document.createElement('div');
    o.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center';
    o.innerHTML = '<div style="background:var(--bg,#111);color:var(--fg,#eee);width:100%;max-width:640px;max-height:80vh;overflow:auto;' +
      'border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))">' +
      '<div data-t style="font-weight:800;margin-bottom:8px"></div><textarea style="width:100%;min-height:42vh;box-sizing:border-box;' +
      'font:inherit;font-size:14px;line-height:1.55;padding:10px;border-radius:10px;border:1px solid rgba(127,127,127,.4);background:transparent;color:inherit"></textarea>' +
      '<div style="display:flex;gap:8px;margin-top:10px"><button data-x="c" style="flex:1;padding:12px;border-radius:10px;font-weight:700">📋 복사</button>' +
      '<button data-x="q" style="padding:12px 16px;border-radius:10px">닫기</button></div></div>';
    o.querySelector('[data-t]').textContent = title;
    var ta = o.querySelector('textarea'); ta.value = text;
    o.addEventListener('click', function (e) {
      var b = e.target.closest('[data-x]');
      if (e.target === o || (b && b.getAttribute('data-x') === 'q')) { o.remove(); return; }
      if (b) {
        var done = function () { b.textContent = '✓ 복사했습니다'; };
        try { navigator.clipboard.writeText(ta.value).then(done, function () { ta.select(); document.execCommand('copy'); done(); }); }
        catch (_) { ta.select(); document.execCommand('copy'); done(); }
      }
    });
    document.body.appendChild(o);
  }
  function post(rec) {                                   // 그림 한 장 같은 날 줄 (kind='studio_img')
    var r = { draft_date: null, draft_key: null, source_id: rec.kind || '', verdict: {}, reason: '', rewrite: {}, device: '' };
    Object.keys(rec).forEach(function (k) { r[k] = rec[k]; });
    return req('plot_evals', { method: 'POST', body: JSON.stringify(r), prefer: 'resolution=merge-duplicates,return=minimal' });
  }
  window.plotStudio = { on: on, send: send, sheet: sheet, post: post };
})();</script>

<script>
(function () {
  var TK = 'plot.app.theme', AK = 'plot.app.accent', NK = 'plot.app.neon',

  var GAPS = [['tight', '좁게'], ['normal', '보통'], ['wide', '넓게']];
  var FSIZES = [['s', '작게'], ['m', '보통'], ['l', '크게'], ['xl', '더 크게']];
  var HUES = ['cyan', 'magenta', 'lime', 'orange', 'violet'];
  var MODES = [['system', '기기'], ['light', '밝게'], ['dark', '어둡게']];
  var ACCENTS = [['amber', '#E8B34A'], ['blue', '#5B8DEF'], ['green', '#4FB477'],

  var box = null;

  function get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }

    if (box) { box.remove(); box = null; document.removeEventListener('click', away); }
  }
  function away(e) {
    if (box && !box.contains(e.target) && !e.target.closest('.plotThemeBtn')) close();
  }

  function open(btn) {
    if (box) { close(); return; }
    box = document.createElement('div');
    box.className = 'plotThemeBox';
    box.innerHTML = '<b>밝기</b><div class="row">' +
      MODES.map(function (m) {
        return '<button type="button" data-mode="' + m[0] + '">' + m[1] + '</button>';
      }).join('') + '</div><b>강조색</b><div class="row">' +
      ACCENTS.map(function (a) {
        return '<button type="button" class="sw" data-accent="' + a[0] +
               '" title="' + a[0] + '"></button>';
      }).join('') + '</div>' +
      // 네온을 골랐을 때만 열리는 줄 — 색이 하나면 사이버펑크가 안 산다
      '<div class="row hues">' + HUES.map(function (h) {
        return '<button type="button" class="hue" data-hue="' + h +
               '" title="' + h + '"></button>';
      }).join('') + '</div>' +
      '<b>글자 크기</b><div class="row">' + FSIZES.map(function (f) {
        return '<button type="button" data-fs="' + f[0] + '">' + f[1] + '</button>';
      }).join('') + '</div>' +
      '<b>여백</b><div class="row">' + GAPS.map(function (g) {
        return '<button type="button" data-gap="' + g[0] + '">' + g[1] + '</button>';
      }).join('') + '</div>';
    document.body.appendChild(box);
    // body 에 배율이 걸려 있으면 getBoundingClientRect 는 이미 곱해진 값을 준다.
    // 상자는 그 배율 안에 놓이므로 되나눠야 제자리에 선다.
    var z = parseFloat(getComputedStyle(document.body).zoom) || 1;
    box.style.top = Math.round(btn.getBoundingClientRect().bottom / z + 8) + 'px';
    box.onclick = function (e) {
      var m = e.target.closest('[data-mode]'), a = e.target.closest('[data-accent]');
      if (m) { set(TK, m.getAttribute('data-mode') === 'system' ? '' : m.getAttribute('data-mode')); apply(); }
      if (a) { set(AK, a.getAttribute('data-accent')); apply(); }
      var h = e.target.closest('[data-hue]');
      if (h) { set(NK, h.getAttribute('data-hue')); apply(); }
      var g = e.target.closest('[data-gap]');
      if (g) { set(GK, g.getAttribute('data-gap')); apply(); }
      var f = e.target.closest('[data-fs]');
      if (f) { set(FK, f.getAttribute('data-fs')); apply(); }
    };
    paint();
    setTimeout(function () { document.addEventListener('click', away); }, 0);
  }

  function put() {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'plotThemeBtn';
    btn.textContent = '◐ 테마';
    btn.title = '밝기와 강조색';
    btn.onclick = function (e) { e.stopPropagation(); open(btn); };
    var own = document.getElementById('theme');
    var h = document.querySelector('header .hbtns') || document.querySelector('.addRow')
            || (own && own.parentElement);
    if (h) { h.appendChild(btn); return; }
    btn.className += ' float';
    document.body.appendChild(btn);
  }

  apply();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', put);
  else put();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', function () {
    // updateViaCache:'none' — 이게 없으면 sw.js 자체가 HTTP 캐시에 걸린다.
    // 캐시 규칙을 고친 새 워커가 옛 캐시 때문에 안 실리는, 웃기지만 실제로 겪은 일.
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(function (r) { r.update(); })
      .catch(function () {});
  });
}
</script>
</body>
</html>
