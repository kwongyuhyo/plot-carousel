<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A0A0C">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PLOT">
<meta name="mobile-web-app-capable" content="yes">
<title>PLOT 캐러셀 스튜디오</title>
<style>
:root{
  --bg:#0A0A0C; --panel:#131318; --raise:#1B1B22; --line:#2A2A34;
  --text:#ECECF1; --muted:#8A8A96; --dim:#5E5E6A;
  --amber:#E8B34A; --danger:#C75B4A; --focus:#7C7CF0;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard-SemiBold",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Pretendard-ExtraBold","Pretendard-SemiBold",sans-serif;margin:0;font-weight:400}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)}

/* 상단 */
header{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:10px 14px 12px;
  display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.mark{font-family:"Pretendard-ExtraBold",sans-serif;font-size:13px;letter-spacing:.22em;
  color:var(--text);border:1px solid var(--line);padding:3px 8px 2px;border-radius:3px}
#deckName{flex:1;min-width:0;background:none;border:none;color:var(--text);
  font-family:"Pretendard-ExtraBold",sans-serif;font-size:17px;padding:2px 0}
#deckName::placeholder{color:var(--dim)}
#dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none;transition:background .2s}
#dot.on{background:var(--amber)}
.hbtns{display:flex;gap:6px}
.hbtns button{border:1px solid var(--line);border-radius:6px;padding:5px 11px;
  font-size:13px;color:var(--muted);background:var(--panel)}
.hbtns button:hover{color:var(--text);border-color:var(--dim)}

/* 본문 격자 */
main{display:grid;gap:0;padding-bottom:96px}
@media(min-width:980px){
  main{grid-template-columns:minmax(360px,470px) 1fr;gap:28px;padding:22px 26px 104px;align-items:start}
  .left{position:sticky;top:96px}
  body{font-size:15px}
}

/* 미리보기 */
.left{padding:14px}
.stagewrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:10px;display:flex;flex-direction:column;gap:10px}
#stage{width:100%;height:auto;display:block;border-radius:4px;background:#141414}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav button{border:1px solid var(--line);border-radius:6px;width:38px;height:32px;
  color:var(--muted);font-size:16px;line-height:1}
.nav button:hover{color:var(--text)}
#counter{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* 레일 */
#rail{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;scrollbar-width:thin}
@media(min-width:980px){#rail{padding:0 0 14px}}
.thumb{flex:none;width:76px;display:flex;flex-direction:column;gap:5px;align-items:center;
  padding:0;border-radius:6px}
.thumb canvas{width:76px;height:95px;border-radius:4px;border:1px solid var(--line);
  background:#141414;display:block}
.thumb span{font-size:11px;color:var(--dim)}
.thumb.on canvas{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}
.thumb.on span{color:var(--text)}
.thumb.add{width:76px;height:95px;border:1px dashed var(--line);border-radius:4px;
  justify-content:center;color:var(--dim);font-size:11px;gap:2px}
.thumb.add:hover{border-color:var(--dim);color:var(--muted)}
.thumb.add .plus{font-size:19px;line-height:1}

/* 편집 */
.right{padding:0 14px}
@media(min-width:980px){.right{padding:0}}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:6px 0 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
#slideMeta{font-size:13px;color:var(--muted)}
.tools{display:flex;gap:6px}
.tools button,.mini{border:1px solid var(--line);border-radius:6px;padding:4px 9px;
  font-size:12px;color:var(--muted);background:var(--panel)}
.tools button:hover,.mini:hover{color:var(--text)}
.mini.danger{color:var(--danger);border-color:#3A2A2C}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.flabel{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.flabel em{font-style:normal;font-size:11px;color:var(--dim)}
.field input,.field textarea{background:var(--panel);border:1px solid var(--line);
  border-radius:7px;color:var(--text);padding:9px 11px;width:100%;resize:vertical}
.field textarea{line-height:1.55;min-height:70px}
.field input:focus,.field textarea:focus{border-color:var(--dim)}
.metarow{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-bottom:16px}
@media(max-width:520px){.metarow{grid-template-columns:1fr}}
.photorow{display:flex;gap:8px;margin:2px 0 18px;flex-wrap:wrap}
.photorow label,.photorow button{border:1px solid var(--line);border-radius:7px;
  padding:9px 14px;font-size:13px;background:var(--panel);color:var(--text);cursor:pointer}
.photorow button{color:var(--muted)}
#photoInput{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}


/* 미리보기 위 편집 */
#canvasbox{position:relative;line-height:0}
#canvasbox.drop::after{content:"사진 놓기";position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;background:rgba(10,10,12,.72);
  border:2px dashed var(--text);border-radius:4px;color:var(--text);font-size:14px;line-height:1}
#hot{position:absolute;inset:0}
#fitLayer{position:absolute;inset:0;cursor:grab;touch-action:none;
  box-shadow:inset 0 0 0 2px rgba(232,179,74,.85)}
#fitLayer.drag{cursor:grabbing}
/* 글 검사 — 렌더가 겪은 일과 자주 틀리는 맞춤법 */
.lintBox{margin-top:9px;border:1px solid rgba(255,255,255,.14);border-radius:7px;
  padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.lintHead{font-size:11px;opacity:.55;margin-bottom:2px}
.lintItem{font-size:12px;line-height:1.5;padding-left:15px;position:relative}
.lintItem::before{position:absolute;left:0;top:0}
.lintItem.bad::before{content:"✗";color:#e06a6a}
.lintItem.warn::before{content:"!";color:#e8b34a}
.lintItem.tip::before{content:"·";opacity:.5}
.lintItem.bad{color:#f0b4b4}
.lintItem.warn{color:#e8cf9a}
.fitBar{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.fitRow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fitRow button{background:none;border:1px solid var(--line,rgba(255,255,255,.22));
  border-radius:6px;color:inherit;font:inherit;font-size:12px;padding:7px 10px;cursor:pointer}
.fitRow button.on{background:rgba(232,179,74,.16);border-color:rgba(232,179,74,.75)}
.fitRow button.strong{background:rgba(255,255,255,.90);color:#111;border-color:transparent;font-weight:700}
.fitRow .fitLbl{font-size:11.5px;opacity:.6}
.fitRow .fitNow{flex:1;text-align:right;font-size:11px;opacity:.6;
  font-family:ui-monospace,Menlo,monospace}
.hs{position:absolute;padding:0;border:1px solid transparent;border-radius:3px;
  background:transparent;transition:background .12s,border-color .12s}
.hs:hover,.hs:focus-visible{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.55);
  border-style:dashed}
#photoHint{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);
  display:flex;align-items:center;gap:7px;line-height:1;
  background:rgba(12,12,14,.78);border:1px solid rgba(255,255,255,.28);border-radius:999px;
  padding:11px 18px;font-size:13px;color:var(--text);backdrop-filter:blur(2px)}
#photoHint:hover{border-color:var(--text)}
#photoHint .pi{font-size:15px}
#quick{position:absolute;left:8px;right:8px;bottom:8px;z-index:5;line-height:1.5;
  background:rgba(11,11,14,.96);border:1px solid var(--line);border-radius:9px;padding:10px 11px 11px}
#quick.top{bottom:auto;top:8px}
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
#qlabel{font-size:12px;color:var(--muted)}
#qdone{border:1px solid var(--line);border-radius:6px;padding:3px 11px;font-size:12px;color:var(--text)}
#qinput{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;
  color:var(--text);padding:8px 10px;resize:none;line-height:1.55}
#qinput.single{height:38px}
#qhint{margin:6px 0 0;font-size:11px;color:var(--dim)}
.tapnote{margin:0;font-size:11px;color:var(--dim);text-align:center;line-height:1.5}
.photorow button.strong{color:var(--text);font-family:"Pretendard-ExtraBold",sans-serif}

/* 아래 고정 바 */
.actions{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);
  border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:8px}
.actions button{flex:1;border-radius:8px;padding:11px 8px;font-size:14px;
  border:1px solid var(--line);background:var(--panel);color:var(--text)}
.actions button.primary{background:var(--text);color:#0A0A0C;border-color:var(--text);
  font-family:"Pretendard-ExtraBold",sans-serif}

/* 겹침 판 */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(6,6,8,.82);
  display:flex;align-items:center;justify-content:center;padding:18px}
.sheet .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  width:min(560px,100%);max-height:82vh;overflow:auto;padding:18px}
.sheet h2{font-size:16px;margin-bottom:12px}
.sheet .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sheet .row>div{flex:1;min-width:0;display:flex;flex-direction:column}
.sheet .row strong{font-weight:400;font-family:"Pretendard-ExtraBold",sans-serif;font-size:14px}
.sheet .row span{font-size:12px;color:var(--muted)}
.sheet textarea{width:100%;height:300px;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;color:var(--text);padding:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12px;line-height:1.6}
.sheet .close{margin-top:12px;border:1px solid var(--line);border-radius:7px;padding:8px 14px;
  font-size:13px;color:var(--muted);width:100%}
#bigImg{width:100%;height:auto;border-radius:6px;display:block}
.hint{font-size:12px;color:var(--muted);margin:0 0 10px}

/* 예시 알림 */
#sampleBar{display:flex;align-items:center;gap:10px;margin:12px 14px 0;padding:9px 12px;
  border:1px solid var(--line);border-left:2px solid var(--amber);border-radius:6px;
  font-size:12px;color:var(--muted);background:var(--panel)}
@media(min-width:980px){#sampleBar{margin:0 0 14px}}
#sampleBar button{color:var(--text);text-decoration:underline;font-size:12px;flex:none}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:60;
  background:var(--raise);border:1px solid var(--line);border-radius:8px;
  padding:9px 15px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;
  max-width:88vw;text-align:center}
#toast.on{opacity:1}
#boot{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;
  align-items:center;justify-content:center;color:var(--muted);font-size:13px;letter-spacing:.04em}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<header>
  <div class="brand">
    <span class="mark">PLOT</span>
    <input id="deckName" placeholder="작업 이름" />
    <span id="dot" title="저장하지 않은 변경"></span>
  </div>
  <div class="hbtns">
    <button id="saveBtn" type="button">저장</button>
    <button id="openBtn" type="button">불러오기</button>
    <button id="newBtn" type="button">새 작업</button>
  </div>
</header>

<main>
  <div class="left">
    <div class="stagewrap">
      <div id="canvasbox">
        <canvas id="stage" width="1080" height="1350" aria-label="카드뉴스 미리보기"></canvas>
        <div id="hot"></div>
        <div id="fitLayer" hidden></div>
        <button id="photoHint" type="button" hidden><span class="pi">＋</span>사진 넣기</button>
        <div id="quick" hidden>
          <div class="qhead">
            <span id="qlabel"></span>
            <button id="qdone" type="button">완료</button>
          </div>
          <textarea id="qinput" rows="3"></textarea>
          <p id="qhint"></p>
        </div>
      </div>
      <p class="tapnote">미리보기의 글자를 눌러 바로 고칠 수 있습니다. 사진은 빈 자리를 누르세요.</p>
      <div class="nav">
        <button id="prev" type="button" aria-label="이전 장">‹</button>
        <span id="counter">1 / 4</span>
        <button id="next" type="button" aria-label="다음 장">›</button>
      </div>
    </div>
  </div>

  <div class="right">
    <div id="sampleBar">
      <span>예시 내용이 들어 있습니다. 그대로 고쳐 쓰거나 비우고 시작하세요.</span>
      <button id="clearSample" type="button">비우기</button>
    </div>

    <div id="rail"></div>

    <div class="metarow">
      <label class="field" style="margin:0">
        <span class="flabel">카테고리<em>좌상단 태그</em></span>
        <input id="catInput" type="text" placeholder="News" />
      </label>
      <label class="field" style="margin:0">
        <span class="flabel">캡션<em>인스타 본문 · 양식에만 실립니다</em></span>
        <input id="capInput" type="text" placeholder="비우면 봇이 자동 생성" />
      </label>
    </div>

    <div class="sectionhead">
      <span id="slideMeta"></span>
      <span class="tools">
        <span id="moveBtns">
          <button id="upBtn" type="button" title="앞으로">↑</button>
          <button id="downBtn" type="button" title="뒤로">↓</button>
        </span>
        <button id="delBtn" type="button">삭제</button>
      </span>
    </div>

    <div class="photorow" id="photoRow">
      <button id="photoBtn" type="button" class="strong">사진 넣기</button>
      <input id="photoInput" type="file" accept="image/*" multiple />
      <button id="photoFitBtn" type="button" hidden>사진 맞추기</button>
      <button id="photoClear" type="button">사진 빼기</button>
    </div>

    <div class="lintBox" id="lintBox" hidden></div>

    <!-- 사진 맞추기 — 4:5 가 아닌 사진을 억지로 자르지 않으려는 자리 -->
    <div class="fitBar" id="fitBar" hidden>
      <div class="fitRow">
        <button type="button" data-fit="cover">꽉 채우기</button>
        <button type="button" data-fit="contain">전체 보이기</button>
        <button type="button" data-fit="zoomout">−</button>
        <button type="button" data-fit="zoomin">＋</button>
        <span class="fitNow" id="fitNow"></span>
      </div>
      <div class="fitRow">
        <span class="fitLbl">남는 자리</span>
        <button type="button" data-bg="blur">블러</button>
        <button type="button" data-bg="white">흰색</button>
        <button type="button" data-bg="black">검정</button>
        <button type="button" id="fitSnap">자석 켬</button>
        <button type="button" data-fit="reset">되돌리기</button>
        <button type="button" id="fitDone" class="strong">완료</button>
      </div>
      <p class="hint">끌어서 위치를 잡고, 두 손가락(또는 휠)으로 확대·축소합니다.
        가장자리에 가까워지면 자석이 붙여 줍니다.</p>
    </div>

    <div id="fields"></div>
  </div>
</main>

<div class="actions">
  <button id="copyBtn" type="button">양식 복사</button>
  <button id="pngBtn" type="button">이 장 저장</button>
  <button id="allBtn" type="button" class="primary">전체 저장</button>
</div>

<div class="sheet" id="listBox" hidden>
  <div class="card">
    <h2>저장된 작업</h2>
    <div id="listBody"></div>
    <button class="close" id="listClose" type="button">닫기</button>
  </div>
</div>

<div class="sheet" id="formBox" hidden>
  <div class="card">
    <h2>봇 양식</h2>
    <p class="hint">길게 눌러 전체 선택 후 복사하세요.</p>
    <textarea id="formOut" readonly></textarea>
    <button class="close" id="formClose" type="button">닫기</button>
  </div>
</div>

<div class="sheet" id="bigBox" hidden>
  <div class="card">
    <h2>이미지 저장</h2>
    <p class="hint">사진을 길게 눌러 저장하세요.</p>
    <img id="bigImg" alt="완성된 카드" />
    <button class="close" id="bigClose" type="button">닫기</button>
  </div>
</div>

<div id="toast"></div>
<div id="boot">불러오는 중…</div>

/* ──────────────────────────────────────────────────────────────────────────
   PLOT 카드뉴스 렌더러 — generators/card_news.py 를 1:1 이식한 판.
   글자 전진폭은 폰트 원본 수치를 1/64px 로 반올림해 파이썬(FreeType)과 같은 값을
   쓴다. 그래서 줄바꿈 위치·자동 축소 결과가 봇과 동일하게 나온다.
   ────────────────────────────────────────────────────────────────────────── */
const W = 1080, H = 1350;
const F = ASSETS.fonts;                      // eb / sb / nb
const TEXT_MAX_X = W - 20;                   // 1060
const BODY_LEFT = 76, BODY_TOP_LIMIT = 200, BODY_BOTTOM_LIMIT = 1195;
const BODY_MAX_LINES = 8, BODY_HEAD_GAP = 0.25;
const HEADING_SIZE = 67, HEADING_MIN = 40, BODY_SIZE = 36;
const SLOGAN = "당신의 음악생활을 위한 종합 음악 매거진, PLOT";

const TYPO = {
  cover_title:    { leading: 1.16, tracking: -0.025 },
  cover_subtitle: { leading: 1.34, tracking: -0.010 },
  body_heading:   { leading: 1.22, tracking: -0.020 },
  body_text:      { leading: 1.45, tracking: -0.005 },
  slogan:         { leading: 1.30, tracking: -0.010 },
  source:         { leading: 1.30, tracking:  0.000 },
};

/* 미리보기에서 눌러 고칠 수 있도록, 그리면서 글자 영역을 같이 적어둔다.
   섬네일을 그릴 때는 TRACK 을 꺼서 본 화면 영역만 남긴다. */
let HITS = [], TRACK = false;
function hit(kind, x, y, w, h) { if (TRACK && w > 0 && h > 0) HITS.push({ kind, x, y, w, h }); }

const fontStr = (fk, size) => `${size}px "${F[fk].name}"`;
function metrics(fk, size) {
  const m = F[fk].metrics[String(size)];
  if (m) return m;
  const any = F[fk].metrics["36"];
  return [Math.round(any[0] * size / 36), Math.round(any[1] * size / 36)];
}
function advOf(fk, size, ch) {
  const f = F[fk];
  const u = f.ex[ch.codePointAt(0)];
  return Math.round(((u === undefined ? f.defAdv : u) * size / f.upem) * 64) / 64;
}
const lineAdvance = (size, leading) => Math.round(size * leading);
const chars = (s) => Array.from(s);

/* ── 줄바꿈 기호 ───────────────────────────────────────────────────────── */
const PIPE = "\u0000PIPE\u0000";
function normBreaks(text) {
  if (!text) return "";
  let t = String(text).split("\\|").join(PIPE);
  t = t.split("\\n").join("\n").split("|").join("\n");
  return t.split(PIPE).join("|");
}
function oneline(text) {
  if (!text) return "";
  return String(text).replace(/\r/g, "\n").split("\n").join(" ").trim();
}

/* ── 측정 · 드로잉 ─────────────────────────────────────────────────────── */
function twTracked(text, fk, size, tr) {
  const t = oneline(text);
  if (!t) return 0;
  const cs = chars(t);
  let w = 0;
  for (const ch of cs) w += advOf(fk, size, ch);
  return w + tr * (cs.length - 1);
}
function drawTracked(ctx, x, y, text, fk, size, fill, tr) {
  const t = oneline(text);
  if (!t) return x;
  ctx.font = fontStr(fk, size);
  ctx.fillStyle = fill;
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  const base = y + metrics(fk, size)[0];
  let cx = x;
  for (const ch of chars(t)) { ctx.fillText(ch, cx, base); cx += advOf(fk, size, ch) + tr; }
  return cx - tr;
}
function wrapTracked(text, fk, size, maxW, tr) {
  const lines = []; let cur = "", w = 0;
  for (const ch of chars(text)) {
    const cw = advOf(fk, size, ch);
    const add = cw + (cur ? tr : 0);
    if (cur && w + add > maxW) { lines.push(cur); cur = ch; w = cw; }
    else { cur += ch; w += add; }
  }
  if (cur) lines.push(cur);
  return lines;
}
function ellipsisTracked(text, fk, size, maxW, tr) {
  let t = oneline(text);
  if (twTracked(t, fk, size, tr) <= maxW) return t;
  let out = chars(t);
  while (out.length && twTracked(out.join("") + "…", fk, size, tr) > maxW) out.pop();
  return out.length ? out.join("") + "…" : "";
}

/* ── 맥락 줄바꿈 (어절 · 금칙 · 외톨이 · 균형) ─────────────────────────── */
const NO_LINE_START = new Set(Array.from("’”』」）］｝〉》.,!?:;·…%\"')]}"));
const NO_LINE_END   = new Set(Array.from("‘“『「（［｛〈《([{"));

function splitTokens(text) {
  const out = []; let cur = "";
  for (const ch of chars(text)) { cur += ch; if (ch === " ") { out.push(cur); cur = ""; } }
  if (cur) out.push(cur);
  return out;
}
function kinsoku(lines, fk, size, maxW, tr) {
  const out = lines.slice();
  for (let i = 1; i < out.length; i++) {
    while (out[i] && NO_LINE_START.has(chars(out[i])[0])) {
      const first = chars(out[i])[0];
      const moved = out[i - 1] + first;
      if (twTracked(moved, fk, size, tr) > maxW) break;
      out[i - 1] = moved;
      out[i] = chars(out[i]).slice(1).join("").replace(/^\s+/, "");
    }
  }
  for (let i = 0; i < out.length - 1; i++) {
    while (out[i] && NO_LINE_END.has(chars(out[i]).slice(-1)[0])) {
      const last = chars(out[i]).slice(-1)[0];
      out[i + 1] = last + out[i + 1];
      out[i] = chars(out[i]).slice(0, -1).join("").replace(/\s+$/, "");
    }
  }
  return out.filter((l) => l !== "");
}
function fixOrphan(lines, fk, size, maxW, tr) {
  if (lines.length < 2) return lines;
  if (twTracked(lines[lines.length - 1], fk, size, tr) >= maxW * 0.28) return lines;
  const prevToks = splitTokens(lines[lines.length - 2]);
  if (prevToks.length < 2) return lines;
  const moved = prevToks[prevToks.length - 1].trim();
  const newPrev = prevToks.slice(0, -1).join("").replace(/\s+$/, "");
  const newLast = (moved + " " + lines[lines.length - 1]).trim();
  if (!newPrev || twTracked(newLast, fk, size, tr) > maxW) return lines;
  return lines.slice(0, -2).concat([newPrev, newLast]);
}
function wrapSmart(text, fk, size, maxW, tr, balance) {
  const t = String(text).split(/\s+/).filter(Boolean).join(" ");
  if (!t) return [""];
  const toks = splitTokens(t);
  let lines = [], cur = "";
  for (const tk of toks) {
    const cand = cur + tk;
    if (cur && twTracked(cand.replace(/\s+$/, ""), fk, size, tr) > maxW) {
      lines.push(cur.replace(/\s+$/, "")); cur = tk;
    } else cur = cand;
  }
  if (cur.trim()) lines.push(cur.replace(/\s+$/, ""));

  const exploded = [];
  for (const ln of lines) {
    if (twTracked(ln, fk, size, tr) > maxW) exploded.push(...wrapTracked(ln, fk, size, maxW, tr));
    else exploded.push(ln);
  }
  lines = exploded;

  if (balance && lines.length === 2 && toks.length > 1) {
    let best = null;
    for (let i = 1; i < toks.length; i++) {
      const a = toks.slice(0, i).join("").replace(/\s+$/, "");
      const b = toks.slice(i).join("").replace(/\s+$/, "");
      const wa = twTracked(a, fk, size, tr), wb = twTracked(b, fk, size, tr);
      if (wa <= maxW && wb <= maxW) {
        const score = [Math.abs(wa - wb), wa >= wb ? 0 : 1];
        if (!best || score[0] < best[0][0] || (score[0] === best[0][0] && score[1] < best[0][1]))
          best = [score, [a, b]];
      }
    }
    if (best) lines = best[1];
  }
  lines = kinsoku(lines, fk, size, maxW, tr);
  lines = fixOrphan(lines, fk, size, maxW, tr);
  return lines.length ? lines : [""];
}

/* ── 자동 맞춤 드로잉 ──────────────────────────────────────────────────── */
/* ── 렌더가 겪은 일 ─────────────────────────────────────────────────────────
 *
 * 이 렌더러는 글이 넘치면 조용히 처리한다 — 폰트를 줄이고, 줄을 접고, 그래도
 * 안 되면 말줄임으로 자른다. 그래서 "잘 들어간 것"과 "억지로 욱여넣은 것"이
 * 화면에서 구별되지 않는다. 커버 제목이 84px 설계인데 48px 로 쪼그라들어도
 * 그림은 나온다 — 시안만 무너질 뿐이다.
 *
 * 글자수를 세어 짐작하는 대신, **그리면서 실제로 무슨 일이 있었는지** 적어 둔다.
 * 폰트 실측과 줄바꿈 규칙이 이미 여기 있으니 이게 가장 정확하다.
 */
let FITREP = null;        // 본 미리보기를 그릴 때만 배열이 된다

function fitSay(field, o) { if (FITREP && field) FITREP.push(Object.assign({ field }, o)); }

function drawFitted(ctx, text, x, y, maxW, fk, size, opt) {
  const o = Object.assign({ minSize: 26, maxLines: 1, fill: "#ffffff", style: null,
                            tracking: null, leading: null }, opt || {});
  const st = TYPO[o.style] || {};
  const trEm = o.tracking === null ? (st.tracking !== undefined ? st.tracking : 0) : o.tracking;
  const ld = o.leading === null ? (st.leading !== undefined ? st.leading : 1.25) : o.leading;

  if (o.maxLines === 1) {
    let s = size, tr = trEm * s;
    while (s > o.minSize && twTracked(text, fk, s, tr) > maxW) {
      s = Math.max(o.minSize, s - 2); tr = trEm * s;
    }
    const drawn = ellipsisTracked(text, fk, s, maxW, tr);
    if (s < size) fitSay(o.field, { kind: "shrink", want: size, got: s, min: o.minSize });
    if (drawn !== oneline(text)) fitSay(o.field, { kind: "cut", n: chars(oneline(text)).length - chars(drawn).length });
    drawTracked(ctx, x, y, drawn, fk, s, o.fill, tr);
    return y + lineAdvance(s, ld);
  }
  const tr = trEm * size;
  let lines = wrapSmart(text, fk, size, maxW, tr, o.maxLines === 2);
  if (lines.length > o.maxLines) {
    fitSay(o.field, { kind: "lines", want: o.maxLines, got: lines.length });
    lines = lines.slice(0, o.maxLines);
    lines[lines.length - 1] = ellipsisTracked(lines[lines.length - 1], fk, size, maxW, tr);
  }
  const advY = lineAdvance(size, ld);
  lines.forEach((ln, i) => drawTracked(ctx, x, y + i * advY, ln, fk, size, o.fill, tr));
  return y + Math.max(1, lines.length) * advY;
}

/* ── 배경 · 공통 요소 ──────────────────────────────────────────────────── */
function fitCover(ctx, img, anchor) {
  const sw = img.naturalWidth || img.width, sh = img.naturalHeight || img.height;
  const scale = Math.max(W / sw, H / sh);
  const nw = Math.trunc(sw * scale), nh = Math.trunc(sh * scale);
  let left = Math.floor((nw - W) / 2);
  let top = anchor === "top" ? 0 : anchor === "bottom" ? nh - H : Math.floor((nh - H) / 2);
  left = Math.max(0, left); top = Math.max(0, top);
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, 0, 0, sw, sh, -left, -top, nw, nh);
}
/* ── 사진 앉히기 ────────────────────────────────────────────────────────────
 *
 * fitCover 는 무조건 틀을 꽉 채우고 넘치는 부분을 잘라낸다. 4:5 가 아닌 사진을
 * 넣으면 가로가 길면 좌우가, 세로가 길면 위아래가 통째로 날아간다. 인물의 손이
 * 잘리거나 로고가 반만 남는 일이 여기서 생긴다.
 *
 * 그래서 사진마다 앉는 방식을 따로 둔다.
 *     z   1 = 전체 보이기(남는 자리는 배경으로) … 커질수록 확대
 *     cx  화면 한가운데에 오는 지점 (0 왼끝 ~ 1 오른끝)
 *     cy  같은 것의 세로
 *     bg  남는 자리 — 'blur' | 'white' | 'black'
 *     snap 가장자리에 붙는 자석
 *
 * fit 이 없으면(= 손대지 않은 사진) 예전 그대로 꽉 채운다. 기존 작업물이
 * 열렸을 때 그림이 달라지면 안 된다.
 */
const FIT_ZMAX = 8;

function fitScales(img) {
  const sw = img.naturalWidth || img.width, sh = img.naturalHeight || img.height;
  return { sw, sh, contain: Math.min(W / sw, H / sh), cover: Math.max(W / sw, H / sh) };
}

/* 꽉 채우려면 z 가 얼마여야 하는가. 4:5 사진이면 1(자를 것이 없다). */
function fitCoverZ(img) {
  const s = fitScales(img);
  return s.contain > 0 ? s.cover / s.contain : 1;
}

function fitNorm(img, fit) {
  const s = fitScales(img);
  const f = Object.assign(
    { z: fitCoverZ(img), cx: 0.5, cy: 0.5, bg: "blur", snap: true }, fit || {});
  f.z = Math.max(1, Math.min(FIT_ZMAX, Number(f.z) || 1));
  const scale = s.contain * f.z;
  const nw = s.sw * scale, nh = s.sh * scale;
  /* 한 가지 식으로 두 경우를 다 가둔다.
       사진이 틀보다 크면  → 빈틈이 생기지 않는 범위
       사진이 틀보다 작으면 → 틀 밖으로 나가지 않는 범위
     두 끝값이 자리를 맞바꿀 뿐이라 min/max 로 정렬하면 같은 식이 된다. */
  const cl = (c, n, size) => {
    if (n <= 0) return 0.5;
    const a = (size / 2) / n, b = (n - size / 2) / n;
    return Math.max(Math.min(a, b), Math.min(Math.max(a, b), Number(c)));
  };
  return { ...s, ...f, scale, nw, nh,
           cx: cl(f.cx, nw, W), cy: cl(f.cy, nh, H) };
}

/* 남는 자리를 원본의 흐린 판으로 채운다.
   ctx.filter 는 사파리 구버전에 없다 — 작게 줄였다가 늘리면 같은 효과가 난다. */
function fitBlurFill(ctx, img) {
  const sw = img.naturalWidth || img.width, sh = img.naturalHeight || img.height;
  const o = document.createElement("canvas");
  o.height = 42; o.width = Math.max(1, Math.round(42 * W / H));
  const oc = o.getContext("2d");
  const k = Math.max(o.width / sw, o.height / sh);
  oc.imageSmoothingQuality = "high";
  oc.drawImage(img, 0, 0, sw, sh,
               (o.width - sw * k) / 2, (o.height - sh * k) / 2, sw * k, sh * k);
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(o, 0, 0, W, H);
  // 뒤가 너무 튀면 앞 사진이 안 산다.
  ctx.fillStyle = "rgba(0,0,0,.28)";
  ctx.fillRect(0, 0, W, H);
}

function drawPhoto(ctx, img, fit) {
  if (!fit) { fitCover(ctx, img, "center"); return; }
  const v = fitNorm(img, fit);
  if (v.nw < W - 0.5 || v.nh < H - 0.5) {
    if (v.bg === "white")      { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H); }
    else if (v.bg === "black") { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H); }
    else                       { fitBlurFill(ctx, img); }
  }
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, 0, 0, v.sw, v.sh,
                Math.round(W / 2 - v.cx * v.nw), Math.round(H / 2 - v.cy * v.nh),
                Math.round(v.nw), Math.round(v.nh));
}

function bottomGradient(ctx, startFrac) {
  const start = Math.trunc(H * startFrac);
  for (let y = start; y < H; y++) {
    const a = Math.trunc(210 * Math.pow((y - start) / (H - start), 1.4));
    if (a <= 0) continue;
    ctx.fillStyle = `rgba(0,0,0,${a / 255})`;
    ctx.fillRect(0, y, W, 1);
  }
}
function darkOverlay(ctx, opacity) {
  ctx.fillStyle = `rgba(0,0,0,${opacity / 255})`;
  ctx.fillRect(0, 0, W, H);
}
function pasteLogo(ctx) {
  const L = IMG.logoSmall; if (!L) return;
  ctx.drawImage(L, 1026 - L.width, 39 + Math.floor((81 - L.height) / 2));
}
const NR_VARIANTS = new Set(["New Release!", "New Released!", "New Release", "New Released"]);
/* PIL 의 textbbox 는 잉크 상자가 아니다. 가로는 원점 0 에서 시작해
   max(반올림한 전진폭, 올림한 잉크 오른끝) 까지, 세로만 잉크에 딱 맞는다.
   태그 가운데 맞춤과 출처 우측 정렬이 이 값을 쓰므로 그대로 흉내 낸다. */
function pilBox(ctx, fk, size, s) {
  const m = ctx.measureText(s);
  const advSum = twTracked(s, fk, size, 0);
  const x1 = Math.max(Math.round(advSum), Math.ceil(m.actualBoundingBoxRight));
  const x0 = Math.min(0, Math.floor(-m.actualBoundingBoxLeft));
  return { w: x1 - x0, h: Math.ceil(m.actualBoundingBoxAscent) + Math.ceil(m.actualBoundingBoxDescent) };
}
function drawTag(ctx, tag) {
  if (!tag) return;
  ctx.fillStyle = "#000000";
  ctx.fillRect(-8, 45, 258, 59);
  const size = 31, tr = (-80 / 1000) * size;
  ctx.font = fontStr("nb", size);
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  const cs = chars(tag), widths = cs.map((ch) => pilBox(ctx, "nb", size, ch).w);
  let total = widths.reduce((a, b) => a + b, 0) + tr * (cs.length - 1);
  const [asc, desc] = metrics("nb", size);
  const ty = 45 + (58 - (asc + desc)) / 2;
  let x = (249 - total) / 2;
  ctx.fillStyle = "#ffffff";
  cs.forEach((ch, i) => { ctx.fillText(ch, x, ty + asc); x += widths[i] + tr; });
}
function applyTag(ctx, tag) {
  if (NR_VARIANTS.has(tag)) { if (IMG.tagNR) ctx.drawImage(IMG.tagNR, 0, 45); return; }
  drawTag(ctx, tag);
}

/* ── 출처 ──────────────────────────────────────────────────────────────── */
const KNOWN_LABELS = ["출처", "제공", "촬영", "직접촬영", "사진", "영상", "자료",
                      "협찬", "취재", "디자인", "그래픽", "번역"];
function splitCredit(raw) {
  let text = (raw || "").trim();
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, "$1").trim();
  if (!text) return ["출처", ""];
  if (text.startsWith("출처:")) text = text.slice(3).trim();
  else if (text.startsWith("출처 :")) text = text.slice(4).trim();
  if (text.includes("|")) {
    const i = text.indexOf("|");
    const label = text.slice(0, i).trim() || "출처";
    return [label, text.slice(i + 1).trim()];
  }
  for (const lab of KNOWN_LABELS) {
    if (text === lab) return [lab, ""];
    for (const sep of [" ", ":", "·", "-"]) {
      if (text.startsWith(lab + sep)) return [lab, text.slice(lab.length + sep.length).trim()];
    }
  }
  return ["출처", text];
}
function drawSource(ctx, source) {
  if (!source) return;
  const [label, value] = splitCredit(source);
  if (!label && !value) return;
  const size = 22;
  ctx.font = fontStr("sb", size);
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "rgb(180,180,180)";
  const asc = metrics("sb", size)[0];
  let y = 1210;
  for (const line of [label, value].filter(Boolean)) {
    const b = pilBox(ctx, "sb", size, line);
    ctx.fillText(line, 1055 - b.w, y + asc);
    y += b.h + 4;
  }
}

/* ── 슬라이드 ──────────────────────────────────────────────────────────── */
function fillEmpty(ctx) { ctx.fillStyle = "rgb(20,20,20)"; ctx.fillRect(0, 0, W, H); }

function slideCover(ctx, img, tag, title, subtitle, source, fit) {
  if (img) drawPhoto(ctx, img, fit); else fillEmpty(ctx);
  bottomGradient(ctx, 0.42);
  pasteLogo(ctx); applyTag(ctx, tag);
  const maxW = TEXT_MAX_X - 76;
  const t = normBreaks(title);
  const SUB_GAP = 16;
  let subtitleY, titleBottom;
  if (t.includes("\n")) {
    let y = 940;
    let parts = t.split("\n").map((q) => q.trim()).filter(Boolean);
    if (parts.length > 2) parts = [parts[0], parts.slice(1).join(" ")];
    for (const part of parts)
      y = drawFitted(ctx, part, 76, y, maxW, "eb", 84,
                     { minSize: 40, maxLines: 1, style: "cover_title", field: "title" });
    titleBottom = y;
    subtitleY = Math.max(y + SUB_GAP, 1057);
  } else {
    const bottom = drawFitted(ctx, t, 76, 940, maxW, "eb", 84,
                              { minSize: 40, maxLines: 2, style: "cover_title", field: "title" });
    titleBottom = bottom;
    subtitleY = Math.max(bottom + SUB_GAP, 1057);
  }
  hit("title", 76, Math.min(940, titleBottom - 40), maxW, Math.max(60, titleBottom - 940));
  hit("subtitle", 87, subtitleY - 6, maxW, 46);
  if (subtitle)
    drawFitted(ctx, subtitle, 87, subtitleY, maxW, "eb", 29,
               { minSize: 18, maxLines: 1, style: "cover_subtitle", field: "subtitle" });
  drawSource(ctx, source);
  hitCommon(tag, source);
}

/* 태그·출처는 모든 장에서 같은 자리다 */
function hitCommon(tag, source) {
  hit("category", 0, 45, 249, 58);
  hit("credit", 720, 1198, 340, 78);
}

function fitCommonHeadingSize(headings, maxW) {
  const em = TYPO.body_heading.tracking;
  let size = HEADING_SIZE;
  for (const h of headings) {
    for (const line of normBreaks(h || "").split("\n").map((x) => x.trim()).filter(Boolean)) {
      while (size > HEADING_MIN && twTracked(line, "eb", size, em * size) > maxW) size -= 2;
    }
  }
  // 소제목은 덱 전체가 같은 크기를 쓴다(한 장만 커 보이면 안 되니까). 그래서
  // 줄어든 것도 여기서 한 번만 알린다 — slideBody 쪽은 이미 정해진 값을 받는다.
  if (size < HEADING_SIZE)
    fitSay("heading", { kind: "shrink", want: HEADING_SIZE, got: size, min: HEADING_MIN,
                        deckWide: true });
  return size;
}

function slideBody(ctx, img, category, heading, bodyText, source, headingSize, fit) {
  if (img) drawPhoto(ctx, img, fit); else fillEmpty(ctx);
  bottomGradient(ctx, 0.35);
  pasteLogo(ctx); applyTag(ctx, category);
  const maxW = TEXT_MAX_X - BODY_LEFT;
  const hasHeading = !!(heading || "").trim();
  const hasBody = !!(bodyText || "").trim();

  const bodyTr = TYPO.body_text.tracking * BODY_SIZE;
  const bodyAdv = lineAdvance(BODY_SIZE, TYPO.body_text.leading);
  let bodyLines = [];
  if (hasBody) {
    for (let para of normBreaks(bodyText).split("\n")) {
      para = para.trim();
      if (!para) { bodyLines.push(""); continue; }
      bodyLines.push(...wrapSmart(para, "eb", BODY_SIZE, maxW, bodyTr, false));
    }
    if (bodyLines.length > BODY_MAX_LINES) {
      fitSay("body", { kind: "lines", want: BODY_MAX_LINES, got: bodyLines.length });
      bodyLines = bodyLines.slice(0, BODY_MAX_LINES);
      bodyLines[bodyLines.length - 1] =
        ellipsisTracked(bodyLines[bodyLines.length - 1], "eb", BODY_SIZE, maxW, bodyTr);
    }
  }
  let bodyBlockH = bodyLines.length * bodyAdv;

  let headLines = [], hSize = 0, headTr = 0, headAdv = 0, headingH = 0;
  if (hasHeading) {
    const em = TYPO.body_heading.tracking;
    hSize = headingSize ? Math.trunc(headingSize) : HEADING_SIZE;
    const parts = normBreaks(heading).split("\n").map((x) => x.trim()).filter(Boolean);
    if (!headingSize) {
      while (hSize > HEADING_MIN &&
             parts.some((x) => twTracked(x, "eb", hSize, em * hSize) > maxW)) hSize -= 2;
    }
    if (hSize < HEADING_SIZE)
      fitSay("heading", { kind: "shrink", want: HEADING_SIZE, got: hSize, min: HEADING_MIN });
    headTr = em * hSize;
    headAdv = lineAdvance(hSize, TYPO.body_heading.leading);
    for (const x of parts) headLines.push(...wrapSmart(x, "eb", hSize, maxW, headTr, false));
    headingH = headLines.length * headAdv;
  }

  let gap = (headLines.length && bodyLines.length) ? Math.round(bodyAdv * BODY_HEAD_GAP) : 0;
  let totalH = headingH + gap + bodyBlockH;
  const avail = BODY_BOTTOM_LIMIT - BODY_TOP_LIMIT;
  while (bodyLines.length && totalH > avail) {
    bodyLines.pop();
    bodyBlockH = bodyLines.length * bodyAdv;
    gap = (headLines.length && bodyLines.length) ? Math.round(bodyAdv * BODY_HEAD_GAP) : 0;
    totalH = headingH + gap + bodyBlockH;
  }

  if (headLines.length || bodyLines.length) {
    const blockTop = Math.max(BODY_BOTTOM_LIMIT - totalH, BODY_TOP_LIMIT);
    if (headLines.length) hit("heading", BODY_LEFT, blockTop - 8, maxW, headingH + 8);
    if (bodyLines.length)
      hit("body", BODY_LEFT, blockTop + headingH + gap - 6, maxW, bodyBlockH + 10);
    headLines.forEach((ln, k) =>
      drawTracked(ctx, BODY_LEFT, blockTop + k * headAdv, ln, "eb", hSize, "#ffffff", headTr));
    let y = blockTop + headingH + gap;
    for (const line of bodyLines) {
      drawTracked(ctx, BODY_LEFT, y, line, "eb", BODY_SIZE, "#ffffff", bodyTr);
      y += bodyAdv;
    }
  } else {
    /* 글이 아직 없는 장 — 눌러서 쓰기 시작할 자리를 열어둔다 */
    hit("heading", BODY_LEFT, 880, maxW, 160);
    hit("body", BODY_LEFT, 1040, maxW, 150);
  }
  if (!headLines.length && bodyLines.length) hit("heading", BODY_LEFT, 700, maxW, 120);
  if (headLines.length && !bodyLines.length) hit("body", BODY_LEFT, 1040, maxW, 150);
  drawSource(ctx, source);
  hitCommon(category, source);
}

function slideLast(ctx, img, tag, source, fit) {
  if (img) drawPhoto(ctx, img, fit); else fillEmpty(ctx);
  darkOverlay(ctx, 140);
  pasteLogo(ctx); applyTag(ctx, tag);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(384, 529, 312, 3);
  ctx.fillRect(384, 822, 312, 3);
  ctx.fillRect(384, 529, 3, 296);
  ctx.fillRect(693, 529, 3, 296);
  const B = IMG.logoBig;
  if (B) ctx.drawImage(B, 435 + Math.floor((210 - B.width) / 2),
                          606 + Math.floor((132 - B.height) / 2));
  drawFitted(ctx, SLOGAN, 178, 841, TEXT_MAX_X - 178, "sb", 37,
             { minSize: 24, maxLines: 1 });
  drawSource(ctx, source);
  hit("category", 0, 45, 249, 58);
}

/* ── 에셋(폰트·로고) 준비 ─────────────────────────────────────────────── */
const IMG = {};
function b64ToBuf(b64) {
  const bin = atob(b64), buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}
function loadPng(entry) {
  return new Promise((res) => {
    if (!entry) return res(null);
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => res(null);
    im.src = "data:image/png;base64," + entry.png;
  });
}
async function bootAssets() {
  await Promise.all(["eb", "sb", "nb"].map(async (k) => {
    const f = ASSETS.fonts[k];
    const face = new FontFace(f.name, await (await fetch(f.url)).arrayBuffer());
    await face.load();
    document.fonts.add(face);
    f.woff2 = null;
  }));
  IMG.logoSmall = await loadPng(ASSETS.logoSmall);
  IMG.logoBig = await loadPng(ASSETS.logoBig);
  IMG.tagNR = await loadPng(ASSETS.tagNR);
}

/* ── Claude 기능은 있으면 쓰고 없으면 브라우저 것으로 돌아간다 ─────────── */
async function useCap(name) {
  try {
    if (!window.claude || typeof claude.use !== "function") return null;
    return await claude.use(name);
  } catch (e) { return null; }
}

/* ── 저장소: Claude db 가 있으면 그쪽, 없으면 이 기기의 IndexedDB ──────── */
const Store = {
  mode: "local", db: null, idb: null,
  async init() {
    const d = await useCap("db");
    if (d) { this.db = d; this.mode = "db"; return; }
    this.idb = await new Promise((res) => {
      const rq = indexedDB.open("plot-carousel", 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore("decks", { keyPath: "id" });
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => res(null);
    });
  },
  _tx(mode) {
    return this.idb.transaction("decks", mode).objectStore("decks");
  },
  async list() {
    if (this.mode === "db") {
      const snap = await this.db.collection("decks").orderBy("updatedAt", "desc").limit(50).get();
      const rows = [];
      snap.forEach((doc) => rows.push(Object.assign({ id: doc.id }, doc.data())));
      return rows;
    }
    if (!this.idb) return [];
    return new Promise((res) => {
      const rq = this._tx("readonly").getAll();
      rq.onsuccess = () => res((rq.result || [])
        .map((r) => ({ id: r.id, name: r.name, category: r.category, caption: r.caption,
                       updatedAt: r.updatedAt, slides: r.slides }))
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)));
      rq.onerror = () => res([]);
    });
  },
  async put(id, meta, images) {
    if (this.mode === "db") {
      await this.db.doc("decks/" + id).set(meta);
      for (let i = 0; i < images.length; i++) {
        const ref = this.db.doc(`decks/${id}/img/${i}`);
        if (images[i]) await ref.set({ d: images[i] });
        else await ref.delete().catch(() => {});
      }
      return;
    }
    if (!this.idb) throw new Error("이 브라우저에서는 저장을 쓸 수 없습니다");
    await new Promise((res, rej) => {
      const rq = this._tx("readwrite").put(Object.assign({ id, images }, meta));
      rq.onsuccess = res; rq.onerror = () => rej(rq.error);
    });
  },
  async images(id, count) {
    if (this.mode === "db") {
      const out = [];
      for (let i = 0; i < count; i++) {
        try {
          const snap = await this.db.doc(`decks/${id}/img/${i}`).get();
          const v = snap.data();
          out.push(v && v.d ? v.d : null);
        } catch (e) { out.push(null); }
      }
      return out;
    }
    return new Promise((res) => {
      const rq = this._tx("readonly").get(id);
      rq.onsuccess = () => res((rq.result && rq.result.images) || []);
      rq.onerror = () => res([]);
    });
  },
  async del(id) {
    if (this.mode === "db") { await this.db.doc("decks/" + id).delete(); return; }
    await new Promise((res) => { const rq = this._tx("readwrite").delete(id); rq.onsuccess = res; rq.onerror = res; });
  },
};

/* ── 글 검사 ────────────────────────────────────────────────────────────────
 *
 * 두 가지를 본다.
 *   ① 렌더가 겪은 일 — 폰트가 줄었나, 줄이 잘렸나, 말줄임이 붙었나.
 *      글자수를 세는 것보다 정확하다. 실제로 그려 보고 얻은 값이니까.
 *   ② 글 자체 — 자주 틀리는 맞춤법·띄어쓰기, 너무 긴 문장, 같은 어미 반복.
 *      규칙으로만 본다. 문맥을 모르니 놓치는 것이 있고, 그래서 '확실한 것'만 담았다.
 *      애매하면 아예 말하지 않는다 — 틀린 지적이 쌓이면 다음부터 안 읽는다.
 */
const FIELD_KO = { title: "커버 제목", subtitle: "커버 부제", heading: "소제목",
                   body: "본문", credit: "출처", category: "카테고리" };

/* 규칙: [찾을 것, 이름, 고칠 말]. 되도록 '거의 항상 틀린' 것만 둔다. */
const SPELL = [
  // '되요' 는 앞에 무엇이 오든 거의 항상 틀린다 — '안되요' 를 놓치면 안 된다.
  [/되요/g, "되요 → 돼요", "돼요"],
  [/됬/g, "됬 → 됐", "됐"],
  [/안\s?되(?=[다어었지요])/g, "안되다 → 안 되다 (부정은 띄어 쓴다)", "안 되"],
  [/(?<![가-힣])몇일(?![가-힣])/g, "몇일 → 며칠", "며칠"],
  [/(?<![가-힣])오랫만/g, "오랫만 → 오랜만", "오랜만"],
  [/(?<![가-힣])어떻해(?![가-힣])/g, "어떻해 → 어떡해", "어떡해"],
  [/(?<![가-힣])역활/g, "역활 → 역할", "역할"],
  [/(?<![가-힣])금새(?![가-힣])/g, "금새 → 금세", "금세"],
  [/(?<![가-힣])왠만/g, "왠만 → 웬만", "웬만"],
  [/(?<![가-힣])웬지(?![가-힣])/g, "웬지 → 왠지", "왠지"],
  [/(?<![가-힣])일일히(?![가-힣])/g, "일일히 → 일일이", "일일이"],
  [/(?<![가-힣])갯수(?![가-힣])/g, "갯수 → 개수", "개수"],
  [/(?<![가-힣])뭐에요(?![가-힣])/g, "뭐에요 → 뭐예요", "뭐예요"],
  [/([가-힣])로서(?=\s|$|[,.])/g, "로서/로써 — 자격이면 '로서', 수단이면 '로써'", null],
  [/(?<=[가-힣])율(?=\s|$|[,.])/g, null, null],   // 아래에서 따로 본다
  [/할수(?![가-힣])/g, "할수 → 할 수", "할 수"],
  [/(?<![가-힣])(수있|수없)/g, "수있다·수없다 → 수 있다·수 없다", null],
  [/([가-힣])지않/g, "-지않 → -지 않", null],
  [/([가-힣])같은경우/g, "같은경우 → 같은 경우", null],
  [/  +/g, "공백이 두 칸 이상입니다", " "],
  [/\s+([,.!?])/g, "문장부호 앞에 공백이 있습니다", "$1"],
];

/* '-율/-률' 은 앞 글자에 따라 갈린다. 받침이 없거나 ㄴ 이면 '율'. */
function checkYul(t) {
  const out = [];
  // 조사가 붙어도 잡아야 한다 — '비률이' 에서 뒤 글자를 막으면 못 본다.
  const re = /([가-힣])(율|률)(?=[이가은는을를에의로도과와만]|\s|$|[,.!?])/g;
  let m;
  while ((m = re.exec(t))) {
    const code = m[1].charCodeAt(0) - 0xac00;
    if (code < 0 || code > 11171) continue;
    const jong = code % 28;                       // 0 = 받침 없음, 4 = ㄴ
    const want = (jong === 0 || jong === 4) ? "율" : "률";
    if (m[2] !== want) out.push(`${m[1]}${m[2]} → ${m[1]}${want}`);
  }
  return out;
}

function lintText(field, text) {
  const t = (text || "").trim();
  const msgs = [];
  if (!t) return msgs;
  for (const [re, name] of SPELL) {
    if (!name) continue;
    re.lastIndex = 0;
    if (re.test(t)) msgs.push(name);
  }
  checkYul(t).forEach((x) => msgs.push(x));
  // 한 문장이 너무 길면 카드에서 읽히지 않는다.
  if (field === "body") {
    const longest = t.split(/(?<=[.!?])\s+|\n/).map((x) => x.trim())
                     .filter(Boolean).sort((a, b) => b.length - a.length)[0] || "";
    if (longest.length > 90) msgs.push(`한 문장이 ${longest.length}자입니다 — 둘로 나누면 읽기 쉬워집니다`);
    // 같은 어미가 내리 세 번이면 글이 단조로워진다.
    const ends = t.split(/(?<=[.!?])\s+/).map((x) => x.trim()).filter(Boolean)
                  .map((x) => x.replace(/[.!?]+$/, "").slice(-2));
    for (let i = 0; i + 2 < ends.length; i++)
      if (ends[i] && ends[i] === ends[i + 1] && ends[i] === ends[i + 2]) {
        msgs.push(`'${ends[i]}' 로 끝나는 문장이 내리 세 번입니다`); break;
      }
  }
  return [...new Set(msgs)];
}

/* 렌더가 남긴 기록 → 사람이 읽을 말. */
function lintFromRender(rep) {
  const by = {};
  for (const r of rep || []) (by[r.field] = by[r.field] || []).push(r);
  const out = [];
  for (const [f, list] of Object.entries(by)) {
    const ko = FIELD_KO[f] || f;
    const sh = list.find((r) => r.kind === "shrink");
    const cut = list.find((r) => r.kind === "cut");
    const ln = list.find((r) => r.kind === "lines");
    if (sh) out.push({ lv: sh.got <= sh.min ? "bad" : "warn",
      m: `${ko} — ${sh.want}px 로 설계됐는데 ${sh.got}px 까지 줄었습니다`
         + (sh.deckWide ? " (가장 긴 소제목에 맞춰 전 장이 같이 줄어듭니다)" : "")
         + (sh.got <= sh.min ? " · 더는 못 줄입니다" : "") });
    if (ln) out.push({ lv: "bad", m: `${ko} — ${ln.got}줄이 됐습니다. ${ln.want}줄까지만 들어갑니다` });
    if (cut) out.push({ lv: "bad", m: `${ko} — 끝이 ${cut.n}자 잘려 …로 끝납니다` });
  }
  return out;
}

function runLint() {
  const box = document.getElementById("lintBox");
  if (!box || !deck) return;
  const sl = deck.slides[cur];
  const items = sl ? lintFromRender(FITREP) : [];
  if (sl) {
    for (const f of ["title", "subtitle", "heading", "body", "credit"]) {
      for (const m of lintText(f, sl[f]))
        items.push({ lv: "tip", m: `${FIELD_KO[f]} — ${m}` });
    }
  }
  // 태그 문자열이 어긋나면 디자인된 PNG 태그 대신 밋밋한 글자 태그가 나온다.
  const tag = (deck.category || "").trim();
  if (/new\s*release/i.test(tag) && !NR_VARIANTS.has(tag))
    items.push({ lv: "warn", m: `카테고리 — '${tag}' 는 디자인 태그가 안 붙습니다. 'New Release!' 로 적어 주세요` });

  // 여기 담기는 말에는 사용자가 쓴 글자가 섞인다. 문자열로 붙이지 않고
  // textContent 로 넣는다 — 제목에 <b> 를 적었다고 화면이 망가지면 안 된다.
  box.hidden = !items.length;
  box.replaceChildren();
  if (!items.length) return;
  const h = document.createElement("div");
  h.className = "lintHead"; h.textContent = "글 검사 " + items.length + "건";
  box.appendChild(h);
  for (const i of items) {
    const d = document.createElement("div");
    d.className = "lintItem " + i.lv; d.textContent = i.m;
    box.appendChild(d);
  }
}

/* ── 상태 ──────────────────────────────────────────────────────────────── */
const blankCover = () => ({ kind: "cover", title: "", subtitle: "", heading: "", body: "", credit: "", srcUrl: "", img: null, el: null, fit: null });
const blankBody  = () => ({ kind: "body",  title: "", subtitle: "", heading: "", body: "", credit: "", srcUrl: "", img: null, el: null,
  // null = 손대지 않음(예전처럼 꽉 채우기). 만지면 {z,cx,cy,bg,snap} 가 들어간다.
  fit: null });

let deck = null, cur = 0, dirty = false, deckId = null;

/* ── 캔버스 ────────────────────────────────────────────────────────────── */
const stage = document.getElementById("stage");
const sctx = stage.getContext("2d");
const off = document.createElement("canvas");
off.width = 1080; off.height = 1350;
const octx = off.getContext("2d");

const lit = (v) => (v || "").replace(/\|/g, "\\|");

function headingSizeForDeck() {
  return fitCommonHeadingSize(deck.slides.slice(1).map((s) => lit(s.heading || "")), 1060 - 76);
}
function paint(ctx, i, track) {
  TRACK = !!track;
  if (track) HITS.length = 0;
  ctx.clearRect(0, 0, 1080, 1350);
  const tag = deck.category || "";
  if (i >= deck.slides.length) {
    // 엔딩은 커버 사진을 그대로 받는다 — 앉히는 방식도 같이 받아야 그림이 같다.
    slideLast(ctx, deck.slides[0] && deck.slides[0].el, tag, "",
              deck.slides[0] && deck.slides[0].fit);
  } else {
    const s = deck.slides[i];
    if (i === 0) slideCover(ctx, s.el, tag, lit(s.title), s.subtitle, s.credit, s.fit);
    else slideBody(ctx, s.el, tag, lit(s.heading), lit(s.body), s.credit,
                   headingSizeForDeck(), s.fit);
  }
  TRACK = false;
}
let paintTimer = null;
function repaint(now) {
  clearTimeout(paintTimer);
  const run = () => {
    FITREP = [];                       // 본 미리보기를 그리는 동안만 적는다
    paint(sctx, cur, true);
    const got = FITREP; FITREP = null; // 섬네일 렌더가 섞이지 않게 바로 끈다
    FITREP = got;
    layoutHotspots(); scheduleThumbs();
    try { runLint(); } catch (_) {}
    FITREP = null;
  };
  if (now) run(); else paintTimer = setTimeout(run, 90);
}

/* ── 눌러서 고치기 ─────────────────────────────────────────────────────── */
const KIND = {
  title:    { label: "제목",   hint: "엔터로 줄을 나눕니다",              multi: true },
  subtitle: { label: "부제",   hint: "한 줄로 들어갑니다",                multi: false },
  heading:  { label: "소제목", hint: "엔터로 줄을 나눕니다",              multi: true },
  body:     { label: "본문",   hint: "엔터로 문단을 나눕니다 · 최대 8줄", multi: true },
  credit:   { label: "출처",   hint: "‘제공 | 하이브’ 처럼 라벨을 바꿀 수 있어요", multi: false },
  category: { label: "카테고리", hint: "좌상단 태그 · 비우면 태그가 사라집니다", multi: false },
};
const hotBox = document.getElementById("hot");
const quick = document.getElementById("quick");
const qInput = document.getElementById("qinput");
let quickKind = null;

function layoutHotspots() {
  hotBox.innerHTML = "";
  const isEnd = cur >= deck.slides.length;
  for (const h of HITS) {
    if (isEnd && h.kind !== "category") continue;
    const d = document.createElement("button");
    d.type = "button";
    d.className = "hs";
    d.style.left = (h.x / 1080 * 100) + "%";
    d.style.top = (h.y / 1350 * 100) + "%";
    d.style.width = (h.w / 1080 * 100) + "%";
    d.style.height = (h.h / 1350 * 100) + "%";
    d.title = KIND[h.kind].label + " 고치기";
    d.setAttribute("aria-label", KIND[h.kind].label + " 고치기");
    d.dataset.kind = h.kind;
    d.dataset.cy = String(h.y + h.h / 2);
    d.onclick = (e) => { e.stopPropagation(); openQuick(h.kind, h.y + h.h / 2); };
    hotBox.appendChild(d);
  }
  const s = deck.slides[cur];
  const hintBtn = document.getElementById("photoHint");
  hintBtn.hidden = isEnd || !!(s && s.img);
}
function readKind(kind) {
  if (kind === "category") return deck.category;
  return deck.slides[cur][kind] || "";
}
function writeKind(kind, v) {
  if (kind === "category") deck.category = v;
  else deck.slides[cur][kind] = v;
}
function openQuick(kind, centerY) {
  quickKind = kind;
  const k = KIND[kind];
  document.getElementById("qlabel").textContent = k.label;
  document.getElementById("qhint").textContent = k.hint;
  qInput.value = readKind(kind);
  qInput.rows = k.multi ? 3 : 1;
  qInput.classList.toggle("single", !k.multi);
  quick.classList.toggle("top", centerY > 675);
  quick.hidden = false;
  qInput.focus();
  qInput.setSelectionRange(qInput.value.length, qInput.value.length);
}
function closeQuick() { quick.hidden = true; quickKind = null; }
qInput.addEventListener("input", () => {
  if (!quickKind) return;
  let v = qInput.value;
  if (!KIND[quickKind].multi) v = v.replace(/[\r\n]+/g, " ");
  writeKind(quickKind, v);
  markDirty();
  repaint();
  syncFieldValue(quickKind);
});
qInput.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeQuick(); }
  if (e.key === "Enter" && !KIND[quickKind].multi) { e.preventDefault(); closeQuick(); }
});
document.getElementById("qdone").onclick = () => { closeQuick(); syncAll(); };

/* ── 슬라이드 레일 ─────────────────────────────────────────────────────── */
const rail = document.getElementById("rail");
let thumbTimer = null;
function scheduleThumbs() {
  clearTimeout(thumbTimer);
  thumbTimer = setTimeout(drawThumbs, 450);
}
function buildRail() {
  rail.innerHTML = "";
  const total = deck.slides.length + 1;
  for (let i = 0; i < total; i++) {
    const btn = document.createElement("button");
    btn.className = "thumb" + (i === cur ? " on" : "");
    btn.type = "button";
    const cv = document.createElement("canvas");
    cv.width = 152; cv.height = 190;
    btn.appendChild(cv);
    const lab = document.createElement("span");
    lab.textContent = i === 0 ? "커버" : i >= deck.slides.length ? "엔딩" : String(i);
    btn.appendChild(lab);
    btn.onclick = () => { closeQuick(); cur = i; syncAll(); };
    rail.appendChild(btn);
  }
  const add = document.createElement("button");
  add.className = "thumb add";
  add.type = "button";
  add.innerHTML = "<span class='plus'>+</span><span>슬라이드</span>";
  add.onclick = () => {
    const pos = Math.max(1, Math.min(cur + 1, deck.slides.length));
    deck.slides.splice(pos, 0, blankBody());
    cur = pos;
    closeQuick(); markDirty(); buildRail(); syncAll();
  };
  rail.appendChild(add);
  drawThumbs();
}
function drawThumbs() {
  const nodes = rail.querySelectorAll(".thumb:not(.add) canvas");
  nodes.forEach((cv, i) => {
    paint(octx, i, false);
    const c = cv.getContext("2d");
    c.clearRect(0, 0, cv.width, cv.height);
    c.imageSmoothingQuality = "high";
    c.drawImage(off, 0, 0, cv.width, cv.height);
  });
}

/* ── 아래쪽 편집 폼 ────────────────────────────────────────────────────── */
const fields = document.getElementById("fields");
const slideMeta = document.getElementById("slideMeta");
const fieldNodes = {};

function field(kind, value, onInput) {
  const k = KIND[kind];
  const wrap = document.createElement("label");
  wrap.className = "field";
  const head = document.createElement("span");
  head.className = "flabel";
  head.textContent = k.label;
  const h = document.createElement("em");
  h.textContent = k.hint;
  head.appendChild(h);
  const input = k.multi ? document.createElement("textarea") : document.createElement("input");
  if (!k.multi) input.type = "text";
  input.value = value || "";
  if (k.multi) input.rows = kind === "body" ? 5 : 3;
  input.addEventListener("input", () => { onInput(input.value); markDirty(); repaint(); });
  wrap.append(head, input);
  fieldNodes[kind] = input;
  return wrap;
}
function plainField(label, hint, value, onInput) {
  const wrap = document.createElement("label");
  wrap.className = "field";
  const head = document.createElement("span");
  head.className = "flabel";
  head.textContent = label;
  const h = document.createElement("em");
  h.textContent = hint;
  head.appendChild(h);
  const input = document.createElement("input");
  input.type = "text";
  input.value = value || "";
  input.addEventListener("input", () => { onInput(input.value); markDirty(); repaint(); });
  wrap.append(head, input);
  return wrap;
}
function syncFieldValue(kind) {
  const n = fieldNodes[kind];
  if (n && n.value !== readKind(kind)) n.value = readKind(kind);
  if (kind === "category") {
    const c = document.getElementById("catInput");
    if (c.value !== deck.category) c.value = deck.category;
  }
}
function syncFields() {
  fields.innerHTML = "";
  for (const k in fieldNodes) delete fieldNodes[k];
  const isEnd = cur >= deck.slides.length;
  slideMeta.textContent = isEnd ? "엔딩 — 커버 사진을 그대로 쓰고 로고와 슬로건이 들어갑니다"
    : cur === 0 ? "커버 — 캐러셀 첫 장" : `본문 ${cur}번째 장`;
  document.getElementById("delBtn").style.display =
    (!isEnd && cur > 0 && deck.slides.length > 1) ? "" : "none";
  document.getElementById("moveBtns").style.display = (!isEnd && cur > 0) ? "" : "none";
  document.getElementById("photoRow").style.display = isEnd ? "none" : "";
  if (isEnd) return;

  const s = deck.slides[cur];
  if (cur === 0) {
    fields.append(field("title", s.title, (v) => (s.title = v)),
                  field("subtitle", s.subtitle, (v) => (s.subtitle = v)));
  } else {
    fields.append(field("heading", s.heading, (v) => (s.heading = v)),
                  field("body", s.body, (v) => (s.body = v)));
  }
  fields.append(field("credit", s.credit, (v) => (s.credit = v)),
                plainField("소스 주소", "양식으로 넘길 때만 쓰입니다 (미리보기에는 안 보임)",
                           s.srcUrl, (v) => (s.srcUrl = v)));
}

function syncAll() {
  document.querySelectorAll(".thumb").forEach((t, i) => t.classList.toggle("on", i === cur));
  document.getElementById("counter").textContent = `${cur + 1} / ${deck.slides.length + 1}`;
  syncFields();
  if (fitMode && !fitActive()) fitExit();
  fitPaintBar();
  repaint(true);
  const t = rail.children[cur];
  if (t && t.scrollIntoView) t.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
}

/* ── 사진 맞추기 ────────────────────────────────────────────────────────────
 *
 * 4:5 가 아닌 사진을 억지로 채우면 원본이 잘린다. 여기서는 끌어서 자리를 잡고,
 * 두 손가락(또는 휠)으로 크기를 바꾸고, 남는 자리를 무엇으로 채울지 고른다.
 * 가장자리 근처에서는 자석이 붙여 준다 — 손으로 1px 을 맞출 수는 없다.
 */
const FIT_SNAP_PX = 22;      // 1080 기준. 이 안에 들어오면 가장자리에 붙인다.
let fitMode = false;
let fitDrag = null;
let fitPts  = null;          // 손가락 두 개

function fitSlide() { return deck.slides[cur]; }
function fitActive() { const s = fitSlide(); return s && s.el ? s : null; }

/* 손대지 않은 사진은 fit 이 없다(= 예전처럼 꽉 채우기).
   한 번이라도 만지면 그때의 모습 그대로를 값으로 굳혀 둔다. */
function fitEnsure(sl) {
  if (!sl.fit) sl.fit = { z: fitCoverZ(sl.el), cx: .5, cy: .5, bg: "blur", snap: true };
  return sl.fit;
}

function fitSetZoom(sl, z, ax, ay) {
  const f = fitEnsure(sl);
  const before = fitNorm(sl.el, f);
  f.z = Math.max(1, Math.min(FIT_ZMAX, z));
  const after = fitNorm(sl.el, f);
  // 집은 지점을 붙잡아 둔다 — 안 그러면 확대할 때마다 보던 곳이 달아난다.
  if (ax != null && before.nw > 0 && after.nw > 0) {
    f.cx = before.cx + (ax - 0.5) * (W / before.nw - W / after.nw);
    f.cy = before.cy + (ay - 0.5) * (H / before.nh - H / after.nh);
  }
  Object.assign(f, { cx: fitNorm(sl.el, f).cx, cy: fitNorm(sl.el, f).cy });
}

/* 가장자리에 가까우면 붙인다. 후보는 왼끝·가운데·오른끝 셋뿐이다. */
function fitSnapAxis(c, n, size) {
  const cands = [(size / 2) / n, 0.5, (n - size / 2) / n];
  let best = c, bestD = Infinity;
  for (const t of cands) {
    const d = Math.abs((c - t) * n);       // 화면에서 몇 px 떨어졌나
    if (d < bestD) { bestD = d; best = t; }
  }
  return bestD <= FIT_SNAP_PX ? best : c;
}

function fitApplySnap(sl) {
  const f = sl.fit; if (!f || !f.snap) return;
  const v = fitNorm(sl.el, f);
  f.cx = fitSnapAxis(v.cx, v.nw, W);
  f.cy = fitSnapAxis(v.cy, v.nh, H);
}

function fitPaintBar() {
  const sl = fitActive();
  const bar = document.getElementById("fitBar");
  const btn = document.getElementById("photoFitBtn");
  if (btn) btn.hidden = !sl;
  if (!bar) return;
  bar.hidden = !(fitMode && sl);
  if (bar.hidden) return;
  // 여기서 fitEnsure 를 부르면 '되돌리기' 로 비운 값이 곧바로 되살아난다.
  // 화면에 보여줄 값은 fitNorm 이 null 도 알아서 채워 준다.
  const f = sl.fit || fitNorm(sl.el, null), v = fitNorm(sl.el, sl.fit);
  const coverZ = fitCoverZ(sl.el);
  bar.querySelectorAll("[data-bg]").forEach((b) =>
    b.classList.toggle("on", b.dataset.bg === f.bg));
  bar.querySelector('[data-fit="cover"]').classList.toggle("on", Math.abs(f.z - coverZ) < .01);
  bar.querySelector('[data-fit="contain"]').classList.toggle("on", Math.abs(f.z - 1) < .01);
  const sb = document.getElementById("fitSnap");
  sb.textContent = f.snap ? "자석 켬" : "자석 끔";
  sb.classList.toggle("on", !!f.snap);
  const gap = (v.nw < W - .5 || v.nh < H - .5);
  document.getElementById("fitNow").textContent =
    Math.round(f.z / coverZ * 100) + "% · " + (gap ? "남는 자리 있음" : "꽉 참");
}

function fitEnter() {
  const sl = fitActive(); if (!sl) return;
  fitEnsure(sl);
  fitMode = true;
  document.getElementById("hot").hidden = true;
  document.getElementById("fitLayer").hidden = false;
  fitPaintBar(); repaint(true);
}

function fitExit() {
  fitMode = false;
  document.getElementById("hot").hidden = false;
  document.getElementById("fitLayer").hidden = true;
  fitPaintBar(); repaint(true);
}

/* 화면 좌표 → 틀 좌표(0~1). 미리보기는 축소돼 있으므로 비율로 바꾼다. */
function fitAt(e, rect) {
  return { x: (e.clientX - rect.left) / rect.width,
           y: (e.clientY - rect.top) / rect.height };
}

function fitDown(e) {
  const sl = fitActive(); if (!sl) return;
  const layer = document.getElementById("fitLayer");
  if (e.pointerType === "touch") {
    fitPts = fitPts || new Map();
    fitPts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (fitPts.size === 2) {
      const p = [...fitPts.values()];
      const rect = layer.getBoundingClientRect();
      fitDrag = null;
      fitPts.pinch = {
        d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1,
        z: fitEnsure(sl).z,
        ax: ((p[0].x + p[1].x) / 2 - rect.left) / rect.width,
        ay: ((p[0].y + p[1].y) / 2 - rect.top) / rect.height,
      };
      return;
    }
  }
  const rect = layer.getBoundingClientRect();
  const f = fitEnsure(sl);
  fitDrag = { at: fitAt(e, rect), cx: f.cx, cy: f.cy, rect };
  layer.classList.add("drag");
  try { layer.setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
}

function fitMove(e) {
  const sl = fitActive(); if (!sl) return;
  if (fitPts && fitPts.has(e.pointerId)) fitPts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (fitPts && fitPts.pinch && fitPts.size === 2) {
    const p = [...fitPts.values()];
    const nd = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1;
    fitSetZoom(sl, fitPts.pinch.z * (nd / fitPts.pinch.d), fitPts.pinch.ax, fitPts.pinch.ay);
    fitPaintBar(); repaint(true);
    return;
  }
  if (!fitDrag) return;
  const now = fitAt(e, fitDrag.rect);
  const f = sl.fit, v = fitNorm(sl.el, f);
  // 손가락이 움직인 만큼 사진이 따라온다 — 미는 방향과 보이는 방향이 같아야 한다.
  f.cx = fitDrag.cx - (now.x - fitDrag.at.x) * (W / v.nw);
  f.cy = fitDrag.cy - (now.y - fitDrag.at.y) * (H / v.nh);
  fitApplySnap(sl);
  Object.assign(f, { cx: fitNorm(sl.el, f).cx, cy: fitNorm(sl.el, f).cy });
  fitPaintBar(); repaint(true);
}

function fitUp(e) {
  if (fitPts) { fitPts.delete(e.pointerId); if (fitPts.size < 2) fitPts.pinch = null; }
  if (!fitDrag) return;
  fitDrag = null;
  document.getElementById("fitLayer").classList.remove("drag");
  markDirty && markDirty();
}

function bindFit() {
  const layer = document.getElementById("fitLayer");
  if (!layer) return;
  layer.addEventListener("pointerdown", fitDown);
  layer.addEventListener("pointermove", fitMove);
  layer.addEventListener("pointerup", fitUp);
  layer.addEventListener("pointercancel", fitUp);
  layer.addEventListener("wheel", (e) => {
    const sl = fitActive(); if (!sl) return;
    e.preventDefault();
    const rect = layer.getBoundingClientRect(), at = fitAt(e, rect);
    fitSetZoom(sl, fitEnsure(sl).z * (e.deltaY < 0 ? 1.12 : 1 / 1.12), at.x, at.y);
    fitPaintBar(); repaint(true); markDirty && markDirty();
  }, { passive: false });
  layer.addEventListener("dblclick", () => {
    const sl = fitActive(); if (!sl) return;
    const f = fitEnsure(sl), coverZ = fitCoverZ(sl.el);
    fitSetZoom(sl, Math.abs(f.z - coverZ) < .01 ? 1 : coverZ);
    fitPaintBar(); repaint(true); markDirty && markDirty();
  });

  document.getElementById("photoFitBtn").onclick = () => fitMode ? fitExit() : fitEnter();
  document.getElementById("fitDone").onclick = fitExit;
  document.getElementById("fitSnap").onclick = () => {
    const sl = fitActive(); if (!sl) return;
    const f = fitEnsure(sl); f.snap = !f.snap; fitPaintBar();
  };
  document.querySelectorAll("[data-bg]").forEach((b) => {
    b.onclick = () => {
      const sl = fitActive(); if (!sl) return;
      fitEnsure(sl).bg = b.dataset.bg;
      fitPaintBar(); repaint(true); markDirty && markDirty();
    };
  });
  document.querySelectorAll("[data-fit]").forEach((b) => {
    b.onclick = () => {
      const sl = fitActive(); if (!sl) return;
      const f = fitEnsure(sl);
      const k = b.dataset.fit;
      if (k === "cover")        fitSetZoom(sl, fitCoverZ(sl.el));
      else if (k === "contain") fitSetZoom(sl, 1);
      else if (k === "zoomin")  fitSetZoom(sl, f.z * 1.15, .5, .5);
      else if (k === "zoomout") fitSetZoom(sl, f.z / 1.15, .5, .5);
      else if (k === "reset")   sl.fit = null;
      fitPaintBar(); repaint(true); markDirty && markDirty();
    };
  });
}

/* ── 사진 ──────────────────────────────────────────────────────────────── */
function downscale(dataUrl) {
  return new Promise((res) => {
    const im = new Image();
    im.onload = () => {
      let w = im.width, h = im.height;
      const k = Math.min(1, 2000 / Math.max(w, h));
      const cw = Math.round(w * k), ch = Math.round(h * k);
      const c = document.createElement("canvas");
      c.width = cw; c.height = ch;
      const cx = c.getContext("2d");
      cx.imageSmoothingQuality = "high";
      cx.drawImage(im, 0, 0, cw, ch);
      let q = 0.9, out = c.toDataURL("image/jpeg", q);
      while (out.length > 740000 && q > 0.45) { q -= 0.1; out = c.toDataURL("image/jpeg", q); }
      res(out);
    };
    im.onerror = () => res(null);
    im.src = dataUrl;
  });
}
function attachImage(slide, dataUrl) {
  return new Promise((res) => {
    const im = new Image();
    im.onload = () => { slide.img = dataUrl; slide.el = im; slide.fit = null; res(true); };
    im.onerror = () => res(false);
    im.src = dataUrl;
  });
}
function readFile(f) {
  return new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });
}
async function addPhotos(files) {
  const imgs = Array.from(files).filter((f) => f.type.startsWith("image/"));
  if (!imgs.length) return;
  toast(imgs.length > 1 ? `사진 ${imgs.length}장 넣는 중…` : "사진 넣는 중…");
  let idx = cur >= deck.slides.length ? 0 : cur;
  for (const f of imgs) {
    if (idx >= deck.slides.length) break;
    const small = await downscale(await readFile(f));
    if (small) await attachImage(deck.slides[idx], small);
    idx++;
  }
  markDirty(); syncAll();
  toast("사진을 넣었습니다");
}
const photoInput = document.getElementById("photoInput");
function pickPhoto() { photoInput.value = ""; photoInput.click(); }
photoInput.addEventListener("change", (e) => addPhotos(e.target.files || []));
document.getElementById("photoBtn").onclick = pickPhoto;
document.getElementById("photoHint").onclick = pickPhoto;
document.getElementById("photoClear").onclick = () => {
  const s = deck.slides[cur];
  if (!s) return;
  // 사진을 빼면 앉히는 방식도 같이 버린다 — 다음 사진에 남의 자리가 적용되면 안 된다.
  s.img = null; s.el = null; s.fit = null;
  if (fitMode) fitExit();
  markDirty(); syncAll();
};
bindFit();
const canvasBox = document.getElementById("canvasbox");
canvasBox.addEventListener("click", (e) => {
  if (e.target === stage && !quick.hidden) closeQuick();
});
["dragenter", "dragover"].forEach((ev) => canvasBox.addEventListener(ev, (e) => {
  e.preventDefault(); canvasBox.classList.add("drop");
}));
["dragleave", "drop"].forEach((ev) => canvasBox.addEventListener(ev, (e) => {
  e.preventDefault(); canvasBox.classList.remove("drop");
}));
canvasBox.addEventListener("drop", (e) => {
  if (e.dataTransfer && e.dataTransfer.files) addPhotos(e.dataTransfer.files);
});
window.addEventListener("paste", (e) => {
  const items = (e.clipboardData && e.clipboardData.files) || [];
  if (items.length) addPhotos(items);
});

/* ── 양식 ──────────────────────────────────────────────────────────────── */
const esc = (v) => lit(v).replace(/\r/g, "").split("\n").join("|");
function buildForm() {
  const L = [];
  L.push("[카테고리]", deck.category || "", "");
  L.push("[캡션]", deck.caption || "", "");
  const c = deck.slides[0];
  L.push("[커버]", "소스: " + (c.srcUrl || ""), "제목: " + esc(c.title),
         "부제: " + oneline(c.subtitle), "출처: " + oneline(c.credit), "");
  for (const s of deck.slides.slice(1)) {
    L.push("[슬라이드]", "소스: " + (s.srcUrl || ""), "소제목: " + esc(s.heading),
           "본문: " + esc(s.body), "출처: " + oneline(s.credit), "");
  }
  return L.join("\n").trim() + "\n";
}
async function copyForm() {
  const text = buildForm();
  try {
    await navigator.clipboard.writeText(text);
    toast("양식을 복사했습니다 — 텔레그램에 붙여넣으세요");
  } catch (err) {
    const ta = document.getElementById("formOut");
    ta.value = text;
    document.getElementById("formBox").hidden = false;
    ta.select();
    toast("복사가 막혀 있어 창으로 펼쳤습니다");
  }
}

/* ── 이미지 내보내기 ───────────────────────────────────────────────────── */
let downloadsApi = undefined;
async function dl() {
  if (downloadsApi === undefined) downloadsApi = await useCap("downloads");
  return downloadsApi;
}
function slug() {
  return ((deck.name || "카드뉴스").replace(/[\\/:*?"<>|]/g, "").trim() || "카드뉴스").slice(0, 40);
}
function blobOf(i) {
  paint(octx, i, false);
  return new Promise((res) => off.toBlob(res, "image/png"));
}
async function saveBlob(name, blob) {
  const api = await dl();
  if (api) {
    try { await api.save({ filename: name, data: blob }); return "ok"; }
    catch (err) { return err && err.code === "declined" ? "declined" : "fail"; }
  }
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return "ok";
  } catch (e) { return "fail"; }
}
async function sharePhotos() {
  const total = deck.slides.length + 1;
  const files = [];
  for (let i = 0; i < total; i++) {
    const b = await blobOf(i);
    files.push(new File([b], `${slug()}_${String(i + 1).padStart(2, "0")}.png`, { type: "image/png" }));
  }
  try {
    await navigator.share({ files, title: deck.name || "카드뉴스" });
    toast("공유 창을 열었습니다");
  } catch (e) {
    if (e && e.name === "AbortError") return;
    toast("공유가 막혀 있어 저장으로 넘어갑니다");
    saveAll();
  }
}
function canShareFiles() {
  try {
    return !!(navigator.canShare && navigator.share &&
      navigator.canShare({ files: [new File([new Blob(["x"])], "a.png", { type: "image/png" })] }));
  } catch (e) { return false; }
}
async function saveOne(i) {
  const b = await blobOf(i);
  const n = String(i + 1).padStart(2, "0");
  const r = await saveBlob(`${slug()}_${n}.png`, b);
  if (r === "ok") toast(`${n}번 장을 저장했습니다`);
  else if (r === "fail") showBig(b);
}
async function saveAll() {
  const total = deck.slides.length + 1;
  for (let i = 0; i < total; i++) {
    const b = await blobOf(i);
    const r = await saveBlob(`${slug()}_${String(i + 1).padStart(2, "0")}.png`, b);
    if (r === "declined") { toast("저장을 멈췄습니다"); return; }
    if (r === "fail") { showBig(b); return; }
    await new Promise((res) => setTimeout(res, 250));
  }
  toast(`${total}장을 모두 저장했습니다`);
}
function showBig(blob) {
  document.getElementById("bigImg").src = URL.createObjectURL(blob);
  document.getElementById("bigBox").hidden = false;
}
document.getElementById("bigClose").onclick = () => { document.getElementById("bigBox").hidden = true; };

/* ── 저장 · 불러오기 ───────────────────────────────────────────────────── */
function markDirty() { dirty = true; document.getElementById("dot").classList.add("on"); }
function markClean() { dirty = false; document.getElementById("dot").classList.remove("on"); }

async function saveDeck() {
  if (!deckId) deckId = "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  toast("저장하는 중…");
  const meta = {
    name: deck.name, category: deck.category, caption: deck.caption, updatedAt: Date.now(),
    slides: JSON.stringify(deck.slides.map((s) => ({
      kind: s.kind, title: s.title, subtitle: s.subtitle, heading: s.heading,
      body: s.body, credit: s.credit, srcUrl: s.srcUrl, hasImg: !!s.img, fit: s.fit || null,
    }))),
  };
  try {
    await Store.put(deckId, meta, deck.slides.map((s) => s.img || null));
    markClean();
    toast(Store.mode === "db" ? "저장했습니다 (팀 공용)" : "이 기기에 저장했습니다");
  } catch (err) {
    toast("저장 실패: " + (err && err.message ? err.message : "알 수 없는 오류"));
  }
}
async function openList() {
  const box = document.getElementById("listBox");
  const body = document.getElementById("listBody");
  box.hidden = false;
  body.innerHTML = "<p class='hint'>불러오는 중…</p>";
  let rows = [];
  try { rows = await Store.list(); } catch (e) { rows = []; }
  if (!rows.length) {
    body.innerHTML = "<p class='hint'>저장된 작업이 아직 없습니다.</p>";
    return;
  }
  body.innerHTML = "";
  for (const r of rows) {
    const el = document.createElement("div");
    el.className = "row";
    const when = new Date(r.updatedAt || 0);
    let cnt = "?";
    try { cnt = JSON.parse(r.slides).length; } catch (e) {}
    el.innerHTML = "<div><strong></strong><span></span></div>";
    el.querySelector("strong").textContent = r.name || "무제";
    el.querySelector("span").textContent =
      `${r.category || "–"} · ${cnt}장 · ${when.toLocaleDateString("ko-KR")} ` +
      when.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    const open = document.createElement("button");
    open.className = "mini"; open.textContent = "열기";
    open.onclick = () => loadDeck(r);
    const del = document.createElement("button");
    del.className = "mini danger"; del.textContent = "삭제";
    del.onclick = async () => {
      if (!confirm(`'${r.name || "무제"}' 을(를) 지울까요?`)) return;
      await Store.del(r.id); openList();
    };
    el.append(open, del);
    body.appendChild(el);
  }
}
async function loadDeck(row) {
  const parsed = JSON.parse(row.slides);
  deck = {
    name: row.name || "무제", category: row.category || "", caption: row.caption || "",
    slides: parsed.map((s) => Object.assign(blankBody(), s, { img: null, el: null })),
  };
  deck.slides[0].kind = "cover";
  const imgs = await Store.images(row.id, parsed.length);
  for (let i = 0; i < parsed.length; i++) {
    if (imgs[i]) await attachImage(deck.slides[i], imgs[i]);
  }
  deckId = row.id; cur = 0;
  document.getElementById("listBox").hidden = true;
  document.getElementById("deckName").value = deck.name;
  document.getElementById("catInput").value = deck.category;
  document.getElementById("capInput").value = deck.caption;
  document.getElementById("sampleBar").hidden = true;
  markClean(); closeQuick(); buildRail(); syncAll();
  toast("불러왔습니다");
}

/* ── 잡동사니 ──────────────────────────────────────────────────────────── */
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 2600);
}

/* ── 배선 ──────────────────────────────────────────────────────────────── */
document.getElementById("deckName").addEventListener("input", (e) => { deck.name = e.target.value; markDirty(); });
document.getElementById("catInput").addEventListener("input", (e) => { deck.category = e.target.value; markDirty(); repaint(); });
document.getElementById("capInput").addEventListener("input", (e) => { deck.caption = e.target.value; markDirty(); });
document.getElementById("prev").onclick = () => { closeQuick(); cur = Math.max(0, cur - 1); syncAll(); };
document.getElementById("next").onclick = () => { closeQuick(); cur = Math.min(deck.slides.length, cur + 1); syncAll(); };
document.getElementById("delBtn").onclick = () => {
  if (cur === 0 || cur >= deck.slides.length) return;
  deck.slides.splice(cur, 1);
  cur = Math.max(0, cur - 1);
  closeQuick(); markDirty(); buildRail(); syncAll();
};
document.getElementById("upBtn").onclick = () => {
  if (cur <= 1) return;
  const s = deck.slides;
  [s[cur - 1], s[cur]] = [s[cur], s[cur - 1]];
  cur--; markDirty(); buildRail(); syncAll();
};
document.getElementById("downBtn").onclick = () => {
  const s = deck.slides;
  if (cur < 1 || cur >= s.length - 1) return;
  [s[cur + 1], s[cur]] = [s[cur], s[cur + 1]];
  cur++; markDirty(); buildRail(); syncAll();
};
document.getElementById("saveBtn").onclick = saveDeck;
document.getElementById("openBtn").onclick = openList;
document.getElementById("listClose").onclick = () => { document.getElementById("listBox").hidden = true; };
document.getElementById("newBtn").onclick = () => {
  if (dirty && !confirm("저장하지 않은 변경이 있습니다. 새로 시작할까요?")) return;
  deck = { name: "무제 카드뉴스", category: "News", caption: "", slides: [blankCover(), blankBody()] };
  deckId = null; cur = 0;
  document.getElementById("deckName").value = deck.name;
  document.getElementById("catInput").value = deck.category;
  document.getElementById("capInput").value = "";
  document.getElementById("sampleBar").hidden = true;
  markClean(); closeQuick(); buildRail(); syncAll();
};
document.getElementById("copyBtn").onclick = copyForm;
document.getElementById("pngBtn").onclick = () => saveOne(cur);
document.getElementById("allBtn").onclick = () => (canShareFiles() ? sharePhotos() : saveAll());
document.getElementById("formClose").onclick = () => { document.getElementById("formBox").hidden = true; };
document.getElementById("clearSample").onclick = () => document.getElementById("newBtn").click();

/* ── 시작 ──────────────────────────────────────────────────────────────── */
(async function start() {
  await bootAssets();
  await Store.init();
  if (canShareFiles()) document.getElementById("allBtn").textContent = "전체 내보내기";
  deck = sampleDeck();
  document.getElementById("deckName").value = deck.name;
  document.getElementById("catInput").value = deck.category;
  buildRail();
  syncAll();
  document.getElementById("boot").hidden = true;
})();

</script>

<script>
(function () {
  function put() {
    var a = document.createElement('a');
    a.href = './';
    a.textContent = '← PLOT 제작';
    a.setAttribute('aria-label', 'PLOT 제작 홈으로');
    a.title = '판 09.21 18:55';
    var ver = document.createElement('span');
    ver.textContent = '09.21 18:55';
    ver.style.cssText = 'font:500 10px/1 ui-monospace,Menlo,monospace;color:#5A5A66;' +
                        'margin-left:6px;letter-spacing:0;';
    a.appendChild(ver);
    // 테두리를 두르면 제목보다 무거워진다. 글자만 남기고 흐리게.
    var base = 'font:700 11.5px/1 Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;' +
               'color:#8A8A96;text-decoration:none;white-space:nowrap;letter-spacing:-.01em;' +
               'padding:5px 0;border:0;background:none;flex:none;';
    // 텔레그램 데스크톱은 미니앱을 폰 크기 창으로 띄운다 — 화면이 넓어도 창은 그대로다.
    // 그래서 컴퓨터에서는 브라우저로 넘어가는 길을 한 번에 열어준다.
    var TG = window.Telegram && window.Telegram.WebApp;
    var inTG = !!(TG && TG.initData !== undefined && TG.platform && TG.platform !== 'unknown');
    var wide = null;
    if (inTG) {
      wide = document.createElement('button');
      wide.type = 'button';
      wide.textContent = '🖥 브라우저에서';
      wide.title = '넓은 화면에서 열기';
      wide.onclick = function () {
        try { TG.openLink(location.href); } catch (e) { window.open(location.href, '_blank'); }
      };
    }

    var h = document.querySelector('header');
    if (h) {
      a.style.cssText = base + 'margin-right:14px;';
      h.insertBefore(a, h.firstChild);
      if (wide) {
        wide.style.cssText = base + 'margin-right:14px;cursor:pointer;';
        h.insertBefore(wide, a.nextSibling);
      }
    } else {
      a.style.cssText = base +
        'position:fixed;left:12px;top:12px;z-index:9999;padding:6px 10px;' +
        'border-radius:6px;background:rgba(10,10,12,.72);color:#ECECF1;' +
        'backdrop-filter:blur(8px);';
      document.body.appendChild(a);
      if (wide) {
        wide.style.cssText = base +
          'position:fixed;left:122px;top:12px;z-index:9999;padding:6px 10px;' +
          'border-radius:6px;background:rgba(10,10,12,.72);color:#ECECF1;' +
          'backdrop-filter:blur(8px);cursor:pointer;';
        document.body.appendChild(wide);
      }
    }
  }
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', put);
  else put();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', function () {
    // updateViaCache:'none' — 이게 없으면 sw.js 자체가 HTTP 캐시에 걸린다.
    // 캐시 규칙을 고친 새 워커가 옛 캐시 때문에 안 실리는, 웃기지만 실제로 겪은 일.
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(function (r) { r.update(); })
      .catch(function () {});
  });
}
</script>
