<head>

<title>맥 상태 — PLOT</title>

<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{--bg:#0A0A0C;--panel:#131318;--raise:#1B1B22;--line:#20202A;--text:#ECECF1;--muted:#8A8A96;--dim:#565663;--amber:#E8B34A;--pick:#6FBF8B;--bad:#E0786A;color-scheme:dark}
:root[data-theme="light"]{--bg:#FBFAF7;--panel:#F2F0EA;--raise:#E9E6DE;--line:#DCD8CE;--text:#1A1A1F;--muted:#5E5E6B;--dim:#746E7C;--amber:#7A6B10;--pick:#2E7D51;--bad:#A63A2B;color-scheme:light}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#FBFAF7;--panel:#F2F0EA;--raise:#E9E6DE;--line:#DCD8CE;--text:#1A1A1F;--muted:#5E5E6B;--dim:#746E7C;--amber:#7A6B10;--pick:#2E7D51;--bad:#A63A2B;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Pretendard,-apple-system,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:26px;margin:8px 0 2px;letter-spacing:-.03em}
.top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:14px}
.top b{color:var(--text)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pick);margin-right:6px;vertical-align:1px}
.dot.off{background:var(--bad)}.dot.warn{background:var(--amber)}
.warn{color:var(--amber)}.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:860px){.grid{grid-template-columns:1fr 1fr}}
.grid>*{min-width:0}
.repo{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 8px}
.repo h2{margin:0 0 8px;font-size:18px;display:flex;align-items:center;gap:8px}
.repo h2 small{font-size:12px;font-weight:400;color:var(--muted)}
.sec{border-top:1px solid var(--line);padding:10px 0 8px}
.sec h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.row{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.row img{width:44px;height:55px;object-fit:cover;border-radius:6px;background:var(--raise);flex:none}
.row .t{flex:1;min-width:0}
.row .t b{font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{display:block;color:var(--muted);font-size:12px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{flex:none;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .r b{display:block;color:var(--text);font-size:13px}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--amber);border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite;margin-right:6px;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:4px;background:var(--raise);border-radius:2px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--amber)}
.empty{color:var(--dim);font-size:13px;padding:2px 0 6px}
.ok{color:var(--pick)}
.chip{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-left:4px;color:var(--muted)}
.more{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;padding:4px 0;cursor:pointer}
.note{color:var(--dim);font-size:12px;margin-top:18px;line-height:1.6}
</style>

<body>
<div class="wrap">
  <h1>맥 상태</h1>
  <div class="top" id="top"><span><span class="spin"></span>맥 상태를 불러오는 중…</span></div>
  <div class="grid" id="grid"></div>
  <div class="note">맥 미니가 30초마다 상태를 올리고, 이 화면은 10초마다 다시 읽습니다. 보기만 하는 화면이라 여기서 바꾸는 건 없습니다.<br>
    예약 발행은 오늘의 초안의 「예약」·「릴스 대기열」로 넣은 것, 숏폼 렌더는 제작·미리 렌더 대기열입니다.</div>
</div>
<script>
(function () {
  var SB = { url: 'https://jipqujwziezeubtthbnw.supabase.co', key: 'sb_publishable_ltzIdTSGhZW8EMT7DpNd4Q_qp2xxJDK' };
  var ST = null, OPEN = {};
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ago(iso) {
    var t = Date.parse(iso || ''); if (isNaN(t)) return '';
    var s = Math.max(0, Math.round((Date.now() - t) / 1000));
    return s < 60 ? s + '초' : s < 3600 ? Math.floor(s / 60) + '분' : Math.floor(s / 3600) + '시간 ' + Math.floor(s % 3600 / 60) + '분';
  }
  function until(iso) {
    var t = Date.parse(iso || ''); if (isNaN(t)) return '';
    var m = Math.round((t - Date.now()) / 60000);
    if (m <= 0) return '곧';
    return m < 60 ? m + '분 뒤' : Math.floor(m / 60) + '시간 ' + (m % 60) + '분 뒤';
  }
  function clock(iso) {
    var d = new Date(iso || ''); if (isNaN(d)) return '';
    var now = new Date(), same = d.toDateString() === now.toDateString();
    return (same ? '' : (d.getMonth() + 1) + '/' + d.getDate() + ' ') + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  function kst(s) { return String(s || '').replace('T', ' ').slice(5, 16); }
  function jobName(j) { return j.desc || j.job || j.id; }
  function optLine(j) {
    var o = j.opts || {}, ks = Object.keys(o);
    return ks.length ? ks.map(function (k) { return k + ' ' + o[k]; }).join(' · ') : '';
  }
  function repoCard(r) {
    var h = '<div class="repo"><h2><span class="dot' + (r.bot ? '' : ' off') + '"></span>' + esc(r.name) +
      ' <small>' + (r.bot ? '봇 켜짐' : '<span class="bad">봇 꺼짐</span>') + '</small></h2>';
    // 지금 하는 일
    h += '<div class="sec"><h3>지금 하는 일<span>' + (r.running.length ? r.running.length + '개' : '') + '</span></h3>';
    var rr = (r.renders || {}).active || [];
    if (!r.running.length && !rr.filter(function (x) { return x.status === 'running'; }).length) h += '<div class="empty">쉬는 중</div>';
    r.running.forEach(function (j) {
      h += '<div class="row"><div class="t"><b><span class="spin"></span>' + esc(jobName(j)) + '</b>' +
        (optLine(j) ? '<small>' + esc(optLine(j)) + '</small>' : '') + (j.now ? '<small>' + esc(j.now) + '</small>' : '') +
        '</div><div class="r"><b>' + ago(j.since) + '째</b>' + esc(j.job) + '</div></div>';
    });
    rr.filter(function (x) { return x.status === 'running'; }).forEach(function (x) {
      var p = Math.max(0, Math.min(100, Number(x.progress) || 0));
      h += '<div class="row"><div class="t"><b><span class="spin"></span>숏폼 렌더 — ' + esc(x.title || x.kind) + '</b>' +
        '<div class="bar"><i style="width:' + p + '%"></i></div></div><div class="r"><b>' + ago(String(x.started_at || '') + '+09:00') + '째</b>' + p + '%</div></div>';
    });
    h += '</div>';
    // 기다리는 일
    var wq = r.inbox || [], wr = rr.filter(function (x) { return x.status === 'queued'; });
    h += '<div class="sec"><h3>기다리는 일<span>' + ((wq.length + wr.length) ? (wq.length + wr.length) + '개' : '') + '</span></h3>';
    if (!wq.length && !wr.length) h += '<div class="empty">없음</div>';
    wq.forEach(function (j) {
      h += '<div class="row"><div class="t"><b>' + esc(jobName(j)) + '</b>' + (optLine(j) ? '<small>' + esc(optLine(j)) + '</small>' : '') +
        '</div><div class="r">' + ago(j.since) + ' 전 들어옴</div></div>';
    });
    wr.forEach(function (x) {
      h += '<div class="row"><div class="t"><b>숏폼 렌더 — ' + esc(x.title || x.kind) + '</b></div><div class="r">' + kst(x.created_at) + ' 들어옴</div></div>';
    });
    h += '</div>';
    // 예약 발행
    var sc = r.schedule || [];
    h += '<div class="sec"><h3>예약 발행<span>' + (sc.length ? sc.length + '개' : '') + '</span></h3>';
    if (!sc.length) h += '<div class="empty">예약된 게 없습니다</div>';
    sc.forEach(function (x) {
      h += '<div class="row">' + (x.thumb ? '<img loading="lazy" referrerpolicy="no-referrer" src="' + esc(x.thumb) + '" alt="">' : '') +
        '<div class="t"><b>' + esc(x.title) + '</b><small>' + (x.kind === 'reel' ? '릴스' : '캐러셀') + (x.cover && x.cover !== 'A' ? ' · 표지 ' + esc(x.cover) : '') +
        (x.claimed ? ' · <span class="warn">올리는 중</span>' : '') + '</small></div>' +
        '<div class="r"><b>' + esc(clock(x.due)) + '</b>' + esc(until(x.due)) + '</div></div>';
    });
    h += '</div>';
    // 최근 끝난 것
    var rc = r.recent || [], open = !!OPEN[r.name], show = open ? rc : rc.slice(0, 4);
    h += '<div class="sec"><h3>최근 끝난 일</h3>';
    if (!rc.length) h += '<div class="empty">기록 없음</div>';
    show.forEach(function (j) {
      h += '<div class="row"><div class="t"><b>' + (j.ok ? '<span class="ok">✓</span> ' : '<span class="bad">✗</span> ') + esc(jobName(j)) + '</b>' +
        (j.ok ? '' : '<small class="bad">' + esc(j.res) + '</small>') + '</div><div class="r">' + esc(j.at) + '</div></div>';
    });
    ((r.renders || {}).done || []).slice(0, open ? 5 : 2).forEach(function (x) {
      h += '<div class="row"><div class="t"><b>' + (x.status === 'done' ? '<span class="ok">✓</span> ' : '<span class="bad">✗</span> ') + '숏폼 렌더 — ' + esc(x.title || x.kind) + '</b>' +
        (x.error ? '<small class="bad">' + esc(x.error) + '</small>' : '') + '</div><div class="r">' + kst(x.finished_at || x.created_at) + '</div></div>';
    });
    if (rc.length > 4) h += '<button class="more" data-more="' + esc(r.name) + '">' + (open ? '접기' : '더 보기') + '</button>';
    return h + '</div></div>';
  }
  function render() {
    var top = document.getElementById('top'), grid = document.getElementById('grid');
    if (!ST) return;
    var age = (Date.now() - Date.parse(ST.at || '')) / 1000, stale = !(age < 120);
    var busy = (ST.repos || []).reduce(function (n, r) { return n + r.running.length + ((r.renders || {}).active || []).filter(function (x) { return x.status === 'running'; }).length; }, 0);
    var load = (ST.load || [])[0], cpus = ST.cpus || 0;
    top.innerHTML = '<span><span class="dot' + (stale ? ' off' : busy ? ' warn' : '') + '"></span><b>' +
      (stale ? '맥 소식이 끊김' : busy ? '일하는 중' : '쉬는 중') + '</b></span>' +
      '<span>' + (stale ? '<span class="bad">마지막 소식 ' + ago(ST.at) + ' 전 — 맥·봇이 꺼졌을 수 있습니다</span>' : ago(ST.at) + ' 전 소식') + '</span>' +
      (load != null ? '<span>부하 <b>' + load + '</b>' + (cpus ? ' / ' + cpus + '코어' : '') + '</span>' : '') +
      (ST.disk_free_gb != null ? '<span>저장 공간 <b' + (ST.disk_free_gb < 20 ? ' class="bad"' : '') + '>' + ST.disk_free_gb + 'GB</b> 남음</span>' : '');
    grid.innerHTML = (ST.repos || []).map(repoCard).join('');
  }
  function load() {
    if (!SB.url || SB.url.indexOf('__') === 0) { document.getElementById('top').textContent = '저장소 설정이 없어 볼 수 없습니다'; return; }
    fetch(SB.url.replace(/\/+$/, '') + '/rest/v1/plot_evals?select=snapshot&id=eq.' + encodeURIComponent('mac:status'),
      { headers: { apikey: SB.key, Authorization: 'Bearer ' + SB.key }, cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (rows) {
        var sn = rows && rows[0] && rows[0].snapshot;
        if (sn) { ST = sn; render(); }
        else if (!ST) document.getElementById('top').textContent = '아직 맥이 상태를 올린 적이 없습니다 — 봇을 다시 띄우면 30초 안에 나옵니다';
      }).catch(function () {});
  }
  document.addEventListener('click', function (e) {
    var m = e.target.closest('[data-more]'); if (m) { var k = m.getAttribute('data-more'); OPEN[k] = !OPEN[k]; render(); }
  });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') load(); });
  load(); setInterval(function () { if (document.visibilityState === 'visible') load(); }, 10000);
  setInterval(function () { if (ST && document.visibilityState === 'visible') render(); }, 5000);
})();
</script>

      a.href = pg[0]; a.textContent = (cur ? '● ' : '') + pg[1];
      a.style.cssText = 'display:flex;align-items:center;min-height:46px;padding:0 14px;border-radius:10px;' +
        'font:' + (cur ? '800' : '600') + ' 16px/1 Pretendard,-apple-system,sans-serif;color:inherit;text-decoration:none;' +
        (cur ? 'opacity:.55;pointer-events:none;' : '');
      box.appendChild(a);
    });
    m.appendChild(box);
    m.addEventListener('click', function (e) { if (e.target === m) close(); });
    document.body.appendChild(m);
    try { history.pushState({ plotNav: 1 }, ''); } catch (e) {}
  }
  function close() {
    var m = document.getElementById('plotNavMenu');
    if (!m) return;
    m.remove();
    try { if (history.state && history.state.plotNav) history.back(); } catch (e) {}
  }
  window.addEventListener('popstate', function () { var m = document.getElementById('plotNavMenu'); if (m) m.remove(); });
  function addMenu() {
    var a = document.querySelector('a[aria-label="PLOT 제작 홈으로"]');
    if (!a || document.getElementById('plotNavBtn')) return;
    var b = document.createElement('button');
    b.id = 'plotNavBtn'; b.type = 'button'; b.textContent = '▾';
    b.setAttribute('aria-label', '다른 화면으로');
    b.style.cssText = 'font:700 15px/1 -apple-system,sans-serif;color:var(--text,var(--ink,#ECECF1));background:none;' +
      'border:1px solid var(--line,#2A2A33);border-radius:9px;min-width:34px;min-height:34px;margin:0 10px 0 -8px;cursor:pointer;flex:none;';
    if (a.style.position === 'fixed') {
      b.style.cssText += 'position:fixed;top:calc(16px + env(safe-area-inset-top));left:' + (a.getBoundingClientRect().right + 16) + 'px;z-index:9999;' +
        'background:var(--glass,rgba(10,10,12,.72));backdrop-filter:blur(8px);';
      document.body.appendChild(b);
    } else {                                        // 링크와 ▾ 를 한 줄로 묶는다 (헤더가 세로로 쌓는 화면에서도)
      var w = document.createElement('span');
      w.style.cssText = 'display:inline-flex;align-items:center;flex:none;align-self:flex-start;';
      a.parentNode.insertBefore(w, a);
      w.appendChild(a); w.appendChild(b);
      b.style.margin = '0 10px 0 -6px';
    }
    b.onclick = function () { document.getElementById('plotNavMenu') ? close() : menu(); };
    if (window.innerWidth < 380) {                  // 좁은 폰에서는 판 번호를 숨겨 자리를 만든다 (판은 길게 눌러 title 로)
      var v = a.querySelector('span'); if (v) v.style.display = 'none';
    }
  }
  function boot() { put(); addMenu(); }
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

<script>
(function () {
  var TK = 'plot.app.theme', AK = 'plot.app.accent', NK = 'plot.app.neon',
      GK = 'plot.app.gap', FK = 'plot.app.fs';
  var GAPS = [['tight', '좁게'], ['normal', '보통'], ['wide', '넓게']];
  var FSIZES = [['s', '작게'], ['m', '보통'], ['l', '크게'], ['xl', '더 크게']];
  var HUES = ['cyan', 'magenta', 'lime', 'orange', 'violet'];
  var MODES = [['system', '기기'], ['light', '밝게'], ['dark', '어둡게']];
  var ACCENTS = [['amber', '#E8B34A'], ['blue', '#5B8DEF'], ['green', '#4FB477'],
                 ['violet', '#8B7CF0'], ['mono', '#ECECF1'], ['neon', '#00F0FF']];
  var box = null;

  function get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
  function set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
  function mode() { var t = get(TK, ''); return (t === 'light' || t === 'dark') ? t : 'system'; }
  function accent() { return get(AK, 'amber'); }
  function hue() { var h = get(NK, 'cyan'); return HUES.indexOf(h) < 0 ? 'cyan' : h; }
  function gap() { var g = get(GK, 'normal'); return /^(tight|normal|wide)$/.test(g) ? g : 'normal'; }
  function fsize() { var f = get(FK, 'm'); return /^(s|m|l|xl)$/.test(f) ? f : 'm'; }

  function apply() {
    var r = document.documentElement, m = mode();
    if (m === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', m);
    r.setAttribute('data-accent', accent());
    r.setAttribute('data-neon', hue());
    r.setAttribute('data-gap', gap());
    r.setAttribute('data-fs', fsize());
    var meta = document.querySelector('meta[name=theme-color]');
    if (meta) {
      var dark = m === 'dark' ||
        (m === 'system' && !matchMedia('(prefers-color-scheme: light)').matches);
      meta.setAttribute('content', dark ? '#0A0A0C' : '#FBFAF7');
    }
    if (box) paint();
  }

  function paint() {
    [].forEach.call(box.querySelectorAll('[data-mode]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-mode') === mode());
    });
    [].forEach.call(box.querySelectorAll('[data-accent]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-accent') === accent());
    });
    [].forEach.call(box.querySelectorAll('[data-hue]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-hue') === hue());
    });
    [].forEach.call(box.querySelectorAll('[data-gap]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-gap') === gap());
    });
    [].forEach.call(box.querySelectorAll('[data-fs]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-fs') === fsize());
    });
  }

  function close() {
    if (box) { box.remove(); box = null; document.removeEventListener('click', away); }
  }
  function away(e) {
    if (box && !box.contains(e.target) && !e.target.closest('.plotThemeBtn')) close();
  }

  function open(btn) {
    if (box) { close(); return; }
    box = document.createElement('div');
    box.className = 'plotThemeBox';
    box.innerHTML = '<b>밝기</b><div class="row">' +
      MODES.map(function (m) {
        return '<button type="button" data-mode="' + m[0] + '">' + m[1] + '</button>';
      }).join('') + '</div><b>강조색</b><div class="row">' +
      ACCENTS.map(function (a) {
        return '<button type="button" class="sw" data-accent="' + a[0] +
               '" title="' + a[0] + '"></button>';
      }).join('') + '</div>' +
      // 네온을 골랐을 때만 열리는 줄 — 색이 하나면 사이버펑크가 안 산다
      '<div class="row hues">' + HUES.map(function (h) {
        return '<button type="button" class="hue" data-hue="' + h +
               '" title="' + h + '"></button>';
      }).join('') + '</div>' +
      '<b>글자 크기</b><div class="row">' + FSIZES.map(function (f) {
        return '<button type="button" data-fs="' + f[0] + '">' + f[1] + '</button>';
      }).join('') + '</div>' +
      '<b>여백</b><div class="row">' + GAPS.map(function (g) {
        return '<button type="button" data-gap="' + g[0] + '">' + g[1] + '</button>';
      }).join('') + '</div>';
    document.body.appendChild(box);
    // body 에 배율이 걸려 있으면 getBoundingClientRect 는 이미 곱해진 값을 준다.
    // 상자는 그 배율 안에 놓이므로 되나눠야 제자리에 선다.
    var z = parseFloat(getComputedStyle(document.body).zoom) || 1;
    box.style.top = Math.round(btn.getBoundingClientRect().bottom / z + 8) + 'px';
    box.onclick = function (e) {
      var m = e.target.closest('[data-mode]'), a = e.target.closest('[data-accent]');
      if (m) { set(TK, m.getAttribute('data-mode') === 'system' ? '' : m.getAttribute('data-mode')); apply(); }
      if (a) { set(AK, a.getAttribute('data-accent')); apply(); }
      var h = e.target.closest('[data-hue]');
      if (h) { set(NK, h.getAttribute('data-hue')); apply(); }
      var g = e.target.closest('[data-gap]');
      if (g) { set(GK, g.getAttribute('data-gap')); apply(); }
      var f = e.target.closest('[data-fs]');
      if (f) { set(FK, f.getAttribute('data-fs')); apply(); }
    };
    paint();
    setTimeout(function () { document.addEventListener('click', away); }, 0);
  }

  function put() {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'plotThemeBtn';
    btn.textContent = '◐ 테마';
    btn.title = '밝기와 강조색';
    btn.onclick = function (e) { e.stopPropagation(); open(btn); };
    var own = document.getElementById('theme');
    var h = document.querySelector('header .hbtns') || document.querySelector('.addRow')
            || (own && own.parentElement);
    if (h) { h.appendChild(btn); return; }
    btn.className += ' float';
    document.body.appendChild(btn);
  }

  apply();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', put);
  else put();
})();
</script>

<script>
(function () {
  var KEY = 'plot.app.installHint';
  var ua = navigator.userAgent;
  var iOS = /iPad|iPhone|iPod/.test(ua) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!iOS) return;
  if (window.navigator.standalone === true ||
      matchMedia('(display-mode: standalone)').matches) return;   // 이미 앱으로 열었다
  try { if (localStorage.getItem(KEY) === 'off') return; } catch (e) {}

  var TG = window.Telegram && window.Telegram.WebApp;
  var inTG = !!(TG && TG.initData !== undefined && TG.platform && TG.platform !== 'unknown');
  var safari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|Chrome/.test(ua);

  function show() {
    var box = document.createElement('div');
    box.style.cssText =
      'position:fixed; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom));' +
      'z-index:9997; background:var(--panel,#131318); color:var(--text,#ECECF1);' +
      'border:1px solid var(--line,#2A2A34); border-radius:12px; padding:12px 13px;' +
      'font:14px/1.55 -apple-system,BlinkMacSystemFont,sans-serif;' +
      'box-shadow:0 14px 40px rgba(0,0,0,.45)';
    var msg = inTG
      ? '홈 화면에 추가하려면 <b>사파리에서 열어야</b> 합니다 — 텔레그램 안에는 그 메뉴가 없어요.'
      : safari
        ? '아래 <b>공유 버튼(↑)</b> → <b>홈 화면에 추가</b> 를 누르면 앱처럼 열립니다.'
        : '홈 화면에 추가는 <b>사파리에서만</b> 됩니다 — 이 주소를 사파리로 열어 주세요.';
    box.innerHTML = '<div style="margin-bottom:9px">' + msg + '</div>' +
      '<div style="display:flex; gap:7px">' +
      (inTG ? '<button id="plotOpenSafari" style="flex:1; border:0; border-radius:8px;' +
              'padding:9px; font:inherit; font-weight:700; background:var(--text,#ECECF1);' +
              'color:var(--bg,#0A0A0C)">브라우저에서 열기</button>' : '') +
      '<button id="plotHintNo" style="flex:' + (inTG ? '0 0 92px' : '1') + ';' +
      'border:1px solid var(--line,#2A2A34); border-radius:8px; padding:9px; font:inherit;' +
      'background:none; color:var(--muted,#8A8A96)">다시 안 보기</button></div>';
    document.body.appendChild(box);
    var go = document.getElementById('plotOpenSafari');
    if (go) go.onclick = function () {
      try { TG.openLink(location.href); } catch (e) { window.open(location.href, '_blank'); }
    };
    document.getElementById('plotHintNo').onclick = function () {
      try { localStorage.setItem(KEY, 'off'); } catch (e) {}
      box.remove();
    };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show);
  else show();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', function () {
    // updateViaCache:'none' — 이게 없으면 sw.js 자체가 HTTP 캐시에 걸린다.
    // 캐시 규칙을 고친 새 워커가 옛 캐시 때문에 안 실리는, 웃기지만 실제로 겪은 일.
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(function (r) { r.update(); })
      .catch(function () {});
  });
}
</script>
