<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLOT 성과 — PLOT</title>
<meta name="description" content="주간 도달·팔로워·결별 성과">
<meta name="robots" content="noindex, nofollow">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0C; --panel:#131318; --raise:#1B1B22;
  --line:#20202A; --hair:#17171E;
  --text:#ECECF1; --muted:#8A8A96; --dim:#565663;
  --amber:#E8B34A; --pick:#6FBF8B; --skip:#4A4A57; --bad:#E0786A;
  --u:8px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#FBFAF7; --panel:#F2F0EA; --raise:#E9E6DE;
  --line:#DCD8CE; --hair:#E6E3DA;
  --text:#1A1A1F; --muted:#5E5E6B; --dim:#746E7C;
  --amber:#7A6B10; --pick:#2E7D51; --skip:#8C8C99; --bad:#A63A2B;
  color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#FBFAF7; --panel:#F2F0EA; --raise:#E9E6DE;
    --line:#DCD8CE; --hair:#E6E3DA;
    --text:#1A1A1F; --muted:#5E5E6B; --dim:#746E7C;
    --amber:#7A6B10; --pick:#2E7D51; --skip:#8C8C99; --bad:#A63A2B;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); min-height:100dvh;
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px; line-height:1.6;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  padding:calc(var(--u)*4 + env(safe-area-inset-top)) 22px
          calc(var(--u)*10 + env(safe-area-inset-bottom));
}
[hidden]{display:none!important}
.wrap{max-width:620px; margin:0 auto}
.lat{font-family:var(--mono); letter-spacing:.14em; text-transform:uppercase}

header{display:flex; align-items:center; gap:14px; padding-bottom:calc(var(--u)*2)}
header .rule{flex:1; height:1px; background:var(--line)}
header .kicker{flex:none; font-size:12px; font-weight:700; color:var(--dim)}
.hbtns{display:flex; gap:8px; align-items:center; flex:none}

h1{font-size:29px; line-height:1.15; letter-spacing:-.03em; margin:0 0 6px}
.stamp{font-family:var(--mono); font-size:12px; color:var(--dim);
  letter-spacing:.02em; margin-bottom:calc(var(--u)*3)}

h2{font-size:14px; font-weight:700; color:var(--muted); margin:0 0 10px;
  letter-spacing:-.01em}
section{border-top:1px solid var(--line); padding:calc(var(--u)*3) 0}

/* ── 요약 세 칸 ── */
.sum{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:calc(var(--u)*2)}
.sum .box{background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:13px 12px}
.sum .lab{font-size:12px; color:var(--dim); font-weight:600; margin-bottom:5px}
.sum .big{font-size:23px; font-weight:800; letter-spacing:-.03em; line-height:1.1}
.sum .delta{font-size:13px; font-weight:700; margin-top:3px}
.sum .up{color:var(--pick)} .sum .down{color:var(--bad)} .sum .flat{color:var(--dim)}
/* 요약 바로 밑 — '이번 주' 가 정확히 며칠인지. 줄임말만 있으면 아무도 모른다. */
.wkline{font-size:13px; color:var(--dim); margin:-4px 0 calc(var(--u)*1)}
.stale{font-size:13px; line-height:1.6; color:var(--bad); border:1px solid var(--bad);
  border-radius:9px; padding:9px 11px; margin:8px 0 calc(var(--u)*1)}

/* ── 주간 막대 ── */
.wk{display:flex; align-items:flex-end; gap:9px; height:152px; margin-bottom:10px}
.wk .col{flex:1; display:flex; flex-direction:column; justify-content:flex-end;
  align-items:center; gap:5px; min-width:0}
.wk .bar{width:100%; background:var(--amber); border-radius:4px 4px 0 0; min-height:3px;
  opacity:.9}
.wk .col.last .bar{opacity:1; box-shadow:0 0 0 1px var(--amber)}
.wk .tag{font-size:12px; font-weight:700; color:var(--muted); white-space:nowrap}
.wk .tag2{font-family:var(--mono); font-size:11px; color:var(--dim); white-space:nowrap;
  margin-top:-3px}
.wk .col.last .tag{color:var(--text)}
.wk .val{font-size:12px; font-weight:700; color:var(--muted); white-space:nowrap}

/* ── 줄 목록 ── */
.rows{display:flex; flex-direction:column; gap:1px}
.ln{display:flex; align-items:center; gap:10px; padding:10px 0;
  border-bottom:1px solid var(--hair)}
.ln:last-child{border-bottom:0}
.ln .nm{flex:1; min-width:0; font-size:14px; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap}
.ln .nm a{color:inherit; text-decoration:none}
.ln .nm a:hover{color:var(--amber)}
.ln b{flex:none; font-size:14px; font-weight:800; letter-spacing:-.02em}
.ln .sub{flex:none; font-size:12px; color:var(--dim); font-family:var(--mono)}

/* 배수 막대 (결별 성과) */
.mb{flex:none; width:92px; height:7px; background:var(--raise); border-radius:4px;
  position:relative; overflow:hidden}
.mb i{position:absolute; left:0; top:0; bottom:0; background:var(--amber); border-radius:4px}

/* 두 줄 비교 막대 (발행 대비 도달) */
.cmp .ln{flex-wrap:wrap}
.cmp .two{flex:1 0 100%; display:flex; flex-direction:column; gap:4px; margin-top:6px}
.cmp .t{display:flex; align-items:center; gap:8px}
.cmp .t span{flex:none; width:44px; font-size:11.5px; color:var(--dim)}
.cmp .t i{height:8px; border-radius:4px; display:block; min-width:2px}
.cmp .t .pub{background:var(--skip)}
.cmp .t .rch{background:var(--amber)}
.cmp .t em{font-style:normal; font-size:12px; color:var(--muted); font-weight:700}
.gapUp{color:var(--pick); font-weight:800}
.gapDn{color:var(--bad); font-weight:800}

.note{font-size:13px; color:var(--dim); line-height:1.7; margin:10px 0 0}
.empty{background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:22px 18px; color:var(--muted); font-size:14px; line-height:1.7}
.err{background:var(--panel); border:1px solid var(--bad); border-radius:10px;
  padding:12px 14px; color:var(--bad); font-size:13px; margin-bottom:14px}
</style>

<body>
<div class="wrap">

  <header>
    <div class="hbtns" id="hbtns"></div>
    <div class="rule"></div>
    <div class="kicker lat">Performance</div>
  </header>

  <h1>PLOT 성과</h1>
  <div class="stamp" id="stamp">불러오는 중…</div>

  <div id="err" class="err" hidden></div>
  <div id="body"></div>

</div>

<script>
(function () {
  'use strict';
  var P = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function num(n) {
    n = Number(n) || 0;
    if (n >= 10000) return (n / 10000).toFixed(n >= 100000 ? 0 : 1).replace(/\.0$/, '') + '만';
    return n.toLocaleString('ko-KR');
  }
  function pct(x) { return (Math.round(x * 1000) / 10) + '%'; }

  /* ── 주 이름 ──────────────────────────────────────────────────────────
     성과 데이터는 ISO 주(2026-W38)로 쌓인다. 기계끼리는 그게 제일 안 헷갈리지만
     사람은 그게 며칠인지 모른다. 화면에서만 사람 말로 바꾼다 — 데이터는 그대로 둔다.

     '몇 주차' 는 그 주의 목요일이 드는 달을 기준으로 센다(ISO 와 같은 규칙).
     목요일끼리는 정확히 7일 간격이라, 그 날짜를 7로 나눠 올리면 곧 몇째 주다.
     한 주가 달을 걸치면(8월 31일~9월 6일) 목요일이 있는 달로 간다 — 그래야
     '9월 1주' 가 9월에 한 번만 나온다. */
  function weekMon(tag) {
    var m = /^(\d{4})-W(\d{1,2})$/.exec(String(tag || ''));
    if (!m) return null;
    var y = +m[1], w = +m[2];
    var jan4 = new Date(Date.UTC(y, 0, 4));          // 1월 4일은 언제나 1주차다
    var dow = (jan4.getUTCDay() + 6) % 7;            // 월=0
    return new Date(jan4.getTime() - dow * 864e5 + (w - 1) * 7 * 864e5);
  }
  function nowWeekTag(d) {
    d = d || new Date();
    var u = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var dow = (u.getUTCDay() + 6) % 7;                 // 월=0
    var thu = new Date(u.getTime() + (3 - dow) * 864e5);   // 그 주의 목요일
    var y = thu.getUTCFullYear();
    var jan4 = new Date(Date.UTC(y, 0, 4));
    var j = (jan4.getUTCDay() + 6) % 7;
    var wk1 = new Date(jan4.getTime() - j * 864e5);
    var n = Math.round((thu - wk1) / (7 * 864e5)) + 1;
    return y + '-W' + (n < 10 ? '0' + n : String(n));
  }
  function weekGap(a, b) {
    var x = weekMon(a), y = weekMon(b);
    return (x && y) ? Math.round((y - x) / (7 * 864e5)) : 0;
  }

  function weekName(tag) {
    var mon = weekMon(tag);
    if (!mon) return { short: String(tag || ''), days: '', full: String(tag || '') };
    var sun = new Date(mon.getTime() + 6 * 864e5);
    var thu = new Date(mon.getTime() + 3 * 864e5);
    var Y = thu.getUTCFullYear(), M = thu.getUTCMonth() + 1;
    var nth = Math.ceil(thu.getUTCDate() / 7);
    var m1 = mon.getUTCMonth() + 1, d1 = mon.getUTCDate();
    var m2 = sun.getUTCMonth() + 1, d2 = sun.getUTCDate();
    return {
      short: M + '월 ' + nth + '주',
      days: m1 === m2 ? (m1 + '.' + d1 + '~' + d2) : (m1 + '.' + d1 + '~' + m2 + '.' + d2),
      full: Y + '년 ' + M + '월 ' + nth + '주차 (' + m1 + '월 ' + d1 + '일~' +
            m2 + '월 ' + d2 + '일)',
    };
  }

  /* 주간 — 값이 0 인 주가 섞여 있다(수집 전). 그건 막대에서 뺀다. */
  function weeks() {
    return (P.weeks || []).filter(function (w) { return (w.reach || 0) > 0 || (w.posts || 0) > 0; });
  }

  function sumBox() {
    var ws = weeks();
    if (!ws.length) return '';
    var last = ws[ws.length - 1];
    var cur = nowWeekTag();
    var gap = weekGap(last.week, cur);              // 몇 주가 비었나
    var d = last.followers_delta;
    var cls = d == null ? 'flat' : (d > 0 ? 'up' : (d < 0 ? 'down' : 'flat'));
    var dtx = d == null ? '지난주 기록 없음' : (d > 0 ? '+' + num(d) : (d < 0 ? num(d) : '변화 없음'));
    return '<div class="sum">' +
      '<div class="box"><div class="lab">' + (gap > 0 ? '마지막 주 도달' : '이번 주 도달') + '</div>' +
        '<div class="big">' + num(last.reach) + '</div></div>' +
      '<div class="box"><div class="lab">팔로워</div>' +
        '<div class="big">' + num(last.followers) + '</div>' +
        '<div class="delta ' + cls + '">' + esc(dtx) + '</div></div>' +
      '<div class="box"><div class="lab">발행</div>' +
        '<div class="big">' + (last.posts || 0) + '</div>' +
        '<div class="delta flat">건 · ' + esc(weekName(last.week).short) + '</div></div>' +
      '</div>' +
      '<div class="wkline">' + esc(weekName(last.week).full) + '</div>' +
      /* 주간 스냅샷은 목요일 아침에 한 번만 돈다. 그날 봇이 자고 있으면 그 주가
         통째로 빈다 — 화면이 아무 말도 안 하면 옛 숫자를 이번 주로 읽게 된다. */
      (gap > 0
        ? '<div class="stale">기록이 ' + gap + '주 밀려 있습니다 — 지금은 ' +
          esc(weekName(cur).short) + '차. 주간 스냅샷은 목요일 아침에 돌고, ' +
          '놓치면 다음 날 아침에 채웁니다.</div>'
        : '');
  }

  function weekBars() {
    var ws = weeks().slice(-6);        // 여덟 주를 넣으면 칸이 좁아 날짜가 안 들어간다
    if (ws.length < 2) return '';
    var hi = Math.max.apply(null, ws.map(function (w) { return w.reach || 0; })) || 1;
    var cols = ws.map(function (w, i) {
      var h = Math.max(3, Math.round(((w.reach || 0) / hi) * 96));
      var n = weekName(w.week);
      return '<div class="col' + (i === ws.length - 1 ? ' last' : '') +
        '" title="' + esc(n.full) + '">' +
        '<div class="val">' + num(w.reach) + '</div>' +
        '<div class="bar" style="height:' + h + 'px"></div>' +
        '<div class="tag">' + esc(n.short) + '</div>' +
        '<div class="tag2">' + esc(n.days) + '</div></div>';
    }).join('');
    return '<section><h2>주간 도달</h2><div class="wk">' + cols + '</div>' +
      '<p class="note">막대는 그 주에 올린 글이 닿은 사람 수다. 발행 건수가 다르면 ' +
      '높낮이만 보고 잘했다 못했다 하기 어렵다 — 아래 결별 성과가 그걸 보정한 값이다.</p></section>';
  }

  function kindBars() {
    var solid = (P.kinds || []).filter(function (k) { return k.stable; });
    var shaky = (P.kinds || []).filter(function (k) { return !k.stable; });
    if (!solid.length && !shaky.length) return '';
    var hi = Math.max.apply(null, solid.map(function (k) { return k.multiple || 0; })) || 1;
    var rows = solid.map(function (k) {
      var w = Math.round(((k.multiple || 0) / hi) * 100);
      return '<div class="ln"><span class="nm">' + esc(k.kind) + '</span>' +
        '<span class="sub">' + k.n + '건</span>' +
        '<span class="mb"><i style="width:' + w + '%"></i></span>' +
        '<b>' + k.multiple + '배</b></div>';
    }).join('');
    return '<section><h2>결별 성과 — 주차 보정</h2><div class="rows">' + rows + '</div>' +
      '<p class="note">그 주의 중앙값을 1로 놓고 잰 값이다. 3배면 같은 주 다른 글보다 ' +
      '세 배 멀리 갔다는 뜻. 한 주를 빼도 순서가 안 바뀌는 결만 실었다.' +
      (shaky.length ? ' 아직 흔들려서 뺀 결: ' +
        shaky.map(function (k) { return esc(k.kind); }).join(', ') + '.' : '') +
      '</p></section>';
  }

  /* 발행 대비 도달 — 손이 많이 간 결과 실제로 멀리 간 결이 같은지 본다.
     이게 어긋나 있으면 제작 배분을 바꿔야 한다는 신호다. */
  function balance() {
    var pub = P.published || [];
    if (pub.length < 10) return '';
    var by = {};
    pub.forEach(function (p) {
      var k = p.kind || '기타';
      if (!by[k]) by[k] = { n: 0, reach: 0 };
      by[k].n += 1; by[k].reach += (p.reach || 0);
    });
    var tn = pub.length;
    var tr = pub.reduce(function (a, p) { return a + (p.reach || 0); }, 0) || 1;
    var ks = Object.keys(by).sort(function (a, b) { return by[b].reach - by[a].reach; });
    var rows = ks.map(function (k) {
      var o = by[k], pn = o.n / tn, pr = o.reach / tr;
      var gap = pr - pn;
      var mark = Math.abs(gap) < 0.04 ? ''
        : (gap > 0 ? '<span class="gapUp">더 써도 된다</span>'
                   : '<span class="gapDn">줄여도 된다</span>');
      return '<div class="ln"><span class="nm">' + esc(k) + '</span>' + mark +
        '<div class="two">' +
          '<div class="t"><span>발행</span><i class="pub" style="width:' +
            Math.max(2, Math.round(pn * 100)) + '%"></i><em>' + pct(pn) + ' · ' + o.n + '건</em></div>' +
          '<div class="t"><span>도달</span><i class="rch" style="width:' +
            Math.max(2, Math.round(pr * 100)) + '%"></i><em>' + pct(pr) + '</em></div>' +
        '</div></div>';
    }).join('');
    return '<section class="cmp"><h2>손이 간 곳과 멀리 간 곳</h2><div class="rows">' + rows + '</div>' +
      '<p class="note">위 막대는 최근 ' + tn + '건 중 그 결이 차지한 비율, 아래는 그 결이 가져온 ' +
      '도달의 비율이다. 아래가 위보다 길면 적게 만들고도 멀리 간 결 — 더 만들 자리가 있다.</p></section>';
  }

  function topPosts() {
    var top = (P.top || []).slice(0, 10);
    if (!top.length) return '';
    var rows = top.map(function (t) {
      var head = (t.head || '').replace(/\n+/g, ' ').trim().slice(0, 42);
      var nm = t.permalink
        ? '<a href="' + esc(t.permalink) + '" target="_blank" rel="noopener">' + esc(head) + '</a>'
        : esc(head);
      return '<div class="ln"><span class="nm">' + nm + '</span>' +
        '<span class="sub">' + esc(t.kind || '') + '</span>' +
        '<b>' + num(t.reach) + '</b></div>';
    }).join('');
    return '<section><h2>가장 멀리 간 글</h2><div class="rows">' + rows + '</div></section>';
  }

  function runs() {
    if (!P.runs) return '';
    var rows = Object.keys(P.runs).map(function (k) {
      return '<div class="ln"><span class="nm">' + esc(k) + '</span>' +
        '<span class="sub">' + esc(P.runs[k]) + '</span></div>';
    }).join('');
    return '<section><h2>마지막 실행</h2><div class="rows">' + rows + '</div>' +
      (P.note ? '<p class="note">' + esc(P.note) + '</p>' : '') + '</section>';
  }

  function render() {
    var host = document.getElementById('body');
    document.getElementById('stamp').textContent = (P.generated_at || '') + ' 기준';
    var out = sumBox() + weekBars() + kindBars() + balance() + topPosts() + runs();
    host.innerHTML = out || '<div class="empty">아직 실을 숫자가 없습니다.</div>';
  }

  fetch('./performance.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) { P = j; render(); })
    .catch(function (e) {
      document.getElementById('stamp').textContent = '';
      document.getElementById('body').innerHTML =
        '<div class="empty">성과 데이터가 아직 배포되지 않았습니다.<br>' +
        '맥에서 스캔이 한 번 더 돌면 여기에 올라옵니다.</div>';
    });
})();
</script>
</body>
</html>

<script>
(function () {
  var TK = 'plot.app.theme', AK = 'plot.app.accent', NK = 'plot.app.neon',
      GK = 'plot.app.gap', FK = 'plot.app.fs';
  var GAPS = [['tight', '좁게'], ['normal', '보통'], ['wide', '넓게']];
  var FSIZES = [['s', '작게'], ['m', '보통'], ['l', '크게'], ['xl', '더 크게']];
  var HUES = ['cyan', 'magenta', 'lime', 'orange', 'violet'];
  var MODES = [['system', '기기'], ['light', '밝게'], ['dark', '어둡게']];
  var ACCENTS = [['amber', '#E8B34A'], ['blue', '#5B8DEF'], ['green', '#4FB477'],
                 ['violet', '#8B7CF0'], ['mono', '#ECECF1'], ['neon', '#00F0FF']];
  var box = null;

  function get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
  function set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
  function mode() { var t = get(TK, ''); return (t === 'light' || t === 'dark') ? t : 'system'; }
  function accent() { return get(AK, 'amber'); }
  function hue() { var h = get(NK, 'cyan'); return HUES.indexOf(h) < 0 ? 'cyan' : h; }
  function gap() { var g = get(GK, 'normal'); return /^(tight|normal|wide)$/.test(g) ? g : 'normal'; }
  function fsize() { var f = get(FK, 'm'); return /^(s|m|l|xl)$/.test(f) ? f : 'm'; }

  function apply() {
    var r = document.documentElement, m = mode();
    if (m === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', m);
    r.setAttribute('data-accent', accent());
    r.setAttribute('data-neon', hue());
    r.setAttribute('data-gap', gap());
    r.setAttribute('data-fs', fsize());
    var meta = document.querySelector('meta[name=theme-color]');
    if (meta) {
      var dark = m === 'dark' ||
        (m === 'system' && !matchMedia('(prefers-color-scheme: light)').matches);
      meta.setAttribute('content', dark ? '#0A0A0C' : '#FBFAF7');
    }
    if (box) paint();
  }

  function paint() {
    [].forEach.call(box.querySelectorAll('[data-mode]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-mode') === mode());
    });
    [].forEach.call(box.querySelectorAll('[data-accent]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-accent') === accent());
    });
    [].forEach.call(box.querySelectorAll('[data-hue]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-hue') === hue());
    });
    [].forEach.call(box.querySelectorAll('[data-gap]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-gap') === gap());
    });
    [].forEach.call(box.querySelectorAll('[data-fs]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-fs') === fsize());
    });
  }

  function close() {
    if (box) { box.remove(); box = null; document.removeEventListener('click', away); }
  }
  function away(e) {
    if (box && !box.contains(e.target) && !e.target.closest('.plotThemeBtn')) close();
  }

  function open(btn) {
    if (box) { close(); return; }
    box = document.createElement('div');
    box.className = 'plotThemeBox';
    box.innerHTML = '<b>밝기</b><div class="row">' +
      MODES.map(function (m) {
        return '<button type="button" data-mode="' + m[0] + '">' + m[1] + '</button>';
      }).join('') + '</div><b>강조색</b><div class="row">' +
      ACCENTS.map(function (a) {
        return '<button type="button" class="sw" data-accent="' + a[0] +
               '" title="' + a[0] + '"></button>';
      }).join('') + '</div>' +
      // 네온을 골랐을 때만 열리는 줄 — 색이 하나면 사이버펑크가 안 산다
      '<div class="row hues">' + HUES.map(function (h) {
        return '<button type="button" class="hue" data-hue="' + h +
               '" title="' + h + '"></button>';
      }).join('') + '</div>' +
      '<b>글자 크기</b><div class="row">' + FSIZES.map(function (f) {
        return '<button type="button" data-fs="' + f[0] + '">' + f[1] + '</button>';
      }).join('') + '</div>' +
      '<b>여백</b><div class="row">' + GAPS.map(function (g) {
        return '<button type="button" data-gap="' + g[0] + '">' + g[1] + '</button>';
      }).join('') + '</div>';
    document.body.appendChild(box);
    // body 에 배율이 걸려 있으면 getBoundingClientRect 는 이미 곱해진 값을 준다.
    // 상자는 그 배율 안에 놓이므로 되나눠야 제자리에 선다.
    var z = parseFloat(getComputedStyle(document.body).zoom) || 1;
    box.style.top = Math.round(btn.getBoundingClientRect().bottom / z + 8) + 'px';
    box.onclick = function (e) {
      var m = e.target.closest('[data-mode]'), a = e.target.closest('[data-accent]');
      if (m) { set(TK, m.getAttribute('data-mode') === 'system' ? '' : m.getAttribute('data-mode')); apply(); }
      if (a) { set(AK, a.getAttribute('data-accent')); apply(); }
      var h = e.target.closest('[data-hue]');
      if (h) { set(NK, h.getAttribute('data-hue')); apply(); }
      var g = e.target.closest('[data-gap]');
      if (g) { set(GK, g.getAttribute('data-gap')); apply(); }
      var f = e.target.closest('[data-fs]');
      if (f) { set(FK, f.getAttribute('data-fs')); apply(); }
    };
    paint();
    setTimeout(function () { document.addEventListener('click', away); }, 0);
  }

  function put() {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'plotThemeBtn';
    btn.textContent = '◐ 테마';
    btn.title = '밝기와 강조색';
    btn.onclick = function (e) { e.stopPropagation(); open(btn); };
    var own = document.getElementById('theme');
    var h = document.querySelector('header .hbtns') || document.querySelector('.addRow')
            || (own && own.parentElement);
    if (h) { h.appendChild(btn); return; }
    btn.className += ' float';
    document.body.appendChild(btn);
  }

  apply();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', put);
  else put();
})();
</script>

<script>

  var ua = navigator.userAgent;
  var iOS = /iPad|iPhone|iPod/.test(ua) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!iOS) return;
  if (window.navigator.standalone === true ||
      matchMedia('(display-mode: standalone)').matches) return;   // 이미 앱으로 열었다
  try { if (localStorage.getItem(KEY) === 'off') return; } catch (e) {}

  var TG = window.Telegram && window.Telegram.WebApp;
  var inTG = !!(TG && TG.initData !== undefined && TG.platform && TG.platform !== 'unknown');

  function show() {

      'z-index:9997; background:var(--panel,#131318); color:var(--text,#ECECF1);' +
      'border:1px solid var(--line,#2A2A34); border-radius:12px; padding:12px 13px;' +

    var msg = inTG
      ? '홈 화면에 추가하려면 <b>사파리에서 열어야</b> 합니다 — 텔레그램 안에는 그 메뉴가 없어요.'
      : safari
        ? '아래 <b>공유 버튼(↑)</b> → <b>홈 화면에 추가</b> 를 누르면 앱처럼 열립니다.'
        : '홈 화면에 추가는 <b>사파리에서만</b> 됩니다 — 이 주소를 사파리로 열어 주세요.';
    box.innerHTML = '<div style="margin-bottom:9px">' + msg + '</div>' +

              'padding:9px; font:inherit; font-weight:700; background:var(--text,#ECECF1);' +
              'color:var(--bg,#0A0A0C)">브라우저에서 열기</button>' : '') +
      '<button id="plotHintNo" style="flex:' + (inTG ? '0 0 92px' : '1') + ';' +
      'border:1px solid var(--line,#2A2A34); border-radius:8px; padding:9px; font:inherit;' +
      'background:none; color:var(--muted,#8A8A96)">다시 안 보기</button></div>';
    document.body.appendChild(box);
    var go = document.getElementById('plotOpenSafari');
    if (go) go.onclick = function () {
      try { TG.openLink(location.href); } catch (e) { window.open(location.href, '_blank'); }
    };
    document.getElementById('plotHintNo').onclick = function () {
      try { localStorage.setItem(KEY, 'off'); } catch (e) {}
      box.remove();
    };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show);
  else show();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', function () {
    // updateViaCache:'none' — 이게 없으면 sw.js 자체가 HTTP 캐시에 걸린다.

    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(function (r) { r.update(); })

  });
}
</script>
