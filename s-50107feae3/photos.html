<title>사진 DB — PLOT</title>

<style>
:root{--bg:#0A0A0C;--panel:#131318;--raise:#1B1B22;--line:#20202A;--text:#ECECF1;--muted:#8A8A96;--dim:#565663;--amber:#E8B34A;--pick:#6FBF8B;--bad:#E0786A;color-scheme:dark}
:root[data-theme="light"]{--bg:#FBFAF7;--panel:#F2F0EA;--raise:#E9E6DE;--line:#DCD8CE;--text:#1A1A1F;--muted:#5E5E6B;--dim:#746E7C;--amber:#7A6B10;--pick:#2E7D51;--bad:#A63A2B;color-scheme:light}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#FBFAF7;--panel:#F2F0EA;--raise:#E9E6DE;--line:#DCD8CE;--text:#1A1A1F;--muted:#5E5E6B;--dim:#746E7C;--amber:#7A6B10;--pick:#2E7D51;--bad:#A63A2B;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Pretendard,-apple-system,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:26px;margin:8px 0 4px;letter-spacing:-.03em}
.sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 14px}
.bar input{flex:1 1 200px;min-width:0;font:inherit;font-size:16px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text)}
.bar button{font:inherit;font-size:13px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--text);cursor:pointer}
.bar button[aria-pressed="true"]{border-color:var(--amber);background:rgba(232,179,74,.14)}
.stat{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:4px 0 10px}
.stat b{color:var(--text)}
.p{border-top:1px solid var(--line);padding:12px 0}
.ph{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ph b{font-size:16px}.ph span{font-size:12px;color:var(--muted)}
.ph .z{color:var(--bad)}
.ph a{color:var(--muted);font-size:12px}
.g{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:thin}
.c{flex:none;width:132px}
.c img{width:132px;height:165px;object-fit:cover;border-radius:8px;background:var(--raise);display:block;cursor:zoom-in}
.c small{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k{display:inline-block;font-size:10.5px;padding:0 6px;border:1px solid var(--line);border-radius:999px;margin-right:3px}
.empty{color:var(--dim);font-size:13px;padding:6px 0}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9;padding:16px}
.zoom img{max-width:100%;max-height:82vh;border-radius:8px}
.zoom p{position:absolute;left:16px;right:16px;bottom:16px;color:#ddd;font-size:13px;text-align:center}
.zoom .zb{display:flex;gap:10px;justify-content:center;margin-top:12px}.zoom .zb button{font:inherit;padding:10px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff}
</style>

<style id="plotGap">

<body>
<div class="wrap">
  <h1>사진 DB</h1>
  <div class="sub" id="at">불러오는 중…</div>
  <div class="stat" id="stat"></div>
  <div class="bar">
    <input id="q" placeholder="이름·핸들 찾기" />
  </div>
  <div class="bar" id="fk"></div>
  <div class="bar" id="fs"></div>
  <div id="list"></div>
</div>
<script>
(function () {
  'use strict';
  var D = [], fk = 'all', fs = 'all', q = '';
  var KINDS = ['all', '프로필', '화보', '셀카·일상', '앨범커버'];
  var SORTS = [['all', '전체'], ['few', '사진 적은 사람'], ['zero', '사진 없음'], ['new', '최근 추가']];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function chips(id, list, cur, cb) {
    var el = document.getElementById(id);
    el.innerHTML = list.map(function (x) { var k = x[0] || x, t = x[1] || (x === 'all' ? '전체 종류' : x);
      return '<button type="button" data-v="' + esc(k) + '" aria-pressed="' + (k === cur) + '">' + esc(t) + '</button>'; }).join('');
    el.onclick = function (e) { var b = e.target.closest('[data-v]'); if (b) cb(b.getAttribute('data-v')); };
  }
  function render() {
    chips('fk', KINDS, fk, function (v) { fk = v; render(); });
    chips('fs', SORTS, fs, function (v) { fs = v; render(); });
    var ql = q.toLowerCase();
    var rows = D.filter(function (p) {
      if (ql && (p.name + ' ' + (p.handle || '') + ' ' + (p.aliases || []).join(' ')).toLowerCase().indexOf(ql) < 0) return false;
      var n = (p.photos || []).length;
      if (fs === 'zero') return n === 0;
      if (fs === 'few') return n > 0 && n < 4;
      return true;
    });
    if (fs === 'new') rows.sort(function (a, b) { return String(b.last || '').localeCompare(String(a.last || '')); });
    else rows.sort(function (a, b) { return (b.prio || 0) - (a.prio || 0) || (b.photos || []).length - (a.photos || []).length; });
    document.getElementById('list').innerHTML = rows.map(function (p) {
      var ph = (p.photos || []).filter(function (x) { return fk === 'all' || x.kind === fk; });
      var n = (p.photos || []).length;
      return '<div class="p"><div class="ph"><b>' + esc(p.name) + '</b>' +
        (p.handle ? '<a href="https://instagram.com/' + esc(p.handle) + '" target="_blank" rel="noopener">@' + esc(p.handle) + '</a>' : '<span>핸들 모름</span>') +
        '<span class="' + (n ? '' : 'z') + '">사진 ' + n + '장</span>' +
        (p.prio === 3 ? '<span>· 지금 뜸</span>' : p.prio === 2 ? '<span>· 최근 다룸</span>' : '') + '</div>' +
        (ph.length ? '<div class="g">' + ph.map(function (x) {
          return '<div class="c"><img loading="lazy" referrerpolicy="no-referrer" src="' + esc(x.url) + '" data-z="' + esc(x.url) + '" data-c="' +
            esc((x.kind || '') + ' · ' + (x.credit || '') + ' · ' + (x.added || '') + (x.why ? ' · ' + x.why : '')) + '" alt="">' +
            '<small><span class="k">' + esc(x.kind || '?') + '</span>' + esc(x.score || '') + '점 · ' + esc(x.src || '') + '</small>' +
            '<small>' + esc(x.credit || '') + (x.used ? ' · ' + x.used + '번 씀' : '') + '</small></div>'; }).join('') + '</div>'
          : '<div class="empty">' + (n ? '이 종류 사진 없음' : '아직 사진이 없습니다') + '</div>') + '</div>';
    }).join('') || '<div class="empty">맞는 사람이 없습니다</div>';
  }
  /* 사진 저장 — 크게 열 때 미리 받아 두고, 저장을 누르는 순간 공유 시트(이미지 저장)로 넘긴다
     (iOS 는 누른 그 순간에만 공유를 허락해서, 누른 뒤에 받으면 막힌다) */
  var ZF = {}, ZP = {};
  function zName(u) { var n = 'plot_' + String(u).split('/').pop().split('?')[0]; return /\.(jpe?g|png|webp)$/i.test(n) ? n : n + '.jpg'; }
  function zFetch(u) {
    if (!ZP[u]) ZP[u] = fetch(u).then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
      .then(function (b) { return (ZF[u] = new File([b], zName(u), { type: b.type || 'image/jpeg' })); })
      .catch(function () { ZF[u] = 'fail'; return 'fail'; });
    return ZP[u];
  }
  function zGive(u, f, btn) {
    if (f === 'fail') { window.open(u, '_blank'); return; }
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      navigator.share({ files: [f] }).catch(function (e) { if (!e || e.name !== 'AbortError') window.open(u, '_blank'); });
      return;
    }
    var x = URL.createObjectURL(f), a = document.createElement('a');
    a.href = x; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(x); }, 4000);
    if (btn) btn.textContent = '저장했습니다';
  }
  function saveImg(u, btn) {
    if (ZF[u]) { zGive(u, ZF[u], btn); return; }
    if (btn) btn.textContent = '받는 중…';
    zFetch(u).then(function (f) { zGive(u, f, btn); });
  }
  document.getElementById('q').addEventListener('input', function (e) { q = e.target.value; render(); });
  document.addEventListener('click', function (e) {
    var z = e.target.closest('[data-z]');
    if (z) {
      var d = document.createElement('div'); d.className = 'zoom';
      var zu = z.getAttribute('data-z');
      d.innerHTML = '<img src="' + esc(zu) + '" referrerpolicy="no-referrer"><p>' + esc(z.getAttribute('data-c')) + '</p>' +
        '<div class="zb"><button type="button" data-zsave>저장</button><button type="button" data-zx>닫기</button></div>';
      // 10/17 "사진 다운 안 됨" — 사진을 누르면 닫히던 것을 바깥·닫기로만 닫고, 저장 버튼을 둔다
      d.onclick = function (ev) {
        if (ev.target.closest('[data-zsave]')) { saveImg(zu, ev.target.closest('[data-zsave]')); return; }
        if (ev.target === d || ev.target.closest('[data-zx]')) d.remove();
      };
      zFetch(zu); document.body.appendChild(d); return;
    }
  });
  fetch('./photos.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (j) {
    D = j.people || [];
    var tot = 0, zero = 0, kinds = {};
    D.forEach(function (p) { var n = (p.photos || []).length; tot += n; if (!n) zero++; (p.photos || []).forEach(function (x) { kinds[x.kind] = (kinds[x.kind] || 0) + 1; }); });
    document.getElementById('at').textContent = (j.at || '') + ' 기준 · 맥이 한 시간마다 몇 명씩 채웁니다';
    document.getElementById('stat').innerHTML = '<span>인물 <b>' + D.length + '</b>명</span><span>사진 <b>' + tot + '</b>장</span><span>사진 없음 <b>' + zero + '</b>명</span>' +
      Object.keys(kinds).map(function (k) { return '<span>' + esc(k) + ' ' + kinds[k] + '</span>'; }).join('');
    render();
  }).catch(function () { document.getElementById('at').textContent = '사진 DB 를 못 불러왔습니다'; });
})();
</script>
</body>
</html>

<script>
(function () {
  function put() {
    var a = document.createElement('a');
    a.href = './';
    a.textContent = '← PLOT 제작';
    a.setAttribute('aria-label', 'PLOT 제작 홈으로');
    a.title = '판 10.29 12:57';
    var ver = document.createElement('span');
    ver.textContent = '10.29 12:57';
    ver.style.cssText = 'font:500 11px/1 ui-monospace,Menlo,monospace;color:var(--faint,#5A5A66);' +
                        'margin-left:7px;letter-spacing:0;';
    a.appendChild(ver);
    // 이 링크가 화면을 빠져나가는 유일한 길이다. 작게 두면 못 찾는다(규효 9/29).
    // 손가락이 닿는 크기(44px)를 세로로 확보하고, 흐린 색 대신 본문색을 쓴다.
    var base = 'font:700 16px/1 Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;' +
               'color:var(--text,#ECECF1);text-decoration:none;white-space:nowrap;letter-spacing:-.02em;' +
               'display:inline-flex;align-items:center;min-height:44px;' +
               'padding:6px 2px;border:0;background:none;flex:none;cursor:pointer;';
    // 텔레그램 데스크톱은 미니앱을 폰 크기 창으로 띄운다 — 화면이 넓어도 창은 그대로다.
    // 그래서 컴퓨터에서는 브라우저로 넘어가는 길을 한 번에 열어준다.
    var TG = window.Telegram && window.Telegram.WebApp;
    var inTG = !!(TG && TG.initData !== undefined && TG.platform && TG.platform !== 'unknown');
    var wide = null;
    if (inTG) {
      wide = document.createElement('button');
      wide.type = 'button';
      wide.textContent = '🖥 브라우저에서';
      wide.title = '넓은 화면에서 열기';
      wide.onclick = function () {
        try { TG.openLink(location.href); } catch (e) { window.open(location.href, '_blank'); }
      };
    }

    var h = document.querySelector('header');
    if (h) {
      a.style.cssText = base + 'margin-right:14px;';
      h.insertBefore(a, h.firstChild);
      if (wide) {
        wide.style.cssText = base + 'margin-right:14px;cursor:pointer;';
        h.insertBefore(wide, a.nextSibling);
      }
    } else {
      a.style.cssText = base +
        'position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top));z-index:9999;padding:8px 14px;' +
        'border-radius:10px;background:var(--glass,rgba(10,10,12,.72));color:var(--text,var(--ink,#ECECF1));' +
        'border:1px solid var(--line,#20202A);box-shadow:0 6px 18px rgba(0,0,0,.28);' +
        'backdrop-filter:blur(8px);';
      document.body.appendChild(a);
      if (wide) {
        wide.style.cssText = base +
          'position:fixed;left:150px;top:calc(12px + env(safe-area-inset-top));z-index:9999;padding:8px 14px;' +
          'border-radius:10px;background:var(--glass,rgba(10,10,12,.72));color:var(--text,var(--ink,#ECECF1));' +
          'border:1px solid var(--line,#20202A);cursor:pointer;' +
          'backdrop-filter:blur(8px);';
        document.body.appendChild(wide);
      }
    }
  }
  /* 10/24 규효 "봇 UI 사용자 편의 — 메뉴·화면 이동" — 다른 화면으로 가려면 늘 홈을 거쳐야 했다.
     '← PLOT 제작' 옆 ▾ 를 누르면 화면 목록이 펼쳐진다. 지금 화면은 표시만. */
  var PAGES = [['./', '홈'], ['sources.html', '오늘의 초안'], ['shorts.html', '숏폼 제작'],
               ['carousel.html', '캐러셀 스튜디오'], ['perf.html', 'PLOT 성과'], ['photos.html', '사진 DB']];
  function menu() {
    if (document.getElementById('plotNavMenu')) return;
    var here = (location.pathname.split('/').pop() || '');
    var m = document.createElement('div');
    m.id = 'plotNavMenu';
    m.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.35);';
    var box = document.createElement('div');
    box.style.cssText = 'position:absolute;left:12px;top:calc(60px + env(safe-area-inset-top));min-width:220px;' +
      'background:var(--bg,var(--paper,#111));color:var(--text,var(--ink,#ECECF1));border:1px solid var(--line,#2A2A33);' +
      'border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.35);padding:6px;';
    PAGES.forEach(function (pg) {
      var cur = pg[0] === here || (pg[0] === './' && (here === '' || here === 'index.html'));
      var a = document.createElement('a');
      a.href = pg[0]; a.textContent = (cur ? '● ' : '') + pg[1];
      a.style.cssText = 'display:flex;align-items:center;min-height:46px;padding:0 14px;border-radius:10px;' +
        'font:' + (cur ? '800' : '600') + ' 16px/1 Pretendard,-apple-system,sans-serif;color:inherit;text-decoration:none;' +
        (cur ? 'opacity:.55;pointer-events:none;' : '');
      box.appendChild(a);
    });
    m.appendChild(box);
    m.addEventListener('click', function (e) { if (e.target === m) close(); });
    document.body.appendChild(m);
    try { history.pushState({ plotNav: 1 }, ''); } catch (e) {}
  }
  function close() {
    var m = document.getElementById('plotNavMenu');
    if (!m) return;
    m.remove();
    try { if (history.state && history.state.plotNav) history.back(); } catch (e) {}
  }
  window.addEventListener('popstate', function () { var m = document.getElementById('plotNavMenu'); if (m) m.remove(); });
  function addMenu() {
    var a = document.querySelector('a[aria-label="PLOT 제작 홈으로"]');
    if (!a || document.getElementById('plotNavBtn')) return;
    var b = document.createElement('button');
    b.id = 'plotNavBtn'; b.type = 'button'; b.textContent = '▾';
    b.setAttribute('aria-label', '다른 화면으로');
    b.style.cssText = 'font:700 15px/1 -apple-system,sans-serif;color:var(--text,var(--ink,#ECECF1));background:none;' +
      'border:1px solid var(--line,#2A2A33);border-radius:9px;min-width:34px;min-height:34px;margin:0 10px 0 -8px;cursor:pointer;flex:none;';
    if (a.style.position === 'fixed') {
      b.style.cssText += 'position:fixed;top:calc(16px + env(safe-area-inset-top));left:' + (a.getBoundingClientRect().right + 16) + 'px;z-index:9999;' +
        'background:var(--glass,rgba(10,10,12,.72));backdrop-filter:blur(8px);';
      document.body.appendChild(b);
    } else {                                        // 링크와 ▾ 를 한 줄로 묶는다 (헤더가 세로로 쌓는 화면에서도)
      var w = document.createElement('span');
      w.style.cssText = 'display:inline-flex;align-items:center;flex:none;align-self:flex-start;';
      a.parentNode.insertBefore(w, a);
      w.appendChild(a); w.appendChild(b);
      b.style.margin = '0 10px 0 -6px';
    }
    b.onclick = function () { document.getElementById('plotNavMenu') ? close() : menu(); };
    if (window.innerWidth < 380) {                  // 좁은 폰에서는 판 번호를 숨겨 자리를 만든다 (판은 길게 눌러 title 로)
      var v = a.querySelector('span'); if (v) v.style.display = 'none';
    }
  }
  function boot() { put(); addMenu(); }
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

<script>
(function () {
  var TK = 'plot.app.theme', AK = 'plot.app.accent', NK = 'plot.app.neon',
      GK = 'plot.app.gap', FK = 'plot.app.fs';
  var GAPS = [['tight', '좁게'], ['normal', '보통'], ['wide', '넓게']];
  var FSIZES = [['s', '작게'], ['m', '보통'], ['l', '크게'], ['xl', '더 크게']];
  var HUES = ['cyan', 'magenta', 'lime', 'orange', 'violet'];
  var MODES = [['system', '기기'], ['light', '밝게'], ['dark', '어둡게']];
  var ACCENTS = [['amber', '#E8B34A'], ['blue', '#5B8DEF'], ['green', '#4FB477'],
                 ['violet', '#8B7CF0'], ['mono', '#ECECF1'], ['neon', '#00F0FF']];
  var box = null;

  function get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
  function set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
  function mode() { var t = get(TK, ''); return (t === 'light' || t === 'dark') ? t : 'system'; }
  function accent() { return get(AK, 'amber'); }
  function hue() { var h = get(NK, 'cyan'); return HUES.indexOf(h) < 0 ? 'cyan' : h; }
  function gap() { var g = get(GK, 'normal'); return /^(tight|normal|wide)$/.test(g) ? g : 'normal'; }
  function fsize() { var f = get(FK, 'm'); return /^(s|m|l|xl)$/.test(f) ? f : 'm'; }

  function apply() {
    var r = document.documentElement, m = mode();
    if (m === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', m);
    r.setAttribute('data-accent', accent());
    r.setAttribute('data-neon', hue());
    r.setAttribute('data-gap', gap());
    r.setAttribute('data-fs', fsize());
    var meta = document.querySelector('meta[name=theme-color]');
    if (meta) {
      var dark = m === 'dark' ||
        (m === 'system' && !matchMedia('(prefers-color-scheme: light)').matches);
      meta.setAttribute('content', dark ? '#0A0A0C' : '#FBFAF7');
    }
    if (box) paint();
  }

  function paint() {
    [].forEach.call(box.querySelectorAll('[data-mode]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-mode') === mode());
    });
    [].forEach.call(box.querySelectorAll('[data-accent]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-accent') === accent());
    });
    [].forEach.call(box.querySelectorAll('[data-hue]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-hue') === hue());
    });
    [].forEach.call(box.querySelectorAll('[data-gap]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-gap') === gap());
    });
    [].forEach.call(box.querySelectorAll('[data-fs]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-fs') === fsize());
    });
  }

  function close() {
    if (box) { box.remove(); box = null; document.removeEventListener('click', away); }
  }
  function away(e) {
    if (box && !box.contains(e.target) && !e.target.closest('.plotThemeBtn')) close();
  }

  function open(btn) {
    if (box) { close(); return; }
    box = document.createElement('div');
    box.className = 'plotThemeBox';
    box.innerHTML = '<b>밝기</b><div class="row">' +
      MODES.map(function (m) {
        return '<button type="button" data-mode="' + m[0] + '">' + m[1] + '</button>';
      }).join('') + '</div><b>강조색</b><div class="row">' +
      ACCENTS.map(function (a) {
        return '<button type="button" class="sw" data-accent="' + a[0] +
               '" title="' + a[0] + '"></button>';
      }).join('') + '</div>' +
      // 네온을 골랐을 때만 열리는 줄 — 색이 하나면 사이버펑크가 안 산다
      '<div class="row hues">' + HUES.map(function (h) {
        return '<button type="button" class="hue" data-hue="' + h +
               '" title="' + h + '"></button>';
      }).join('') + '</div>' +
      '<b>글자 크기</b><div class="row">' + FSIZES.map(function (f) {
        return '<button type="button" data-fs="' + f[0] + '">' + f[1] + '</button>';
      }).join('') + '</div>' +
      '<b>여백</b><div class="row">' + GAPS.map(function (g) {
        return '<button type="button" data-gap="' + g[0] + '">' + g[1] + '</button>';
      }).join('') + '</div>';
    document.body.appendChild(box);
    // body 에 배율이 걸려 있으면 getBoundingClientRect 는 이미 곱해진 값을 준다.
    // 상자는 그 배율 안에 놓이므로 되나눠야 제자리에 선다.
    var z = parseFloat(getComputedStyle(document.body).zoom) || 1;
    box.style.top = Math.round(btn.getBoundingClientRect().bottom / z + 8) + 'px';
    box.onclick = function (e) {
      var m = e.target.closest('[data-mode]'), a = e.target.closest('[data-accent]');
      if (m) { set(TK, m.getAttribute('data-mode') === 'system' ? '' : m.getAttribute('data-mode')); apply(); }
      if (a) { set(AK, a.getAttribute('data-accent')); apply(); }
      var h = e.target.closest('[data-hue]');
      if (h) { set(NK, h.getAttribute('data-hue')); apply(); }
      var g = e.target.closest('[data-gap]');
      if (g) { set(GK, g.getAttribute('data-gap')); apply(); }
      var f = e.target.closest('[data-fs]');
      if (f) { set(FK, f.getAttribute('data-fs')); apply(); }
    };
    paint();
    setTimeout(function () { document.addEventListener('click', away); }, 0);
  }

  function put() {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'plotThemeBtn';
    btn.textContent = '◐ 테마';
    btn.title = '밝기와 강조색';
    btn.onclick = function (e) { e.stopPropagation(); open(btn); };
    var own = document.getElementById('theme');
    var h = document.querySelector('header .hbtns') || document.querySelector('.addRow')
            || (own && own.parentElement);
    if (h) { h.appendChild(btn); return; }
    btn.className += ' float';
    document.body.appendChild(btn);
  }

  apply();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', put);
  else put();
})();
</script>

<script>
(function () {
  var KEY = 'plot.app.installHint';
  var ua = navigator.userAgent;
  var iOS = /iPad|iPhone|iPod/.test(ua) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!iOS) return;
  if (window.navigator.standalone === true ||
      matchMedia('(display-mode: standalone)').matches) return;   // 이미 앱으로 열었다
  try { if (localStorage.getItem(KEY) === 'off') return; } catch (e) {}

  var TG = window.Telegram && window.Telegram.WebApp;
  var inTG = !!(TG && TG.initData !== undefined && TG.platform && TG.platform !== 'unknown');
  var safari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|Chrome/.test(ua);

  function show() {
    var box = document.createElement('div');
    box.style.cssText =
      'position:fixed; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom));' +
      'z-index:9997; background:var(--panel,#131318); color:var(--text,#ECECF1);' +
      'border:1px solid var(--line,#2A2A34); border-radius:12px; padding:12px 13px;' +
      'font:14px/1.55 -apple-system,BlinkMacSystemFont,sans-serif;' +
      'box-shadow:0 14px 40px rgba(0,0,0,.45)';
    var msg = inTG
      ? '홈 화면에 추가하려면 <b>사파리에서 열어야</b> 합니다 — 텔레그램 안에는 그 메뉴가 없어요.'
      : safari
        ? '아래 <b>공유 버튼(↑)</b> → <b>홈 화면에 추가</b> 를 누르면 앱처럼 열립니다.'
        : '홈 화면에 추가는 <b>사파리에서만</b> 됩니다 — 이 주소를 사파리로 열어 주세요.';
    box.innerHTML = '<div style="margin-bottom:9px">' + msg + '</div>' +
      '<div style="display:flex; gap:7px">' +
      (inTG ? '<button id="plotOpenSafari" style="flex:1; border:0; border-radius:8px;' +
              'padding:9px; font:inherit; font-weight:700; background:var(--text,#ECECF1);' +
              'color:var(--bg,#0A0A0C)">브라우저에서 열기</button>' : '') +
      '<button id="plotHintNo" style="flex:' + (inTG ? '0 0 92px' : '1') + ';' +
      'border:1px solid var(--line,#2A2A34); border-radius:8px; padding:9px; font:inherit;' +
      'background:none; color:var(--muted,#8A8A96)">다시 안 보기</button></div>';
    document.body.appendChild(box);
    var go = document.getElementById('plotOpenSafari');
    if (go) go.onclick = function () {
      try { TG.openLink(location.href); } catch (e) { window.open(location.href, '_blank'); }
    };
    document.getElementById('plotHintNo').onclick = function () {
      try { localStorage.setItem(KEY, 'off'); } catch (e) {}
      box.remove();
    };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show);
  else show();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', function () {
    // updateViaCache:'none' — 이게 없으면 sw.js 자체가 HTTP 캐시에 걸린다.
    // 캐시 규칙을 고친 새 워커가 옛 캐시 때문에 안 실리는, 웃기지만 실제로 겪은 일.
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(function (r) { r.update(); })
      .catch(function () {});
  });
}
</script>
