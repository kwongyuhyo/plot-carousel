<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>규효 데스크</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#08080B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="데스크">
<meta name="mobile-web-app-capable" content="yes">
<style>/* 플루토 · 디자인 시스템
 * ─────────────────────────────────────────────────────────────
 * 팀 앱과 개인 앱이 이 한 장을 같이 쓴다. 둘은 강조색만 다르다 —
 * 같은 손에 익은 조작이 두 사이트에서 똑같이 먹혀야 하기 때문이다.
 *
 * 규칙 넷.
 *   1. 색은 뜻이 있을 때만 쓴다. 장식으로 쓰는 색은 없다.
 *   2. 상태 표시는 한 벌뿐이다. 점 + 이름. 화면마다 새로 만들지 않는다.
 *   3. 4px 격자 위에 올린다. 어중간한 값(13.5px 같은)을 쓰지 않는다.
 *   4. 움직임은 설명할 때만. 120~180ms, 감속.
 *
 * 웹폰트는 싣지 않는다. Pretendard 를 CDN 에서 @import 하면 CSS 가
 * 직렬로 막히고, 사무실 망이나 지하철에서 첫 화면이 그만큼 늦어진다.
 * 이 앱은 "폰에서 급할 때 연다"가 전부다. 기기에 Pretendard 가 있으면
 * 쓰고, 없으면 시스템 한글 글꼴(Apple SD Gothic Neo / Noto Sans KR)로
 * 떨어진다. 가독성은 글꼴이 아니라 크기·줄폭·위계로 만든다.
 */

:root{
  /* ── 브랜드색 ── 밝을 때와 어두울 때 다른 값을 쓴다. 같은 앰버를
     흰 종이 위에 올리면 읽히지 않는다. 앱별 강조색은 이 둘만 바꾼다. */
  --brand-d:#E9B75A; --brand-l:#8A5A0B;
  --focus-d:#8A8AF4; --focus-l:#4B45C8;

  /* ── 면 ── 뒤에서 앞으로 네 겹. 이 순서를 뒤집지 않는다.
     순수 검정(#000 근처)은 글자 경계가 번져 눈이 빨리 지친다.
     한 단계 들어올린 숯색을 바닥으로 쓴다. */
  --bg:#121217;          /* 바닥 */
  --sf:#191920;          /* 패널·카드 */
  --sf2:#21212A;         /* 카드 안의 카드, 입력칸 */
  --sf3:#2B2B36;         /* 눌린 것, 떠 있는 것 */
  --line:#2E2E3A;        /* 경계 */
  --line2:#242430;       /* 흐린 경계 — 목록 안쪽 줄 */
  --on-accent:#121217;   /* 강조색 위에 얹는 글자 */
  --bar:rgba(18,18,23,.88);   /* 상단 바 */
  --bar2:rgba(25,25,32,.94);  /* 하단 탭바 */
  --scrim:rgba(8,8,12,.7);

  /* ── 글자 ── 네 단계. 더 만들면 위계가 무너진다. */
  --t1:#F2F2F7;          /* 제목·본문 */
  --t2:#C4C4D0;          /* 설명 — 메모가 본문만큼 자주 읽힌다 */
  --t3:#9E9EAC;          /* 부가 정보 */
  --t4:#7E7E8C;          /* 거의 안 보여도 되는 것 */
  --measure:70ch;        /* 한 줄이 이보다 길어지면 눈이 줄을 놓친다 */

  /* ── 뜻이 있는 색 ── */
  --accent:var(--brand-d);
  --focus:var(--focus-d);
  --danger:#E2705A;      /* 막힘·지남 */
  --ok:#5FC194;          /* 진행·정상 */
  --hold:#D0A84E;        /* 대기 */
  --solo:#BE96CC;        /* 개인 */
  --auto:#7AA0C6;        /* 자동화가 한 일 */

  --danger-bg:#2E1815; --ok-bg:#13251D; --hold-bg:#241F11;
  --focus-bg:#1A1A32;   --solo-bg:#221929; --auto-bg:#131D28;
  --accent-bg:#26200F;

  /* 테두리용 반투명 — 색을 바꾸면 여기도 같이 바뀌게 색 이름으로 둔다 */
  --ring-accent:color-mix(in srgb, var(--accent) 45%, transparent);
  --ring-focus:color-mix(in srgb, var(--focus) 48%, transparent);
  --ring-danger:color-mix(in srgb, var(--danger) 45%, transparent);

  /* ── 간격 ── 4px 격자 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px;
  --s6:28px; --s7:40px; --s8:56px;

  --r1:4px; --r2:6px; --r3:10px; --r4:16px;

  --shadow:0 20px 52px rgba(0,0,0,.55);
  --shadow-s:0 6px 18px rgba(0,0,0,.38);

  --ease:cubic-bezier(.2,.7,.3,1);
  --fast:120ms; --mid:170ms;

  --rail:212px;
  --pane:376px;

  color-scheme:dark;
}

/* ── 밝게 ──────────────────────────────────────────────
 * 스튜디오 낮 조명 아래에서는 어두운 판이 오히려 안 읽힌다.
 * 종이는 순백이 아니라 살짝 따뜻한 회백 — 순백은 흰 화면이 그대로
 * 눈에 들어와 피로하다. data-theme 은 부팅할 때 JS 가 항상 채우므로
 * 미디어 쿼리를 두 벌 쓰지 않는다.
 */
:root[data-theme="light"]{
  --bg:#F4F3EF;
  --sf:#FFFFFF;
  --sf2:#F8F7F3;
  --sf3:#EAE8E1;
  --line:#DFDCD3;
  --line2:#EAE8E1;
  --on-accent:#FFFFFF;
  --bar:rgba(244,243,239,.9);
  --bar2:rgba(255,255,255,.95);
  --scrim:rgba(40,38,33,.4);

  --t1:#1A1A1F;
  --t2:#4E4E58;
  --t3:#6E6E78;
  --t4:#8C8C96;

  --accent:var(--brand-l);
  --focus:var(--focus-l);
  --danger:#A83A22;
  --ok:#2C6B4C;
  --hold:#8A6612;
  --solo:#6D4A85;
  --auto:#3A6389;

  --danger-bg:#F7E4DE; --ok-bg:#DFEDE5; --hold-bg:#F3EBD4;
  --focus-bg:#E5E4F8;  --solo-bg:#EFE6F4; --auto-bg:#E1EAF2;
  --accent-bg:#F2E8D3;

  --shadow:0 20px 48px rgba(40,38,33,.16);
  --shadow-s:0 4px 14px rgba(40,38,33,.1);

  color-scheme:light;
}

/* 개인 앱은 같은 뼈대에 다른 강조색을 쓴다. 두 사이트를 헷갈리지 않으려면
   색이 먼저 다르고 구조는 같아야 한다 — 반대로 하면 조작을 다시 배운다. */
:root[data-app="desk"]{ --brand-d:#C9A4D8; --brand-l:#6D4A85;
  --focus-d:#A98EE0; --focus-l:#5E45A8; }

*{box-sizing:border-box}
[hidden]{display:none!important}

html,body{overflow-x:clip}
body{
  margin:0;background:var(--bg);color:var(--t1);
  font-family:"Pretendard Variable",Pretendard,
    -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
  font-size:15px;line-height:1.65;letter-spacing:-.004em;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
  word-break:keep-all;overflow-wrap:anywhere;
}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.018em;line-height:1.28}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
  text-align:left;letter-spacing:inherit}
input,textarea,select{font:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r1)}
::selection{background:var(--focus);color:var(--on-accent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ── 글자 계단 ─────────────────────────────────────── */
.d1{font-size:23px;font-weight:800;line-height:1.2;letter-spacing:-.025em}
.h1{font-size:18px;font-weight:800;line-height:1.3}
.h2{font-size:14px;font-weight:800;line-height:1.35}
.lbl{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--t3)}
.meta{font-size:12px;line-height:1.45;color:var(--t2)}
.micro{font-size:11px;line-height:1.4;color:var(--t3)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.dim{color:var(--t3)}

/* ── 골격 ──────────────────────────────────────────── */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100dvh}
.app.has-pane{grid-template-columns:var(--rail) minmax(0,1fr) var(--pane)}

.rail{position:sticky;top:0;height:100dvh;overflow-y:auto;background:var(--sf);
  border-right:1px solid var(--line);padding:var(--s4) var(--s3) var(--s5);
  display:flex;flex-direction:column;gap:var(--s2)}
.mark{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) var(--s2) var(--s3)}
.mark .glyph{width:22px;height:22px;border-radius:var(--r2);background:var(--accent);
  color:var(--on-accent);display:grid;place-items:center;font-size:12px;font-weight:800;flex:0 0 auto}
.mark b{font-size:14px;font-weight:800;letter-spacing:-.02em}
.mark span{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--t4);
  margin-left:auto}

.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:var(--s2);width:100%;
  padding:7px var(--s2);border-radius:var(--r2);color:var(--t2);font-size:13px;
  transition:background var(--fast) var(--ease),color var(--fast) var(--ease)}
.nav button:hover{background:var(--sf2);color:var(--t1)}
.nav button[aria-current="page"]{background:var(--sf3);color:var(--t1);font-weight:700}
.nav .ic{width:15px;text-align:center;font-size:11px;color:var(--t4);flex:0 0 auto}
.nav button[aria-current="page"] .ic{color:var(--accent)}
.nav .ct{margin-left:auto;font-size:11px;color:var(--t4)}
.nav .ct.hot{color:var(--danger);font-weight:700}
.nav .ct.on{color:var(--accent)}
.navgap{height:var(--s3)}
.railfoot{margin-top:auto;padding:var(--s3) var(--s2) 0;border-top:1px solid var(--line2);
  font-size:10.5px;line-height:1.55;color:var(--t3);display:flex;flex-direction:column;
  gap:var(--s2)}
.railfoot b{color:var(--t3);font-weight:600}
/* 나 — 이름은 이 브라우저에만 있다. 페이지에도 저장소에도 명단은 없다. */
.meb{display:flex;flex-direction:column;gap:1px;width:100%;padding:7px var(--s2);
  border-radius:var(--r2);transition:background var(--fast) var(--ease)}
.meb:hover{background:var(--sf2)}
.mename{font-size:12.5px;font-weight:700;color:var(--t1)}
.mename.none{color:var(--t4);font-weight:600}
.mesub{font-size:10.5px;color:var(--t4)}
.whonote{padding:var(--s3) var(--s4) var(--s2);border-top:1px solid var(--line2)}
.whonote p{font-size:13.5px;line-height:1.65;color:var(--t2);max-width:var(--measure)}
.whonote p + p{margin-top:var(--s2)}
/* 들여보내기 — 대표에게만, 기다리는 사람이 있을 때만 눈에 띈다 */
.gateb{display:flex;align-items:center;gap:var(--s2);width:100%;padding:6px var(--s2);
  border-radius:var(--r2);font-size:12px;color:var(--t3);
  transition:background var(--fast) var(--ease),color var(--fast) var(--ease)}
.gateb:hover{background:var(--sf2);color:var(--t1)}
.gateb.hot{color:var(--accent);font-weight:700}
.gateb .ct{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums;
  background:var(--accent);color:var(--on-accent);border-radius:99px;padding:0 6px}
.gaterow{align-items:center}
.gaterow .cm{display:flex;gap:6px}
.gaterow .btn{padding:4px 12px;font-size:12px}

/* 화면 밝기 — 셋 중 하나. 스튜디오 낮 조명과 밤 폰은 다른 판을 원한다. */
.thm{display:flex;gap:2px;background:var(--sf2);border-radius:99px;padding:2px}
.thm button{flex:1;padding:4px 2px;border-radius:99px;font-size:10.5px;color:var(--t3);
  text-align:center;transition:background var(--fast) var(--ease),color var(--fast) var(--ease)}
.thm button:hover{color:var(--t1)}
.thm button[aria-pressed="true"]{background:var(--sf3);color:var(--t1);font-weight:700}
/* 폰에는 레일이 없어 상단 바에 한 개짜리 돌림 버튼을 둔다. */
.thmb{display:none;width:26px;height:26px;border-radius:50%;color:var(--t3);
  font-size:13px;line-height:1;text-align:center;flex:0 0 auto;
  transition:background var(--fast) var(--ease),color var(--fast) var(--ease)}
.thmb:hover{background:var(--sf2);color:var(--t1)}

.main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:20;background:var(--bar);
  backdrop-filter:saturate(1.3) blur(12px);-webkit-backdrop-filter:saturate(1.3) blur(12px);
  border-bottom:1px solid var(--line);padding:var(--s4) var(--s5) var(--s3)}
.barrow{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
.barrow .ask{font-size:12px;color:var(--t3)}
.barrow .right{margin-left:auto;display:flex;align-items:center;gap:var(--s2);
  flex:0 0 auto;min-width:0}
.stamp{font-size:11px;color:var(--t3);white-space:nowrap}
.body{padding:var(--s6) var(--s5) var(--s8);min-width:0;flex:1;
  width:100%;max-width:1140px;margin-inline:auto}
.body > * + *{margin-top:var(--s7)}

/* ── 첫 화면 머리 ──────────────────────────────────────
 * 이 판에서 제일 큰 것. 숫자 넉 장보다 "지금 이거 하나"가 먼저다.
 * 왼쪽 굵은 막대가 급한지 아닌지를 나르고, 나머지는 조용하게 둔다.
 */
.lead{background:var(--sf);border:1px solid var(--line);border-radius:var(--r4);
  padding:var(--s6) var(--s6) var(--s5);position:relative;overflow:hidden;
  box-shadow:var(--shadow-s)}
.lead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--accent)}
.lead.hot::before{background:var(--danger)}
.lead.calm::before{background:var(--ok)}
.leadk{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent)}
.lead.hot .leadk{color:var(--danger)}
.lead.calm .leadk{color:var(--ok)}
.leadwhy{font-size:12.5px;color:var(--t3);margin-top:var(--s2);font-weight:600}
.leadt{margin-top:var(--s2);font-size:26px;line-height:1.3;letter-spacing:-.028em;
  max-width:24ch}
.leadt button{font:inherit;letter-spacing:inherit;line-height:inherit;
  transition:color var(--fast) var(--ease)}
.leadt button:hover{color:var(--accent)}
.leadn{margin-top:var(--s3);font-size:14.5px;line-height:1.7;color:var(--t2);
  max-width:var(--measure)}
.leadw{margin-top:var(--s2);font-size:13.5px;line-height:1.6;color:var(--accent);
  max-width:var(--measure);padding-left:var(--s3);
  border-left:2px solid var(--ring-accent)}
.leada{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);margin-top:var(--s5)}
.leadrest{font-size:12.5px;color:var(--t3);margin-left:auto}

/* ── 통계 줄 ───────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(156px,1fr));
  gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r3);
  overflow:hidden}
.stat{background:var(--sf);padding:var(--s3) var(--s4) var(--s4);min-width:0}
.stat:hover{background:var(--sf2)}
.stat .k{font-size:11px;font-weight:700;letter-spacing:-.005em;
  color:var(--t3);display:block;margin-bottom:var(--s1)}
.stat .v{font-size:25px;font-weight:800;line-height:1.1;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;display:block}
.stat .u{font-size:12px;font-weight:600;color:var(--t3);margin-left:3px}
.stat .n{display:block;font-size:11.5px;color:var(--t3);margin-top:var(--s1);line-height:1.5}
.stat.hot .v{color:var(--danger)}
.stat.good .v{color:var(--ok)}

/* ── 구역 ──────────────────────────────────────────── */
.sec{min-width:0}
.sech{display:flex;align-items:baseline;gap:var(--s3);padding-bottom:var(--s3);
  border-bottom:1px solid var(--line);margin-bottom:var(--s2)}
.sech h2{font-size:15px;font-weight:800;letter-spacing:-.02em}
.sech .sub{font-size:12px;color:var(--t3)}
.sech .n{margin-left:auto;font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
.sech .act{margin-left:auto;font-size:12px;color:var(--t3)}
.sech .act:hover{color:var(--t1)}

/* ── 섹션 접기 · 그 자리에서 추가 ───────────────────── */
.foldb{width:16px;height:16px;flex:0 0 auto;color:var(--t4);font-size:9px;
  display:grid;place-items:center;border-radius:var(--r1);
  transform:rotate(90deg);transition:transform var(--fast) var(--ease),color var(--fast) var(--ease)}
.foldb:hover{color:var(--t1);background:var(--sf2)}
.sec.shut .foldb{transform:rotate(0deg)}
.sec.shut .sech{border-bottom-color:var(--line2);margin-bottom:0}
.addhere{display:flex;align-items:center;gap:var(--s2);width:100%;
  padding:var(--s3) var(--s3);font-size:13.5px;color:var(--t4);border-radius:var(--r2);
  transition:color var(--fast) var(--ease),background var(--fast) var(--ease)}
.addhere::before{content:"+";font-size:15px;line-height:1;width:20px;text-align:center;
  color:var(--t4)}
.addhere:hover{color:var(--t1);background:var(--sf)}
.addhere:hover::before{color:var(--accent)}

/* 그 자리에서 제목 고치기 — 상세 패널까지 가지 않는다 */
.pen{opacity:0;font-size:12px;color:var(--t4);padding:0 4px;flex:0 0 auto;
  transition:opacity var(--fast) var(--ease),color var(--fast) var(--ease)}
.row:hover .pen,.pen:focus-visible{opacity:1}
.pen:hover{color:var(--accent)}
input.tin{font-size:16px;font-weight:700;line-height:1.5;letter-spacing:-.016em;
  color:var(--t1);background:var(--sf2);border:1px solid var(--focus);
  border-radius:var(--r2);padding:2px 8px;width:100%;max-width:var(--measure);
  font-family:inherit}
.fgap{width:var(--s4);flex:0 0 auto}
.filt .lbl{align-self:center;margin-right:2px}
/* 파트는 줄에서 누를 수 있는 것 — 그 파트만 모아 보는 입구 */
.rmeta .mi.part{color:var(--t2);font-weight:600;
  transition:color var(--fast) var(--ease)}
.rmeta .mi.part:hover{color:var(--accent)}
.rmeta .mi.part.flat{color:var(--t3);font-weight:500;cursor:default}

/* ── 항목 줄 ───────────────────────────────────────────
 * 읽는 순서를 강제한다: 제목 → 메모 → 부가 정보.
 * 예전에는 제목과 표식 대여섯 개가 같은 줄에서 경쟁했다.
 * 왼쪽 세로 막대는 신호를 하나만 나른다 — 빨강은 막혔거나 지났다,
 * 앰버는 최우선. 둘 다 아니면 아무것도 없다.
 */
.row{display:grid;grid-template-columns:22px minmax(0,1fr);gap:0 var(--s3);
  padding:var(--s4) var(--s3) var(--s4) var(--s3);
  border-bottom:1px solid var(--line2);
  align-items:start;position:relative;border-radius:var(--r2);
  transition:background var(--fast) var(--ease)}
.row:hover{background:var(--sf)}
.row.sel{background:var(--sf2)}
.row::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;
  border-radius:99px;background:transparent}
.row.edge-hot::before{background:var(--danger)}
.row.edge-top::before{background:var(--accent)}
.row.sel::before{background:var(--focus);top:6px;bottom:6px}
.row.edge-hot,.row.edge-top{padding-left:var(--s4)}
/* 빽빽하게 — 훑는 모드. 줄 높이를 반으로 줄인다. */
.row.tight{padding:var(--s2) var(--s3)}
.row.tight .rc{gap:2px}
.row.tight .rt{font-size:15px;line-height:1.4}
.row.tight .box{width:18px;height:18px;margin-top:0}
.row.tight .rmeta{margin-top:0;font-size:11.5px}
.row.done{opacity:.42}
.row.done::before{background:transparent}
.row.done .rt{text-decoration:line-through;text-decoration-color:var(--t4)}

.box{width:20px;height:20px;margin-top:1px;border-radius:var(--r1);
  border:1.5px solid var(--t4);position:relative;flex:0 0 auto;
  transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease)}
.box:hover{border-color:var(--focus);background:var(--sf3)}
.box[data-k="recur"]{border-radius:50%}
.box[data-k="track"]{border-style:dashed;opacity:.4;cursor:default}
.box.on{background:var(--ok);border-color:var(--ok)}
.box.on::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;
  border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(43deg)}

.rc{min-width:0;display:flex;flex-direction:column;gap:var(--s1)}
.rhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s1) var(--s2)}
.rt{font-size:16px;font-weight:700;line-height:1.5;color:var(--t1);
  letter-spacing:-.016em;max-width:var(--measure)}
button.rt:hover{color:var(--accent)}
/* 상태는 알약이 아니라 한 낱말로. 제목 옆에서 색만 다르면 충분하다. */
.st{font-size:12.5px;font-weight:700;letter-spacing:-.01em;flex:0 0 auto;
  transition:color var(--fast) var(--ease)}
.st.s-막힘{color:var(--danger)} .st.s-진행{color:var(--ok)}
.st.s-대기{color:var(--hold)}   .st.s-상시{color:var(--focus)}
.st.s-확인필요{color:var(--accent)} .st.s-동결{color:var(--t4)}
button.st:hover{filter:brightness(1.3)}

.rn{font-size:13.5px;color:var(--t2);line-height:1.72;max-width:var(--measure)}
.rw{font-size:13px;color:var(--accent);line-height:1.6;max-width:var(--measure);
  padding-left:var(--s3);border-left:2px solid var(--ring-accent);margin-top:2px}

/* 부가 정보는 전부 아래 한 줄로 내린다 — 훑을 때 건너뛸 수 있게. */
.rmeta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1) var(--s3);
  margin-top:var(--s1);font-size:12px;line-height:1.5;color:var(--t3)}
.rmeta .mi{white-space:nowrap}
.rmeta .mi.hot{color:var(--danger);font-weight:600}
.rmeta .mi.new{color:var(--focus);font-weight:600}
.rmeta .sep{color:var(--t4);opacity:.55;user-select:none}

/* ── 표식 ── 한 벌만 쓴다 ───────────────────────────── */
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;
  flex:0 0 auto;line-height:1.55;white-space:nowrap}
.pill.q{background:var(--sf3);color:var(--t2);box-shadow:inset 0 0 0 1px var(--line)}
.pill.s-막힘{background:var(--danger-bg);color:var(--danger)}
.pill.s-진행{background:var(--ok-bg);color:var(--ok)}
.pill.s-대기{background:var(--hold-bg);color:var(--hold)}
.pill.s-확인필요{color:var(--accent);box-shadow:inset 0 0 0 1px var(--ring-accent)}
.pill.s-상시{background:var(--focus-bg);color:var(--focus)}
.pill.s-동결{background:var(--sf2);color:var(--t4)}
.pill.solo{background:var(--solo-bg);color:var(--solo)}
.pill.late{background:var(--danger-bg);color:var(--danger)}
.pill.mac{background:var(--sf2);color:var(--t3)}
.pill.edit{color:var(--focus);box-shadow:inset 0 0 0 1px var(--ring-focus)}
.pill.top{color:var(--danger);box-shadow:inset 0 0 0 1px var(--ring-danger);
  font-size:10px;letter-spacing:.05em}
button.pill{transition:filter var(--fast) var(--ease)}
button.pill:hover{filter:brightness(1.25)}

/* 집기 칩 — 세 상태. 배정이 아니라 "누가 집었나"를 보여준다.
   부가 정보 줄에 들어가므로 테두리를 빼고 글자만 남긴다. */
.who{font-size:12px;color:var(--t3);flex:0 0 auto;white-space:nowrap;
  transition:color var(--fast) var(--ease)}
button.who:hover{color:var(--t1)}
.who.has{color:var(--t1);font-weight:600}
.who.open{color:var(--focus);font-weight:600}
.who.only{color:var(--t4)}
/* 카드·칸 안에서는 테두리가 있어야 눌리는 것으로 보인다. */
.cell .who,.card .who{padding:2px 8px;border-radius:99px;
  box-shadow:inset 0 0 0 1px var(--line)}
.cell .who.open,.card .who.open{box-shadow:inset 0 0 0 1px var(--ring-focus)}
.cell .who.has,.card .who.has{box-shadow:inset 0 0 0 1px var(--t3)}

.dot{width:6px;height:6px;border-radius:50%;background:var(--t4);flex:0 0 auto}
.dot.막힘{background:var(--danger)} .dot.진행{background:var(--ok)}
.dot.대기{background:var(--hold)}   .dot.상시{background:var(--focus)}
.dot.확인필요{background:var(--accent)} .dot.동결{background:var(--t4)}

/* ── 알림 ──────────────────────────────────────────────
 * 넷이 펼쳐져 있으면 첫 화면이 관제로 다 찬다. 한 줄로 접고,
 * 눌러야 자세한 내용이 나온다. 급한 것(crit)만 처음부터 펴 둔다.
 */
.alerts{border:1px solid var(--line);border-radius:var(--r3);overflow:hidden;
  background:var(--sf)}
.alert{border-bottom:1px solid var(--line2)}
.alert:last-child{border-bottom:0}
.ahead{display:grid;grid-template-columns:7px minmax(0,1fr) auto;align-items:center;
  gap:0 var(--s3);width:100%;
  padding:var(--s3) var(--s4);transition:background var(--fast) var(--ease)}
.ahead .atx{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px var(--s3);min-width:0}
.ahead:hover{background:var(--sf2)}
.ahead .sev{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--hold)}
.alert.crit .ahead .sev{background:var(--danger)}
.alert.ok .ahead .sev{background:var(--ok)}
.ahead b{font-size:14px;font-weight:700;letter-spacing:-.012em;min-width:0}
.ahead .when{font-size:12px;color:var(--t3);white-space:nowrap}
.alert.crit .ahead .when{color:var(--danger);font-weight:600}
.ahead .caret{font-size:11px;color:var(--t4);flex:0 0 auto;padding-left:var(--s3);
  transition:transform var(--fast) var(--ease)}
.alert.open .ahead .caret{transform:rotate(90deg)}
.abody{padding:0 var(--s4) var(--s4) 30px;display:flex;flex-direction:column;
  gap:var(--s2);align-items:flex-start}
.abody p{font-size:13.5px;color:var(--t2);line-height:1.7;max-width:var(--measure)}
.abody .snz{font-size:12px;color:var(--t3)}
.abody .snz:hover{color:var(--t1)}

/* ── 카드 ──────────────────────────────────────────── */
.cards{display:grid;gap:var(--s3)}
.cards.c2{grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}
.cards.c3{grid-template-columns:repeat(auto-fill,minmax(216px,1fr))}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r3);
  padding:var(--s4);min-width:0;transition:border-color var(--fast) var(--ease)}
.card:hover{border-color:var(--line)}
.cardh{display:flex;align-items:baseline;gap:var(--s2);padding-bottom:var(--s2);
  border-bottom:1px solid var(--line2);margin-bottom:var(--s2)}
.cardh b{font-size:13.5px;font-weight:800}
.cardh .n{margin-left:auto;font-size:11px;color:var(--t4)}
/* 카드 안의 한 줄 — 누가 무엇을 집었는지 훑는 용도라 줄 높이를 낮게 잡는다. */
.pl{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;
  padding:6px 0;border-bottom:1px solid var(--line2);font-size:12.5px;
  line-height:1.45;color:var(--t2);transition:color var(--fast) var(--ease)}
.pl:last-of-type{border-bottom:0}
.pl:hover{color:var(--t1)}
.pl .dot{margin-top:6px}
.pmore{font-size:11px;color:var(--t3);padding-top:8px}

/* ── 칸 ── 나누는 단위. 비어 있는 칸이 한눈에 보여야 한다. ── */
/* 칸이 다섯 개뿐이라 넓은 화면에서 빈 트랙이 여섯 개씩 생겼다. 폭을 묶는다. */
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:var(--s3);
  margin-top:var(--s3);max-width:1000px}
.cell{background:var(--sf);border:1px solid var(--line);border-radius:var(--r3);
  padding:var(--s3) var(--s4) var(--s3);display:flex;flex-direction:column;gap:var(--s2);
  transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease)}
.cell.held{background:var(--sf2)}
.cell:not(.held){border-style:dashed;border-color:var(--t4)}
.cell.hot{border-color:var(--ring-danger)}
.cellh{display:flex;align-items:baseline;gap:var(--s2)}
.cellh b{font-size:13.5px;font-weight:800}
.cellh .n{margin-left:auto;font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums}
.cellm{display:flex;flex-wrap:wrap;gap:var(--s1);align-items:center;min-height:19px}
.cellby{align-self:flex-start}
.cellopen{font-size:11px;color:var(--t3);padding-top:var(--s1);
  border-top:1px solid var(--line2);margin-top:auto;width:100%}
.cellopen:hover{color:var(--t1)}

/* ── 열쇠 ── 왜 규효만 가능한지를 이유별로 묶는다 ─────
 * 한 덩어리로 두면 전부 어쩔 수 없어 보인다. 갈라 놓으면
 * "이 하나만 만들면 다섯 건이 넘어간다"가 보인다.
 */
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:var(--s3);margin-top:var(--s3);max-width:1040px}
.key{background:var(--sf);border:1px solid var(--line);border-radius:var(--r3);
  padding:var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
.keyh{display:flex;align-items:baseline;gap:var(--s2)}
.keyh b{font-size:14.5px;font-weight:800}
.keyh .n{margin-left:auto;font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
.keyw{font-size:13px;line-height:1.6;color:var(--accent)}
.keyl{display:flex;flex-direction:column;gap:2px;margin-top:var(--s1);
  border-top:1px solid var(--line2);padding-top:var(--s2)}
.keyi{font-size:13px;line-height:1.5;color:var(--t2);padding:3px 0;width:100%;
  transition:color var(--fast) var(--ease)}
.keyi:hover{color:var(--t1)}
.keyi::before{content:"·";color:var(--t4);margin-right:6px}
/* 넘길 수 있는 것은 글자를 덜 죽인다 — 못 넘기는 것과 같아 보이면 안 된다. */
.who.only.freeable{color:var(--t3)}

/* ── 회차 제작 시트 ──────────────────────────────────
 * 병목은 "누가 회차를 맡나"가 아니라 "어느 단계를 누가 맡나"다.
 */
.sheet{background:var(--sf);border:1px solid var(--line);border-radius:var(--r3);
  padding:var(--s4) var(--s5) var(--s5);margin-top:var(--s3);max-width:760px}
.shrow{display:grid;grid-template-columns:76px minmax(0,1fr);gap:var(--s3);
  padding:7px 0;border-bottom:1px solid var(--line2);align-items:baseline}
.shrow .k{font-size:11.5px;color:var(--t3)}
.shrow .v{font-size:14px;color:var(--t1)}
.shrow .v.none{color:var(--t4)}
.clash{margin-top:var(--s3);font-size:13px;line-height:1.6;color:var(--danger);
  background:var(--danger-bg);border-radius:var(--r2);padding:var(--s3) var(--s4)}
.shh{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--t3);margin-top:var(--s5);margin-bottom:var(--s2)}
.rls{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:var(--s2)}
.rl{background:var(--sf2);border:1px solid var(--line2);border-radius:var(--r2);
  padding:var(--s3);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.rl.past{opacity:.55}
.rl.at{border-color:var(--accent);background:var(--accent-bg)}
.rlg{font-size:12px;font-weight:700;color:var(--t2)}
.rl.at .rlg{color:var(--accent)}
.rl .who{padding:2px 8px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--line)}
.rl .who.open{box-shadow:inset 0 0 0 1px var(--ring-focus)}
.rl .who.has{box-shadow:inset 0 0 0 1px var(--t3)}
/* 이름을 .q 로 두면 안 된다 — .pill.q(조용한 알약)와 같은 자리에서 부딪혀
   상단 바의 상태 알약이 통째로 망가진다. 실제로 한 번 그렇게 깨졌다. */
.qs{display:flex;flex-direction:column;gap:2px}
.qi{display:flex;align-items:flex-start;gap:var(--s3);width:100%;padding:8px 0;
  font-size:14px;line-height:1.5;color:var(--t1);border-bottom:1px solid var(--line2);
  transition:color var(--fast) var(--ease)}
.qi:last-child{border-bottom:0}
.qi:hover .qb{border-color:var(--focus)}
.qi .qb{width:16px;height:16px;margin-top:3px;border-radius:var(--r1);flex:0 0 auto;
  border:1.5px solid var(--t4);position:relative;
  transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease)}
.qi.on{color:var(--t4);text-decoration:line-through;text-decoration-color:var(--t4)}
.qi.on .qb{background:var(--ok);border-color:var(--ok)}
.qi.on .qb::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:8px;
  border:solid var(--on-accent);border-width:0 1.7px 1.7px 0;transform:rotate(43deg)}
.kcard.on{border-color:var(--accent)}
.kcard .sub.when{color:var(--accent);font-variant-numeric:tabular-nums}

/* ── 처음 열었을 때 ── 팀은 이 판을 처음 본다 ───────── */
.intro{background:var(--sf);border:1px solid var(--accent);border-radius:var(--r4);
  padding:var(--s5) var(--s5) var(--s4);margin-bottom:var(--s6)}
.intro h2{font-size:19px;letter-spacing:-.022em}
.intro p{font-size:14px;line-height:1.75;color:var(--t2);margin-top:var(--s3);
  max-width:var(--measure)}
.intro b{color:var(--t1)}
.intro .btn{margin-top:var(--s4)}

/* ── 막대 ──────────────────────────────────────────── */
.bar-t{height:5px;border-radius:99px;background:var(--sf3);overflow:hidden;display:flex}
.bar-t i{display:block;height:100%}
.bar-t i.k{background:var(--accent)} .bar-t i.o{background:var(--auto)}

/* ── 회차 칸반 ─────────────────────────────────────── */
.kan{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s2);
  align-items:start}
.col{background:var(--sf);border:1px solid var(--line);border-radius:var(--r3);
  min-height:118px;display:flex;flex-direction:column;
  transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease)}
.col.over{border-color:var(--focus);background:var(--focus-bg)}
.colh{display:flex;align-items:baseline;gap:var(--s2);padding:var(--s3) var(--s3) var(--s2);
  border-bottom:1px solid var(--line2)}
.colh b{font-size:11.5px;font-weight:800;letter-spacing:.02em}
.colh .n{margin-left:auto;font-size:10.5px;color:var(--t4)}
.colb{padding:var(--s2);display:flex;flex-direction:column;gap:var(--s2);flex:1}
.kcard{background:var(--sf2);border:1px solid var(--line);border-radius:var(--r2);
  padding:var(--s3);cursor:grab;-webkit-user-drag:none;
  transition:transform var(--fast) var(--ease),
  border-color var(--fast) var(--ease),box-shadow var(--fast) var(--ease)}
.kcard:hover{border-color:var(--focus);box-shadow:var(--shadow-s)}
.kcard:active{cursor:grabbing}
.kcard.drag{opacity:.35}
.kcard b{display:block;font-size:12.5px;font-weight:700;line-height:1.4}
.kcard .sub{display:block;font-size:11px;color:var(--t3);margin-top:2px;line-height:1.4}
.kcard .foot{display:flex;align-items:center;gap:var(--s1);margin-top:var(--s2)}

/* ── 주간 ──────────────────────────────────────────── */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r3);overflow:hidden}
.dy{background:var(--sf);min-height:168px;display:flex;flex-direction:column}
.dy.off{background:var(--bg)}
.dy.now{box-shadow:inset 0 2px 0 var(--accent)}
.dyh{padding:var(--s2) var(--s3) 6px;display:flex;align-items:baseline;gap:5px;
  border-bottom:1px solid var(--line2)}
.dyh b{font-size:11.5px;font-weight:800}
.dyh span{font-size:10.5px;color:var(--t3)}
.dy.now .dyh b{color:var(--accent)}
.dyb{padding:6px var(--s2) var(--s3);display:flex;flex-direction:column;gap:3px;flex:1}
.slot{display:flex;gap:5px;align-items:baseline;font-size:10.5px;line-height:1.4}
.slot .tm{color:var(--t3);flex:0 0 auto;font-variant-numeric:tabular-nums}
.slot.auto .nm{color:var(--auto)}
.slot.work .nm{color:var(--t2)}
.slot.meet .nm{color:var(--focus)}
.slot.broken .nm{color:var(--danger);text-decoration:line-through
  ;text-decoration-color:var(--ring-danger)}
.chip{margin-top:3px;padding:5px 7px;border-radius:var(--r1);font-size:10.5px;
  line-height:1.4;background:var(--sf2);color:var(--t2);width:100%}
.chip:hover{background:var(--sf3);color:var(--t1)}
.chip.late{background:var(--danger-bg);color:var(--danger)}
.chip b{display:block;font-weight:700}

/* ── 상세 패널 ─────────────────────────────────────── */
.pane{position:sticky;top:0;height:100dvh;overflow-y:auto;background:var(--sf);
  border-left:1px solid var(--line);display:flex;flex-direction:column}
.paneh{position:sticky;top:0;background:var(--sf);z-index:2;
  padding:var(--s4) var(--s4) var(--s3);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:var(--s2)}
.paneh .lbl{flex:1}
.iconb{width:26px;height:26px;border-radius:var(--r2);display:grid;place-items:center;
  color:var(--t3);font-size:13px;transition:background var(--fast) var(--ease)}
.iconb:hover{background:var(--sf3);color:var(--t1)}

  var h = P.holder(it), me = P.me();
  return !!(h && me && h === me);
};
/* "기술 합류 가 집었습니다" 같은 말이 나오지 않게 받침을 본다.
   한글이 아닌 끝글자(PD 등)는 읽는 소리를 따라 받침 없는 쪽으로 둔다. */
function josa(name, withJong, without){
  var c = String(name||"").trim().slice(-1).charCodeAt(0);
  var hangul = c >= 0xAC00 && c <= 0xD7A3;
  return name + (hangul && (c - 0xAC00) % 28 ? withJong : without);
}
P.josa = josa;
/* 나누는 단위는 항목이 아니라 칸이다 — 팀 × 성질.
   한 사람이 칸을 맡고, 칸 안은 맡은 쪽이 알아서 굴린다.
   36개를 고르는 건 부담이지만 칸 하나를 맡는 건 회의에서 한 번에 정해진다. */
/* must 의 이유. free=true 면 체계를 만들면 넘어간다 — 이걸 갈라야
   "규효만 19건"이 "진짜 6건 + 풀 수 있는 13건"으로 보인다. */
P.why = function(it){
  var w = (DATA.whys || {})[it && it.why];
  return w || null;
};
P.canFree = function(it){ var w = P.why(it); return !!(w && w.free); };
P.whys = function(){ return DATA.whys || {}; };

/* ── 회차 제작 시트 ──────────────────────────────────
   회차의 병목은 "누가 맡나"가 아니라 "어느 단계를 누가 맡나"다.
   서브 PD 위임 범위가 정확히 이 자리에서 정해진다. */
P.roleKey = function(sid, stage){ return sid + "|" + stage; };
P.role = function(sid, stage){ return (S.srole || {})[P.roleKey(sid, stage)] || null; };
P.claimRole = function(sid, stage, name){
  var k = P.roleKey(sid, stage), was = (S.srole || {})[k] || null;
  S.srole = S.srole || {};
  if (name) S.srole[k] = name; else delete S.srole[k];
  logit(k, name ? "단계 맡음 " + name : "단계 놓음");
  save("srole:" + k);
  P.toast(name ? josa(name, "이", "가") + " " + stage + " 단계를 맡았습니다"
               : stage + " 단계를 놓았습니다",
    "되돌리기", function(){
      if (was) S.srole[k] = was; else delete S.srole[k];
      save("srole:" + k); P.render();
    });
  P.render();
};
P.openKey = function(sid, i){ return sid + "|" + i; };
P.openDone = function(sid, i){ return !!(S.sdone || {})[P.openKey(sid, i)]; };
P.togOpen = function(sid, i){
  var k = P.openKey(sid, i), was = P.openDone(sid, i);
  S.sdone = S.sdone || {};
  if (was) delete S.sdone[k]; else S.sdone[k] = true;
  save("sdone:" + k);
  P.render();
};

/* 파트 — 이 판에서 일을 가르는 단위. 팀 × 성질.
   사람은 파트에 붙는 속성이지 가르는 기준이 아니다. */
P.dense = function(){ return !!(S && S.dense); };

P.part = function(it){
  var lane = P.lane(it.l);
  return it.team ? it.team + " · " + lane : lane;
};

/* ── 그 자리에서 고치기 ──────────────────────────────
   제목 하나 바꾸려고 상세 패널을 열고 저장을 누르는 건 너무 멀다.
   화면을 통째로 다시 그리는 구조라 "고치는 중"도 상태로 들고 있어야 한다. */
P.editing = function(id, field){
  return !!(edit && edit.id === id && edit.field === (field || "t"));
};
P.startEdit = function(id, field){ edit = { id:id, field:field || "t" }; P.render(); };
P.cancelEdit = function(){ edit = null; P.render(); };
P.commitEdit = function(val){
  if (!edit) return;
  var it = P.byId(edit.id), f = edit.field, v = String(val == null ? "" : val).trim();
  edit = null;
  if (it && v && v !== it[f]) {
    var o = {}; o[f] = v;
    P.patch(it.id, o, f === "t" ? "제목 수정" : f + " 수정");
  }
  P.render();
};
/* 섹션 끝에서 바로 만든다 — 그 섹션의 성질을 그대로 물려받는다. */
P.addHere = function(preset){
  var it = P.add("", preset || {});
  edit = { id: it.id, field: "t" };
  P.render();
};

P.cellId = function(team, lane){ return "cell:" + team + "|" + lane; };
P.cellBy = function(team, lane){
  var c = S.cell || {}; return c[team + "|" + lane] || null;
};
P.claimCell = function(team, lane, name){
  var k = team + "|" + lane;
  S.cell = S.cell || {};
  var was = S.cell[k] || null;
  if (name) S.cell[k] = name; else delete S.cell[k];
  logit(P.cellId(team,lane), name ? ("칸 맡음 — "+name) : "칸 놓음");
  save(P.cellId(team, lane));
  P.toast(name ? josa(name,"이","가")+" "+team+" · "+P.lane(lane)+" 칸을 맡았습니다"
               : team+" · "+P.lane(lane)+" 칸을 놓았습니다", "되돌리기", function(){
    if (was) P.S().cell[k] = was; else delete P.S().cell[k];
    save(P.cellId(team, lane)); P.render(); });
  P.render();
};

P.lane = function(l){ var a=DATA.lanes,i; for(i=0;i<a.length;i++) if(a[i].id===l) return a[i].n; return l; };
P.data = function(){ return DATA; };

/* ── 고치기 ───────────────────────────────────────── */
function logit(id, what){
  S.log.unshift({ id:id, t:what, at:Date.now() });
  if (S.log.length > 80) S.log.length = 80;
}
P.patch = function(id, f, label, quiet){
  var p = S.patch[id] || (S.patch[id] = {}), k;
  for (k in f) p[k] = f[k];
  dirty(); if (!quiet) logit(id, label); save(id);
};
P.toggle = function(it){
  if (it.k==="track") return;
  var was;
  if (it.k==="recur"){
    was = S.last[it.id]===P.T;
    if (was) delete S.last[it.id]; else S.last[it.id]=P.T;
    logit(it.id, was?"오늘 표시 해제":"오늘 처리");
  } else {
    was = !!S.done[it.id];
    if (was) delete S.done[it.id]; else S.done[it.id]=true;
    logit(it.id, was?"완료 해제":"완료");
    if (!was) P.toast("완료 — "+it.t, "되돌리기", function(){
      delete S.done[it.id]; save(); P.render();
    });
  }
  save(it.id); P.render();
};
P.cycle = function(it){
  var i = P.STATES.indexOf(it.s), prev = it.s;
  var next = P.STATES[(i+1)%4];
  P.patch(it.id, {s:next}, "상태 "+prev+" → "+next);
  P.toast("상태 "+next, "되돌리기", function(){
    P.patch(it.id, {s:prev}, "상태 되돌림", true); P.render();
  });
  P.render();
};
P.add = function(title, extra){
  S.seq += 1;
  var it = { id:"u"+S.seq, l:CFG.defaults.l, by:null, must:null, team:CFG.defaults.team,
             k:"once", s:"대기", h:"now", p:3, t:title, n:null, w:null, d:null,
             scope:CFG.scope, mac:false, _n:true };
  if (extra) for (var k in extra) it[k]=extra[k];
  S.add.push(it); dirty(); logit(it.id,"새로 씀"); save(it.id);
  return it;
};
P.drop = function(id){
  var i = S.add.map(function(x){return x.id;}).indexOf(id);
  var it = P.byId(id), name = it?it.t:id;
  if (i>=0) S.add.splice(i,1);
  else P.patch(id, {l:"frozen", s:"동결"}, "동결로 내림", true);
  delete S.done[id]; delete S.last[id];
  dirty(); logit(id, i>=0?"지움":"동결"); save(id);
  P.toast((i>=0?"지웠습니다":"동결로 내렸습니다")+" — "+name);
};

/* ── 조각 ─────────────────────────────────────────── */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
P.esc = esc;

P.row = function(it, opt){
  opt = opt || {};
  var on = P.on(it), late = P.late(it), meta = [];

  // 상태는 제목 옆에 한 낱말로. 나머지는 전부 아래 줄로 내린다 —
  // 예전에는 표식 대여섯 개가 제목과 같은 줄에서 경쟁했다.
  var st = it.s
    ? '<button class="st s-'+esc(it.s)+'" data-act="cycle" data-arg="'+esc(it.id)
      + '" title="상태 바꾸기 — s">'+esc(it.s)+"</button>"
    : "";

  if (!opt.hideWho){
    if (it.must){
      var w = P.why(it);
      meta.push('<span class="who only'+(w && w.free?" freeable":"")+'"'
        + (w?' title="'+esc(w.how)+'"':"")+">"
        + esc(P.roleName(it.must))+"만"+(w?" \u00B7 "+esc(w.n):"")+"</span>");
    } else {
      var hold = P.holder(it);
      meta.push(hold
        ? '<span class="who has">'+esc(hold)+" 칸</span>"
        : '<span class="who open">빈 칸</span>');
    }
  }
  if (it.d) meta.push('<span class="mi'+(late?" hot":"")+'">'+esc(it.d.slice(5))
    + (late? " · "+P.days(P.T,it.d)+"일 지남" : " 마감")+"</span>");
  if (it.p===1 && !on) meta.push('<span class="mi hot">최우선</span>');
  // 파트가 맨 앞. 섹션이 이미 그 파트로 묶여 있으면 중복이라 생략한다.
  // 개인 판에는 파트로 모아 보는 화면이 없다. 갈 곳이 없으면 버튼으로 두지 않는다.
  if (opt.showPart) meta.unshift(
    (CFG.actions && CFG.actions.gopart)
      ? '<button class="mi part" data-act="gopart" data-arg="'
        + esc(it.team ? it.team+"|"+it.l : "|"+it.l)+'">'+esc(P.part(it))+"</button>"
      : '<span class="mi part flat">'+esc(P.part(it))+"</span>");
  else if (opt.showTeam && it.team) meta.push('<span class="mi">'+esc(it.team)+"</span>");
  if (opt.showScope && it.scope==="solo") meta.push('<span class="mi">개인</span>');
  if (it.mac) meta.push('<span class="mi">맥에서만</span>');
  if (it._n) meta.push('<span class="mi new">새로</span>');
  else if (it._e) meta.push('<span class="mi new">고침</span>');

  var edge = on ? "" : (late || it.s==="막힘") ? " edge-hot" : (it.p===1 ? " edge-top" : "");
  // 빽빽하게: 메모와 주의를 접는다. 훑을 때는 제목·상태·파트면 충분하다.
  var tight = P.dense() && !opt.always;

  return '<div class="row'+(on?" done":"")+(sel===it.id?" sel":"")+edge+(tight?" tight":"")
    + '" data-row="'+esc(it.id)+'">'
    + '<button class="box'+(on?" on":"")+'" data-k="'+esc(it.k)+'" data-act="tog" data-arg="'
    + esc(it.id)+'" aria-pressed="'+on+'" aria-label="'+esc(it.t)+(on?" 완료 해제":" 완료")+'"'
    + (it.k==="track"?" disabled":"")+"></button>"
    + '<div class="rc">'
    + '<div class="rhead">'
    + (P.editing(it.id, "t")
        ? '<input class="rt tin" id="inline" value="'+esc(it.t)+'" '
          + 'autocomplete="off" spellcheck="false" aria-label="제목 고치기">'
        : '<button class="rt" data-act="open" data-arg="'+esc(it.id)+'">'+esc(it.t)+"</button>"
          + '<button class="pen" data-act="editt" data-arg="'+esc(it.id)
          + '" aria-label="제목 그 자리에서 고치기" title="제목 고치기">\u270E</button>')
    + st+"</div>"
    + (tight ? "" :
        (it.n?'<p class="rn">'+esc(it.n)+"</p>":"")
        + (it.w?'<p class="rw">'+esc(it.w)+"</p>":""))
    + (meta.length?'<div class="rmeta">'+meta.join('<span class="sep">·</span>')+"</div>":"")
    + "</div></div>";
};
P.sec = function(title, sub, list, opt){
  opt = opt || {};
  if (!list.length && !opt.add) return "";
  var key = opt.key || title;
  var shut = !!(S.fold || {})[key];
  if (!shut) rowsOnScreen = rowsOnScreen.concat(list.map(function(i){return i.id;}));
  return '<section class="sec'+(shut?" shut":"")+'">'
    + '<div class="sech">'
    + '<button class="foldb" data-act="fold" data-arg="'+esc(key)+'"'
    + ' aria-expanded="'+(!shut)+'" aria-label="'+esc(title)+' 접기/펴기">'
    + "\u25B8</button>"
    + '<h2>'+esc(title)+"</h2>"
    + (sub?'<span class="sub">'+esc(sub)+"</span>":"")
    + '<span class="n num">'+list.length+"</span></div>"
    + (shut ? "" :
        list.map(function(i){ return P.row(i,opt); }).join("")
        + (opt.add
            ? (P.editing("__new__","t") ? "" :
               '<button class="addhere" data-act="addhere" data-arg="'
               + esc(JSON.stringify(opt.add))+'">여기에 추가</button>')
            : ""))
    + "</section>";
};
P.stats = function(list){
  return '<div class="stats">'+list.map(function(s){
    return '<div class="stat'+(s.tone?" "+s.tone:"")+'"'
      + (s.act?' data-act="'+esc(s.act)+'" data-arg="'+esc(s.arg||"")+'" role="button" tabindex="0"':"")
      + '><span class="k">'+esc(s.k)+"</span>"
      + '<span class="v num">'+esc(s.v)+(s.u?'<span class="u">'+esc(s.u)+"</span>":"")+"</span>"
      + (s.n?'<span class="n">'+esc(s.n)+"</span>":"")+"</div>";
  }).join("")+"</div>";
};
P.empty = function(title, body){
  return '<div class="empty"><b>'+esc(title)+"</b>"+esc(body||"")+"</div>";
};
P.resetRows = function(){ rowsOnScreen = []; };

/* 첫 화면의 머리. 화면 이름이 "지금 뭘 해야 하나"인데 정작 숫자 넉 장으로
   시작해서 답을 안 했다. 제일 급한 하나를 크게 세우고, 나머지는 그 아래로.
   왜 이게 제일 급한지를 같이 적는다 — 근거 없이 하나만 들이밀면 안 믿는다. */
P.lead = function(list, opt){
  opt = opt || {};
  var open = list.filter(function(i){ return !P.on(i) && i.k !== "track"; })
                 .sort(P.urgency);
  var rest = open.length - 1;
  if (!open.length){
    return '<section class="lead calm"><p class="leadk">지금</p>'
      + '<h2 class="leadt">'+esc(opt.calm || "걸린 게 없습니다")+"</h2>"
      + (opt.calmn?'<p class="leadn">'+esc(opt.calmn)+"</p>":"")+"</section>";
  }
  var it = open[0], why = [];
  if (P.late(it)) why.push(P.days(P.T, it.d)+"일 지남");
  if (it.s === "막힘") why.push("막혀 있음");
  if (it.p === 1) why.push("최우선");
  if (it.k === "recur") why.push("매일 도는 것");
  if (it.must) why.push(P.roleName(it.must)+"만 가능");
  else { var hh = P.holder(it); if (hh) why.push(josa(hh, "이", "가")+" 맡은 칸"); }
  if (!why.length) why.push(P.lane(it.l));

  return '<section class="lead'+(P.late(it)||it.s==="막힘"?" hot":"")+'">'
    + '<p class="leadk">지금</p>'
    + '<p class="leadwhy">'+why.join(" · ")+"</p>"
    + '<h2 class="leadt"><button data-act="open" data-arg="'+esc(it.id)+'">'
    + esc(it.t)+"</button></h2>"
    + (it.n?'<p class="leadn">'+esc(it.n)+"</p>":"")
    + (it.w?'<p class="leadw">'+esc(it.w)+"</p>":"")
    + '<div class="leada">'
    + '<button class="btn" data-act="tog" data-arg="'+esc(it.id)+'">'
    + (it.k==="recur"?"오늘 했다":"끝냈다")+"</button>"
    + '<button class="btn g" data-act="open" data-arg="'+esc(it.id)+'">열어 보기</button>'
    + (rest>0?'<span class="leadrest">그다음 '+rest+"건</span>":"")
    + "</div></section>";
};

/* 관제 알림. 넷이 펼쳐져 있으면 첫 화면이 관제로 다 차서, 한 줄로 접었다.
   급한 것(crit)만 처음부터 펴 두고 나머지는 눌러야 열린다. */
P.alerts = function(list){
  if (!list.length) return "";
  if (!alertsOpen){
    alertsOpen = {};
    list.forEach(function(a){ if (a.sev === "crit") alertsOpen[a.t] = true; });
  }
  return '<div class="alerts">'+list.map(function(a){
    var open = !!alertsOpen[a.t], has = !!a.x;
    return '<div class="alert '+esc(a.sev||"warn")+(open?" open":"")+'">'
      + '<button class="ahead" data-act="altog" data-arg="'+esc(a.t)+'"'
      + ' aria-expanded="'+open+'"><span class="sev"></span>'
      + '<span class="atx"><b>'+esc(a.t)+"</b>"
      + (a.d?'<span class="when">'+esc(a.d)+"</span>":"")+"</span>"
      + (has?'<span class="caret">&#9656;</span>':"<span></span>")+"</button>"
      + (open && has
          ? '<div class="abody"><p>'+esc(a.x)+"</p>"
            + (a.sev!=="ok"
                ? '<button class="snz" data-act="snooze" data-arg="al:'+esc(a.t)
                  + '">하루 숨기기</button>' : "")
            + "</div>"
          : "")
      + "</div>";
  }).join("")+"</div>";
};

/* ── 토스트 ───────────────────────────────────────── */
P.toast = function(msg, label, fn){
  toast = { m:msg, l:label, fn:fn };
  clearTimeout(toastT);
  toastT = setTimeout(function(){ toast=null; paintToast(); }, label?6000:2800);
  paintToast();
};
function paintToast(){
  var el = document.getElementById("toast");
  if (!el) return;
  el.innerHTML = toast
    ? '<div class="toast"><span>'+esc(toast.m)+"</span>"
      + (toast.l?'<button data-act="undo">'+esc(toast.l)+"</button>":"")+"</div>"
    : "";
}

/* ── 상세 패널 ────────────────────────────────────── */
P.open = function(id){ sel = id; cmd.on=false; P.render(); };
P.close = function(){ sel = null; P.render(); };
P.sel = function(){ return sel; };

function paneHTML(){
  if (!sel) return "";
  var it = P.byId(sel);
  if (!it) { sel=null; return ""; }
  function segs(name, list, cur, cls){
    return '<div class="segs">'+list.map(function(o){
      return '<button class="seg'+(cls?" "+cls:"")+'" data-act="set" data-arg="'+esc(name)
        + '" data-val="'+esc(o[0])+'" aria-pressed="'+(cur===o[0])+'">'+esc(o[1])+"</button>";
    }).join("")+"</div>";
  }
  var lanes = DATA.lanes.map(function(l){ return [l.id, l.n]; });
  return '<aside class="pane"><div class="paneh"><span class="lbl">항목</span>'

    + '<button class="iconb" data-act="close" aria-label="닫기">✕</button></div>'
    + '<div class="paneb">'
    + '<textarea class="ttlin" id="f_t" rows="1" aria-label="제목">'+esc(it.t)+"</textarea>"
    + '<div class="fgrid">'
    + (it.scope==="team"
        ? '<span class="k">팀</span>'
          + segs("team",(DATA.teams||[]).map(function(t){return [t,t];}),it.team)
          + '<span class="k">넘길 수 있나</span>'
          + segs("must",[["","파트가 가져감"],["owner","대표만 가능"]], it.must||"")
        : "")
    + '<span class="k">상태</span>'+segs("s",P.STATES.map(function(x){return [x,x];}),it.s,"s")
    + '<span class="k">기한</span>'+segs("h",P.HORIZ,it.h)
    + '<span class="k">레인</span>'+segs("l",lanes,it.l)
    + '<span class="k">종류</span>'+segs("k",[["once","한 번"],["recur","매일"],["track","지켜보기"]],it.k)
    + '<span class="k">우선</span>'+segs("p",[[1,"최우선"],[2,"보통"],[3,"나중"]],it.p)
    + (CFG.canScope
        ? '<span class="k">판</span>'+segs("scope",[["team","팀"],["solo","개인"]],it.scope)
        : "")
    + '<span class="k">맥에서만</span>'+segs("mac",[[true,"그렇다"],[false,"아니다"]],!!it.mac)
    + "</div>"
    + '<div class="fld"><label for="f_d">마감일</label>'
    + '<input id="f_d" type="date" value="'+esc(it.d||"")+'"></div>'
    + '<div class="fld"><label for="f_n">메모</label><textarea id="f_n">'+esc(it.n||"")+"</textarea></div>"
    + '<div class="fld"><label for="f_w">주의 — 놓치면 다시 하게 되는 것</label>'
    + '<textarea id="f_w">'+esc(it.w||"")+"</textarea></div>"
    + "</div>"
    + '<div class="panef"><button class="btn" data-act="savefld">저장</button>'
    + (S.patch[it.id]?'<button class="btn g" data-act="reset" data-arg="'+esc(it.id)+'">원래대로</button>':"")
    + '<button class="btn d" data-act="drop" data-arg="'+esc(it.id)+'">'

}
function saveFields(){
  var it = P.byId(sel); if (!it) return;
  function g(id){ var e=document.getElementById(id); return e?e.value.trim():""; }
  P.patch(it.id, { t:g("f_t")||it.t, n:g("f_n")||null, w:g("f_w")||null, d:g("f_d")||null },
          "내용 수정");
  P.toast("저장했습니다"); P.render();
}

/* ── 명령바 ───────────────────────────────────────── */
function cmdRows(){
  var q = cmd.q.trim(), out = [];
  if (!q){
    CFG.views.forEach(function(v){
      out.push({ g:"이동", ic:v.ic, t:v.n, m:v.ask, go:function(){ go(v.id); } });
    });
    out.push({ g:"할 것", ic:"?", t:"단축키 보기", m:"?", go:function(){ help=true; P.render(); } });
    return out;
  }
  var lq = q.toLowerCase();
  P.items().filter(function(i){
    return (i.t+" "+(i.n||"")+" "+P.lane(i.l)+" "+(i.team||"")+" "+(P.holder(i)||"")+" "+(i.s||""))
      .toLowerCase().indexOf(lq) >= 0;
  }).sort(P.urgency).slice(0,9).forEach(function(i){
    out.push({ g:"항목", ic:"·", t:i.t, m:P.lane(i.l)+" · "+(P.holder(i)||"빈 칸"),
               go:function(){ P.open(i.id); } });
  });
  out.push({ g:"만들기", ic:"+", t:'"'+q+'" 새 항목으로', m:"Enter",
             go:function(){ var it=P.add(q); P.open(it.id); } });
  return out;
}
function cmdHTML(){
  if (!cmd.on) return "";
  cmd.rows = cmdRows();
  var g = "", html = "";
  cmd.rows.forEach(function(r,i){
    if (r.g !== g){ g = r.g; html += '<p class="cgrp">'+esc(g)+"</p>"; }
    html += '<button class="crow" data-act="cmdgo" data-arg="'+i+'" aria-selected="'+(i===cmd.i)+'">'
      + '<span class="cic">'+esc(r.ic||"·")+"</span>"
      + '<span class="ctx">'+esc(r.t)+"</span>"
      + '<span class="cm">'+esc(r.m||"")+"</span></button>";
  });
  return '<div class="scrim" data-act="cmdclose"></div><div class="cmdbox">'
    + '<div class="cmdin"><span>⌕</span>'
    + '<input id="cq" value="'+esc(cmd.q)+'" autocomplete="off" spellcheck="false" '
    + 'placeholder="찾거나, 쓰면 새 항목이 됩니다"></div>'
    + '<div class="cmdlist">'+(html||P.empty("없습니다",""))+"</div>"
    + '<div class="cmdf"><span><kbd>↑↓</kbd> 고르기</span><span><kbd>↵</kbd> 열기</span>'
    + "<span><kbd>esc</kbd> 닫기</span></div></div>";
}

/* ── 단축키 안내 ──────────────────────────────────── */
var KEYS = [
  ["⌘K / /","찾기·새 항목"], ["j / k","줄 이동"], ["↵","상세 열기"],
  ["x","완료 표시"], ["s","상태 돌리기"], ["e","상세에서 고치기"],
  ["1–9","화면 이동"], ["esc","닫기"], ["?","이 도움말"]
];
/* 남을 배정하는 게 아니라 내가 맡는다. 그래서 고를 명단이 없고,
   필요한 건 "이 기기에서 나는 누구인가" 한 줄뿐이다. 한 번 적으면 기억한다.
   로그인이 붙으면 이 자리를 계정 표시 이름이 대신한다. */
P.askMe = function(fn, why){
  var me = P.me();
  if (me) { fn(me); return; }
  pick = { fn:fn, why:why || "" };
  P.render();
};

          + '적은 이름은 이 브라우저에 남고, 맡은 칸에만 표시됩니다.</p>')

/* ── 입력 ─────────────────────────────────────────── */
function act(name, arg, val){
  switch(name){
    case "go": go(arg); break;
    case "cmd": cmd.on=true; cmd.q=""; cmd.i=0; P.render(); break;
    case "cmdclose": cmd.on=false; P.render(); break;
    case "cmdgo": var r=cmd.rows[+arg]; cmd.on=false; if(r) r.go(); else P.render(); break;
    case "helpopen": help=true; P.render(); break;
    case "theme":
      S.theme = arg; save(); applyTheme(); P.render(); break;
    case "themecycle":
      var ti = 0;
      THEMES.forEach(function(t,i){ if (t[0]===P.theme()) ti=i; });
      S.theme = THEMES[(ti+1) % THEMES.length][0];
      save(); applyTheme(); P.render(); break;
    case "altog":
      if (!alertsOpen) alertsOpen = {};
      if (alertsOpen[arg]) delete alertsOpen[arg]; else alertsOpen[arg] = true;
      P.render(); break;
    case "helpclose": help=false; P.render(); break;
    case "close": P.close(); break;
    case "open": P.open(arg); break;
    case "tog": var i1=P.byId(arg); if(i1) P.toggle(i1); break;
    case "cycle": var i2=P.byId(arg); if(i2) P.cycle(i2); break;
    case "savefld": saveFields(); break;
    case "reset": delete S.patch[arg]; dirty(); logit(arg,"원래대로"); save(arg);
      P.toast("원래대로 돌렸습니다"); P.render(); break;
    case "drop": P.drop(arg); P.close(); break;
    case "rolepick":
      var rp = String(arg).split("|");
      P.askMe(function(me){ P.claimRole(rp[0], rp[1], me); },
              rp[1]+" 단계를 맡습니다. 이름이 한 번 필요합니다.");
      break;
    case "roledrop":
      var rd = String(arg).split("|"); P.claimRole(rd[0], rd[1], null); break;
    case "opentog":
      var ot = String(arg).split("|"); P.togOpen(ot[0], +ot[1]); break;
    case "fd": S.dense = arg === "1" ? 1 : 0; save(); P.render(); break;
    case "fold":
      S.fold = S.fold || {};
      if (S.fold[arg]) delete S.fold[arg]; else S.fold[arg] = 1;
      save(); P.render(); break;
    case "editt": P.startEdit(arg, "t"); break;
    case "addhere":
      var pre = {}; try { pre = JSON.parse(arg) || {}; } catch(e){}
      P.addHere(pre); break;
    case "gopart":
      var gp = String(arg).split("|");
      if (CFG.actions && CFG.actions.gopart) CFG.actions.gopart(gp[0], gp[1]);
      break;
    case "seen":
      S.seen = Date.now(); save(); P.render(); break;
    case "cellpick":
      var cp = String(arg).split("|");
      P.askMe(function(me){ P.claimCell(cp[0], cp[1], me); },
              cp[0]+" · "+P.lane(cp[1])+" 칸을 맡습니다. 이름이 한 번 필요합니다.");
      break;
    case "whoami":
      pick = { fn:function(){ P.render(); }, why:"맡은 칸에 이 이름이 보입니다." };
      P.render(); break;
    case "celldrop":
      var cd = String(arg).split("|"); P.claimCell(cd[0], cd[1], null); break;
    case "pick-close": pick = null; P.render(); break;
    case "pick-set":
      if (P.gateState() === "new"){       // 대표에게 승인 요청
        var nm2 = String(val||"").trim();
        if (!nm2){ P.render(); break; }
        pick = null; P.render();
        global.Auth.ask(nm2).then(function(ok){
          P.toast(ok ? "승인 요청을 보냈습니다 — 대표가 승인하면 바로 됩니다"
                     : "요청을 보내지 못했습니다");
          P.render();
        });
        break;
      }
      if (P.gate()){ pick = null; P.render(); break; }   // 대기 중엔 적을 게 없다
      var fn = pick && pick.fn, nm = P.setMe(val);
      pick = null;
      if (nm && fn) fn(nm); else P.render();
      break;
    case "gateopen":  gateOpen = true;  P.render(); break;
    case "gateclose": gateOpen = false; P.render(); break;
    case "gateok":
      global.Auth.approve(arg, true).then(function(ok){
        P.toast(ok ? "들여보냈습니다" : "승인하지 못했습니다"); P.render(); });
      break;
    case "gateno":
      global.Auth.approve(arg, false).then(function(ok){
        P.toast(ok ? "거절했습니다" : "처리하지 못했습니다"); P.render(); });
      break;
    case "set":
      var v = val;
      if (arg==="must" && v==="") v=null;
      else if (v==="true") v=true; else if (v==="false") v=false;
      else if (arg==="p") v=+v;
      var o={}; o[arg]=v; P.patch(sel,o,arg+" → "+val); P.render(); break;
    case "undo": if(toast&&toast.fn){ var f=toast.fn; toast=null; clearTimeout(toastT); f(); } break;
    case "snooze":
      S.snooze[arg] = Date.now()+864e5; save();
      P.toast("하루 동안 숨깁니다", "되돌리기", function(){
        delete S.snooze[arg]; save(); P.render(); });
      P.render(); break;
    default:
      if (CFG.actions && CFG.actions[name]) CFG.actions[name](arg, val);
  }
}
P.act = act;
P.snoozed = function(key){ return (S.snooze[key]||0) > Date.now(); };

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-act]");
  if (!t) return;
  e.preventDefault();
  act(t.dataset.act, t.dataset.arg, t.dataset.val);
});
document.addEventListener("focusout", function(e){
  if (e.target && e.target.id === "inline" && edit){
    var v = e.target.value, wasId = edit.id;
    P.commitEdit(v);
    var made = P.byId(wasId);
    if (made && !made.t) P.drop(wasId);
  }
});
document.addEventListener("input", function(e){
  if (e.target.id==="cq"){ cmd.q=e.target.value; cmd.i=0; P.render(); }
  if (e.target.id==="f_t"){ e.target.style.height="auto"; e.target.style.height=e.target.scrollHeight+"px"; }
});
document.addEventListener("keydown", function(e){
  // 그 자리 편집칸 안에서는 Enter·Esc 만 가로챈다. 아래 공통 단축키로
  // 흘려보내면 한 글자 칠 때마다 화면이 바뀐다.
  if (e.target && e.target.id === "whoami"){
    if (e.key === "Enter"){ e.preventDefault(); act("pick-set", null, e.target.value); }
    if (e.key === "Escape"){ e.preventDefault(); pick = null; P.render(); }
    return;
  }
  if (e.target && e.target.id === "inline"){
    if (e.key === "Enter" || e.key === "Escape"){
      e.preventDefault();
      var wasId = edit && edit.id;
      var wasNew = !!(wasId && (P.byId(wasId) || {})._n);
      if (e.key === "Enter") P.commitEdit(e.target.value);
      else P.cancelEdit();
      var made = wasId && P.byId(wasId);
      // 제목 없이 끝냈으면 껍데기를 남기지 않는다
      if (made && wasNew && !made.t) P.drop(wasId);
    }
    return;
  }
  var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){
    e.preventDefault(); cmd.on=true; cmd.i=0; P.render(); return; }
  if (e.key==="Escape"){
    if (cmd.on){ cmd.on=false; P.render(); }
    else if (gateOpen){ gateOpen=false; P.render(); }
    else if (pick){ pick=null; P.render(); }
    else if (help){ help=false; P.render(); }
    else if (sel){ P.close(); }
    return;
  }
  if (cmd.on){
    if (e.key==="ArrowDown"){ e.preventDefault(); cmd.i=Math.min(cmd.i+1,cmd.rows.length-1); P.render(); }
    else if (e.key==="ArrowUp"){ e.preventDefault(); cmd.i=Math.max(cmd.i-1,0); P.render(); }
    else if (e.key==="Enter"){ e.preventDefault(); var r=cmd.rows[cmd.i]; cmd.on=false;
      if (r) r.go(); else P.render(); }
    return;
  }
  if (typing) return;
  if ((e.metaKey||e.ctrlKey) && e.key==="Enter" && sel){ e.preventDefault(); saveFields(); return; }
  if (e.metaKey||e.ctrlKey||e.altKey) return;

  var k = e.key;
  if (k==="/" ){ e.preventDefault(); cmd.on=true; cmd.q=""; cmd.i=0; P.render(); return; }
  if (k==="?"){ help=true; P.render(); return; }
  if (k>="1" && k<="9"){
    var v = CFG.views[+k-1]; if (v){ go(v.id); } return;
  }
  if (!rowsOnScreen.length) return;
  if (k==="j" || k==="ArrowDown"){ e.preventDefault();
    cursor=Math.min(cursor+1, rowsOnScreen.length-1); P.render(); return; }
  if (k==="k" || k==="ArrowUp"){ e.preventDefault();
    cursor=Math.max(cursor-1, 0); P.render(); return; }
  var id = rowsOnScreen[cursor];
  if (!id) return;
  var it = P.byId(id);
  if (!it) return;
  if (k==="Enter"){ e.preventDefault(); P.open(id); }
  else if (k==="x"){ e.preventDefault(); P.toggle(it); }
  else if (k==="s"){ e.preventDefault(); P.cycle(it); }
  else if (k==="e"){ e.preventDefault(); P.startEdit(id, "t"); }
});

/* 자정을 넘겨 켜둔 폰에서 "매일" 항목이 어제 상태로 남지 않게. */
setInterval(function(){
  var k = ymd(new Date());
  if (k !== P.T){ NOW = new Date(); P.T = k; P.render(); }
}, 6e4);

P.boot = function(cfg){
  CFG = cfg;
  DATA = JSON.parse(document.getElementById("data").textContent);
  document.documentElement.dataset.app = cfg.id;
  S = load();
  applyTheme();
  // 여기서 그리지 않는다. 앱 파일이 DATA 를 받아 자기 변수를 채운 뒤
  // 직접 P.render() 를 부른다 — 먼저 그리면 화면 수 세는 함수가 빈 데이터를 만난다.
  //
  // 공유 저장소는 뒤따라 붙는다. 먼저 로컬로 그려 두고, 내려온 값이 다르면
  // 그때 다시 그린다 — 네트워크를 기다리며 흰 화면을 보여주지 않는다.
  if (global.Auth && global.Auth.on) {
    setTimeout(function(){ global.Auth.start(function(){ P.render(); }); }, 0);
  }
  if (global.Sync && global.Sync.on) {
    setTimeout(function(){
      global.Sync.start(S, function(){ ALL = null; P.render(); });
    }, 0);
  }
};
return P;
})(window);
</script>
<script>/* 규효 데스크 — 개인 앱
 * 팀이 볼 일이 없는 것만 들어온다. 주소도 다르고 색도 다르다.
 * 같은 조작을 쓰되(core.js) 화면 구성은 팀 앱과 다르게 간다 —
 * 여기서 묻는 건 "남이 기다리나"가 아니라 "다음 한 동작이 뭔가"다.
 */
(function () {
"use strict";
var D = null;
function E(s){ return P.esc(s); }
function live(){ return P.live(); }
function solo(){ return live().filter(function(i){ return i.scope==="solo"; }); }
/* 팀 판에서 내 몫 = 내가 집은 것 + 구조적으로 나만 가능한 것.
   미배정은 팀 판에 남겨 둔다 — 여기로 끌어오면 다시 혼자 다 쥐는 그림이 된다. */
function held(){ return live().filter(function(i){
  // 팀 판에서 내 몫 = 대표만 가능한 것 + 내가 맡은 칸에 든 것
  return i.scope==="team" && (i.must==="owner" || P.isMine(i)); }); }

/* ── 오늘 ─────────────────────────────────────────── */
function drawToday(){
  var s = solo(), h = held();
  var late = live().filter(P.late).sort(P.urgency);
  var nowS = s.filter(function(i){ return !P.on(i) && (i.h==="now"||i.k==="recur") && !P.late(i); });
  var nowT = h.filter(function(i){ return !P.on(i) && (i.h==="now"||i.k==="recur") && !P.late(i); })
              .sort(P.urgency);
  var mac = live().filter(function(i){ return i.mac && !P.on(i); }).sort(P.urgency);

  var al = P.data().alerts.filter(function(a){ return !P.snoozed("al:"+a.t); });
  var lead = P.lead(live(), { calm:"개인 판에 걸린 게 없습니다",
                              calmn:"팀 판으로 넘어가도 됩니다." });
  var top = live().filter(function(i){ return !P.on(i) && i.k!=="track"; }).sort(P.urgency)[0];
  var notTop = function(l){ return top ? l.filter(function(i){ return i.id!==top.id; }) : l; };
  var body = lead + P.stats([
    { k:"개인", v:s.filter(function(i){return !P.on(i);}).length, n:"남이 몰라도 되는 일" },
    { k:"팀에서 내 몫", v:h.filter(function(i){return !P.on(i);}).length,
      n:"내가 집었거나 나만 가능한 일", act:"go", arg:"team" },
    { k:"지남", v:late.length, tone:late.length?"hot":"", n:late.length?"가장 오래된 건 "
      +P.days(P.T,late[0].d)+"일":"넘긴 것 없음" },
    { k:"맥 앞에서만", v:mac.length, n:"이 기기 앞에 앉는 날", act:"go", arg:"mac" }
  ])
  + (al.length
      ? '<section class="sec"><div class="sech"><h2>관제</h2>'
        + '<span class="sub">개인 쪽 자동화</span>'
        + '<span class="n num">'+al.length+'</span></div>'
        + P.alerts(al)+'</section>'
      : "")
  + P.sec("지났다","", notTop(late), {showScope:true, showPart:true})
  + P.sec("오늘 — 내 것","", notTop(nowS.sort(P.urgency)), {showPart:true})
  + P.sec("오늘 — 팀에서 내 몫","남이 기다리는 쪽", notTop(nowT), {showPart:true});

  if (!late.length && !nowS.length && !nowT.length)
    body += P.empty("오늘 걸린 게 없습니다","트랙에서 다음 한 동작을 골라도 됩니다.");
  return body;
}

/* ── 트랙 ─────────────────────────────────────────── */
/* 수익화·상표·지원사업처럼 몇 달 가는 줄기들. 목록이 아니라 줄기로 본다 —
   줄기마다 "다음 한 동작"이 하나씩만 보이면 고르는 데 시간이 안 든다. */
function drawTrack(){
  var groups = [
    { id:"rev",  n:"수익화",   d:"부수입 경로" },
    { id:"side", n:"외부·행정", d:"상표 · 지원사업 · 개인 프로젝트" },
    { id:"gear", n:"장비",     d:"사고 파는 것" },
    { id:"frozen", n:"묻어둔 것", d:"지금은 건드리지 않는다" }
  ];
  var cards = '<div class="cards c2">'+groups.map(function(g){
    var list = P.items().filter(function(i){ return i.scope==="solo" && i.l===g.id; })
                 .sort(P.urgency);
    if (!list.length) return "";
    var next = list.filter(function(i){ return !P.on(i) && i.l!=="frozen"; })[0];
    return '<div class="card"><div class="cardh"><b>'+E(g.n)+"</b>"
      + '<span class="n num">'+list.length+"</span></div>"
      + '<p class="micro" style="margin-bottom:10px">'+E(g.d)+"</p>"
      + (next
          ? '<p class="lbl" style="margin-bottom:4px">다음 한 동작</p>'
            + '<button class="rt" data-act="open" data-arg="'+E(next.id)+'" '
            + 'style="display:block;font-size:13.5px">'+E(next.t)+"</button>"
            + (next.n?'<p class="rn">'+E(next.n)+"</p>":"")
          : '<p class="micro">다음 동작 없음</p>')
      + '<div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:4px">'
      + list.filter(function(i){ return i!==next; }).map(function(i){
          return '<button class="pill q" data-act="open" data-arg="'+E(i.id)+'">'
            + (P.on(i)?"✓ ":"")+E(i.t)+"</button>"; }).join("")
      + "</div></div>";
  }).join("")+"</div>";

  return cards
    + '<p class="note"><b>줄기마다 다음 한 동작만.</b> 수익화 네 건을 한 줄 목록에 늘어놓으면 '
    + '무엇부터인지 매번 다시 고르게 됩니다. 줄기를 세우고 그 안에서 하나만 꺼내 두면 '
    + '고르는 데 시간이 안 듭니다.</p>';
}

/* ── 맥에서만 ─────────────────────────────────────── */
function drawMac(){
  var mac = live().filter(function(i){ return i.mac; }).sort(P.urgency);
  var openN = mac.filter(function(i){ return !P.on(i); }).length;
  return P.stats([
    { k:"맥 전용", v:openN, n:"이 기기 앞에서만 되는 일" },
    { k:"한 세션", v:"~90", u:"분", n:"전부 몰아서 끝낼 수 있는 분량" }
  ])
  + P.sec("맥 앞에 앉는 날","위에서부터", mac, {showScope:true, showPart:true})
  + '<p class="note"><b>왜 모아두는가.</b> 커밋·launchd·.env·편집은 흩어져 있으면 '
  + '맥 앞에 앉아도 무엇부터인지 모릅니다. 한 화면에 모아 두면 한 번에 끝납니다.</p>';
}

/* ── 팀에서 내 몫 ─────────────────────────────────── */
function drawTeam(){
  var h = held().sort(P.urgency);
  var g = { now:[], week:[], month:[], quarter:[], someday:[] };
  h.forEach(function(i){ (g[i.h]||g.someday).push(i); });
  return P.HORIZ.map(function(x){ return P.sec(x[1],"", g[x[0]]); }).join("")
    + '<p class="note"><b>미배정은 여기 안 옵니다.</b> 팀 판에 남겨 둬야 누군가 집습니다 — '
    + '끌어오는 순간 다시 혼자 다 쥐는 그림이 됩니다.'
    + (P.shared() ? ' 두 사이트는 같은 저장소를 보므로 어느 쪽에서 눌러도 이어집니다.'
                  : ' 체크는 두 사이트가 서로 안 이어지니 한쪽에서만 누르세요.') + "</p>";
}

/* ── 기록 ─────────────────────────────────────────── */
function drawLog(){
  var log = P.S().log;
  if (!log.length) return P.empty("아직 기록이 없습니다","무언가 누르면 여기 쌓입니다.");
  return '<section class="sec"><div class="sech"><h2>최근 손댄 것</h2>'
    + '<span class="sub">이 브라우저 기준 · 80건까지</span></div>'
    + log.map(function(l){
        var it = P.byId(l.id);
        return '<div class="logl"><span class="tm">'+E(P.ago(l.at))+"</span>"
          + "<span><b>"+E(it?it.t:l.id)+"</b> — "+E(l.t)+"</span></div>"; }).join("")
    + "</section>";
}

var VIEWS = [
  { id:"today", n:"오늘", ic:"●", ask:"오늘 내가 할 것", draw:drawToday, hot:true,
    count:function(){ return live().filter(function(i){
      return !P.on(i) && (i.h==="now"||i.k==="recur"||P.late(i)); }).length; } },
  { id:"track", n:"트랙", ic:"⌥", ask:"다음 한 동작은", draw:drawTrack,
    count:function(){ return solo().filter(function(i){ return !P.on(i); }).length; } },
  { id:"mac",   n:"맥",   ic:"⌘", ask:"이 기기 앞에서만", draw:drawMac,
    count:function(){ return live().filter(function(i){ return i.mac && !P.on(i); }).length; } },
  { id:"team",  n:"팀 몫", ic:"◍", ask:"남이 기다리는 일", draw:drawTeam,
    count:function(){ return held().filter(function(i){ return !P.on(i); }).length; } },
  { id:"log",   n:"기록", ic:"≡", ask:"무엇을 언제 바꿨나", draw:drawLog,
    count:function(){ return ""; } }
];

P.boot({
  id:"desk", key:"pluto.desk.v2", glyph:"K", name:"규효 데스크", kind:"solo",
  views:VIEWS, scope:"solo", canScope:true,
  defaults:{ l:"side", team:null },   // 개인 판에는 팀 구분이 없다
  foot:function(){
    return "기준 "+P.data().asof
      + "\n혼자 보는 판입니다. 주소를 아는 사람만 열립니다 — 잠금은 아닙니다.";
  }
});
D = P.data();
P.render();
})();
</script>
